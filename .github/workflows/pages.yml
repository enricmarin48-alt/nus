name: Publica NUS a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara Pages
        uses: actions/configure-pages@v5
      - name: Versió de NotesGim (cada aparell es posa al dia sol)
        run: |
          v="$(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}"
          sed -i "s/^const VERSION = 'notesgim-[A-Za-z0-9]*';/const VERSION = 'notesgim-${GITHUB_SHA::8}';/" gimnastica/sw.js
          sed -i "s/^const APP_BUILD = 'dev';/const APP_BUILD = '$v';/" gimnastica/index.html
          grep -q "notesgim-${GITHUB_SHA::8}" gimnastica/sw.js
          grep -q "APP_BUILD = '$v'" gimnastica/index.html
      - name: Empaqueta el joc
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Desplega
        id: deployment
        uses: actions/deploy-pages@v4
