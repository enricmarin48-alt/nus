name: Publica NUS a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara Pages
        uses: actions/configure-pages@v5
      - name: Empaqueta el joc
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Desplega
        id: deployment
        uses: actions/deploy-pages@v4
