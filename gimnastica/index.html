function printHeader(c) {
  const s = S();
  return `<div class="ph"><div class="ph-logo">${s.logoL ? `<img src="${s.logoL}" alt="">` : ''}</div>
    <div class="ph-text"><div class="ph-org">${h(s.org)}</div>${s.line2 ? `<div>${h(s.line2)}</div>` : ''}${c.season ? `<div>CURS ${h(c.season)}</div>` : ''}
      <div class="ph-name">${h(c.name)}</div><div>${h((c.place || '').toUpperCase())}${c.date ? ' · ' + fmtDate(c.date) : ''}</div>
      <div class="ph-date">Imprès el ${fmtDate(today())}</div></div>
    <div class="ph-logo">${s.logoR ? `<img src="${s.logoR}" alt="">` : ''}</div></div>`;
}
// el títol i el grup van dins la capçalera de cada taula: el navegador la repeteix a cada pàgina,
// així un full solt sempre diu què és
const sheet = (c, title, g, body, land = false) => {
  const label = h(title) + (g ? ' · ' + h(groupLabelPrint(g)) : '');
  return `<section class="sheet ${land ? 'landscape' : ''}">${printHeader(c)}
    ${body.replace(/<thead>/g, `<thead><tr class="rep"><th colspan="99">${label}</th></tr>`)}</section>`;
};
function judgeSheet(c, g, a) {
  const det = c.scoring === 'detailed', n = Math.max(1, a.attempts || 1);
  const cols = det ? ['D', 'E', 'Pen.', 'Nota'] : ['Nota'];
  const list = sortEntries(g.entries).filter(e => e.status !== 'np');
  const head = `<tr><th>Ordre</th><th>Dorsal</th><th>Esportista</th><th>Entitat</th>${range(n).map(i => cols.map(cl => `<th>${n > 1 ? ordHtml(i + 1) + ' ' : ''}${cl}</th>`).join('')).join('')}${n > 1 ? '<th>Final</th>' : ''}</tr>`;
  const rows = list.map((e, i) => `<tr class="judge"><td class="num">${i + 1}</td><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}</td><td>${h(clubName(e.clubId))}</td>${'<td></td>'.repeat(n * cols.length + (n > 1 ? 1 : 0))}</tr>`).join('');
  // la línia de signatura va al peu de la taula: surt a cada pàgina i no queda mai sola
  return sheet(c, `Full de jutge · ${a.name}`, g, `<table><thead>${head}</thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="99" class="signrow">Tutor/a de joc: ______________________________     Signatura: ____________________</td></tr></tfoot></table>`, n * cols.length > 4);
}
function notesSheet(c, g) {
  const apps = Engine.enabledApps(c, g.gender), det = c.scoring === 'detailed';
  const head = `<tr><th>Dors.</th><th>Esportista</th><th>Entitat / equip</th>${apps.map(a => `<th>${h(a.name)}${Engine.appMode(a, g.gender) === 'total' ? '' : ' <span class="lc">(a part)</span>'}</th>`).join('')}<th>Total</th></tr>`;
  const rows = sortEntries(g.entries).map(e => {
    const team = c.teams.find(t => t.id === e.teamId);
    const cell = a => {
      const r = Engine.appResult(e, a, c);
      const parts = range(Math.max(1, a.attempts || 1)).map(i => {
        const at = att(e, a, i);
        return det && r.attempts[i] !== null ? `D ${fmt(Engine.toM(at.d))} · E ${fmt(Engine.toM(at.e))}${Engine.toM(at.p) ? ' · P ' + fmt(Engine.toM(at.p)) : ''}` : '';
      }).filter(Boolean);
      return `<td class="num"><b>${fmt(r.value)}</b>${parts.length ? `<br><span class="small">${parts.join('<br>')}</span>` : ''}${(a.attempts || 1) > 1 ? `<br><span class="small">(${r.attempts.map(fmt).join(' / ')})</span>` : ''}</td>`;
    };
    return `<tr><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}${e.status === 'np' ? ' (NP)' : ''}</td><td>${h(clubName(e.clubId))}${team && team.name !== clubName(e.clubId) ? `<br><span class="small">${h(team.name)}</span>` : ''}</td>${apps.map(cell).join('')}<td class="num"><b>${fmt(Engine.entryTotal(c, e))}</b></td></tr>`;
  }).join('');
  return sheet(c, 'Acta de notes', g, `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`, apps.length > 3 || det);
}
function listSheet(c, g) {
  const rows = sortEntries(g.entries).map(e => { const t = c.teams.find(x => x.id === e.teamId);
    return `<tr><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}</td><td>${h(clubName(e.clubId))}</td><td>${t ? h(t.name) : '—'}</td></tr>`; }).join('');
  const teams = compTeamsOf(c, g);
  return sheet(c, 'Llistat d’inscrits', g, `<table><thead><tr><th>Dorsal</th><th>Esportista</th><th>Entitat</th><th>Equip</th></tr></thead><tbody>${rows}</tbody></table>
    ${teams.length ? `<h3>Equips</h3><table><thead><tr><th>Equip</th><th>Entitat</th><th>Gimnastes</th></tr></thead><tbody>${teams.map(t => `<tr><td>${h(t.name)}</td><td>${h(clubName(t.clubId))}</td><td>${c.entries.filter(e => e.teamId === t.id).map(e => h(entryName(e))).join(', ')}</td></tr>`).join('')}</tbody></table>` : ''}`);
}
function doPrint(c, types, keys) {
  const groups = groupsOf(c).filter(g => keys.includes(g.key));
  const out = [];
  // el podi de tots els grups va seguit, per llegir-lo a l'entrega de medalles
  if (types.includes('podium')) out.push(`<section class="sheet">${printHeader(c)}<h2>Podi</h2>${groups.map(g =>
    `<div style="break-inside:avoid"><h3>${h(groupLabelPrint(g))}</h3>${htmlPodium(c, g)}</div>`).join('')}</section>`);
  for (const g of groups) {
    if (types.includes('general') && g.entries.length) out.push(sheet(c, 'Classificació individual', g, htmlIndividual(c, g, true)));
    if (types.includes('apps') && g.entries.length) for (const a of Engine.enabledApps(c, g.gender)) out.push(sheet(c, `Classificació · ${a.name}${Engine.appMode(a, g.gender) === 'apart' ? ' (a part)' : ''}`, g, htmlOneApp(c, g, a, true)));
    if (types.includes('teams') && compTeamsOf(c, g).length) out.push(sheet(c, 'Classificació per equips', g,
      htmlTeams(c, g, true) + `<p class="small">A cada aparell compten les ${c.teamCount} millors notes de l’equip (les ratllades no compten).</p>`));
    if (types.includes('notes') && g.entries.length) out.push(notesSheet(c, g));
    if (types.includes('list')) out.push(listSheet(c, g));
    if (types.includes('judge') && g.entries.length) for (const a of Engine.enabledApps(c, g.gender)) out.push(judgeSheet(c, g, a));
  }
  if (!out.length) { toast('No hi ha res per imprimir amb aquesta selecció.', 'bad'); return; }
  $('#print').innerHTML = out.join('');
  setTimeout(() => window.print(), 50);
}
addEventListener('afterprint', () => { $('#print').innerHTML = ''; });

/* ═══════════════════════════════════════════ EXCEL (.xlsx sense llibreries)
   Un .xlsx és un zip de fitxers XML. Fem el zip "sense comprimir" (STORE), que
   Excel, LibreOffice i Google Sheets obren sense problema. */
const XLSX = (() => {
  const enc = new TextEncoder();
  const T = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const size = central.reduce((s, c) => s + c.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, size, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const x = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  const col = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const STY = { b: 1, n: 2, bn: 3, t: 4, h: 5, m: 6, mn: 7 };
  function sheetXml(sh) {
    const rows = sh.rows.map((row, r) => `<row r="${r + 1}">${(row || []).map((cell, c) => {
      if (cell === null || cell === undefined || cell === '') return '';
      let v = cell, s = 0;
      if (typeof cell === 'object') { v = cell.v; s = STY[cell.s] || 0; }
      const ref = col(c) + (r + 1), sa = s ? ` s="${s}"` : '';
      if (v === null || v === undefined || v === '') return s ? `<c r="${ref}"${sa}/>` : '';
      if (typeof v === 'number') return Number.isFinite(v) ? `<c r="${ref}"${sa}><v>${v}</v></c>` : '';
      return `<c r="${ref}" t="inlineStr"${sa}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols = sh.cols ? `<cols>${sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">${cols}<sheetData>${rows}</sheetData></worksheet>`;
  }
  const STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.00#"/></numFmts>
<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font><font><i/><strike/><sz val="11"/><color rgb="FF888888"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF1E3E8"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF999999"/></left><right style="thin"><color rgb="FF999999"/></right><top style="thin"><color rgb="FF999999"/></top><bottom style="thin"><color rgb="FF999999"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="3" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  function sheetNames(sheets) {
    const used = new Set();
    return sheets.map(s => {
      let base = String(s.name || 'Full').replace(/[\\/?*\[\]:]/g, '-').replace(/^'+|'+$/g, '').trim().slice(0, 31) || 'Full';
      let n = base, k = 2;
      while (used.has(n.toLowerCase())) { const suf = ` (${k++})`; n = base.slice(0, 31 - suf.length) + suf; }
      used.add(n.toLowerCase());
      return n;
    });
  }
  function build(sheets) {

const num = m => m === null || m === undefined ? '' : { v: m / 1000, s: 'n' };
const bnum = m => m === null || m === undefined ? '' : { v: m / 1000, s: 'bn' };
function compWorkbook(c) {
  const sheets = [];
  for (const g of groupsOf(c)) {
    const rows = [];
    const H = s => ({ v: s, s: 'h' });
    rows.push([{ v: S().org, s: 'b' }], [c.name + ' · ' + fmtDate(c.date) + (c.place ? ' · ' + c.place : '')], [{ v: groupLabelPrint(g).toUpperCase(), s: 't' }], []);
    const allApps = Engine.enabledApps(c, g.gender);
    // classificació individual
    const ind = Engine.individualRanking(c, g, { nameOf: entryName });
    rows.push([{ v: 'CLASSIFICACIÓ INDIVIDUAL', s: 't' }]);
    rows.push([H('Pos.'), H('Dorsal'), H('Esportista'), H('Entitat'), H('Equip'), ...ind.apps.map(a => H(a.name)), H('Nota final')]);
    for (const r of ind.rows) {
      const t = c.teams.find(x => x.id === r.entry.teamId);
      rows.push([r.rank ? r.rank : (r.np ? 'NP' : ''), +r.entry.bib || '', r.name, clubName(r.entry.clubId), t ? t.name : '', ...ind.apps.map(a => num(r.scores[a.id])), r.np ? 'NP' : bnum(r.total)]);
    }
    rows.push([]);
    // equips
    const tr = Engine.teamRanking(c, g);
    if (tr.rows.length) {
      rows.push([{ v: 'CLASSIFICACIÓ PER EQUIPS', s: 't' }], [{ v: `Compten les ${c.teamCount} millors notes de cada aparell (les ratllades no compten)`, s: 'm' }]);
      rows.push([H('Pos.'), '', H('Equip / esportista'), H('Entitat'), '', ...tr.apps.map(a => H(a.name)), H('Total')]);
      for (const r of tr.rows.filter(r => !r.undersize)) {
        rows.push([r.rank ? r.rank : (r.eligible ? '' : 'NC'), '', { v: r.team.name, s: 'b' }, clubName(r.team.clubId), teamWhy(c, r), ...tr.apps.map(a => bnum(r.perApp[a.id].value)), bnum(r.eligible ? r.total : r.rawTotal)]);
        for (const e of sortEntries(r.members)) rows.push(['', +e.bib || '', '   ' + entryName(e) + (e.status === 'np' ? ' (NP)' : ''), clubName(e.clubId), '',
          ...tr.apps.map(a => { const v = Engine.appScore(e, a, c); const cnt = r.counted[e.id] && r.counted[e.id][a.id]; return v === null ? '' : { v: v / 1000, s: cnt ? 'n' : 'mn' }; }), '']);
      }
      const gone = tr.rows.filter(r => r.undersize);
      if (gone.length) rows.push([{ v: `Equips anul·lats (menys de ${c.teamMin} gimnastes que hagin competit): ${gone.map(r => `${r.team.name} (${r.size})`).join(', ')}`, s: 'm' }]);
      rows.push([]);
    }
    // per aparells
    for (const a of allApps) {
      const ar = Engine.apparatusRanking(c, g, a, { nameOf: entryName });
      const n = Math.max(1, a.attempts || 1);
      rows.push([{ v: 'CLASSIFICACIÓ · ' + a.name.toUpperCase(), s: 't' }]);
      rows.push([H('Pos.'), H('Dorsal'), H('Esportista'), H('Entitat'), '', ...(n > 1 ? range(n).map(i => H(ordinal(i + 1) + ' intent')) : []), H('Nota')]);
      for (const r of ar) rows.push([r.rank ? r.rank : (r.np ? 'NP' : ''), +r.entry.bib || '', r.name, clubName(r.entry.clubId), '', ...(n > 1 ? r.attempts.map(num) : []), r.np ? 'NP' : bnum(r.value)]);
      rows.push([]);
    }
    // notes detallades
    if (c.scoring === 'detailed') {
      rows.push([{ v: 'NOTES DETALLADES (D + E − Pen.)', s: 't' }]);
      const hdr = [H('Dorsal'), H('Esportista'), H('Entitat')];
      for (const a of allApps) for (let i = 0; i < Math.max(1, a.attempts || 1); i++) { const p = (a.attempts || 1) > 1 ? ` ${ordinal(i + 1)}` : ''; hdr.push(H(`${a.name}${p} D`), H(`${a.name}${p} E`), H(`${a.name}${p} Pen.`), H(`${a.name}${p} Nota`)); }
      rows.push(hdr);
      for (const e of sortEntries(g.entries)) {
        const r = [+e.bib || '', entryName(e), clubName(e.clubId)];
        for (const a of allApps) { const res = Engine.appResult(e, a, c); for (let i = 0; i < Math.max(1, a.attempts || 1); i++) { const at = att(e, a, i); r.push(num(Engine.toM(at.d)), num(Engine.toM(at.e)), num(Engine.toM(at.p)), num(res.attempts[i])); } }
        rows.push(r);
      }
    }
    const suffix = ` ${genderPrint(g.gender)} ${g.level}`;
    sheets.push({ name: g.category.slice(0, 31 - suffix.length).trim() + suffix, rows, cols: [7, 8, 30, 26, 18, ...range(12).map(() => 12)] });
  }
  return sheets;
}

      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const scale = Math.min(1, 240 / img.height, 400 / img.width);
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);

const safeName = s => String(s || 'competicio').replace(/[\\/:*?"<>|]+/g, '-').trim();

function gymPickList(c) {
  const p = ui.pick || {};
  const q = norm(p.q);
  const inComp = new Set(c.entries.map(e => e.gymnastId));
  const list = db.gymnasts.filter(g => !g.archived && !inComp.has(g.id))
    .sort((a, b) => coll(clubName(a.clubId), clubName(b.clubId)) || coll(gymName(a), gymName(b)));
  if (!list.length) return `<p class="muted" style="padding:10px">${db.gymnasts.length ? 'Ja està tothom inscrit.' : 'Encara no hi ha gimnastes. Afegeix-les a <a href="#/gimnastes">Gimnastes</a>.'}</p>`;
  return list.map(g => {
    const show = (!q || norm(gymName(g) + ' ' + clubName(g.clubId)).includes(q)) && (!p.club || g.clubId === p.club) && (!p.gender || genderOf(g) === p.gender) && (!p.cat || g.category === p.cat) && (!p.level || g.level === p.level);
    return `<label class="${show ? '' : 'hidden'}"><input type="checkbox" name="g" value="${g.id}"> ${h(gymName(g))}
      <span class="muted">${h(clubName(g.clubId))} · ${genderShort(g.gender)} · ${h(g.category || '¿categoria?')} · ${h(g.level || '¿nivell?')}</span></label>`;
  }).join('');
}

const forms = {
  tutLogin: async f => {
    const fd = new FormData(f);
    tut.pin = String(fd.get('pin') || '').trim(); tut.who = String(fd.get('who') || '').trim();
    try { await tutFetch(); } catch (_) { tut.error = 'No es pot connectar amb l’ordinador de la taula. Comprova que estàs a la mateixa Wi-Fi.'; tut.comps = []; }
    if (!tut.comps.length) tut.pin = tut.error ? tut.pin : '';
    tutSave(); render(); tutStatusBar();
  },
  comp: f => {
    const fd = new FormData(f), id = f.dataset.id;
    const vals = { name: fd.get('name').trim(), date: fd.get('date'), place: fd.get('place').trim(), season: fd.get('season').trim() || Engine.seasonFor(fd.get('date')) };
    if (id) { Object.assign(compById(id), vals); commit(); closeDialog(); render(); return; }
    const c = Object.assign({ id: uid(), entries: [], teams: [], locked: false, created: new Date().toISOString() }, JSON.parse(JSON.stringify(S().compDefaults)), vals);
    const src = fd.get('copyFrom') && compById(fd.get('copyFrom'));
    if (src) {
      for (const k of COMP_KEYS) c[k] = JSON.parse(JSON.stringify(src[k]));
      const map = {};
      c.teams = src.teams.map(t => { const n = Object.assign({}, t, { id: uid() }); map[t.id] = n.id; return n; });
      c.entries = src.entries.filter(e => { const g = gymById(e.gymnastId); return g && !g.archived; })
        .map(e => ({ id: uid(), gymnastId: e.gymnastId, category: e.category, gender: genderOf(e), level: e.level, clubId: e.clubId, teamId: map[e.teamId] || null, bib: e.bib, status: '', scores: {} }));
    }
    db.competitions.push(normalizeComp(c, S().compDefaults));
    commit(); closeDialog();
    go(`#/competicio/${c.id}/${c.entries.length ? 'notes' : 'inscripcions'}`);
  },
  gym: (f, submitter) => {
    const fd = new FormData(f), id = f.dataset.id;
    const name = fd.get('name').trim(); if (!name) return;
    const vals = { name, surname: fd.get('surname').trim(), clubId: ensureClub(fd.get('club')), gender: fd.get('gender') === 'M' ? 'M' : 'F',
      category: fd.get('category'), level: fd.get('level'), birthYear: fd.get('birthYear') ? String(fd.get('birthYear')) : '', notes: fd.get('notes').trim() };
    if (id) {
      const g = gymById(id);
      Object.assign(g, vals, { archived: fd.get('archived') === 'on' });
      commit(); closeDialog(); render();
      // si està inscrita en una competició oberta en un altre grup, ofereix canviar-ho també allà
      const open = db.competitions.filter(c => !c.locked && c.entries.some(e => e.gymnastId === g.id && !sameGroup(e, g) && !hasScores(e)));
      if (open.length && g.category && g.level) confirmBox(`${h(gymName(g))} està inscrita com a ${h(open.map(c => { const e = c.entries.find(x => x.gymnastId === g.id); return `${e.category} ${e.level}`; })[0])} a ${open.map(c => `<b>${h(c.name)}</b>`).join(', ')}. Ho canvio també allà a ${h(g.category)} ${genderWord(g.gender)} ${h(g.level)}?<br><span class="small muted">Només on encara no té notes.</span>`, { ok: 'Canvia-ho' })
        .then(ok => { if (!ok) return; withUndo('Inscripcions actualitzades.', () => { for (const c of open) { const e = c.entries.find(x => x.gymnastId === g.id); if (e.teamId) e.teamId = null; e.category = g.category; e.gender = g.gender; e.level = g.level; autoAssignTeams(c, [e]); pruneAutoTeams(c); } }); });
      return;
    }
    const dup = db.gymnasts.find(g => norm(gymName(g)) === norm(name + ' ' + vals.surname));
    db.gymnasts.push(Object.assign({ id: uid(), archived: false }, vals));
    ui.lastGym = { clubName: clubName(vals.clubId), gender: vals.gender, category: vals.category, level: vals.level };
    commit();
    toast(`${name} ${vals.surname}: desat.${dup ? ' Compte: ja n’hi havia una fitxa amb el mateix nom.' : ''}`, dup ? 'bad' : 'ok');
    if (submitter && submitter.name === 'again') openDialog(gymForm(null, ui.lastGym)); else closeDialog();
    render();
  },
  team: f => {
    const fd = new FormData(f), id = f.dataset.id;
    const vals = { name: fd.get('name').trim(), clubId: fd.get('clubId') || null, gender: fd.get('gender') === 'M' ? 'M' : 'F', category: fd.get('category'), level: fd.get('level'), memberIds: fd.getAll('m') };
    if (!vals.name || !vals.category || !vals.level) { toast('Cal el nom, la categoria i el nivell.', 'bad'); return; }
    const t = id ? teamById(id) : (db.teams.push({ id: uid() }), db.teams[db.teams.length - 1]);
    Object.assign(t, vals);
    // una gimnasta no pot ser a dos equips del mateix grup (categoria, gènere i nivell)
    db.teams.forEach(o => { if (o.id !== t.id && sameGroup(o, t)) o.memberIds = o.memberIds.filter(m => !t.memberIds.includes(m)); });
    commit(); closeDialog(); render();
    const n = t.memberIds.length, d = S().compDefaults;
    toast(n < d.teamMin ? `Equip desat, però només té ${plural(n, 'gimnasta', 'gimnastes')} (mínim ${d.teamMin}).` : n > d.teamMax ? `Equip desat, però té ${n} gimnastes (màxim ${d.teamMax}).` : 'Equip desat.', n < d.teamMin || n > d.teamMax ? 'bad' : 'ok');
  },
  autoTeams: f => {
    const picks = new FormData(f).getAll('p').map(Number);
    withUndo(`${plural(picks.length, 'equip creat', 'equips creats')}.`, () => {
      for (const i of picks) db.teams.push(Object.assign({ id: uid() }, ui.proposals[i]));
    });
    closeDialog();
  },
  enrollTeams: f => {
    const c = curComp(), ids = new FormData(f).getAll('t');
    if (!ids.length) { closeDialog(); return; }
    let problems = [], moved = [];
    withUndo(`${plural(ids.length, 'equip inscrit', 'equips inscrits')}.`, () => {
      for (const id of ids) { const r = enrollTeam(c, teamById(id)); problems = problems.concat(r.problems); moved = moved.concat(r.moved); }
    });
    closeDialog();
    if (moved.length) toast(`Competeixen amb l’equip en un grup diferent del de la seva fitxa: ${moved.join(', ')}. Revisa-ho a Inscripcions si no és correcte.`, 'bad');
    if (problems.length) toast(`No s’han pogut moure de grup (ja tenen notes): ${problems.join(', ')}`, 'bad');
  },
  enrollGyms: f => {
    const c = curComp(), ids = new FormData(f).getAll('g');
    if (!ids.length) { toast('No has marcat cap gimnasta.', 'bad'); return; }
    withUndo(`${plural(ids.length, 'inscripció feta', 'inscripcions fetes')}.`, () => {
      const added = ids.map(id => { const e = newEntry(c, gymById(id)); c.entries.push(e); return e; });
      autoAssignTeams(c, added);
      if (c.autoTeams) autoCompTeams(c, added);
    });
    closeDialog();
  },
  entry: f => {
    const c = curComp(), e = c.entries.find(x => x.id === f.dataset.id), fd = new FormData(f);
    const cat = fd.get('category'), level = fd.get('level'), gender = fd.get('gender') === 'M' ? 'M' : 'F';
    let left = null;
    if (!sameGroup(e, { category: cat, gender, level }) && e.teamId) { left = c.teams.find(t => t.id === e.teamId); e.teamId = null; }
    Object.assign(e, { category: cat, gender, level, clubId: fd.get('clubId') || null, bib: fd.get('bib') ? +fd.get('bib') : e.bib });
    if (left) autoAssignTeams(c, [e]);
    pruneAutoTeams(c);
    commit(); closeDialog(); render();
    if (left) { const n = c.entries.filter(x => x.teamId === left.id).length;
      toast(`${entryName(e)} ja no és a l’equip «${left.name}» (ara en té ${n})${n < c.teamMin ? ': no arriba al mínim i quedarà anul·lat' : ''}.`, n < c.teamMin ? 'bad' : ''); }
  },
  compTeam: f => {
    const c = curComp(), fd = new FormData(f), id = f.dataset.id;
    const name = fd.get('name').trim(); if (!name) return;
    let t = id && c.teams.find(x => x.id === id);
    if (!t) { t = { id: uid(), category: f.dataset.cat, gender: f.dataset.gender === 'M' ? 'M' : 'F', level: f.dataset.level, sourceTeamId: null }; c.teams.push(t); }
    t.name = name; t.clubId = fd.get('clubId') || null;
    const members = new Set(fd.getAll('m'));
    c.entries.forEach(e => { if (members.has(e.id)) { e.teamId = t.id; delete e.noAuto; } else if (e.teamId === t.id) { e.teamId = null; e.noAuto = true; } });
    if (!c.entries.some(e => e.teamId === t.id)) c.teams = c.teams.filter(x => x.id !== t.id || !t.auto);
    pruneAutoTeams(c);
    commit(); closeDialog(); render();
  },
  print: f => {
    const fd = new FormData(f);
    closeDialog();
    doPrint(curComp(), fd.getAll('t'), fd.getAll('g'));
  },
  club: f => {
    const name = new FormData(f).get('name').trim(); if (!name) return;
    if (db.clubs.some(c => norm(c.name) === norm(name))) { toast('Aquesta entitat ja existeix.', 'bad'); return; }
    ensureClub(name); commit(); closeDialog(); render();
  },
};

/* ═══════════════════════════════════════════ canvis en camps (change / input) */
const changes = {
  // nota d'una tutora: es posa a la cua i s'envia
  tscore: el => {
    if (el.dataset.last === el.value) return !el.classList.contains('invalid');
    const val = Engine.parseScore(el.value);
    if (Number.isNaN(val) || (val !== null && val > 100)) {
      el.classList.add('invalid'); toast(`«${el.value}» no és una nota vàlida. Escriu un número, per exemple 8,35.`, 'bad'); return false;
    }
    el.classList.remove('invalid');
    const m = Engine.toM(val); el.value = m === null ? '' : fmt(m); el.dataset.last = el.value;
    const op = { compId: tutComp().id, entryId: el.dataset.e, appId: el.dataset.a, i: +el.dataset.i, value: val, at: Date.now() };
    tut.queue = tut.queue.filter(q => !(q.compId === op.compId && q.entryId === op.entryId && q.appId === op.appId && q.i === op.i));
    tut.queue.push(op); tutSave(); tutApplyLocal(op); tutMark(op, 'wait'); tutStatusBar();
    tutSend();
    return true;
  },
  score: el => {
    const c = curComp(); if (!c || c.locked) return;
    const e = c.entries.find(x => x.id === el.dataset.e); if (!e) return;
    if (el.dataset.last === el.value) return !el.classList.contains('invalid');   // ja processat (Intro i després blur)
    el.dataset.last = el.value;
    const val = Engine.parseScore(el.value);
    if (Number.isNaN(val)) {
      el.classList.add('invalid');
      toast(`«${el.value}» no és una nota vàlida. Escriu un número, per exemple 8,35.`, 'bad');
      return false;
    }
    el.classList.remove('invalid');
    setAttemptField(e, el.dataset.a, +el.dataset.i, el.dataset.f, val);
    const m = Engine.toM(val);
    el.value = m === null ? '' : fmt(m);
    el.dataset.last = el.value;
    if (el.classList.contains('tutor')) {   // corregida per l'organització: ja no és «per revisar»
      el.classList.remove('tutor'); el.title = '';
      const tb = $('#tutorreview'); if (tb) tb.outerHTML = tutorReviewBtn(c, groupsOf(c).find(x => x.key === ui.group));
    }
    el.classList.toggle('high', m !== null && el.dataset.f !== 'p' && c.maxScore && m > c.maxScore * 1000);
    if (el.classList.contains('high')) toast(`Compte: ${fmt(m)} passa de ${c.maxScore}. Revisa que sigui correcta.`, 'bad');
    const minM = Engine.toM(c.minScore) || 0;
    if (el.dataset.f !== 'p' && minM && m !== null && m > 0 && m < minM && c.scoring !== 'detailed') toast(`S’aplica la nota mínima: compta com a ${fmt(minM)}.`);
    commit(); refreshScoreRow(c, e);
    return true;
  },
  bib: el => { const c = curComp(); const e = c.entries.find(x => x.id === el.dataset.id); e.bib = el.value ? +el.value : null; commit(); },
  entryTeam: el => {
    const c = curComp(); const e = c.entries.find(x => x.id === el.dataset.id);
    e.teamId = el.value || null;
    if (e.teamId) delete e.noAuto; else e.noAuto = true;   // l'ha tret a mà: els equips automàtics no la tornaran a posar
    pruneAutoTeams(c);
    commit(); render();
    const n = e.teamId ? c.entries.filter(x => x.teamId === e.teamId).length : 0;
    if (n > c.teamMax) toast(`Aquest equip ara té ${n} gimnastes i el màxim és ${c.teamMax}: no classificarà fins que en tregueu.`, 'bad');
  },
  entryStatus: el => { const c = curComp(); const e = c.entries.find(x => x.id === el.dataset.id); e.status = el.value; commit(); render(); },
  cfg: el => {
    const cfg = cfgTarget(el), k = el.dataset.k;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.dec) {
      // com les notes: accepta coma o punt; fora de límits no es desa
      const n = Engine.parseScore(v);
      if (n === null || Number.isNaN(n) || n < +el.dataset.min || n > +el.dataset.max) {
        toast(`«${v}» no val: ha de ser un número entre ${el.dataset.min} i ${el.dataset.max}.`, 'bad');
        el.value = fmt(Engine.toM(cfg[k])); return;
      }
      v = n;
    } else if (el.type === 'number') {
      const n = el.dataset.dec ? Math.round((+v || 0) * 1000) / 1000 : Math.round(+v || 0);
      v = Math.max(+el.min || 0, Math.min(+el.max || 100, n));
      if (!v && +el.min > 0) v = COMP_DEFAULTS()[k];
    }
    cfg[k] = v;
    if (cfg.teamMin > cfg.teamMax) { if (k === 'teamMin') cfg.teamMax = cfg.teamMin; else cfg.teamMin = cfg.teamMax; }
    commit(); renderKeepFocus();
  },
  app: el => {
    const cfg = cfgTarget(el), a = cfg.apparatus[+el.dataset.i], k = el.dataset.k;
    if (k === 'modeF' || k === 'modeM') { a.modes = Object.assign({ F: Engine.appMode(a, 'F'), M: Engine.appMode(a, 'M') }, a.modes); a.modes[k.slice(4)] = el.value; }
    else if (el.type === 'checkbox') a[k] = el.checked;
    else if (k === 'attempts') a[k] = +el.value;
    else if (k === 'name') a[k] = el.value.trim() || a[k];
    else a[k] = el.value;
    commit(); renderKeepFocus();
  },
  gFilter: el => { ui[el.dataset.k] = el.value; $('#gymtable').innerHTML = gymTable(); },
  gArchived: el => { ui.gArchived = el.checked; $('#gymtable').innerHTML = gymTable(); },
  pickFilter: el => { ui.pick[el.dataset.k] = el.value; refreshPick(); },
  teamFormRefresh: el => {
    const f = el.closest('form'), fd = new FormData(f);
    const v = { clubId: fd.get('clubId'), gender: fd.get('gender'), category: fd.get('category'), level: fd.get('level'), memberIds: fd.getAll('m') };
    $('#teampick').innerHTML = teamPickList(v, fd.get('showAll') === 'on', f.dataset.id);
    $('#teamcount').textContent = $$('#teampick input:checked').length;
  },
  teamCount: () => { $('#teamcount').textContent = $$('#teampick input:checked').length; },
  impHeader: el => {
    const imp = ui.import;
    imp.hasHeader = el.checked;
    imp.map = el.checked ? range(imp.width).map(i => guessField(imp.rows[0][i]) || imp.map[i])
      : ['name', 'surname', 'club', 'gender', 'category', 'level', 'birth', 'team'].slice(0, imp.width).concat(range(Math.max(0, imp.width - 8)).map(() => ''));
    openDialog(importDialog(), { wide: true });
  },
  impMap: el => { ui.import.map[+el.dataset.i] = el.value; openDialog(importDialog(), { wide: true }); },
  impDef: el => { ui.import[el.dataset.k] = el.value; openDialog(importDialog(), { wide: true }); },
  clubName: el => {
    const c = clubById(el.dataset.id), v = el.value.trim();
    if (!v) { el.value = c.name; return; }
    if (db.clubs.some(o => o.id !== c.id && norm(o.name) === norm(v))) { toast('Ja hi ha una entitat amb aquest nom. Fes servir «Fusiona».', 'bad'); el.value = c.name; return; }
    c.name = v; commit(); toast('Nom canviat.', 'ok');
  },
  clubMerge: async el => {
    const from = clubById(el.dataset.id), to = clubById(el.value);
    if (!to) return;
    if (!(await confirmBox(`Fusionar <b>${h(from.name)}</b> dins de <b>${h(to.name)}</b>? Totes les gimnastes, equips i inscripcions de «${h(from.name)}» passaran a «${h(to.name)}».`, { ok: 'Fusiona' }))) { el.value = ''; return; }
    withUndo(`«${from.name}» fusionada amb «${to.name}».`, () => {
      const fix = o => { if (o.clubId === from.id) o.clubId = to.id; };
      db.gymnasts.forEach(fix); db.teams.forEach(fix);
      db.competitions.forEach(c => { c.entries.forEach(fix); c.teams.forEach(fix); });
      db.clubs = db.clubs.filter(c => c.id !== from.id);
    });
  },
  setting: el => { S()[el.dataset.k] = el.value; commit(); },
  tutorsOn: el => { const c = curComp(); c.tutorsOn = el.checked; if (c.tutorsOn && !/^\d{4,6}$/.test(c.tutorPin)) c.tutorPin = String(1000 + Math.floor(Math.random() * 9000)); commit(); render(); },
  rkSeason: el => { ui.rkSeason = el.value; ui.rkGroup = null; render(); },
  rkComp: el => { ui.rkOff[el.dataset.id] = !el.checked; render(); },
  catField: el => {
    const i = +el.dataset.i, c = S().categories[i], k = el.dataset.k;
    if (k === 'name') {
      const old = c.name, v = el.value.trim();
      if (!v || v === old) { el.value = old; return; }
      if (catNames().some((x, j) => j !== i && norm(x) === norm(v))) { toast('Ja n’hi ha una amb aquest nom.', 'bad'); el.value = old; return; }
      c.name = v;
      const fix = o => { if (o.category === old) o.category = v; };
      db.gymnasts.forEach(fix); db.teams.forEach(fix);
      db.competitions.forEach(x => { x.entries.forEach(fix); x.teams.forEach(fix); });
      commit(); toast(`«${old}» ara es diu «${v}».`, 'ok');
      return;
    }
    c[k] = el.value === '' ? null : Math.round(+el.value);
    commit(); renderKeepFocus();
  },
  listRename: el => {
    const key = el.dataset.key, i = +el.dataset.i, old = S()[key][i], v = el.value.trim();
    if (!v || v === old) { el.value = old; return; }
    if (S()[key].some((x, j) => j !== i && norm(x) === norm(v))) { toast('Ja n’hi ha un amb aquest nom.', 'bad'); el.value = old; return; }
    const field = key === 'categories' ? 'category' : 'level';
    S()[key][i] = v;
    const fix = o => { if (o[field] === old) o[field] = v; };
    db.gymnasts.forEach(fix); db.teams.forEach(fix);
    db.competitions.forEach(c => { c.entries.forEach(fix); c.teams.forEach(fix); });
    commit(); toast(`«${old}» ara es diu «${v}».`, 'ok');
  },
};
const inputs = {
  gSearch: el => { ui.gSearch = el.value; $('#gymtable').innerHTML = gymTable(); },
  // en escriure l'any de naixement, la categoria es posa sola
  gymYear: el => {
    const f = el.closest('form'), sel = f && f.querySelector('select[name=category]'), hint = $('#yearhint');
    if (!/^\d{4}$/.test(el.value)) { if (hint) hint.textContent = ''; return; }
    const cat = catForYear(el.value);
    if (cat && sel) sel.value = cat;
    if (hint) hint.textContent = cat ? `Per l’any ${el.value} li toca ${cat}.` : `Cap categoria no inclou l’any ${el.value}. Revisa els anys a Configuració → Categories.`;
  },
  pickFilter: el => { ui.pick[el.dataset.k] = el.value; refreshPick(); },
};
function refreshPick() {
  const p = ui.pick, q = norm(p.q);
  $$('#gympick label').forEach(l => {
    const g = gymById(l.querySelector('input').value);
    const show = (!q || norm(gymName(g) + ' ' + clubName(g.clubId)).includes(q)) && (!p.club || g.clubId === p.club) && (!p.gender || genderOf(g) === p.gender) && (!p.cat || g.category === p.cat) && (!p.level || g.level === p.level);
    l.classList.toggle('hidden', !show);
  });
}

/* ═══════════════════════════════════════════ esdeveniments */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  if (el.dataset.act === 'editGym' && $('#dlg').open) closeDialog();
  fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (el && changes[el.dataset.chg]) changes[el.dataset.chg](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-inp]');
  if (el && inputs[el.dataset.inp]) inputs[el.dataset.inp](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  forms[f.dataset.form](f, e.submitter);
});
document.addEventListener('keydown', e => {
  const el = e.target;
  // a la graella de notes, Intro / fletxes baixen i pugen per la mateixa columna
  if (el.matches && el.matches('input.sc') && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const up = e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey);
    const col = $$(`#scoregrid input.sc[data-col="${el.dataset.col}"]:not(:disabled)`);
    const i = col.indexOf(el);
    if (changes[el.dataset.chg](el) === false) { el.select(); return; }   // nota no vàlida: no es passa a la següent
    const next = col[i + (up ? -1 : 1)];
    if (next) { next.focus(); next.select(); next.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } else el.blur();
    return;
  }
  if (el.dataset && el.dataset.enter && e.key === 'Enter') { e.preventDefault(); actions[el.dataset.enter](el); }
});
// en entrar en una casella de nota, es selecciona tota perquè es pugui sobreescriure.
// Ha de ser immediat: si s'espera, el que s'escriu de pressa després d'Intro quedaria seleccionat i se sobreescriuria.
const isSc = el => el && el.matches && el.matches('input.sc');
document.addEventListener('focusin', e => { if (isSc(e.target)) { e.target.select(); e.target._fresh = true; } });
document.addEventListener('mouseup', e => { if (isSc(e.target) && e.target._fresh) e.preventDefault(); if (e.target) e.target._fresh = false; });
document.addEventListener('keydown', e => { if (e.target) e.target._fresh = false; }, true);

// el primer clic de la sessió torna a demanar permís per al fitxer vinculat (el navegador ho exigeix així)
document.addEventListener('click', () => { if (fileHandle && fileState === 'perm') regrantFile(); }, { once: true, capture: true });

/* ═══════════════════════════════════════════ arrencada */
async function start() {
  loadDb();
  route();
  if (!(await serverInit())) render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (fsSupported()) {
    const hd = await idbGet('fileHandle');
    if (hd) {
      fileHandle = hd;
      try { fileState = (await hd.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'perm'; } catch (_) { fileState = 'perm'; }
      renderSaveState(false);
    }
  }
}
start();

// instal·lable i sense internet quan es serveix per web (des d'un fitxer local ja funciona sense res més)
if (location.protocol.startsWith('http')) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
