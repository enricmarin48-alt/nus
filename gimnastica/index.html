  },
  entry: f => {
    const c = curComp(), e = c.entries.find(x => x.id === f.dataset.id), fd = new FormData(f);
    const cat = fd.get('category'), level = fd.get('level'), gender = fd.get('gender') === 'M' ? 'M' : 'F';
    let left = null;
    if (!sameGroup(e, { category: cat, gender, level }) && e.teamId) { left = c.teams.find(t => t.id === e.teamId); e.teamId = null; }
    Object.assign(e, { category: cat, gender, level, clubId: fd.get('clubId') || null, bib: fd.get('bib') ? +fd.get('bib') : e.bib });
    if (left) { if (c.autoTeams) autoCompTeams(c, [e]); else autoAssignTeams(c, [e]); }
    pruneAutoTeams(c);
    commit(); closeDialog(); render();
    if (left) { const n = teamSize(c, left), np = teamNP(c, left);
      toast(`${entryName(e)} ja no és a l’equip «${left.name}» (ara en té ${n}${np ? ` + ${np} NP` : ''})${n < c.teamMin ? ': no arriba al mínim i quedarà anul·lat' : ''}.`, n < c.teamMin ? 'bad' : ''); }
  },
  // equip dins d'una competició. Un equip nou queda també a les fitxes de les seves gimnastes; els canvis
  // d'un equip que ja hi era només valen per a aquesta competició (amb un botó per passar-los a les fitxes)
  compTeam: f => {
    const c = curComp(), fd = new FormData(f), id = f.dataset.id;
    const name = fd.get('name').trim(); if (!name) return;
    const grp = { category: f.dataset.cat, gender: f.dataset.gender === 'M' ? 'M' : 'F', level: f.dataset.level };
    const members = new Set(fd.getAll('m'));
    // equip nou sense entitat triada: si totes les marcades són de la mateixa, és la seva
    const clubsOf = new Set(c.entries.filter(e => members.has(e.id)).map(e => e.clubId || null));
    const clubId = fd.get('clubId') || (!id && clubsOf.size === 1 ? [...clubsOf][0] : null);
    let t = id && c.teams.find(x => x.id === id);
    const isNew = !t;
    const sameName = x => (x.clubId || null) === (clubId || null) && sameGroup(x, grp) && norm(x.name) === norm(name);
    if (!isNew) {
      // reanomenar-lo amb el nom d'un altre equip de la mateixa entitat i grup en faria dos d'iguals
      const ex = findTeam(clubId, grp, name), src = t.sourceTeamId && teamById(t.sourceTeamId) ? t.sourceTeamId : null;
      const changedKey = norm(name) !== norm(t.name) || (clubId || null) !== (t.clubId || null);
      if (changedKey && (c.teams.some(x => x !== t && sameName(x)) || (ex && src && ex.id !== src))) {
        toast(`Aquesta entitat ja té un equip «${name}» en aquest grup. Posa-li un altre nom (per exemple «${name} 2»).`, 'bad'); return;
      }
    }
    // un equip «nou» amb el nom d'un que ja hi és: s'hi afegeixen les marcades (no se'n treu ningú)
    let reused = false;
    closeDialog();
    withUndo(() => {
      const n = teamSize(c, t), alive = c.teams.includes(t), np = teamNP(c, t);
      const msg = !alive ? `Equip «${name}» tret de la competició (s’ha quedat sense gimnastes).` : `Equip «${name}» ${reused ? 'ja hi era: s’hi han afegit les marcades' : `desat${isNew ? '' : ' en aquesta competició'}`} (${plural(n, 'gimnasta', 'gimnastes')}${np ? ` + ${np} NP` : ''}).${n < c.teamMin ? ` No arriba al mínim (${c.teamMin}).` : n > c.teamMax ? ` Passa del màxim (${c.teamMax}).` : ''}`;
      const acts = alive && !isNew ? [{ label: 'També a les fitxes', fn: () => {
        // (després d'un Desfés les dades són unes altres: es busquen de nou)
        const cc = compById(c.id), tt = cc && cc.teams.find(x => x.id === t.id);
        if (!tt) { toast('Aquest equip ja no hi és.', 'bad'); return; }
        withUndo(() => `Fitxes de les gimnastes de «${tt.name}» actualitzades.`, () => { syncTeamToRecords(cc, tt); });
      } }] : [];
      return { msg, type: alive && (n < c.teamMin || n > c.teamMax) ? 'bad' : 'ok', actions: acts };
    }, () => {
      let ex = null;
      if (!t) {
        // si ja hi ha un equip amb aquest nom (de la mateixa entitat i grup), és aquest
        ex = findTeam(clubId, grp, name);
        const here = c.teams.find(sameName);
        if (here) { t = here; reused = true; }
        else if (ex) { t = compTeamFor(c, ex); reused = true; }
        else if (isUpcoming(c)) t = compTeamFor(c, makeTeam(clubId, grp, name));
        else { t = { id: uid(), name, clubId, category: grp.category, gender: grp.gender, level: grp.level, sourceTeamId: null, auto: true }; c.teams.push(t); }
      }
      t.name = name; t.clubId = clubId;
      c.entries.forEach(e => { if (members.has(e.id)) { e.teamId = t.id; delete e.noAuto; } else if (!reused && e.teamId === t.id) { e.teamId = null; e.noAuto = true; } });
      const master = t.sourceTeamId && teamById(t.sourceTeamId);
      if (reused && master && isUpcoming(c)) {
        // a les fitxes: les marcades entren a l'equip (les que ja hi eren no se'n treuen)
        const before = [...master.memberIds];
        for (const e of c.entries) if (members.has(e.id) && inRecordGroup(e)) { putInTeam(e.gymnastId, master); const g = gymById(e.gymnastId); if (g) delete g.noTeam; }
        propagateTeam(master, [], master.memberIds.filter(x => !before.includes(x)));
      } else if (isNew && !reused && isUpcoming(c)) syncTeamToRecords(c, t);
      pruneAutoTeams(c);
    });
  },
  print: async f => {
    const fd = new FormData(f), c = curComp(), types = fd.getAll('t'), keys = fd.getAll('g');
    closeDialog();
    if (!types.length || !keys.length) { toast('Tria què vols imprimir i de quins grups.', 'bad'); return; }
    if (await confirmMissing(c, types, keys)) doPrint(c, types, keys);
  },
  club: f => {
    const name = new FormData(f).get('name').trim(); if (!name) return;
    if (db.clubs.some(c => norm(c.name) === norm(name))) { toast('Aquesta entitat ja existeix.', 'bad'); return; }
    ensureClub(name); commit(); closeDialog(); render();
  },
};

/* ═══════════════════════════════════════════ canvis en camps (change / input) */
const changes = {
  // nota d'una tutora: es posa a la cua i s'envia
  tscore: el => {
    if (el.dataset.last === el.value) return !el.classList.contains('invalid');
    const c = tutComp(); if (!c) return false;
    const e = c.entries.find(x => x.id === el.dataset.e), a = c.apparatus.find(x => x.id === el.dataset.a);
    if (!e || !a) return false;
    const val = Engine.parseScore(el.value), max = +c.maxScore || 20;
    if (Number.isNaN(val) || (val !== null && val > max)) { badScore(el, val, max, () => changes.tscore(el)); return false; }
    el.classList.remove('invalid'); hideFixTip();
    const m = Engine.toM(val); el.value = m === null ? '' : fmt(m); el.dataset.last = el.value;
    tutQueue(c, e, a, +el.dataset.i, val);
    return true;
  },
  score: el => {
    const c = curComp(); if (!c || c.locked) return;
    const e = c.entries.find(x => x.id === el.dataset.e); if (!e) return;
    const max = +c.maxScore || 20;
    // ja processat (Intro i després blur). Si s'havia rebutjat per D + E − Pen., es torna a mirar (potser ja s'ha
    // corregit l'altra nota)
    if (el.dataset.last === el.value && !el._why) {
      if (el.classList.contains('invalid') && document.activeElement === el && !$('#fixtip')) badScore(el, Engine.parseScore(el.value), max, () => changes.score(el));
      return !el.classList.contains('invalid');
    }
    el.dataset.last = el.value;
    // «NP» escrit a la casella: no presentada
    if (/^\s*n\.?\s*p\.?\s*$/i.test(el.value)) {
      hideFixTip();
      const apply = () => withUndo(() => { const w = npTeamWarn(c, e); return { msg: `${entryName(e)}: no presentada (NP).${w}`, type: w ? 'bad' : 'ok' }; }, () => { e.status = 'np'; });
      if (navKey) { apply(); return 'np'; }
      // en sortir de la casella (Tab o clic): primer deixem que el focus arribi on ha d'anar i després es torna a pintar
      setTimeout(() => {
        const a = document.activeElement, to = isSc(a) && a.dataset.e !== e.id ? { col: a.dataset.col, e: a.dataset.e } : null;
        const away = a && a !== document.body && !isSc(a);
        apply();
        const n = to && $(`#scoregrid input.sc[data-col="${to.col}"][data-e="${to.e}"]`);
        if (n && !n.disabled) focusSc(n); else if (!away) advanceFrom(el);
      }, 0);
      return 'np';
    }
    const val = Engine.parseScore(el.value);
    if (Number.isNaN(val) || (val !== null && val > max)) { badScore(el, val, max, () => changes.score(el)); return false; }
    // D + E − Pen.: la nota que en surt tampoc pot passar del màxim, ni la penalització ser més gran que D + E
    if (c.scoring === 'detailed' && ['d', 'e', 'p'].includes(el.dataset.f)) {
      const x = Object.assign({}, att(e, { id: el.dataset.a }, +el.dataset.i), { [el.dataset.f]: val });
      const dM = Engine.toM(x.d), eM = Engine.toM(x.e), pM = Engine.toM(x.p) || 0, mx = Engine.toM(max);
      const why = dM === null || eM === null ? null
        : dM + eM - pM > mx ? `D + E − Pen. = ${fmt(dM + eM - pM)}: passa del màxim (${fmt(mx)}). Revisa les notes.`
        : pM > dM + eM ? `La penalització (${fmt(pM)}) és més gran que D + E (${fmt(dM + eM)}): la nota seria 0. Revisa-la.` : null;
      if (why) { badScore(el, val, max, () => changes.score(el), why); return false; }
    }
    el.classList.remove('invalid'); el._why = null; hideFixTip();
    setAttemptField(e, el.dataset.a, +el.dataset.i, el.dataset.f, val);
    const m = Engine.toM(val);
    el.value = m === null ? '' : fmt(m);
    el.dataset.last = el.value;
    if (el.classList.contains('tutor')) {   // corregida per l'organització: ja no és «per revisar»
      el.classList.remove('tutor'); el.title = '';
      const tb = $('#tutorreview'); if (tb) tb.outerHTML = tutorReviewBtn(c, groupsOf(c).find(x => x.key === ui.group));
    }
    el.classList.remove('high');
    const minM = Engine.toM(c.minScore) || 0;
    if (el.dataset.f !== 'p' && minM && m !== null && m > 0 && m < minM && c.scoring !== 'detailed') toast(`S’aplica la nota mínima: compta com a ${fmt(minM)}.`);
    commit(); refreshScoreRow(c, e);
    // D + E − Pen.: una altra casella d'aquest intent que s'havia rebutjat potser ara ja val (es desa)
    if (c.scoring === 'detailed') for (const o of $$(`#scoregrid input.sc.invalid[data-e="${e.id}"][data-a="${el.dataset.a}"][data-i="${el.dataset.i}"]`)) {
      if (o === el || !o._why) continue;
      changes.score(o);
      const t = $('#fixtip'); if (t && t._for === o) hideFixTip();
    }
    return true;
  },
  bib: el => {
    const c = curComp(), e = c && c.entries.find(x => x.id === el.dataset.id); if (!e || c.locked) return;
    const v = el.value.trim();
    if (v && !/^\d{1,5}$/.test(v)) { toast('El dorsal ha de ser un número.', 'bad'); el.value = e.bib ?? ''; return; }
    const n = v ? +v : null;
    const dup = n !== null && c.entries.find(x => x !== e && +x.bib === n);
    e.bib = n; commit();
    if (dup) toast(`Compte: el dorsal ${n} també el té ${entryName(dup)}.`, 'bad');
  },
  // canvi d'equip el mateix dia: només en aquesta competició (i un botó per canviar-ho també a la fitxa)
  entryTeam: el => {
    const c = curComp(); if (!c || c.locked) return;
    const e = c.entries.find(x => x.id === el.dataset.id); if (!e) return;
    const gym = gymById(e.gymnastId), value = el.value;
    let ct = null, left = null;
    withUndo(() => {
      const n = ct ? teamSize(c, ct) : 0;
      const nl = left ? teamSize(c, left) : 0;
      const master = ct && ct.sourceTeamId && teamById(ct.sourceTeamId);
      const want = master ? master.id : '__none';
      const acts = gym && !ct === !master && want !== gymTeamValue(gym) ? [{ label: 'També a la fitxa', fn: () => {
        const g2 = gymById(gym.id);   // (després d'un Desfés les dades són unes altres)
        if (!g2 || (want !== '__none' && !teamById(want))) { toast('Ja no es pot: les dades han canviat.', 'bad'); return; }
        let r; withUndo(() => teamSetMsg(g2, r), () => { r = setGymTeam(g2, want); });
      } }] : [];
      const warn = n > c.teamMax ? ` Ara en té ${n} i el màxim és ${c.teamMax}: no classificarà fins que en tregueu.`
        : left && nl < c.teamMin && nl > 0 ? ` «${left.name}» es queda amb ${nl}: no arriba al mínim i quedarà anul·lat.` : '';
      return { msg: `${entryName(e)} → ${ct ? ct.name : 'individual'} (en aquesta competició).${warn}`, type: warn ? 'bad' : 'ok', actions: acts };
    }, () => {
      left = c.teams.find(t => t.id === e.teamId) || null;
      let v = value;
      if (v.startsWith('m:')) { const t = teamById(v.slice(2)); v = t ? compTeamFor(c, t).id : ''; }

function badScore(el, val, max, retry, why = null) {
  el.classList.add('invalid'); el._why = why;
  const sug = why || Number.isNaN(val) ? null : Engine.suggestScore(el.value, max);
  const msg = why || (Number.isNaN(val) ? `«${el.value}» no és una nota. Escriu-la com 8,35.` : `${el.value} no pot ser: el màxim és ${fmt(Engine.toM(max))}.`);

  tip.id = 'fixtip'; tip.className = 'fixtip'; tip.setAttribute('role', 'alert'); tip._for = el;
  tip.innerHTML = `<span>${h(msg)}</span>${sug !== null ? `<button type="button">Volies dir ${h(fmt(Engine.toM(sug)))}?</button>` : ''}`;
  tip._msg = msg;
  tip._fix = sug === null ? null : { label: `Posa ${fmt(Engine.toM(sug))}`, fn: () => { el.value = fmt(Engine.toM(sug)); retry(); if (!document.contains(el)) renderKeepFocus(); } };
  (el.closest('dialog') || document.body).appendChild(tip);
  const r = el.getBoundingClientRect(), vh = window.visualViewport ? visualViewport.height : innerHeight;
  const w = tip.offsetWidth, ht = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  tip.style.top = (r.bottom + 6 + ht > vh ? Math.max(8, r.top - ht - 6) : r.bottom + 6) + 'px';
  const b = tip.querySelector('button');
  if (b) {
    b.addEventListener('pointerdown', ev => ev.preventDefault());   // la casella no perd el focus
    b.addEventListener('mousedown', ev => ev.preventDefault());
    b.onclick = () => { hideFixTip(); el.value = fmt(Engine.toM(sug)); const r2 = retry(); if (r2 !== false && document.contains(el)) advanceFrom(el, false); };
  }
  el.addEventListener('input', hideFixTip, { once: true });
}

// passa a la casella de sota (o de dalt). Al final de la columna, a la primera de la columna següent

function advanceFrom(el, up = false) {
  const colKey = el.dataset.col, eid = el.dataset.e;
  const all = $$(`#scoregrid input.sc[data-col="${colKey}"]`);   // amb les desactivades, en l'ordre de les files
  const i = all.findIndex(x => x.dataset.e === eid);
  for (let j = i + (up ? -1 : 1); i >= 0 && j >= 0 && j < all.length; j += up ? -1 : 1) if (!all[j].disabled) { focusSc(all[j]); return; }
  if (up) { const cur = all[i]; if (cur && !cur.disabled) focusSc(cur); return; }   // a dalt de tot: s'hi queda
  const cols = [...new Set($$('#scoregrid input.sc:not(:disabled)').map(x => x.dataset.col))];
  const nc = cols[cols.indexOf(colKey) + 1];
  const first = nc && $(`#scoregrid input.sc[data-col="${nc}"]:not(:disabled)`);
  if (first) { focusSc(first); return; }
  if (document.contains(el)) el.blur();
  if (el.dataset.chg !== 'score') return;
  const c = curComp(); if (!c) return;
  const groups = groupsOf(c).filter(g => g.entries.length), k = groups.findIndex(g => g.key === ui.group);
  const g = groups[k], miss = x => Engine.missingScores(c, x);
  const order = groups.slice(k + 1).concat(groups.slice(0, k));
  // on es continua: amb un sol aparell a la pantalla, primer un altre aparell d'aquest grup que falti, i si no,
  // el grup següent on falti aquest aparell (o, si no, qualsevol nota); amb tots els aparells, el grup següent
  const cur = g && notesApp(c, g).app;
  let next = null;
  if (cur) {
    const other = g && Object.keys(miss(g).perApp).find(id => id !== cur.id);
    const ng = order.find(x => miss(x).perApp[cur.id]);
    const ng2 = !ng && order.find(x => miss(x).total);
    if (other) next = { g, app: other, label: `Ara ${(c.apparatus.find(a => a.id === other) || {}).name || 'l’aparell següent'}` };
    else if (ng) next = { g: ng, app: cur.id, label: 'Grup següent' };
    else if (ng2) next = { g: ng2, app: Object.keys(miss(ng2).perApp)[0], label: 'Grup següent' };
  } else {
    const ng = order.find(x => miss(x).total);
    if (ng) next = { g: ng, app: 'all', label: 'Grup següent' };
  }
  toast(`Final de ${g ? groupLabel(g) : 'aquest grup'}${cur ? ` · ${cur.name}` : ''}${g && !miss(g).total ? ': notes completes ✓' : ''}.`, 'ok', next ? { actions: [{ label: next.label, fn: () => {
    ui.group = next.g.key; ui.app = next.app; qe.buf = ''; render();
    // només una casella buida d'una nota que falta (mai una que ja té nota ni la de penalització)
    const c2 = curComp();
    const f = c2 && $$('#scoregrid input.sc[data-chg="score"]:not(:disabled)').find(x => {
      if (x.value || x.dataset.f === 'p') return false;
      const e = c2.entries.find(y => y.id === x.dataset.e), a = c2.apparatus.find(y => y.id === x.dataset.a);
      return !!(e && a && !Engine.appComplete(e, a, c2));
    });
    if (f) focusSc(f);
  } }] } : {});
}

  e.preventDefault();
  forms[f.dataset.form](f, e.submitter);
});
let navKey = false;   // el canvi de nota ve d'Intro o d'una fletxa (no de sortir de la casella)
document.addEventListener('keydown', e => {
  const el = e.target;
  // el desplegable d'equip de la graella: les fletxes no canvien l'equip sense voler, passen a la fila del costat
  if (el.matches && el.matches('#scoregrid select.teamsel') && !['Tab', 'Enter', ' ', 'Escape'].includes(e.key)) {
    // (cap tecla canvia l'equip sense obrir el desplegable; amunt i avall passen a la fila del costat)
    e.preventDefault();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const tr = el.closest('tr'), sib = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling;
      const f = sib && sib.querySelector('input.sc:not(:disabled)'); if (f) focusSc(f);
    }
    return;
  }
  // a la graella de notes, Intro / fletxes baixen i pugen per la mateixa columna
  if (el.matches && el.matches('input.sc') && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const up = e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey);
    const col = $$(`#scoregrid input.sc[data-col="${el.dataset.col}"]:not(:disabled)`);
    const nx = col[col.indexOf(el) + (up ? -1 : 1)], nextId = nx && nx.dataset.e, colKey = el.dataset.col;
    navKey = true;
    let r;
    try { r = changes[el.dataset.chg](el); } finally { navKey = false; }
    if (r === false) { el.select(); return; }   // nota no vàlida: no es passa a la següent
    if (r === 'np') { const n = nextId && $(`#scoregrid input.sc[data-col="${colKey}"][data-e="${nextId}"]`); if (n && !n.disabled) focusSc(n); else advanceFrom(el, up); return; }
    advanceFrom(el, up);
    return;
  }
  if (el.dataset && el.dataset.enter && e.key === 'Enter') { e.preventDefault(); actions[el.dataset.enter](el); }
});
// que la casella activa no quedi tapada per la fila de títols (enganxosa) ni per la barra de dalt
function keepClear(el) {
  const wrap = el.closest('.grid-wrap'); if (!wrap) return;
  const hd = $('header.top'), tb = $('#tutbanner');
  const bar = Math.max(getComputedStyle(hd).position === 'sticky' ? hd.getBoundingClientRect().bottom : 0,
    tb && tb.childElementCount && getComputedStyle(tb).position === 'sticky' ? tb.getBoundingClientRect().bottom : 0);
  const nav = $('nav.bottom'), navTop = nav && getComputedStyle(nav).display !== 'none' ? nav.getBoundingClientRect().top : innerHeight;
  const w = wrap.getBoundingClientRect(), r = el.getBoundingClientRect(), th = wrap.querySelector('thead');
  const top = Math.max(w.top, bar) + (th ? th.getBoundingClientRect().height : 0), bottom = Math.min(w.bottom, innerHeight, navTop);
  if (r.top < top) wrap.scrollTop -= top - r.top + 4;
  else if (r.bottom > bottom) wrap.scrollTop += r.bottom - bottom + 4;
  const r2 = el.getBoundingClientRect();
  if (r2.top < bar + 4) window.scrollBy(0, r2.top - bar - 8);
  else if (r2.bottom > Math.min(innerHeight, navTop) - 4) window.scrollBy(0, r2.bottom - Math.min(innerHeight, navTop) + 8);
}
// en entrar en una casella de nota, es selecciona tota perquè es pugui sobreescriure.
// Ha de ser immediat: si s'espera, el que s'escriu de pressa després d'Intro quedaria seleccionat i se sobreescriuria.
const isSc = el => el && el.matches && el.matches('input.sc');
document.addEventListener('focusin', e => { if (isSc(e.target)) { e.target.select(); e.target._fresh = true; } });
document.addEventListener('mouseup', e => { if (isSc(e.target) && e.target._fresh) e.preventDefault(); if (e.target) e.target._fresh = false; });
document.addEventListener('keydown', e => { if (e.target) e.target._fresh = false; }, true);

// recorda quins desplegables d'equip del podi estan oberts
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.mem')) { if (d.open) ui.openTeams.add(d.dataset.tid); else ui.openTeams.delete(d.dataset.tid); } }, true);

// el primer clic de la sessió torna a demanar permís per al fitxer vinculat (el navegador ho exigeix així)
document.addEventListener('click', () => { if (fileHandle && fileState === 'perm') regrantFile(); }, { once: true, capture: true });

/* ═══════════════════════════════════════════ arrencada */
async function start() {
  loadDb();
  route();
  if (!(await serverInit())) render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (fsSupported()) {
    const hd = await idbGet('fileHandle');
    if (hd) {
      fileHandle = hd;
      try { fileState = (await hd.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'perm'; } catch (_) { fileState = 'perm'; }
      renderSaveState(false);
      // es comprova el fitxer ja en obrir, abans que ningú escrigui res
      if (fileState === 'ok') queueFileWrite();
    }
  }
}
start();

// instal·lable i sense internet quan es serveix per web (https: GitHub Pages). Des d'un fitxer ja funciona sense
// res més; i el programa NotesGim (http) serveix el manifest però no fa servir service worker (la pàgina és la
// que porta el programa, i així no queda mai una versió vella desada).
function addManifest() {
  if ($('link[rel=manifest]')) return;
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
}
if (location.protocol === 'https:') {
  addManifest();
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    // quan arriba una versió nova, s'avisa amb un botó a dalt (no es recarrega sola: es podria estar entrant notes)
    const ownSW = w => !!w && w.scriptURL === new URL('sw.js', location.href).href;
    let had = ownSW(navigator.serviceWorker.controller);
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (had && !updateReady) { updateReady = true; renderSaveState(false); }
      had = ownSW(navigator.serviceWorker.controller);
    });
  }
}
</script>
