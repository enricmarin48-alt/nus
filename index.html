<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#06070e;color:#e8ecf5;
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;touch-action:none}
  canvas{display:block;border-radius:18px;background:#06070e}

  /* ---- HUD ---- */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
    justify-content:space-between;padding:14px 18px;pointer-events:none;z-index:5}
  #lvl{font-size:15px;font-weight:700;letter-spacing:.14em;color:#5d6785}
  #lvl b{color:#9fb0d8}
  #ropes{display:flex;gap:7px;align-items:center}
  .rdot{width:13px;height:13px;border-radius:50%;border:2px solid #35e8ff;
    box-shadow:0 0 10px rgba(53,232,255,.5);transition:all .18s}
  .rdot.used{background:#1b2438;border-color:#2a3450;box-shadow:none;transform:scale(.72)}

  /* ---- botons ---- */
  #bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;
    padding:0 16px 20px;z-index:5}
  .btn{flex:1;border:none;border-radius:14px;padding:15px 8px;font:inherit;font-size:14px;
    font-weight:800;letter-spacing:.1em;color:#8b97b8;background:#131829;
    transition:transform .1s,opacity .15s;cursor:pointer}
  .btn:active{transform:scale(.95)}
  .btn:disabled{opacity:.3}
  .btn.go{flex:1.5;color:#04121a;background:linear-gradient(180deg,#4ff0ff,#15c8e6);
    box-shadow:0 0 26px rgba(53,232,255,.4)}

  /* ---- pantalles ---- */
  .screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;padding:34px;
    background:rgba(6,7,14,.9);backdrop-filter:blur(7px);border-radius:18px}
  .screen.hide{display:none}
  .title{font-size:76px;font-weight:900;letter-spacing:.22em;margin-right:-.22em;
    background:linear-gradient(180deg,#eaffff,#35e8ff);-webkit-background-clip:text;
    background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(53,232,255,.45))}
  .sub{font-size:15px;color:#6d79a0;line-height:1.6;max-width:270px}
  .big{font-size:34px;font-weight:900;letter-spacing:.05em}
  .cta{margin-top:10px;border:none;border-radius:16px;padding:17px 42px;font:inherit;
    font-size:16px;font-weight:800;letter-spacing:.14em;color:#04121a;
    background:linear-gradient(180deg,#4ff0ff,#15c8e6);
    box-shadow:0 0 34px rgba(53,232,255,.45);cursor:pointer}
  .cta:active{transform:scale(.96)}
  .ghost{background:none;color:#5d6785;box-shadow:none;padding:12px 20px;font-size:13px}
  .spinner{width:34px;height:34px;border:3px solid #1b2438;border-top-color:#35e8ff;
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<div id="app"><div id="stage">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="lvl">NIVELL <b id="lvlnum">1</b></div>
    <div id="ropes"></div>
  </div>

  <div id="bar">
    <button class="btn" id="bUndo">DESFÉS</button>
    <button class="btn go" id="bGo">ENGEGA</button>
    <button class="btn" id="bReset">REINICIA</button>
  </div>

  <div class="screen" id="scMenu">
    <div class="title">NUS</div>
    <div class="sub">Lliga'ls de dos en dos.<br>Xoquen, peten, i el que peta<br>en fa petar més.</div>
    <button class="cta" id="bPlay">JUGA</button>
    <button class="cta ghost" id="bWipe">començar de zero</button>
  </div>

  <div class="screen hide" id="scLoad">
    <div class="spinner"></div>
    <div class="sub">preparant el nivell…</div>
  </div>

  <div class="screen hide" id="scEnd">
    <div class="big" id="endTitle">NET</div>
    <div class="sub" id="endSub"></div>
    <button class="cta" id="bNext">SEGÜENT</button>
  </div>
</div></div>

<script>
"use strict";
// ───────────────────────────────────────────── món lògic
const W = 400, H = 720;
const TOP = 86, BOT = H - 96;           // zona jugable (sota el HUD, sobre els botons)

// ───────────────────────────────────────────── física (compartida joc + solver)
const P = {
  dt: 1/120,
  ropeAccel: 2100,      // acceleració cap a la parella lligada
  ropeDamp: .994,
  freeDamp: .9985,
  wallBounce: .82,
  killSpeed: 300,       // xoc lliure mortal (normal)
  heavyKillSpeed: 560,  // els pesats necessiten una hòstia de veritat
  maxSteps: 400,
};
// perfils d'explosió per tipus
const BOOM = {
  normal: { kill: 76,  push: 168, imp: 560 },
  heavy:  { kill: 84,  push: 190, imp: 700 },
  bomb:   { kill: 124, push: 246, imp: 900 },
};
const TYPE = {
  normal: { r: 18, mass: 1,   expKillable: true  },
  heavy:  { r: 27, mass: 3.4, expKillable: false },
  bomb:   { r: 20, mass: 1.1, expKillable: true  },
  pillar: { r: 26, mass: 0,   expKillable: false, static: true },
};

// ───────────────────────────────────────────── aleatori determinista
function rngFrom(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ───────────────────────────────────────────── simulació
function cloneBodies(bodies){
  const out = new Array(bodies.length);
  for (let i = 0; i < bodies.length; i++){
    const b = bodies[i];
    out[i] = { x:b.x, y:b.y, vx:0, vy:0, r:b.r, m:b.m, t:b.t,
               alive:true, stat:b.stat, expKillable:b.expKillable, rope:-1 };
  }
  return out;
}

// aplica una explosió: mata els de dins i empeny els de fora; retorna els nous morts
function detonate(bodies, x, y, prof, deadQueue, fx){
  for (let i = 0; i < bodies.length; i++){
    const b = bodies[i];
    if (!b.alive || b.stat) continue;
    const dx = b.x - x, dy = b.y - y;
    const d = Math.hypot(dx, dy) || .001;
    if (d < prof.kill + b.r * .5 && b.expKillable){
      b.alive = false;
      deadQueue.push(i);
    } else if (d < prof.push){
      const f = (1 - d / prof.push) * prof.imp / b.m;
      b.vx += dx / d * f;
      b.vy += dy / d * f;
    }
  }
  if (fx) fx.boom(x, y, prof);
}

// un pas de física. fx = efectes visuals (null al solver)
function step(bodies, fx){
  const dt = P.dt;
  const dead = [];

  // 1. estirada de les cordes
  for (let i = 0; i < bodies.length; i++){
    const b = bodies[i];
    if (!b.alive || b.rope < 0) continue;
    const o = bodies[b.rope];
    if (!o.alive || o.rope !== i) continue;
    const dx = o.x - b.x, dy = o.y - b.y;
    const d = Math.hypot(dx, dy) || .001;
    const a = P.ropeAccel / b.m * dt;
    b.vx += dx / d * a;
    b.vy += dy / d * a;
    b.vx *= P.ropeDamp;
    b.vy *= P.ropeDamp;
  }

  // 2. moviment + parets
  for (let i = 0; i < bodies.length; i++){
    const b = bodies[i];
    if (!b.alive || b.stat) continue;
    if (b.rope < 0){ b.vx *= P.freeDamp; b.vy *= P.freeDamp; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < b.r)       { b.x = b.r;       b.vx = -b.vx * P.wallBounce; }
    if (b.x > W - b.r)   { b.x = W - b.r;   b.vx = -b.vx * P.wallBounce; }
    if (b.y < TOP + b.r) { b.y = TOP + b.r; b.vy = -b.vy * P.wallBounce; }
    if (b.y > BOT - b.r) { b.y = BOT - b.r; b.vy = -b.vy * P.wallBounce; }
  }

  // 3. col·lisions
  for (let i = 0; i < bodies.length; i++){
    const a = bodies[i];
    if (!a.alive) continue;
    for (let j = i + 1; j < bodies.length; j++){
      const b = bodies[j];
      if (!b.alive) continue;
      if (a.stat && b.stat) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const sum = a.r + b.r;
      const d2 = dx*dx + dy*dy;
      if (d2 > sum*sum) continue;
      const d = Math.sqrt(d2) || .001;
      const nx = dx/d, ny = dy/d;

      // parella lligada que es troba → petada
      if (a.rope === j && b.rope === i){
        a.alive = b.alive = false;
        const prof = (a.t === 'bomb' || b.t === 'bomb') ? BOOM.bomb
                   : (a.t === 'heavy' || b.t === 'heavy') ? BOOM.heavy : BOOM.normal;
        const q = [];
        detonate(bodies, (a.x+b.x)/2, (a.y+b.y)/2, prof, q, fx);
        dead.push(...q);
        if (fx) fx.chain(2 + q.length);
        continue;
      }

      // separació
      const ov = sum - d;
      const ma = a.stat ? 0 : 1/a.m, mb = b.stat ? 0 : 1/b.m;
      const tot = ma + mb || 1;
      a.x -= nx * ov * (ma/tot); a.y -= ny * ov * (ma/tot);
      b.x += nx * ov * (mb/tot); b.y += ny * ov * (mb/tot);

      // resposta elàstica
      const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
      const vn = rvx*nx + rvy*ny;
      if (vn < 0){
        const imp = -(1.7) * vn / tot;
        if (!a.stat){ a.vx -= nx*imp*ma; a.vy -= ny*imp*ma; }
        if (!b.stat){ b.vx += nx*imp*mb; b.vy += ny*imp*mb; }
      }

      // mort per impacte
      const sp = Math.abs(vn);
      if (sp > 120 && fx) fx.hit(a.x + nx*a.r, a.y + ny*a.r, sp);
      const lim = t => t === 'heavy' ? P.heavyKillSpeed : P.killSpeed;
      const q = [];
      if (!a.stat && sp > lim(a.t)) { a.alive = false; q.push(i); }
      if (!b.stat && sp > lim(b.t)) { b.alive = false; q.push(j); }
      dead.push(...q);
    }
  }

  // 4. cadena: tot mort explota, i el que mata també explota
  let guard = 0;
  while (dead.length && guard++ < 60){
    const i = dead.shift();
    const b = bodies[i];
    detonate(bodies, b.x, b.y, BOOM[b.t] || BOOM.normal, dead, fx);
    if (fx) fx.chain(1);
  }
}

function settled(bodies){
  for (const b of bodies){
    if (!b.alive || b.stat) continue;
    if (b.rope >= 0 && bodies[b.rope].alive) return false;
    if (Math.hypot(b.vx, b.vy) > 34) return false;
  }
  return true;
}

function allClear(bodies){
  for (const b of bodies) if (b.alive && !b.stat) return false;
  return true;
}

// simulació sencera sense dibuixar → true si queda net
function simulate(proto, pairs){
  const bodies = cloneBodies(proto);
  for (const [i,j] of pairs){ bodies[i].rope = j; bodies[j].rope = i; }
  for (let s = 0; s < P.maxSteps; s++){
    step(bodies, null);
    if (allClear(bodies)) return true;
    if ((s & 7) === 0 && s > 40 && settled(bodies)) break;
  }
  return allClear(bodies);
}

// ───────────────────────────────────────────── solver: mínim de cordes
function matchings(idx, k){
  const out = [];
  (function rec(start, chosen){
    if (chosen.length === k){ out.push(chosen.slice()); return; }
    for (let a = start; a < idx.length; a++){
      for (let b = a + 1; b < idx.length; b++){
        if (chosen.some(p => p[0] === idx[a] || p[1] === idx[a] ||
                             p[0] === idx[b] || p[1] === idx[b])) continue;
        chosen.push([idx[a], idx[b]]);
        rec(a + 1, chosen);
        chosen.pop();
      }
    }
  })(0, []);
  return out;
}

function liveIdx(proto){
  const idx = [];
  for (let i = 0; i < proto.length; i++) if (!proto[i].stat) idx.push(i);
  return idx;
}

function minRopes(proto, max){
  const idx = liveIdx(proto);
  for (let k = 1; k <= max; k++){
    for (const m of matchings(idx, k)) if (simulate(proto, m)) return k;
  }
  return Infinity;
}

// quantes solucions hi ha (s'atura en arribar a `cap`)
function countSolutions(proto, k, cap){
  const idx = liveIdx(proto);
  let n = 0;
  for (const m of matchings(idx, k)){
    if (simulate(proto, m) && ++n >= cap) break;
  }
  return n;
}

// ───────────────────────────────────────────── generació de nivells
function spec(n){
  // corba de dificultat; a partir del 24 va pujant sol
  const table = [
    null,
    {n:3,k:1},{n:4,k:1},                      // 1-2  entendre-ho
    {n:5,k:2},{n:5,k:1},{n:6,k:2},            // 3-5  la cadena
    {n:6,k:2,bomb:1},{n:7,k:2,bomb:1},        // 6-7  bombes
    {n:7,k:2},{n:6,k:2,heavy:1},              // 8-9
    {n:7,k:2,heavy:1},{n:7,k:2,heavy:1,bomb:1}, // 10-11 pesats
    {n:7,k:2,pillar:1},{n:8,k:2,pillar:1},    // 12-13 columnes
    {n:8,k:2,heavy:1,pillar:1},               // 14
    {n:7,k:3},{n:8,k:3},{n:8,k:3,bomb:1},     // 15-17 tres cordes
    {n:8,k:3,heavy:1},{n:9,k:3,pillar:1},     // 18-19
    {n:9,k:3,heavy:1,bomb:1},{n:9,k:3,heavy:2},
    {n:9,k:3,pillar:2,bomb:1},{n:9,k:3,heavy:1,pillar:1},
  ];
  if (n < table.length) return table[n];
  const r = rngFrom(n * 7919);
  return { n: 8 + Math.floor(r()*2), k: 3,
           heavy: r() < .55 ? 1 + (r()<.3?1:0) : 0,
           bomb:  r() < .5 ? 1 : 0,
           pillar: r() < .45 ? 1 + (r()<.25?1:0) : 0 };
}

function layout(sp, rand){
  const bodies = [];
  const kinds = [];
  for (let i = 0; i < (sp.pillar||0); i++) kinds.push('pillar');
  for (let i = 0; i < (sp.heavy||0);  i++) kinds.push('heavy');
  for (let i = 0; i < (sp.bomb||0);   i++) kinds.push('bomb');
  while (kinds.length < sp.n + (sp.pillar||0)) kinds.push('normal');

  for (const t of kinds){
    const T = TYPE[t];
    let placed = false;
    for (let tries = 0; tries < 300 && !placed; tries++){
      const x = 34 + rand() * (W - 68);
      const y = TOP + 34 + rand() * (BOT - TOP - 68);
      let ok = true;
      for (const b of bodies){
        if (Math.hypot(b.x - x, b.y - y) < b.r + T.r + 26){ ok = false; break; }
      }
      if (!ok) continue;
      bodies.push({ x, y, r:T.r, m:T.mass||1, t,
                    stat:!!T.static, expKillable:T.expKillable });
      placed = true;
    }
    if (!placed) return null;
  }
  return bodies;
}

function generate(level){
  const sp = spec(level);
  const rand = rngFrom(level * 1013904223 + 12345);
  // als primers nivells exigim més d'una solució perquè hi hagi marge d'error
  const slack = level <= 2 ? 1 : level <= 8 ? 3 : 1;
  for (let attempt = 0; attempt < 420; attempt++){
    const proto = layout(sp, rand);
    if (!proto) continue;
    const k = minRopes(proto, sp.k);
    if (k !== sp.k) continue;
    if (slack > 1 && countSolutions(proto, sp.k, slack) < slack) continue;
    return { bodies: proto, budget: sp.k, level };
  }
  for (let attempt = 0; attempt < 300; attempt++){   // sense l'exigència de marge
    const proto = layout(sp, rand);
    if (!proto) continue;
    if (minRopes(proto, sp.k) === sp.k) return { bodies: proto, budget: sp.k, level };
  }
  // xarxa de seguretat: el que surti, amb el pressupost que calgui
  for (let attempt = 0; attempt < 420; attempt++){
    const proto = layout(sp, rand);
    if (!proto) continue;
    const k = minRopes(proto, sp.k + 1);
    if (k !== Infinity) return { bodies: proto, budget: k, level };
  }
  return null;
}

// ───────────────────────────────────────────── so
let AC = null;
function audio(){ if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return AC; }
function blip(freq, dur, type, vol){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function noise(dur, vol){
  const ac = audio(); if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  const g = ac.createGain(); g.gain.value = vol || .3;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}

// ───────────────────────────────────────────── estat del joc
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const el = id => document.getElementById(id);

let G = {
  mode: 'menu',        // menu | build | run | end
  level: 1,
  budget: 0,
  proto: [],           // disposició original
  bodies: [],          // estat viu
  pairs: [],           // cordes posades
  sel: -1,
  drag: null,
  steps: 0,
  timeScale: 1,
  shake: 0,
  chainCount: 0,
  chainShow: 0,
  parts: [],
  won: false,
};

// efectes visuals que la física crida
const FX = {
  boom(x, y, prof){
    G.shake = Math.min(26, G.shake + prof.kill * .17);
    for (let i = 0; i < 22; i++){
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 420;
      G.parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                     life: .35 + Math.random()*.5, max: .85,
                     r: 1.5 + Math.random()*3.5, c: prof === BOOM.bomb ? '#ff5f9e' : '#6ff4ff' });
    }
    G.parts.push({ ring: true, x, y, r: 6, to: prof.kill * 1.25, life: .38, max: .38,
                   c: prof === BOOM.bomb ? '#ff5f9e' : '#8ff8ff' });
    noise(.28, .22);
    blip(90 + Math.random()*40, .22, 'triangle', .1);
    if (navigator.vibrate) navigator.vibrate(14);
  },
  hit(x, y, sp){
    for (let i = 0; i < 4; i++){
      const a = Math.random()*Math.PI*2, s = 30 + Math.random()*100;
      G.parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                     life:.2, max:.2, r:1.5, c:'#9fb0d8' });
    }
  },
  chain(n){
    G.chainCount += n;
    if (G.chainCount >= 3) G.chainShow = .9;
    blip(320 + Math.min(G.chainCount, 14) * 70, .1, 'square', .05);
  }
};

// ───────────────────────────────────────────── mides
let scale = 1, rect = null;
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  const pad = 0;
  scale = Math.min((innerWidth - pad) / W, (innerHeight - pad) / H);
  const st = el('stage');
  st.style.width = (W * scale) + 'px';
  st.style.height = (H * scale) + 'px';
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  rect = cv.getBoundingClientRect();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

// ───────────────────────────────────────────── dibuix
function draw(dt){
  ctx.save();
  if (G.shake > .4){
    const s = G.shake;
    ctx.translate((Math.random()-.5)*s, (Math.random()-.5)*s);
    G.shake *= .87;
  }

  // fons
  ctx.fillStyle = '#06070e';
  ctx.fillRect(-40, -40, W+80, H+80);

  // marc de la zona jugable
  ctx.strokeStyle = 'rgba(56,68,104,.35)';
  ctx.lineWidth = 1.5;
  roundRect(6, TOP - 8, W - 12, BOT - TOP + 16, 16);
  ctx.stroke();

  // graella tènue
  ctx.strokeStyle = 'rgba(40,50,80,.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 40; x < W; x += 40){ ctx.moveTo(x, TOP); ctx.lineTo(x, BOT); }
  for (let y = TOP; y < BOT; y += 40){ ctx.moveTo(6, y); ctx.lineTo(W-6, y); }
  ctx.stroke();

  // cordes
  for (const [i,j] of G.pairs){
    const a = G.bodies[i], b = G.bodies[j];
    if (!a.alive || !b.alive) continue;
    const puls = G.mode === 'run' ? .5 + .5*Math.sin(performance.now()/70) : 1;
    ctx.strokeStyle = 'rgba(120,240,255,' + (.55 + .35*puls) + ')';
    ctx.lineWidth = 2.4;
    ctx.shadowColor = '#35e8ff'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // corda que s'està arrossegant
  if (G.drag && G.sel >= 0){
    const a = G.bodies[G.sel];
    const near = G.drag.over >= 0 ? G.bodies[G.drag.over] : null;
    const tx = near ? near.x : G.drag.x, ty = near ? near.y : G.drag.y;
    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = near ? 'rgba(120,240,255,.95)' : 'rgba(120,240,255,.4)';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.setLineDash([]);
  }

  // partícules
  for (const p of G.parts){
    const k = Math.max(0, p.life / p.max);
    if (p.ring){
      ctx.strokeStyle = p.c;
      ctx.globalAlpha = k * .8;
      ctx.lineWidth = 2 + 4 * k;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + (p.to - p.r) * (1 - k), 0, 7);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.c;
      ctx.globalAlpha = k;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // cossos
  for (let i = 0; i < G.bodies.length; i++){
    const b = G.bodies[i];
    if (!b.alive) continue;
    const selected = (i === G.sel && G.mode === 'build');
    const linked = b.rope >= 0;
    drawBody(b, selected, linked);
  }

  // comptador de cadena
  if (G.chainShow > 0){
    ctx.globalAlpha = Math.min(1, G.chainShow);
    ctx.fillStyle = '#fff';
    ctx.font = '900 44px ui-rounded, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#35e8ff'; ctx.shadowBlur = 24;
    ctx.fillText('CADENA ×' + G.chainCount, W/2, H/2 - 60);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    G.chainShow -= dt * 1.1;
  }

  // pista del primer nivell
  if (G.mode === 'build' && G.level === 1 && G.pairs.length === 0){
    ctx.fillStyle = 'rgba(120,135,175,.75)';
    ctx.font = '600 15px ui-rounded, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('arrossega d\'una bola a una altra', W/2, BOT + 26);
  }

  ctx.restore();
}

function drawBody(b, selected, linked){
  const col = b.t === 'bomb'  ? ['#ff3d7f','#ff9ec4']
            : b.t === 'heavy' ? ['#ffa53d','#ffd9a3']
            : b.t === 'pillar'? ['#39425f','#5a6890']
            : ['#35e8ff','#c9fbff'];
  if (b.t === 'pillar'){
    ctx.fillStyle = '#1a2033';
    ctx.strokeStyle = '#39425f';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(90,104,140,.55)';
    ctx.lineWidth = 2;
    for (let k = -1; k <= 1; k++){
      ctx.beginPath();
      ctx.moveTo(b.x - b.r*.62, b.y + k*9 + b.r*.3);
      ctx.lineTo(b.x + b.r*.62, b.y + k*9 - b.r*.3);
      ctx.stroke();
    }
    return;
  }
  const pulse = b.t === 'bomb' ? .5 + .5*Math.sin(performance.now()/230) : 0;
  ctx.shadowColor = col[0];
  ctx.shadowBlur = selected ? 30 : (18 + pulse*14);
  ctx.fillStyle = 'rgba(8,14,26,.9)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.strokeStyle = col[0];
  ctx.lineWidth = b.t === 'heavy' ? 5 : 3;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = col[1];
  ctx.globalAlpha = linked ? .95 : .55;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (b.t==='bomb' ? .34 + pulse*.1 : .3), 0, 7); ctx.fill();
  ctx.globalAlpha = 1;

  if (b.t === 'heavy'){
    ctx.strokeStyle = 'rgba(255,217,163,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * .68, 0, 7); ctx.stroke();
  }
  if (selected){
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 9, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ───────────────────────────────────────────── bucle
let last = performance.now();
function loop(now){
  let dt = Math.min(.05, (now - last) / 1000);
  last = now;

  if (G.mode === 'run'){
    const sub = P.dt;
    let t = dt * G.timeScale;
    let guard = 0;
    while (t > 0 && guard++ < 12){
      step(G.bodies, FX);
      G.steps++;
      t -= sub;
      if (allClear(G.bodies)){ finish(true); break; }
      if (G.steps > 40 && (G.steps & 7) === 0 && settled(G.bodies)){ finish(false); break; }
      if (G.steps > P.maxSteps){ finish(false); break; }
    }
    // càmera lenta quan en queda una de sola
    let aliveN = 0;
    for (const b of G.bodies) if (b.alive && !b.stat) aliveN++;
    G.timeScale += ((aliveN === 1 ? .32 : 1) - G.timeScale) * .12;
  }

  // partícules
  for (let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0){ G.parts.splice(i, 1); continue; }
    if (!p.ring){ p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94; }
  }

  draw(dt);
  requestAnimationFrame(loop);
}

// ───────────────────────────────────────────── flux de joc
function loadLevel(n){
  G.mode = 'load';
  el('scLoad').classList.remove('hide');
  el('scEnd').classList.add('hide');
  el('scMenu').classList.add('hide');
  setTimeout(() => {
    const lv = cache(n);
    if (!lv){ el('scLoad').classList.add('hide'); return; }
    G.level = n;
    G.proto = lv.bodies;
    G.budget = lv.budget;
    reset();
    el('scLoad').classList.add('hide');
    el('lvlnum').textContent = n;
    prefetch(n + 1);
  }, 30);
}

let LEVELS = {};
function cache(n){
  if (LEVELS[n]) return LEVELS[n];
  const lv = generate(n);
  if (lv) LEVELS[n] = lv;
  return lv;
}
function prefetch(n){
  if (LEVELS[n]) return;
  setTimeout(() => { try { cache(n); } catch(e){} }, 400);
}

function reset(){
  G.bodies = cloneBodies(G.proto);
  G.pairs = [];
  G.sel = -1;
  G.drag = null;
  G.steps = 0;
  G.timeScale = 1;
  G.chainCount = 0;
  G.chainShow = 0;
  G.parts = [];
  G.won = false;
  G.mode = 'build';
  renderRopes();
  updateButtons();
}

function renderRopes(){
  const box = el('ropes');
  box.innerHTML = '';
  for (let i = 0; i < G.budget; i++){
    const d = document.createElement('div');
    d.className = 'rdot' + (i < G.pairs.length ? ' used' : '');
    box.appendChild(d);
  }
}

function updateButtons(){
  const building = G.mode === 'build';
  el('bUndo').disabled = !building || G.pairs.length === 0;
  el('bGo').disabled = !building || G.pairs.length === 0;
  el('bReset').disabled = G.mode === 'run' ? false : false;
}

function run(){
  if (G.mode !== 'build' || !G.pairs.length) return;
  G.mode = 'run';
  G.steps = 0;
  G.sel = -1; G.drag = null;
  updateButtons();
  blip(520, .09, 'square', .07);
}

function finish(won){
  if (G.mode !== 'run') return;
  G.mode = 'end';
  G.won = won;
  setTimeout(() => {
    if (won){
      const best = Math.max(progress(), G.level + 1);
      saveProgress(best);
      el('endTitle').textContent = 'NET';
      el('endTitle').style.color = '#6ff4ff';
      el('endSub').textContent = G.pairs.length < G.budget
        ? 'I encara t\'ha sobrat una corda.'
        : 'Cadena de ' + Math.max(G.chainCount, 2) + '.';
      el('bNext').textContent = 'SEGÜENT';
      blip(660, .12, 'sine', .12);
      setTimeout(() => blip(880, .18, 'sine', .12), 110);
    } else {
      el('endTitle').textContent = 'N\'HA QUEDAT';
      el('endTitle').style.color = '#ff6a8f';
      el('endSub').textContent = 'Prova una altra combinació.';
      el('bNext').textContent = 'UN ALTRE COP';
      blip(150, .3, 'sawtooth', .07);
    }
    el('scEnd').classList.remove('hide');
  }, won ? 620 : 420);
}

// ───────────────────────────────────────────── progrés desat
function progress(){
  try { return parseInt(localStorage.getItem('nus.lvl') || '1', 10) || 1; }
  catch(e){ return 1; }
}
function saveProgress(n){
  try { localStorage.setItem('nus.lvl', String(n)); } catch(e){}
}

// ───────────────────────────────────────────── entrada
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
function bodyAt(x, y, pad){
  let best = -1, bd = 1e9;
  for (let i = 0; i < G.bodies.length; i++){
    const b = G.bodies[i];
    if (!b.alive || b.stat) continue;
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < b.r + (pad || 16) && d < bd){ bd = d; best = i; }
  }
  return best;
}

cv.addEventListener('pointerdown', e => {
  audio();
  if (G.mode !== 'build') return;
  const p = pos(e);
  const i = bodyAt(p.x, p.y);
  if (i < 0){ G.sel = -1; return; }
  if (G.bodies[i].rope >= 0) return;            // ja lligat
  if (G.pairs.length >= G.budget) return;       // sense cordes
  if (G.sel === i){ G.sel = -1; return; }
  G.sel = i;
  G.drag = { x: p.x, y: p.y, over: -1 };
  cv.setPointerCapture(e.pointerId);
  blip(740, .05, 'sine', .05);
});

cv.addEventListener('pointermove', e => {
  if (!G.drag || G.mode !== 'build') return;
  const p = pos(e);
  G.drag.x = p.x; G.drag.y = p.y;
  const i = bodyAt(p.x, p.y, 22);
  G.drag.over = (i >= 0 && i !== G.sel && G.bodies[i].rope < 0) ? i : -1;
});

cv.addEventListener('pointerup', e => {
  if (G.mode !== 'build') return;
  const p = pos(e);
  const i = bodyAt(p.x, p.y, 22);
  const from = G.sel;
  const moved = G.drag && Math.hypot(G.drag.x - G.bodies[from]?.x, G.drag.y - G.bodies[from]?.y) > 14;
  G.drag = null;
  if (from < 0) return;
  if (i >= 0 && i !== from && G.bodies[i].rope < 0){
    tie(from, i);
    G.sel = -1;
  } else if (moved){
    G.sel = -1;                                  // arrossegament fallit
  }
  // si no s'ha mogut, deixem la bola seleccionada (mode toc-toc)
});

function tie(i, j){
  if (G.pairs.length >= G.budget) return;
  G.bodies[i].rope = j;
  G.bodies[j].rope = i;
  G.pairs.push([i, j]);
  renderRopes();
  updateButtons();
  blip(430, .09, 'triangle', .08);
  if (navigator.vibrate) navigator.vibrate(8);
  if (G.pairs.length === G.budget) setTimeout(run, 420);
}

function undo(){
  const p = G.pairs.pop();
  if (!p) return;
  G.bodies[p[0]].rope = -1;
  G.bodies[p[1]].rope = -1;
  G.sel = -1;
  renderRopes();
  updateButtons();
  blip(240, .07, 'triangle', .06);
}

// ───────────────────────────────────────────── botons
el('bUndo').onclick  = () => { audio(); undo(); };
el('bGo').onclick    = () => { audio(); run(); };
el('bReset').onclick = () => { audio(); el('scEnd').classList.add('hide'); reset(); };
el('bPlay').onclick  = () => { audio(); loadLevel(progress()); };
el('bWipe').onclick  = () => { audio(); saveProgress(1); loadLevel(1); };
el('bNext').onclick  = () => {
  audio();
  el('scEnd').classList.add('hide');
  if (G.won) loadLevel(G.level + 1); else reset();
};

// ───────────────────────────────────────────── instal·lable i sense cobertura
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ───────────────────────────────────────────── arrencada
resize();
el('lvlnum').textContent = progress();
const cont = progress() > 1;
el('bPlay').textContent = cont ? 'CONTINUA' : 'JUGA';
if (!cont) el('bWipe').style.display = 'none';
requestAnimationFrame(loop);
</script>
</body>
</html>
