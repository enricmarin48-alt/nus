        <td class="c-st"><select data-chg="entryStatus" data-id="${e.id}" ${dis} aria-label="Es presenta?"><option value="">Participa</option><option value="np" ${e.status === 'np' ? 'selected' : ''}>${isPhone() ? 'NP (no es presenta)' : 'No es presenta (NP)'}</option></select></td>
        <td class="c-del num"><button class="icon-btn" data-act="delEntry" data-id="${e.id}" title="Treu-la de la competició" aria-label="Treu ${h(gymName(gym))} de la competició" ${dis}>✕</button></td></tr>`;
    }).join('');
    const anyHit = !q || sortEntries(g.entries).some(e => { const gym = gymById(e.gymnastId); return norm(`${gymName(gym)} ${clubName(e.clubId)} ${e.bib}`).includes(q) || String(e.bib) === q; });
    return `<div class="card ins-group ${anyHit ? '' : 'hidden'}">
      <div class="card-head"><h3>${h(groupLabel(g))}</h3><span class="muted">${plural(g.entries.length, 'gimnasta', 'gimnastes')} · ${plural(teams.length, 'equip', 'equips')}</span>
        <div class="actions"><button class="btn sm" data-act="newGymHere" data-g="${h(g.key)}" ${dis}>＋ Gimnasta nova</button><button class="btn sm" data-act="newCompTeam" data-g="${h(g.key)}" ${dis}>＋ Equip</button></div></div>
      ${teams.length ? `<div class="chips" style="margin-bottom:10px">${teamChips}</div>` : ''}
      <div class="tbl-wrap"><table class="tbl cardify ins"><thead><tr><th>Dorsal</th><th>Gimnasta</th><th class="hide-ph">Entitat</th><th>Equip</th><th>Estat</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6" class="muted">Cap gimnasta en aquest grup.</td></tr>`}</tbody></table></div></div>`;
  }).join('');
}

function newEntry(c, g, grp) {
  return { id: uid(), gymnastId: g.id, category: (grp ? grp.category : g.category) ?? '', gender: genderOf(grp || g),
    level: (grp ? grp.level : g.level) ?? '', clubId: g.clubId || null, teamId: null, bib: nextBib(c), status: '', scores: {} };
}
const hasScores = e => Object.values(e.scores || {}).some(arr => (arr || []).some(a => a && ['v', 'd', 'e', 'p'].some(k => a[k] !== undefined && a[k] !== null)));
/* ─── EQUIPS: cada gimnasta té el seu equip a la fitxa
   L'equip viu a la llista general (db.teams: nom, entitat, grup i gimnastes) i és el que surt a la fitxa de
   cada gimnasta. A cada competició se'n fa una còpia (c.teams, amb sourceTeamId) que és la que compta aquell
   dia: una NP o un canvi d'equip el mateix dia no canvien les altres jornades. Quan es canvia la fitxa (o la
   llista d'equips), les competicions d'avui o de més endavant la segueixen; les passades no es toquen. */
const gymTeam = g => db.teams.find(t => t.memberIds.includes(g.id) && sameGroup(t, g)) || db.teams.find(t => t.memberIds.includes(g.id)) || null;
// valor del desplegable d'equip de la fitxa: l'id de l'equip, '__none' (només individual) o '' (automàtic)
const gymTeamValue = g => { const t = gymTeam(g); return t ? t.id : g.noTeam ? '__none' : ''; };
const clubTeams = (clubId, grp, extra = []) => db.teams.concat(extra).filter(t => (t.clubId || null) === (clubId || null) && sameGroup(t, grp));
// nom d'un equip nou: el de l'entitat (el grup ja surt a tot arreu) i, si ja n'hi ha, amb número: «CG Lleida 2».
// extra: equips que encara no existeixen però es crearan alhora
function newTeamName(clubId, grp, extra = []) {
  const base = clubName(clubId) || 'Equip';
  const used = new Set(db.teams.concat(extra).filter(t => sameGroup(t, grp)).map(t => norm(t.name)));
  if (!clubTeams(clubId, grp, extra).length && !used.has(norm(base))) return base;
  for (let n = 2; ; n++) if (!used.has(norm(base + ' ' + n))) return base + ' ' + n;
}
function makeTeam(clubId, grp, name) {
  const t = { id: uid(), name: String(name || '').trim() || newTeamName(clubId, grp), clubId: clubId || null,
    gender: genderOf(grp), category: grp.category ?? '', level: grp.level ?? '', memberIds: [] };
  db.teams.push(t);
  return t;
}
// una gimnasta només és a un equip: entrar en un la treu de tots els altres
function putInTeam(gymId, team) {
  for (const t of db.teams) if (t !== team && t.memberIds.includes(gymId)) t.memberIds = t.memberIds.filter(id => id !== gymId);
  if (team && !team.memberIds.includes(gymId)) team.memberIds.push(gymId);
}
// la còpia d'un equip en una competició (es crea quan cal; si es queda buida, desapareix sola). Si l'equip ha
// canviat de grup, la còpia del grup d'abans no serveix: se'n fa una de nova
function compTeamFor(c, team) {
  let ct = c.teams.find(x => x.sourceTeamId === team.id && sameGroup(x, team));
  if (!ct) {
    ct = { id: uid(), name: team.name, clubId: team.clubId || null, category: team.category, gender: genderOf(team), level: team.level, sourceTeamId: team.id, auto: true };
    c.teams.push(ct);
  }
  return ct;
}
// treu els equips de la competició que s'han quedat sense ningú
function pruneAutoTeams(c) {
  c.teams = c.teams.filter(t => !t.auto || c.entries.some(e => e.teamId === t.id));
}
// competicions que segueixen la fitxa: les no tancades d'avui o de més endavant (i la que tens oberta)
const followsRecords = c => !c.locked && (!c.date || c.date >= today() || (ui.view === 'competicio' && c.id === ui.compId));
// el que passa en una competició només pot canviar la fitxa si és d'avui o de més endavant (no una de passada)
const isUpcoming = c => !c.date || c.date >= today();
// una gimnasta d'aquesta inscripció competeix en el grup de la seva fitxa (si no, aquell dia va en un altre grup)
const inRecordGroup = e => { const g = gymById(e.gymnastId); return !!g && sameGroup(e, g); };
// el mateix equip (entitat, grup i nom) a la llista general
const findTeam = (clubId, grp, name) => db.teams.find(t => (t.clubId || null) === (clubId || null) && sameGroup(t, grp) && norm(t.name) === norm(name));
// gimnastes d'un equip a la competició que hi compten (les NP no)
const teamSize = (c, ct) => c.entries.filter(e => e.teamId === ct.id && e.status !== 'np').length;
const teamNP = (c, ct) => c.entries.filter(e => e.teamId === ct.id && e.status === 'np').length;
// avís si una NP deixa el seu equip sense el mínim
function npTeamWarn(c, e) {
  const ct = e.teamId && c.teams.find(t => t.id === e.teamId);
  if (!ct || e.status !== 'np') return '';
  const n = teamSize(c, ct);
  return n < (c.teamMin || 3) ? ` «${ct.name}» es queda amb ${n}: no arriba al mínim i quedarà anul·lat.` : '';
}
// les inscripcions sense equip van a l'equip de la seva fitxa (si en té un del mateix grup). Torna quantes.
function autoAssignTeams(c, entries) {
  let n = 0;
  for (const e of entries) {
    if (e.teamId || e.noAuto) continue;
    const t = db.teams.find(t => t.memberIds.includes(e.gymnastId) && sameGroup(t, e));
    if (t) { e.teamId = compTeamFor(c, t).id; n++; }
  }
  return n;
}
// EQUIPS PER ENTITAT: primer, cadascú al seu equip de la fitxa. Després, a cada grup, les gimnastes d'una
// entitat que no tenen equip en formen (mínim 3, i si són 7 o més, dos equips), o entren als de la seva
// entitat que tinguin lloc. L'equip queda a la fitxa de cada gimnasta per a les jornades següents.
// No es toca qui ja té equip, qui s'ha tret d'un equip a mà en aquesta competició (noAuto) ni qui a la fitxa
// diu «només individual». only: les inscripcions que s'acaben de fer (s'hi afegeixen les soles de la seva
// mateixa entitat i grup, per si ara ja n'hi ha prou per fer equip).
function autoCompTeams(c, only) {
  const min = c.teamMin || 3, max = c.teamMax || 6;
  let placed = autoAssignTeams(c, only || c.entries), made = 0;
  const pairs = only ? new Set(only.map(e => groupKeyOf(e) + '|' + e.clubId)) : null;
  for (const g of groupsOf(c)) {
    const byClub = new Map();
    for (const e of sortEntries(g.entries)) {
      if (e.teamId || !e.clubId || e.status === 'np' || e.noAuto || (pairs && !pairs.has(g.key + '|' + e.clubId))) continue;
      const gym = gymById(e.gymnastId);
      if (!gym || gym.noTeam) continue;
      if (!byClub.has(e.clubId)) byClub.set(e.clubId, []);
      byClub.get(e.clubId).push(e);
    }
    for (const [clubId, free] of byClub) {
      const size = ct => c.entries.filter(x => x.teamId === ct.id).length;
      // (en una competició que vé, un equip que a la fitxa ja és ple no rep ningú més: avui li falta algú, però a
      // la jornada següent en tindria massa; i per tant tampoc compta per saber quants equips nous calen)
      const full = t => isUpcoming(c) && t.sourceTeamId && ((teamById(t.sourceTeamId) || {}).memberIds || []).length >= max;
      const teams = compTeamsOf(c, g).filter(t => t.clubId === clubId), open = teams.filter(t => !full(t));
      const total = open.reduce((n, t) => n + size(t), 0) + free.length;
      // equips nous que calen (com si es fessin tots de cop), però només si les noves els poden omplir fins al mínim
      const kNew = Math.max(0, Math.min(splitSizes(total, min, max).length - open.length, Math.floor(free.length / min)));
      // en una competició passada (o si aquell dia competeixen en un altre grup) els equips nous són només d'aquell
      // dia: no es toca cap fitxa
      const toRecords = isUpcoming(c) && free.some(inRecordGroup);
      const fresh = range(kNew).map(() => {
        if (toRecords) return compTeamFor(c, makeTeam(clubId, g));
        const ct = { id: uid(), name: newTeamName(clubId, g, c.teams), clubId, category: g.category, gender: genderOf(g), level: g.level, sourceTeamId: null, auto: true };
        c.teams.push(ct);
        return ct;
      });
      made += fresh.length;
      const put = (e, ct) => {
        e.teamId = ct.id; placed++;
        const t = ct.sourceTeamId && teamById(ct.sourceTeamId);
        if (t && isUpcoming(c) && inRecordGroup(e)) putInTeam(e.gymnastId, t);
      };
      for (const ct of fresh) while (size(ct) < min && free.length) put(free.shift(), ct);
      const all = teams.concat(fresh);
      while (free.length) {
        const room = all.filter(t => size(t) < max && !full(t)).sort((a, b) => size(a) - size(b))[0];
        if (!room) break;
        put(free.shift(), room);
      }
    }
  }
  return { made, placed };
}
// canvia l'equip de la fitxa. value: id d'un equip, '__new' (equip nou amb el nom newName), '__none' (només
// individual) o '' (automàtic: amb les de la seva entitat). Les competicions que segueixen la fitxa també canvien.
function setGymTeam(g, value, newName) {
  let team = null;
  if (value === '__new') team = (String(newName || '').trim() && findTeam(g.clubId, g, newName)) || makeTeam(g.clubId, g, newName);
  else if (value && value !== '__none') team = teamById(value) || null;
  putInTeam(g.id, team);
  if (value === '__none') g.noTeam = true; else delete g.noTeam;
  const touched = [];
  for (const c of db.competitions.filter(followsRecords)) {
    const e = c.entries.find(x => x.gymnastId === g.id);
    if (!e) continue;
    const before = e.teamId;
    if (team) { if (sameGroup(e, team)) { e.teamId = compTeamFor(c, team).id; delete e.noAuto; } }   // si aquell dia competeix en un altre grup, no es toca
    else if (value === '__none') { e.teamId = null; e.noAuto = true; }
    else if (sameGroup(e, g)) { e.teamId = null; delete e.noAuto; if (c.autoTeams) autoCompTeams(c, [e]); }
    pruneAutoTeams(c);
    if (e.teamId !== before) touched.push(c.name);
  }
  return { team: team || gymTeam(g), touched };
}
// les competicions que segueixen la fitxa es posen al dia amb un equip de la llista (qui hi és i qui no).
// added: les gimnastes que s'acaben d'afegir a l'equip. Si es dona, només es mouen aquestes i les de removed:
// un canvi d'equip del mateix dia a les altres (o un canvi de nom) no desfà el que s'ha fet a la competició.
function propagateTeam(team, removed = [], added = null) {
  const touched = [];
  for (const c of db.competitions.filter(followsRecords)) {
    let changed = false;
    // les còpies d'aquest equip a la competició (n'hi pot haver una del grup d'abans, si l'equip ha canviat de grup)
    const copies = c.teams.filter(x => x.sourceTeamId === team.id);
    // l'equip ha canviat de grup: totes les seves gimnastes hi van
    const regroup = copies.length > 0 && !copies.some(x => sameGroup(x, team));
    for (const ct of copies) if (sameGroup(ct, team)) { ct.name = team.name; ct.clubId = team.clubId || null; }
    for (const e of c.entries) {
      const id = e.gymnastId;
      if (team.memberIds.includes(id) && sameGroup(e, team)) {
        if (added && !regroup && !added.includes(id)) continue;
        const ct = compTeamFor(c, team);
        if (e.teamId !== ct.id) { e.teamId = ct.id; delete e.noAuto; changed = true; }
      } else if (copies.some(x => x.id === e.teamId) && (removed.includes(id) || (!added && !team.memberIds.includes(id)) || !sameGroup(e, team))) {
        e.teamId = null; e.noAuto = true; changed = true;
      }
    }
    pruneAutoTeams(c);
    if (changed) touched.push(c.name);
  }
  return touched;
}
// un equip d'una competició, tal com és aquell dia, passa a les fitxes (i a les competicions que les segueixen)
function syncTeamToRecords(c, ct) {
  let team = ct.sourceTeamId && teamById(ct.sourceTeamId);
  if (team && !sameGroup(team, ct)) team = null;
  if (!team) { team = findTeam(ct.clubId, ct, ct.name) || makeTeam(ct.clubId, ct, ct.name); ct.sourceTeamId = team.id; ct.auto = true; }
  team.name = ct.name; team.clubId = ct.clubId || null;
  const before = [...team.memberIds];
  const inComp = c.entries.filter(e => e.teamId === ct.id && inRecordGroup(e)).map(e => e.gymnastId);
  const enrolled = new Set(c.entries.filter(e => sameGroup(e, ct)).map(e => e.gymnastId));
  const removed = team.memberIds.filter(id => enrolled.has(id) && !inComp.includes(id));
  team.memberIds = team.memberIds.filter(id => !removed.includes(id));
  for (const id of inComp) { putInTeam(id, team); const g = gymById(id); if (g) delete g.noTeam; }
  return propagateTeam(team, removed, team.memberIds.filter(id => !before.includes(id)));
}
// equips repetits (mateixa entitat, grup i nom) després d'ajuntar dos nivells: es queden en un de sol
// Si junts en serien massa, o en una competició passada o tancada (aquell dia eren dos equips), no s'ajunten:
// el segon passa a dir-se «… 2».
function mergeDupTeams() {
  const key = t => (t.clubId || '') + '|' + groupKeyOf(t) + '|' + norm(t.name);
  const freeName = (list, t) => { for (let n = 2; ; n++) { const nm = `${t.name} ${n}`; if (!list.some(o => o !== t && key(o) === key(Object.assign({}, t, { name: nm })))) return nm; } };
  const max = S().compDefaults.teamMax || 6;
  const keep = new Map(), remap = new Map();
  for (const t of db.teams) {
    const o = keep.get(key(t));
    if (!o) { keep.set(key(t), t); continue; }
    if (new Set(o.memberIds.concat(t.memberIds)).size > max) { t.name = freeName(db.teams, t); keep.set(key(t), t); continue; }
    for (const id of t.memberIds) if (!o.memberIds.includes(id)) o.memberIds.push(id);
    remap.set(t.id, o.id);
  }
  db.teams = db.teams.filter(t => !remap.has(t.id));
  for (const c of db.competitions) {
    const past = c.locked || !isUpcoming(c);
    const size = ct => c.entries.filter(e => e.teamId === ct.id).length;
    for (const ct of c.teams) {
      if (remap.has(ct.sourceTeamId)) ct.sourceTeamId = remap.get(ct.sourceTeamId);
      // a les que vénen, la còpia té el nom de l'equip de la fitxa (que potser ara és «… 2»)
      else if (!past) { const m = ct.sourceTeamId && teamById(ct.sourceTeamId); if (m && sameGroup(m, ct)) ct.name = m.name; }
    }
    const kc = new Map(), rc = new Map();
    for (const ct of c.teams) {
      const o = kc.get(key(ct));
      if (!o) { kc.set(key(ct), ct); continue; }
      if (past || size(o) + size(ct) > (c.teamMax || max)) {
        ct.name = freeName(c.teams, ct); kc.set(key(ct), ct);
        if (ct.sourceTeamId === o.sourceTeamId) ct.sourceTeamId = null;   // (si no, el rànquing el comptaria dues vegades)
        continue;
      }
      rc.set(ct.id, o.id);
    }
    if (!rc.size) continue;
    for (const e of c.entries) if (rc.has(e.teamId)) e.teamId = rc.get(e.teamId);
    c.teams = c.teams.filter(ct => !rc.has(ct.id));
  }
}
// opcions del desplegable d'equip d'una inscripció: els equips del grup en aquesta competició i els altres
// equips del grup de la llista general (encara no hi són perquè cap de les seves gimnastes no hi està inscrita)
function entryTeamOptions(c, e, g) {
  const teams = compTeamsOf(c, g);
  const size = t => teamSize(c, t) + (teamNP(c, t) ? ` + ${teamNP(c, t)} NP` : '');
  const others = db.teams.filter(t => sameGroup(t, g) && !teams.some(ct => ct.sourceTeamId === t.id)).sort((a, b) => coll(a.name, b.name));
  return `<option value="">— Individual —</option>
    ${teams.map(t => `<option value="${t.id}" ${e.teamId === t.id ? 'selected' : ''}>${h(t.name)} (${size(t)})</option>`).join('')}
    ${others.length ? `<optgroup label="Altres equips d’aquest grup">${others.map(t => `<option value="m:${t.id}">${h(t.name)} (0)</option>`).join('')}</optgroup>` : ''}`;
}

  },
  qeTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
  qeSave: () => {
    const ctx = qeCtx(); if (!ctx || !ctx.a) return;
    const e = qeCurrent(ctx);
    if (!qe.buf) { qeActions.qeMove({ dataset: { d: '1' } }); return; }
    const val = Engine.parseScore(qe.buf);
    if (Number.isNaN(val) || val > ctx.max) { qeRefresh(); return; }
    // mentrestant la taula l'ha posada, revisada, o ha bloquejat les notes: es diu per què no es desa
    if (e.status === 'np' || ctx.locked(e, qe.i)) {
      render();

    }
    const i = qe.i, prev = JSON.parse(JSON.stringify(ctx.get(e, i) || {})), a = ctx.a, comp = ctx.c, eid = e.id;
    ctx.save(e, i, val);
    const savedAt = (ctx.get(e, i) || {}).at;
    const nx = (i + 1 < ctx.n && !qeHas(ctx, e, i + 1)) ? { e, i: i + 1 } : qeNextMissing(ctx, ctx.list.indexOf(e));
    qe.buf = '';
    if (nx) { qe.entryId = nx.e.id; qe.i = nx.i; }
    render();
    const offline = ctx.tutor && !tut.online;
    toast(`${offline ? 'Guardada al mòbil (sense connexió: s’enviarà sola)' : 'Desada'} ${fmt(Engine.toM(val))} · ${a.name}${ctx.n > 1 ? ' ' + ordinal(i + 1) : ''} · ${e.bib} ${ctx.name(e)}`, offline ? 'bad' : 'ok', { actions: [{ label: 'Desfés', fn: () => {
      // sempre a l'aparell i la competició on s'ha desat, i només si ningú no l'ha tornada a canviar
      const v0 = prev.v === undefined || prev.v === null ? null : +prev.v;
      if (ctx.tutor) {
        const c2 = tut.comps.find(x => x.id === comp.id), e2 = c2 && c2.entries.find(x => x.id === eid);
        const now = e2 && (((e2.scores || {})[a.id] || [])[i] || {});
        // (el moment de desar el canvia el programa en rebre-la: es mira que hi hagi la mateixa nota i que la taula no l'hagi tocada)
        if (!e2 || Engine.toM(now.v) !== Engine.toM(val) || Engine.guarded(now)) { toast('Ja no es pot desfer: s’ha tornat a canviar.', 'bad'); return; }
        tutQueue(c2, e2, a, i, v0);
      } else {
        const c2 = compById(comp.id), e2 = c2 && c2.entries.find(x => x.id === eid);
        if (!e2 || att(e2, a, i).at !== savedAt || c2.locked) { toast('Ja no es pot desfer: s’ha tornat a canviar.', 'bad'); return; }
        setAttemptField(e2, a.id, i, 'v', v0); commit();
      }
      qe.entryId = eid; qe.i = i; qe.buf = ''; render(); toast('Desfet.');
    } }] });
  },
  qeNP: () => {
    const ctx = qeCtx(); if (!ctx || ctx.tutor || ctx.c.locked) return;
    const e = qeCurrent(ctx), was = e.status === 'np';
    withUndo(() => { const w = was ? '' : npTeamWarn(ctx.c, e); return { msg: `${entryName(e)}: ${was ? 'torna a participar' : 'no presentada (NP)'}.${w}`, type: w ? 'bad' : 'ok' }; }, () => { e.status = was ? '' : 'np'; });
    if (!was) { const nx = qeNextMissing(qeCtx(), ctx.list.indexOf(e)); if (nx) { qe.entryId = nx.e.id; qe.i = nx.i; render(); } }
  },
};
// teclat de l'ordinador (o de la tauleta) a l'entrada ràpida
document.addEventListener('keydown', e => {
  if (!$('#qe') || $('#dlg').open || $('#confirm').open || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && t.matches && t.matches('input, select, textarea')) return;
  const k = e.key;
  // Intro sobre un botó o enllaç de fora del teclat (p. ex. «Desfés» d'un avís): fa el que diu el botó
  if ((k === 'Enter' || k === ' ') && t && t.closest && t.closest('a, button, summary, [role=button]') && !t.closest('#qe')) return;
  let act = null;
  if (/^[0-9]$/.test(k)) act = ['qeKey', { k }];
  else if (k === ',' || k === '.' || k === "'") act = ['qeKey', { k: ',' }];
  else if (k === 'Backspace') act = ['qeKey', { k: 'del' }];
  else if (k === 'Enter') act = ['qeSave', {}];
  else if (k === 'ArrowRight') act = ['qeMove', { d: '1' }];
  else if (k === 'ArrowLeft') act = ['qeMove', { d: '-1' }];
  else if (k === 'Escape') { qe.buf = ''; qeRefresh(); e.preventDefault(); return; }
  if (!act) return;
  e.preventDefault();
  qeActions[act[0]]({ dataset: act[1] });
});

// medalles que cal tenir preparades (amb empats, n'hi pot haver més d'una de cada)
function medalCount(c) {
  const n = { 1: 0, 2: 0, 3: 0 };
  for (const g of groupsOf(c)) {
    for (const r of Engine.individualRanking(c, g).rows) if (r.rank && r.rank <= 3) n[r.rank]++;
    for (const r of Engine.teamRanking(c, g).rows) if (r.rank && r.rank <= 3) n[r.rank] += r.members.filter(e => e.status !== 'np').length;
  }
  return `Medalles: ${n[1]} d’or, ${n[2]} de plata i ${n[3]} de bronze (comptant-ne una per a cada gimnasta dels equips).`;
}
// PODI: les tres primeres posicions (amb empats, n'hi pot haver més) per a les medalles
const MEDALS = { 1: 'Or', 2: 'Plata', 3: 'Bronze' };

/* ═══════════════════════════════════════════ RÀNQUING DE JORNADES
   Cada competició va sola; aquí se sumen les jornades d'un curs (les que es triïn). */
function rankingData() {
  const seasons = [...new Set(db.competitions.map(c => c.season).filter(Boolean))].sort().reverse();
  if (!seasons.includes(ui.rkSeason)) ui.rkSeason = seasons[0] || '';
  ui.rkOff = ui.rkOff || {};
  const all = db.competitions.filter(c => c.season === ui.rkSeason).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const comps = all.filter(c => !ui.rkOff[c.id]);
  return { seasons, all, comps, groups: Engine.seasonRanking(comps, S(), { nameOf: entryName, teamGone: id => !teamById(id) }) };
}
const jLabel = (comps, c) => 'J' + (comps.indexOf(c) + 1);
// notes que falten en una competició (de totes les gimnastes que hi participen)
const compMissing = c => groupsOf(c).reduce((n, g) => n + Engine.missingScores(c, g).total, 0);
// abans d'imprimir o exportar el rànquing: si en alguna jornada marcada falten notes, s'avisa
async function confirmRankMissing(d) {
  const list = d.comps.filter(c => compMissing(c));
  if (!list.length) return true;
  return (await choiceBox(`<b>Encara falten notes</b> a ${list.map(c => `<b>${h(jLabel(d.all, c))} · ${h(c.name)}</b> (${compMissing(c)})`).join(', ')}: el rànquing no serà definitiu.<br><span class="small muted">Si aquesta jornada encara no s’ha acabat, desmarca-la.</span>`,
    [{ value: 'go', label: 'Continua igualment', cls: 'primary' }])) === 'go';
}

  const body = g.rows.map(r => `<tr class="${medal(r.rank)}"><td class="num pos">${posTxt(r)}</td><td>${h(r.name)}<span class="sub-ph">${h(clubName(r.entry.clubId))}</span></td><td class="hide-ph">${h(clubName(r.entry.clubId))}</td>

const jLegend = d => `<p class="small muted">${d.comps.map(c => `<b>${jLabel(d.all, c)}</b>: ${h(c.name)} (${fmtDate(c.date)})`).join(' · ')}</p>`;
views.ranquing = () => {

      ${d.all.map(c => `<label class="chk"><input type="checkbox" data-chg="rkComp" data-id="${c.id}" ${ui.rkOff[c.id] ? '' : 'checked'}> ${jLabel(d.all, c)} · ${h(c.name)} <span class="muted small">${fmtDate(c.date)}</span>${compMissing(c) ? ` <span class="badge warn" title="Hi falten notes: els totals d’aquesta jornada encara no són definitius">falten ${compMissing(c)}</span>` : ''}</label>`).join('')}</div>
    <p class="small muted">Suma la nota final de cada gimnasta (i de cada equip que classifica) a les jornades marcades. Qui no hi ha anat no suma res aquell dia. Els empats queden a la mateixa posició.</p>

    ${jLegend(d)}
    ${sel.map(g => `<div class="card"><div class="card-head"><h3>${h(groupLabel(g))}</h3></div>${type === 'teams' ? htmlSeasonTeams(d, g) : htmlSeasonInd(d, g)}</div>`).join('')}`

/* ═══════════════════════════════════════════ GIMNASTES */

/* ─── Equip de cada gimnasta (es tria a la mateixa fitxa) */
function teamOptionsFor(g, current) {
  const cur = current && !String(current).startsWith('__') ? teamById(current) : null;
  const list = db.teams.filter(t => sameGroup(t, g) || t === cur).sort((a, b) => coll(a.name, b.name));
  const own = g.clubId ? list.filter(t => t.clubId === g.clubId) : [], other = list.filter(t => !own.includes(t));
  const max = S().compDefaults.teamMax;
  const opt = t => { const n = t.memberIds.length, mine = t.memberIds.includes(g.id);
    return `<option value="${t.id}" ${t.id === current ? 'selected' : ''}>${h(t.name)}${sameGroup(t, g) ? '' : ' (un altre grup)'}${own.includes(t) || !t.clubId ? '' : ' · ' + h(clubName(t.clubId))} — ${n}/${max}${n >= max && !mine ? ' · ple' : ''}</option>`; };
  return `<option value="" ${!current ? 'selected' : ''}>Automàtic: amb les de la seva entitat</option>
    ${own.map(opt).join('')}${other.length ? (g.clubId ? `<optgroup label="Altres entitats">${other.map(opt).join('')}</optgroup>` : other.map(opt).join('')) : ''}
    <option value="__none" ${current === '__none' ? 'selected' : ''}>Només individual (sense equip)</option>
    <option value="__new" ${current === '__new' ? 'selected' : ''}>＋ Equip nou…</option>`;
}
function teamSetMsg(g, r) {
  const t = r.team, n = t ? t.memberIds.length : 0, max = S().compDefaults.teamMax;
  const where = r.touched.length ? ` També a: ${r.touched.join(', ')}.` : '';
  return { type: n > max ? 'bad' : 'ok', msg: t ? `${gymName(g)} → ${t.name} (${plural(n, 'gimnasta', 'gimnastes')}).${where}${n > max ? ` Compte: el màxim és ${max}.` : ''}`
    : g.noTeam ? `${gymName(g)}: només individual.${where}` : `${gymName(g)}: sense equip; quan s’inscrigui anirà amb les de la seva entitat.${where}` };
}
const teamSetToast = (g, r) => { const m = teamSetMsg(g, r); toast(m.msg, m.type); };

const IMPORT_FIELDS = [['', '— no l’importis —'], ['name', 'Nom'], ['surname', 'Cognoms'], ['full', 'Nom i cognoms'], ['club', 'Entitat'],
  ['gender', 'Gènere'], ['category', 'Categoria'], ['level', 'Nivell'], ['birth', 'Any / data de naixement'], ['team', 'Equip']];
// F / M / Femení / Masculí / noia / noi / dona / home… → 'F' | 'M' | null
function parseGender(v) {
  const x = norm(v).replace(/\.$/, '');
  if (!x) return null;
  if (/^(f|fem|femeni|femenina|femenino|noia|nena|dona|d|mujer|chica|nina|girl|female|w)$/.test(x)) return 'F';
  if (/^(m|masc|masculi|masculino|noi|nen|home|h|hombre|chico|nino|boy|male)$/.test(x)) return 'M';
  return null;
}
function guessField(header) {
  const x = norm(header);
  if (!x) return '';
  if (/^(genere|sexe|sexo|genero|gender|noi\/noia|noia\/noi)$/.test(x)) return 'gender';
  if (/^(nom i cognoms|nom complet|esportista|gimnasta|alumne|alumna|nombre y apellidos|nombre completo)$/.test(x)) return 'full';
  if (/^(cognoms?|apellidos?)/.test(x)) return 'surname';
  if (/^(nom|nombre|name)$/.test(x)) return 'name';
  if (/^(entitat|club|escola|centre|colegio|entidad|club\/escola|escola\/club|nom entitat|nom de l'entitat)$/.test(x)) return 'club';
  if (/^categori/.test(x)) return 'category';
  if (/^(nivell|nivel|level)/.test(x)) return 'level';
  if (/^(any|ano|any naixement|any de naixement|data naixement|data de naixement|naixement|fecha nacimiento|fecha de nacimiento|nacimiento|birth|data)$/.test(x)) return 'birth';
  if (/^(equip|equipo|team)/.test(x)) return 'team';
  return '';
}
// parteix en files respectant les cometes: una cel·la d'Excel amb salt de línia arriba entre cometes
// (Excel només posa entre cometes les cel·les que ho necessiten, i la cometa és el primer caràcter de la
// cel·la; una cometa enmig d'un nom, com a Anna "Nena", és un caràcter normal)
function quotedLines(text) {
  const out = []; let cur = '', q = false, start = true;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cur += '""'; i++; continue; }
        q = false; cur += ch; continue;
      }
      cur += ch === '\n' ? ' ' : ch;
      continue;
    }
    if (ch === '"' && start) { q = true; cur += ch; start = false; continue; }
    if (ch === '\n') { out.push(cur); cur = ''; start = true; continue; }
    cur += ch;
    start = ch === '\t' || ch === ';' || ch === ',';
  }
  out.push(cur);
  return out;
}
const unquote = s => { const t = s.trim(); return /^".*"$/s.test(t) ? t.slice(1, -1).replace(/""/g, '"').trim() : t; };
function splitRows(text) {
  const lines = quotedLines(String(text).replace(/\r\n?/g, '\n')).filter(l => l.trim() !== '');
  if (!lines.length) return [];
  // amb tabuladors (enganxat d'Excel) o punt i coma, es parteix per aquí; amb comes només si totes les files en tenen
  // el mateix nombre (si no, és una sola columna del tipus «COGNOMS, NOM»)
  const anyTab = lines.some(l => l.includes('\t')), anySemi = lines.some(l => l.includes(';'));
  const commas = new Set(lines.map(l => (l.match(/,/g) || []).length));
  const delim = anyTab ? '\t' : anySemi ? ';' : (commas.size === 1 && !commas.has(0) && guessField(lines[0]) !== 'full' && lines.length > 1 && !lines.slice(1).every(l => /^[^,]+,\s*[^,]+$/.test(l))) ? ',' : null;
  if (!delim) return lines.map(l => [unquote(l)]);
  return lines.map(l => {
    if (delim === '\t') return l.split('\t').map(unquote);
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === delim) { out.push(cur.trim()); cur = ''; } else cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}
function importAnalyze(text) {
  const rows = splitRows(text);
  if (!rows.length) return null;
  const width = Math.max(...rows.map(r => r.length));
  const guessed = range(width).map(i => guessField(rows[0][i]));
  // la primera fila són títols si hi ha una columna de nom reconeguda, o almenys dues de reconegudes
  const hasHeader = guessed.some(f => ['name', 'surname', 'full'].includes(f)) || guessed.filter(Boolean).length >= 2;
  const map = hasHeader ? guessed : (width === 1 ? ['full'] : ['name', 'surname', 'club', 'gender', 'category', 'level', 'birth', 'team'].slice(0, width).concat(range(Math.max(0, width - 8)).map(() => '')));
  return { rows, width, hasHeader, map, defCat: '', defLevel: '', defGender: 'F' };
}
function importResolve(imp) {
  const data = imp.hasHeader ? imp.rows.slice(1) : imp.rows;
  const col = f => imp.map.indexOf(f);
  const get = (r, f) => { const i = col(f); return i >= 0 ? String(r[i] ?? '').trim() : ''; };
  const seen = new Set();
  const known = new Set(db.gymnasts.map(g => norm(gymName(g)) + '|' + norm(clubName(g.clubId))));
  return data.map(r => {
    let name = get(r, 'name'), surname = get(r, 'surname');
    const full = get(r, 'full');
    if (!name && full) {
      if (full.includes(',')) { const [s, n] = full.split(','); surname = surname || s.trim(); name = n.trim(); }
      else name = full;
    }
    const club = get(r, 'club');
    const by = (/(19|20)\d{2}/.exec(get(r, 'birth')) || [])[0] || '';
    const gender = parseGender(get(r, 'gender')) || imp.defGender || 'F';
    // categoria: la de la columna; si no n'hi ha, la que toca per l'any; si tampoc, la triada per defecte
    const catRaw = get(r, 'category') || (by && catForYear(by)) || imp.defCat, levelRaw = get(r, 'level') || imp.defLevel;
    const category = matchFromList(catNames(), catRaw) || catRaw;
    // «Nivell A», «Nivel B», «Level A», «Niv. A» → A
    const lv = String(levelRaw || '').replace(/^\s*(nivell|nivel|level|niv\.?)\s*/i, '').trim() || levelRaw;
    const level = matchFromList(S().levels, lv) || matchFromList(S().levels, levelRaw) || lv.toUpperCase();
    const team = get(r, 'team');
    const key = norm(name + ' ' + surname) + '|' + norm(club);
    let status = 'new';
    if (!name) status = 'noname';
    else if (seen.has(key)) status = 'dupfile';
    else if (known.has(norm(name + ' ' + surname) + '|' + norm(club))) status = 'exists';
    seen.add(key);
    return { name, surname, club, gender, category, level, birthYear: by, team, status,
      newCat: category && !catNames().includes(category), newLevel: level && !S().levels.includes(level) };
  });
}

// reparteix n gimnastes en equips de min a max: el mínim d'equips possible i el més igualats possible.

function splitSizes(n, min, max) {
  if (n < min) return [];
  let k = Math.ceil(n / max);
  while (k > 1 && Math.floor(n / k) < min) k--;

  return range(k).map(i => base + (i < extra ? 1 : 0));
}
// proposta automàtica: gimnastes de la mateixa entitat + gènere + categoria + nivell que no tenen equip
function proposeTeams() {
  const min = S().compDefaults.teamMin, max = S().compDefaults.teamMax;
  const buckets = new Map();
  for (const g of db.gymnasts) {
    if (g.archived || g.noTeam || !g.clubId || !g.category || !g.level || db.teams.some(t => t.memberIds.includes(g.id) && sameGroup(t, g))) continue;
    const k = g.clubId + '||' + genderOf(g) + '||' + g.category + '||' + g.level;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(g);
  }
  const out = [];
  for (const list of buckets.values()) {
    if (list.length < min) continue;
    list.sort((a, b) => coll(gymName(a), gymName(b)));
    const sizes = splitSizes(list.length, min, max), k = sizes.length;
    let p = 0;
    for (let i = 0; i < k; i++) {
      const size = sizes[i];
      const members = list.slice(p, p + size); p += size;
      const g0 = members[0];
      const prop = { clubId: g0.clubId, gender: genderOf(g0), category: g0.category, level: g0.level, memberIds: members.map(m => m.id) };
      prop.name = newTeamName(g0.clubId, prop, out);
      out.push(prop);
    }
  }
  return out;
}

// a Configuració: si l'app ja és a punt per funcionar sense internet i si les dades estan protegides
async function offlineStatus() {
  const el = $('#offstat'); if (!el) return;
  const out = [];
  if (location.protocol === 'file:') out.push('✓ Oberta com a fitxer: funciona sense internet en aquest ordinador.');
  else if ('serviceWorker' in navigator && location.protocol === 'https:') {
    let ready = false;
    try { ready = !!navigator.serviceWorker.controller && !!(await caches.match(new URL('./', location.href).href)); } catch (_) {}
    out.push(ready ? '✓ Llesta per funcionar sense internet en aquest aparell.' : '⏳ Encara no està desada per funcionar sense internet: deixa-la oberta uns segons amb internet i torna a entrar.');
  }
  try {
    if (navigator.storage && navigator.storage.persisted) {
      const p = await navigator.storage.persisted();
      out.push(p ? '✓ Dades protegides: el navegador no les esborrarà per fer lloc.' : 'Les dades encara no estan protegides contra la neteja automàtica del navegador. <button class="btn sm" data-act="persist">Protegeix-les</button>');
    }
  } catch (_) {}
  if ($('#offstat') === el) el.innerHTML = out.join('<br>');
}

/* ═══════════════════════════════════════════ MODE TUTORA (mòbil a la Wi-Fi del servidor)
   La tutora posa el codi de la competició, tria el grup i el seu aparell i escriu la nota final.
   Si es perd la connexió, les notes queden a la cua del mòbil i s'envien soles quan torna. */
const TUT_KEY = 'notesgim.tutor';
const tut = { pin: '', who: '', comps: [], compId: null, group: null, app: null, version: null, queue: [], error: '', online: true, sending: false, list: false };
function tutLoad() { try { Object.assign(tut, JSON.parse(localStorage.getItem(TUT_KEY) || '{}')); } catch (_) {} if (!Array.isArray(tut.queue)) tut.queue = []; }
function tutSave() { try { localStorage.setItem(TUT_KEY, JSON.stringify({ pin: tut.pin, who: tut.who, compId: tut.compId, group: tut.group, app: tut.app, queue: tut.queue, list: tut.list })); } catch (_) {} }
async function tutorStart() {
  document.body.classList.add('tutor-mode');
  tutLoad();
  // el codi QR de la taula porta el codi a l'adreça (#codi=1234): s'entra sense escriure res
  const m = /(?:^#|[#&])codi=(\d{3,8})/.exec(location.hash);
  if (m) { if (tut.pin !== m[1]) { tut.pin = m[1]; tut.app = null; } try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} }
  ui.view = 'tutor';
  if (tut.pin) {
    try { await tutFetch(); } catch (_) { tut.online = false; }
    // el codi ja no val: es torna a demanar (però les notes que hi hagi per enviar es guarden)
    if (!tut.comps.length && tut.online && !tut.queue.length) tut.pin = '';
  }
  render();
  tutWaitLoop();
  if (tut.comps.length) tutSend();
}
async function tutFetch(since) {
  try {
    const j = await api(`api/tutor?pin=${encodeURIComponent(tut.pin)}${since != null ? '&since=' + since : ''}`);
    if (!j) return false;
    const wasOut = !tut.comps.length;
    tut.error = ''; tut.comps = j.comps || []; tut.version = j.version; tut.online = true;
    for (const op of tut.queue) tutApplyLocal(op);   // el que encara no s'ha enviat, es continua veient
    if (wasOut && tut.comps.length && tut.queue.length) setTimeout(tutSend, 0);   // ha tornat a entrar: s'envia el que quedava
    return true;
  } catch (e) {
    if (e.status === 403) { tut.error = e.message; tut.comps = []; return true; }
    throw e;
  }
}
async function tutWaitLoop() {
  for (;;) {
    if (!tut.pin) { await new Promise(r => setTimeout(r, 3000)); continue; }
    if (!tut.comps.length) {
      // encara no s'ha pogut entrar (sense connexió en obrir, o la competició està tancada o sense tutores):
      // es torna a provar sol, i quan la taula la torna a obrir s'hi entra sense fer res
      try { await tutFetch(); tut.online = true; if (tut.comps.length) render(); } catch (_) { tut.online = false; }
      await new Promise(r => setTimeout(r, tut.comps.length ? 0 : 5000));
      continue;
    }
    try {
      const changed = await tutFetch(tut.version);
      if (!tut.online) tut.online = true;
      if (changed) tutRefresh();
      tutStatusBar();
    } catch (_) { tut.online = false; tutStatusBar(); await new Promise(r => setTimeout(r, 3000)); }
  }
}
const tutComp = () => tut.comps.find(c => c.id === tut.compId) || tut.comps[0];
function tutApplyLocal(op) {
  const c = tut.comps.find(x => x.id === op.compId); if (!c) return;
  const e = c.entries.find(x => x.id === op.entryId); if (!e) return;
  e.scores = e.scores || {};
  const l = e.scores[op.appId] = e.scores[op.appId] || [];
  while (l.length <= op.i) l.push({});
  l[op.i] = op.value === null ? { by: 'tutor', at: op.at, mine: true } : { v: op.value, by: 'tutor', at: op.at, mine: true };
}
// una nota de la tutora: a la cua (es guarda al mòbil) i s'envia a la taula
function tutQueue(c, e, a, i, value) {
  const op = { compId: c.id, entryId: e.id, appId: a.id, i, value, at: Date.now(),
    label: `${e.bib ?? ''} ${e.name || ''} · ${a.name}${(a.attempts || 1) > 1 ? ' ' + ordinal(i + 1) : ''}` };
  tut.queue = tut.queue.filter(q => !(q.compId === op.compId && q.entryId === op.entryId && q.appId === op.appId && q.i === op.i));
  tut.queue.push(op); tutSave(); tutApplyLocal(op); tutMark(op, 'wait'); tutStatusBar();
  tutSend();
}
// envia la cua de notes, d'una en una i en ordre (només les de les competicions on es pot entrar ara)
async function tutSend() {
  if (tut.sending) return;
  tut.sending = true;
  try {
    for (;;) {
      const op = tut.queue.find(q => tut.comps.some(c => c.id === q.compId));
      if (!op) break;
      try {
        await api('api/score', { method: 'POST', body: JSON.stringify({ pin: tut.pin, who: tut.who, compId: op.compId, entryId: op.entryId, appId: op.appId, i: op.i, value: op.value }) }, 15000);
        tut.online = true;
        tut.queue = tut.queue.filter(q => q !== op); tutSave(); tutMark(op, 'ok');
      } catch (e) {
        if (e.status === 401) {
          // el codi ja no val (l'han canviat o han tancat la competició): les notes es queden al mòbil
          tut.error = e.message; tut.comps = []; tutSave(); render();
          break;
        }
        if (e.status && e.status !== 500) {
          // la taula no l'accepta (ja l'ha posada o revisada, no presentada…): fora de la cua i es torna a carregar
          tut.queue = tut.queue.filter(q => q !== op); tutSave(); tutMark(op, e.status === 409 ? 'lock' : 'err');
          toast(e.message, 'bad');
          try { await tutFetch(); render(); } catch (_) {}
          continue;
        }
        tut.online = false; tutStatusBar();
        await new Promise(r => setTimeout(r, 4000));
      }
    }
  } finally { tut.sending = false; tutStatusBar(); }
}
function tutMark(op, st) {
  const el = $$('[data-st]').find(x => x.dataset.st === `${op.entryId}:${op.appId}:${op.i}`);
  if (el) { el.textContent = st === 'ok' ? '✓' : st === 'err' ? '✕' : st === 'lock' ? '🔒' : '…'; el.className = 'st ' + (st === 'lock' ? 'err' : st); }
}
// notes de la cua que es poden enviar ara (les de les competicions on s'ha entrat) i les que no
const tutReach = () => tut.queue.filter(q => tut.comps.some(c => c.id === q.compId));
const tutStuck = () => tut.queue.filter(q => !tut.comps.some(c => c.id === q.compId));
const tutOpList = l => l.map(q => `${h(q.label || '')}: <b>${q.value === null ? 'esborrar' : fmt(Engine.toM(q.value))}</b>`).join('<br>');
// estat de la connexió en curt, per a la barra de l'aparell del teclat gran
const tutNetText = () => { const n = tutReach().length; return !tut.online ? `⚠ Sense connexió${n ? ` · ${n} al mòbil` : ''}` : n > 2 ? `Enviant ${n}…` : ''; };
function tutStatusBar() {
  const el = $('#tutstatus'), bn = $('#tutbanner'), qn = $('#qenet');
  if (qn) qn.textContent = tutNetText();
  const n = tutReach().length, stuck = tutStuck();
  const stuckNote = stuck.length ? `<div class="note warn"><b>${plural(stuck.length, 'nota d’una altra competició no s’ha', 'notes d’una altra competició no s’han')} pogut enviar</b> (està tancada o el codi ha canviat): digues-les a la taula.<br>${tutOpList(stuck)}
    <div class="dlg-actions"><button class="btn sm" data-act="tutDropStuck">Ja les he dit a la taula</button></div></div>` : '';
  if (el) el.innerHTML = !tut.online ? '<span class="badge bad">Sense connexió</span>'
    : n ? `<span class="badge warn">Enviant ${plural(n, 'nota', 'notes')}…</span>` : '<span class="badge ok">Connectada · tot enviat</span>';
  if (bn) bn.innerHTML = !tut.online ? `<div class="banner bad">Sense connexió amb l’ordinador de la taula.${n ? ` ${plural(n, 'nota guardada', 'notes guardades')} al mòbil: s’enviaran soles quan torni la Wi-Fi.` : ''} No tanquis aquesta pàgina.</div>`
    : n > 2 ? `<div class="banner bad">Enviant ${plural(n, 'nota', 'notes')}… No tanquis aquesta pàgina.</div>` : '';
  if (bn && stuckNote !== (bn.dataset.stuck || '')) {
    bn.dataset.stuck = stuckNote;
    let sn = $('#tutstuck');
    if (!sn) { sn = document.createElement('div'); sn.id = 'tutstuck'; bn.after(sn); }
    sn.innerHTML = stuckNote;
  }
}
// dades noves del servidor: s'actualitza el que no s'està escrivint
function tutRefresh() {
  // amb el teclat gran no hi ha cap casella amb el focus: es torna a pintar (el que s'està escrivint es manté)
  if ($('#qe') || !tut.comps.length) { render(); return; }
  if (!$('#scoregrid')) { render(); return; }
  const c = tutComp(); if (!c) { render(); return; }

/* ═══════════════════════════════════════════ CODI QR (sense llibreries ni internet)
   Generador de codis QR (mode byte, correcció M, versions 1–15), segons l'algorisme de referència de
   Project Nayuki (MIT). Torna un SVG. Es fa servir perquè les tutores entrin escanejant-lo. */
const QR = (() => {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24];
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10];
  const rawModules = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLK[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { r[j] = mul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; } root = mul(root, 2); }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  }
  function encode(text) {
    const bytes = [...new TextEncoder().encode(String(text))];
    let ver = 1;
    for (; ver <= 15; ver++) if (4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= dataCodewords(ver) * 8) break;
    if (ver > 15) throw new Error('text massa llarg per al codi QR');
    const bits = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCodewords(ver) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));

      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) all.push(b[i]); });
    // matriu
    const size = ver * 4 + 17;
    const M = Array.from({ length: size }, () => new Array(size).fill(false));
    const F = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy; if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);

      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));

      const b = (ver << 12) | r;

    }

    const masks = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0];
    const apply = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && masks[m](x, y)) M[y][x] = !M[y][x]; };

    const penalty = () => {

      }

      const dark = M.reduce((n, r) => n + r.filter(Boolean).length, 0), tot = size * size;
      p += (Math.ceil(Math.abs(dark * 20 - tot * 10) / tot) - 1) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { apply(m); format(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } apply(m); }
    apply(best); format(best);
    return M;
  }
  // SVG amb el marge blanc de 4 mòduls que demana la norma
  function svg(text, px = 220) {
    const M = encode(text), n = M.length, q = 4;
    let d = '';
    M.forEach((row, y) => row.forEach((on, x) => { if (on) d += `M${x + q} ${y + q}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="Codi QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { encode, svg };
})();

// avís a l'iPhone / iPad a Safari: l'app instal·lada té dades separades i Safari les pot esborrar

function printHeader(c) {

      <div class="ph-date">Imprès el ${fmtDate(today())}</div></div>
    <div class="ph-logo">${s.logoR ? `<img src="${s.logoR}" alt="">` : ''}</div></div>`;

// el títol i el grup van dins la capçalera de cada taula: el navegador la repeteix a cada pàgina,

};
function judgeSheet(c, g, a) {
  const det = c.scoring === 'detailed', n = Math.max(1, a.attempts || 1);

  const head = `<tr><th>Ordre</th><th>Dorsal</th><th>Esportista</th><th>Entitat</th>${range(n).map(i => cols.map(cl => `<th>${n > 1 ? ordHtml(i + 1) + ' ' : ''}${cl}</th>`).join('')).join('')}${n > 1 ? '<th>Final</th>' : ''}</tr>`;
  const rows = list.map((e, i) => `<tr class="judge"><td class="num">${i + 1}</td><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}</td><td>${h(clubName(e.clubId))}</td>${'<td></td>'.repeat(n * cols.length + (n > 1 ? 1 : 0))}</tr>`).join('');

  return sheet(c, `Full de jutge · ${a.name}`, g, `<table><thead>${head}</thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="99" class="signrow">Tutor/a de joc: ______________________________     Signatura: ____________________</td></tr></tfoot></table>`, n * cols.length > 4);
}
function notesSheet(c, g) {
  const apps = Engine.enabledApps(c, g.gender), det = c.scoring === 'detailed';
  const head = `<tr><th>Dors.</th><th>Esportista</th><th>Entitat / equip</th>${apps.map(a => `<th>${h(a.name)}${Engine.appMode(a, g.gender) === 'total' ? '' : ' <span class="lc">(a part)</span>'}</th>`).join('')}<th>Total</th></tr>`;
  const rows = sortEntries(g.entries).map(e => {
    const team = c.teams.find(t => t.id === e.teamId);
    const cell = a => {
      const r = Engine.appResult(e, a, c);
      const parts = range(Math.max(1, a.attempts || 1)).map(i => {
        const at = att(e, a, i);
        return det && r.attempts[i] !== null ? `D ${fmt(Engine.toM(at.d))} · E ${fmt(Engine.toM(at.e))}${Engine.toM(at.p) ? ' · P ' + fmt(Engine.toM(at.p)) : ''}` : '';

      return `<td class="num"><b>${fmt(r.value)}</b>${parts.length ? `<br><span class="small">${parts.join('<br>')}</span>` : ''}${(a.attempts || 1) > 1 ? `<br><span class="small">(${r.attempts.map(fmt).join(' / ')})</span>` : ''}</td>`;

  }).join('');

}
function listSheet(c, g) {
  const rows = sortEntries(g.entries).map(e => { const t = c.teams.find(x => x.id === e.teamId);
    return `<tr><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}</td><td>${h(clubName(e.clubId))}</td><td>${t ? h(t.name) : '—'}</td></tr>`; }).join('');
  const teams = compTeamsOf(c, g);
  return sheet(c, 'Llistat d’inscrits', g, `<table><thead><tr><th>Dorsal</th><th>Esportista</th><th>Entitat</th><th>Equip</th></tr></thead><tbody>${rows}</tbody></table>
    ${teams.length ? `<h3>Equips</h3><table><thead><tr><th>Equip</th><th>Entitat</th><th>Gimnastes</th></tr></thead><tbody>${teams.map(t => `<tr><td>${h(t.name)}</td><td>${h(clubName(t.clubId))}</td><td>${c.entries.filter(e => e.teamId === t.id).map(e => h(entryName(e))).join(', ')}</td></tr>`).join('')}</tbody></table>` : ''}`);

function doPrint(c, types, keys) {
  const groups = groupsOf(c).filter(g => keys.includes(g.key));
  const out = [];
  // el podi de tots els grups va seguit, per llegir-lo a l'entrega de medalles
  if (types.includes('podium')) out.push(`<section class="sheet">${printHeader(c)}<h2>Podi</h2>${groups.map(g =>
    `<div style="break-inside:avoid"><h3>${h(groupLabelPrint(g))}</h3>${htmlPodium(c, g, true)}</div>`).join('')}</section>`);
  for (const g of groups) {
    if (types.includes('general') && g.entries.length) out.push(sheet(c, 'Classificació individual', g, htmlIndividual(c, g, true)));
    if (types.includes('apps') && g.entries.length) for (const a of Engine.enabledApps(c, g.gender)) out.push(sheet(c, `Classificació · ${a.name}${Engine.appMode(a, g.gender) === 'apart' ? ' (a part)' : ''}`, g, htmlOneApp(c, g, a, true)));
    if (types.includes('teams') && compTeamsOf(c, g).length) out.push(sheet(c, 'Classificació per equips', g,
      htmlTeams(c, g, true) + `<p class="small">A cada aparell compten les ${c.teamCount} millors notes de l’equip (les ratllades no compten).</p>`));
    if (types.includes('notes') && g.entries.length) out.push(notesSheet(c, g));
    if (types.includes('list')) out.push(listSheet(c, g));
    if (types.includes('judge') && g.entries.length) for (const a of Engine.enabledApps(c, g.gender)) out.push(judgeSheet(c, g, a));
  }
  if (!out.length) { toast('No hi ha res per imprimir amb aquesta selecció.', 'bad'); return; }
  printSheets(out.join(''));
}

      rows.push([]);
    }
    // notes detallades
    if (c.scoring === 'detailed') {
      rows.push([{ v: 'NOTES DETALLADES (D + E − Pen.)', s: 't' }]);
      const hdr = [H('Dorsal'), H('Esportista'), H('Entitat')];
      for (const a of allApps) for (let i = 0; i < Math.max(1, a.attempts || 1); i++) { const p = (a.attempts || 1) > 1 ? ` ${ordinal(i + 1)}` : ''; hdr.push(H(`${a.name}${p} D`), H(`${a.name}${p} E`), H(`${a.name}${p} Pen.`), H(`${a.name}${p} Nota`)); }
      rows.push(hdr);
      for (const e of sortEntries(g.entries)) {
        const r = [+e.bib || '', entryName(e), clubName(e.clubId)];
        for (const a of allApps) { const res = Engine.appResult(e, a, c); for (let i = 0; i < Math.max(1, a.attempts || 1); i++) { const at = att(e, a, i); r.push(num(Engine.toM(at.d)), num(Engine.toM(at.e)), num(Engine.toM(at.p)), num(res.attempts[i])); } }
        rows.push(r);
      }
    }
    const suffix = ` ${genderPrint(g.gender)} ${g.level}`;
    sheets.push({ name: g.category.slice(0, 31 - suffix.length).trim() + suffix, rows, cols: [7, 8, 30, 26, 18, ...range(12).map(() => 12)] });
  }
  return sheets;
}

    const H = x => ({ v: x, s: 'h' });
    const js = d.comps.map(c => H(jLabel(d.all, c)));
    const sheets = d.groups.map(g => {
      const rows = [[{ v: S().org, s: 'b' }], [`Rànquing de jornades · curs ${ui.rkSeason}`], [{ v: groupLabelPrint(g).toUpperCase(), s: 't' }],

        [{ v: 'INDIVIDUAL', s: 't' }], [H('Pos.'), H('Esportista'), H('Entitat'), ...js, H('Total'), H('Jornades')]];
      for (const r of g.rows) rows.push([r.rank || '', r.name, clubName(r.entry.clubId), ...d.comps.map(c => r.per[c.id] === 'np' ? 'NP' : num(r.per[c.id] === undefined ? null : r.per[c.id])), bnum(r.total), r.n]);

    const bad = server.saveErr;
    const msg = bad ? `<b>Ara no es pot desar al fitxer</b> (${h(bad)}).<br>Si tanques NotesGim, els últims canvis només quedaran en aquest ordinador, en aquesta finestra. Abans, fes «Descarrega còpia de seguretat» a Configuració.<br><br>Vols tancar-lo igualment?`

    if (!(await confirmBox(msg, { ok: bad ? 'Tanca igualment' : 'Tanca', danger: !!bad }))) return;
    commitTyping(); flush();
    for (let i = 0; i < 40 && (server.pushing || server.again); i++) await new Promise(r => setTimeout(r, 100));
    let saved = !server.saveErr;
    try { await api('api/quit', { method: 'POST', body: JSON.stringify({ force: !!bad }) }); }

      // el programa no ha pogut desar l'últim cop i no s'ha tancat: es diu, i la finestra continua

      saved = saved && server.online;

    if (!list.length) { toast('Totes les gimnastes ja tenen la categoria que els toca.'); return; }
    if (!already && !(await confirmBox(`Canviar la categoria de ${plural(list.length, 'gimnasta', 'gimnastes')} segons l’any de naixement?<br><span class="small muted">${list.slice(0, 8).map(g => `${h(gymName(g))}: ${h(g.category || '—')} → ${h(catMismatch(g))}`).join('<br>')}${list.length > 8 ? '<br>…' : ''}</span><br><br>Les competicions ja fetes no canvien; a les que vénen, també es canvien (si encara no hi tenen notes). Les que canvien de categoria surten del seu equip i se’n fan d’equips nous per entitat.`, { ok: 'Canvia-les' }))) return;
    let upd = 0, kept = 0;
    withUndo(() => `${plural(list.length, 'gimnasta ha', 'gimnastes han')} canviat de categoria.${upd ? ` A les competicions que vénen: ${plural(upd, 'inscripció posada', 'inscripcions posades')} al dia.` : ''}${kept ? ` ${plural(kept, 'inscripció ja tenia', 'inscripcions ja tenien')} notes i no s’ha tocat.` : ''}`, () => {
      for (const g of list) g.category = catMismatch(g);
      // surten dels equips del grup d'abans (els que es queden buits s'esborren): quan s'inscriguin, es faran equips nous
      const ids = new Set(list.map(g => g.id));
      const emptied = db.teams.filter(t => t.memberIds.length && t.memberIds.every(id => ids.has(id) && !sameGroup(t, gymById(id))));

      for (const c of db.competitions.filter(c => !c.locked && isUpcoming(c))) {
        const moved = [];
        for (const g of list) {
          const e = c.entries.find(x => x.gymnastId === g.id);

          if (hasScores(e)) { kept++; continue; }
          e.category = g.category; e.gender = genderOf(g); e.level = g.level; e.teamId = null; delete e.noAuto;

        if (moved.length) { pruneAutoTeams(c); if (c.autoTeams) autoCompTeams(c, moved); else autoAssignTeams(c, moved); pruneAutoTeams(c); upd += moved.length; }
      }
    });

const forms = {
  tutLogin: async f => {

    try { await tutFetch(); } catch (_) { tut.error = 'No es pot connectar amb l’ordinador de la taula. Comprova que estàs a la mateixa Wi-Fi.'; tut.comps = []; }
    if (!tut.comps.length) tut.pin = tut.error ? tut.pin : '';

    if (tut.comps.length && tut.queue.length) tutSend();
  },
  comp: f => {
    const fd = new FormData(f), id = f.dataset.id;
    const vals = { name: fd.get('name').trim(), date: fd.get('date'), place: fd.get('place').trim(), season: fd.get('season').trim() || Engine.seasonFor(fd.get('date')) };
    if (id) {
      // el curs era el de la data d'abans (no s'havia posat a mà): segueix la data nova
      const old = compById(id);
      if (old && fd.get('season').trim() === Engine.seasonFor(old.date)) vals.season = Engine.seasonFor(vals.date) || vals.season;
      Object.assign(old, vals); commit(); closeDialog(); render(); return;
    }
    const c = Object.assign({ id: uid(), entries: [], teams: [], locked: false, created: new Date().toISOString() }, JSON.parse(JSON.stringify(S().compDefaults)), vals);
    const src = fd.get('copyFrom') && compById(fd.get('copyFrom'));
    let moved = 0;
    if (src) {
      // les mateixes gimnastes amb el dorsal d'aquell dia; la categoria, el nivell, l'entitat i l'equip, els de la fitxa d'ara
      for (const k of COMP_KEYS) c[k] = JSON.parse(JSON.stringify(src[k]));
      const seen = new Set();
      c.entries = src.entries.map(e => [e, gymById(e.gymnastId)]).filter(([, g]) => g && !g.archived && !seen.has(g.id) && seen.add(g.id))
        .map(([e, g]) => { if (!sameGroup(e, g)) moved++; return Object.assign(newEntry(c, g), { bib: e.bib }); });
    }
    db.competitions.push(normalizeComp(c, S().compDefaults));
    const res = c.entries.length ? (c.autoTeams ? autoCompTeams(c) : { placed: autoAssignTeams(c, c.entries) }) : { placed: 0 };
    commit(); closeDialog();
    go(`#/competicio/${c.id}/${c.entries.length ? 'notes' : 'inscripcions'}`);
    if (src) toast(`Competició creada amb ${plural(c.entries.length, 'gimnasta', 'gimnastes')}${res.placed ? ` (${res.placed} en equips)` : ''}.${moved ? ` Compte: ${plural(moved, 'gimnasta competeix', 'gimnastes competeixen')} en una categoria o nivell diferent que a «${src.name}» (el de la fitxa).` : ''}`, moved ? 'bad' : 'ok');
  },
  gym: (f, submitter) => {
    const fd = new FormData(f), id = f.dataset.id;
    const name = fd.get('name').trim(); if (!name) return;
    const vals = { name, surname: fd.get('surname').trim(), clubId: ensureClub(fd.get('club')), gender: fd.get('gender') === 'M' ? 'M' : 'F',
      category: fd.get('category'), level: fd.get('level'), birthYear: fd.get('birthYear') ? String(fd.get('birthYear')) : '', notes: fd.get('notes').trim() };
    const teamVal = fd.get('team') || '', newTeam = fd.get('newTeam') || '';
    if (fd.get('archived') !== 'on' && (!vals.category || !vals.level)) { toast('Tria la categoria i el nivell (sense, competiria sola en un grup a part).', 'bad'); return; }
    if (id) {
      const g = gymById(id);
      if (!g) { closeDialog(); return; }
      const before = gymTeamValue(g), oldClub = g.clubId || null, oldGroup = { category: g.category, gender: genderOf(g), level: g.level };
      Object.assign(g, vals, { archived: fd.get('archived') === 'on' });
      // ha canviat d'entitat: a les competicions que vénen també (i surt de l'equip de l'entitat d'abans)
      if ((g.clubId || null) !== oldClub) {
        const t0 = gymTeam(g);
        if (t0 && (t0.clubId || null) === oldClub && teamVal === before) putInTeam(g.id, null);
        for (const c of db.competitions.filter(c => !c.locked && isUpcoming(c))) {
          const e = c.entries.find(x => x.gymnastId === g.id);
          if (!e || (e.clubId || null) !== oldClub || hasScores(e)) continue;   // (on ja té notes, no es toca)
          e.clubId = g.clubId || null; e.teamId = null; delete e.noAuto;
          pruneAutoTeams(c); if (c.autoTeams) autoCompTeams(c, [e]); else autoAssignTeams(c, [e]); pruneAutoTeams(c);
        }
      }
      const r = teamVal !== before ? setGymTeam(g, teamVal, newTeam) : null;
      commit(); closeDialog(); render();
      if (r) teamSetToast(g, r); else toast('Fitxa desada.', 'ok');
      // si ara és d'un altre grup i està inscrita en una competició que vé, ofereix canviar-ho també allà
      // (les passades no es toquen; i només si aquesta vegada s'ha canviat el grup)
      const regrouped = !sameGroup(oldGroup, g);
      const follow = c => regrouped && !c.locked && isUpcoming(c);
      const stuck = db.competitions.filter(c => follow(c) && c.entries.some(e => e.gymnastId === g.id && !sameGroup(e, g) && hasScores(e)));
      if (stuck.length && g.category && g.level) toast(`${gymName(g)} ja té notes a ${stuck.map(c => c.name).join(', ')} i allà continua al grup d’abans. Si cal, canvia-ho a Inscripcions (clic al nom).`, 'bad');
      const open = db.competitions.filter(c => follow(c) && c.entries.some(e => e.gymnastId === g.id && !sameGroup(e, g) && !hasScores(e)));
      if (open.length && g.category && g.level) confirmBox(`${h(gymName(g))} està inscrita com a ${h(open.map(c => { const e = c.entries.find(x => x.gymnastId === g.id); return `${e.category} ${e.level}`; })[0])} a ${open.map(c => `<b>${h(c.name)}</b>`).join(', ')}. Ho canvio també allà a ${h(g.category)} ${genderWord(g.gender)} ${h(g.level)}?<br><span class="small muted">Només on encara no té notes.</span>`, { ok: 'Canvia-ho' })
        .then(ok => { if (!ok) return; withUndo('Inscripcions actualitzades.', () => { for (const c of open) { const e = c.entries.find(x => x.gymnastId === g.id); if (!e) continue; e.teamId = null; delete e.noAuto; e.category = g.category; e.gender = g.gender; e.level = g.level; if (c.autoTeams) autoCompTeams(c, [e]); else autoAssignTeams(c, [e]); pruneAutoTeams(c); } }); });
      return;
    }
    const dup = db.gymnasts.find(g => norm(gymName(g)) === norm(name + ' ' + vals.surname));
    const g = Object.assign({ id: uid(), archived: false }, vals);
    db.gymnasts.push(g);
    const r = teamVal ? setGymTeam(g, teamVal, newTeam) : { team: null, touched: [] };
    // creada des d'una competició: també s'hi inscriu (i va al seu equip)
    const ec = f.dataset.comp && fd.get('enroll') === 'on' ? compById(f.dataset.comp) : null;
    let enrolled = null;
    if (ec && !ec.locked) {
      enrolled = newEntry(ec, g); ec.entries.push(enrolled);
      if (ec.autoTeams) autoCompTeams(ec, [enrolled]); else autoAssignTeams(ec, [enrolled]);
    }
    const team = enrolled && enrolled.teamId ? ec.teams.find(t => t.id === enrolled.teamId) : r.team;
    // «Desa i afegeix-ne una altra» recorda entitat, grup i equip: així s'entra un equip sencer de pressa
    ui.lastGym = { clubName: clubName(vals.clubId), gender: vals.gender, category: vals.category, level: vals.level, teamId: r.team ? r.team.id : g.noTeam ? '__none' : '' };
    commit();
    toast(`${name} ${vals.surname}: desat${team ? ` a l’equip ${team.name}` : ''}${enrolled ? ` · inscripció feta (dorsal ${enrolled.bib})` : ''}.${dup ? ' Compte: ja n’hi havia una fitxa amb el mateix nom.' : ''}`, dup ? 'bad' : 'ok');
    // (si s'ha obert des de «Inscriu gimnastes», s'hi torna amb les que ja hi havia marcades)
    const back = !!f.dataset.back;
    if (submitter && submitter.name === 'again') openDialog(gymForm(null, ui.lastGym, { compId: f.dataset.comp || '', back }));
    else if (back) { render(); actions.enrollGyms({ back: true }); return; }
    else closeDialog();
    render();
  },
  // equip de la llista general: és el de les fitxes, i les competicions que les segueixen també canvien
  team: f => {
    const fd = new FormData(f), id = f.dataset.id;
    const vals = { name: fd.get('name').trim(), clubId: fd.get('clubId') || null, gender: fd.get('gender') === 'M' ? 'M' : 'F', category: fd.get('category'), level: fd.get('level') };
    const members = fd.getAll('m');
    if (!vals.name || !vals.category || !vals.level) { toast('Cal el nom, la categoria i el nivell.', 'bad'); return; }
    if (db.teams.some(x => x.id !== id && (x.clubId || null) === (vals.clubId || null) && sameGroup(x, vals) && norm(x.name) === norm(vals.name))) { toast(`Aquesta entitat ja té un equip «${vals.name}» en aquest grup. Posa-li un altre nom (per exemple «${vals.name} 2»).`, 'bad'); return; }
    let t = id && teamById(id), touched = [];
    closeDialog();
    withUndo(() => {
      const n = t.memberIds.length, d = S().compDefaults, where = touched.length ? ` També a: ${touched.join(', ')}.` : '';
      const bad = n < d.teamMin || n > d.teamMax;
      return { type: bad ? 'bad' : 'ok', msg: (n < d.teamMin ? `Equip desat, però només té ${plural(n, 'gimnasta', 'gimnastes')} (mínim ${d.teamMin}).` : n > d.teamMax ? `Equip desat, però té ${n} gimnastes (màxim ${d.teamMax}).` : 'Equip desat.') + where };
    }, () => {
      if (!t) t = makeTeam(vals.clubId, vals, vals.name);
      const before = [...t.memberIds];
      Object.assign(t, vals, { memberIds: [] });
      // una gimnasta només és a un equip: si era a un altre, en surt
      for (const m of members) { putInTeam(m, t); const g = gymById(m); if (g) delete g.noTeam; }
      touched = propagateTeam(t, before.filter(x => !members.includes(x)), members.filter(x => !before.includes(x)));
    });
  },
  autoTeams: f => {
    const picks = new FormData(f).getAll('p').map(Number);
    closeDialog();
    withUndo(`${plural(picks.length, 'equip creat', 'equips creats')}.`, () => {
      for (const i of picks) {
        const p = ui.proposals[i];
        const t = makeTeam(p.clubId, p, p.name);
        for (const m of p.memberIds) putInTeam(m, t);
        propagateTeam(t);
      }

  },
  enrollGyms: f => {
    const c = curComp(), ids = new FormData(f).getAll('g');
    if (!ids.length) { if (!f.querySelector('input[name=g]')) closeDialog(); else toast('No has marcat cap gimnasta.', 'bad'); return; }
    let res = { made: 0, placed: 0 };
    closeDialog();
    withUndo(() => `${plural(ids.length, 'inscripció feta', 'inscripcions fetes')}${res.placed ? ` · ${plural(res.placed, 'gimnasta', 'gimnastes')} en equips` : ''}${res.made ? ` (${plural(res.made, 'equip nou', 'equips nous')})` : ''}.`, () => {
      const added = ids.map(id => gymById(id)).filter(Boolean).map(g => { const e = newEntry(c, g); c.entries.push(e); return e; });
      res = c.autoTeams ? autoCompTeams(c, added) : { made: 0, placed: autoAssignTeams(c, added) };
