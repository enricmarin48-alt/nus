<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NotesGim">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6d1a33">
<meta name="description" content="Notes i classificacions de gimnàstica artística (individual, per aparells i per equips). Funciona sense internet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d1a33'/%3E%3Crect x='10' y='24' width='44' height='7' rx='3' fill='white'/%3E%3Cpath d='M20 31l-3 20M44 31l3 20' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='13' r='6' fill='%23ffc94d'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>NotesGim · Gimnàstica artística</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f3f5f9; --panel:#fff; --ink:#1a2233; --muted:#667085; --line:#dde2ea; --line2:#eef1f5;
    --pri:#6d1a33; --pri2:#8f2445; --pri-soft:#f7e6ec; --pri-ink:#fff;
    --ok:#1e7b3a; --ok-soft:#e5f5ea; --warn:#a15c00; --warn-soft:#fff3dc; --bad:#c0262d; --bad-soft:#fdeaea;
    --gold:#fff1bf; --silver:#eceff4; --bronze:#f7e0cc;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--pri2)}
  a.pill{text-decoration:none;color:inherit}
  a.pill.on{color:#fff}
  h1{font-size:22px;margin:0}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:15px;margin:0}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .center{text-align:center}
  .nowrap{white-space:nowrap}
  .hidden{display:none !important}

  /* ═══ capçalera de l'app */
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:8px 18px;padding-top:max(8px,env(safe-area-inset-top));background:var(--pri);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:800;font-size:17px;letter-spacing:.02em}
  .brand svg{width:28px;height:28px}
  header.top nav{display:flex;gap:4px;flex-wrap:wrap}
  header.top nav a{color:#f3dbe3;text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600}
  header.top nav a:hover{background:rgba(255,255,255,.1)}
  header.top nav a.on{background:#fff;color:var(--pri)}
  .savestate{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:#f3dbe3}
  .savestate button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
  .savestate button.alert{background:#ffc94d;color:#3a2a00;border-color:#ffc94d;font-weight:700}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fd38a;margin-right:5px}
  .dot.busy{background:#ffc94d}.dot.err{background:#ff6b6b}

  main{max-width:1280px;margin:0 auto;padding:20px 18px 80px}
  .page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .grow{flex:1;min-width:180px}
  .toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  /* ═══ botons i controls */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
    padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
  .btn:hover{border-color:#b9c3d3}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--pri2);border-color:var(--pri2);color:#fff}
  .btn.primary:hover{background:var(--pri)}
  .btn.danger{color:var(--bad);border-color:#f1c1c3}
  .btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--line2)}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:6px;color:var(--muted);font-size:15px;line-height:1}
  .icon-btn:hover{background:var(--line2);color:var(--ink)}
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid #dba3b6;outline-offset:0;border-color:#dba3b6}
  textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
  label.f > span{color:var(--muted);font-weight:600}
  label.chk{display:flex;gap:7px;align-items:center;cursor:pointer;padding:3px 0}
  label.chk>input{flex:none}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .grid2>*,.grid3>*{min-width:0}
  select{max-width:100%}
  @media (max-width:720px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
  fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:0 0 12px}
  legend{font-weight:700;padding:0 6px}

  /* ═══ targetes, taules, pastilles */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .card-head .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .comp-card h3{font-size:16px;margin-bottom:4px}
  .comp-card .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .comp-card .stats{display:flex;gap:14px;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
  .comp-card .stats b{font-size:16px;display:block}
  .comp-card .actions{display:flex;gap:6px;flex-wrap:wrap}

  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
  table.tbl{border-collapse:collapse;width:100%;background:#fff}
  .tbl th,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
  .tbl thead th{background:#f7f9fc;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
    position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
  .tbl th.grp{text-align:center;border-left:1px solid var(--line)}
  .tbl td.sep,.tbl th.sep{border-left:1px solid var(--line)}
  .tbl tbody tr:hover{background:#fafbfe}
  .tbl tr.hit td{background:#fff3c4 !important;transition:background .4s}
  .tbl tr.gold td{background:var(--gold)} .tbl tr.silver td{background:var(--silver)} .tbl tr.bronze td{background:var(--bronze)}
  .tbl tr.np td{color:var(--muted)}
  .tbl tr.team-row td{border-top:2px solid var(--line);font-weight:700}
  .tbl tr.member td{font-size:13px;color:#3d475c;border-bottom-color:transparent}
  .tbl tr.member td:first-child{border-left:3px solid var(--pri-soft)}
  .tbl td.pos{font-weight:800;width:44px}
  .tbl td.total{font-weight:800}
  .tbl .disc{color:#9aa3b5;text-decoration:line-through}
  .tbl .cnt{font-weight:700}
  button.tg{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 8px;margin-left:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--pri)}
  button.tg:hover{background:var(--pri-soft)}
  details.mem{margin-top:4px;font-size:13px;font-weight:400}
  details.mem summary{cursor:pointer;color:var(--pri);font-weight:600}
  details.mem ol{margin:4px 0 2px;padding-left:22px}
  .empty{padding:34px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .pill.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
  .pill .n{font-size:11px;opacity:.75;display:inline-block;font-variant-numeric:tabular-nums}
  /* (el comptador d'una pastilla —«12 · falten 3», «12 ✓», «3/12»— té sempre l'amplada del més llarg que hi pot sortir:
     si la pastilla s'eixamplés o s'estrenyés quan arriba una nota, les pastilles podrien passar a ocupar una ratlla més o
     menys i la graella es mouria just quan s'hi clica) */
  .pill .n[data-w]::after{content:attr(data-w);display:block;height:0;overflow:hidden;visibility:hidden;font-weight:800}
  .pill svg{width:16px;height:16px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--muted)}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .selbox{width:18px;height:18px;margin:0;vertical-align:middle;cursor:pointer;accent-color:var(--pri)}
  th.c-sel,td.c-sel{width:28px;text-align:center}
  .selbar{margin-bottom:10px}
  .selbar .invis{visibility:hidden}
  /* «Dona per revisades…»: sempre a la seva línia, d'una sola ratlla (si no hi ha res per revisar, amagat però hi és) */
  .tutrev{display:flex;margin-top:6px}
  .tutrev .btn{max-width:100%;white-space:nowrap}
  .tutrev .btn span{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tutrev .invis{visibility:hidden}
  .comp-sel{display:inline-flex;vertical-align:-2px;margin-right:4px}
  .chg{color:var(--warn);font-weight:600;margin-top:2px;white-space:normal}
  .badge.bad{background:var(--bad-soft);color:var(--bad)}
  .badge.pri{background:var(--pri-soft);color:var(--pri)}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;background:#fff;font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .note{padding:10px 12px;border-radius:8px;background:var(--pri-soft);color:#561327;margin-bottom:12px;font-size:13px}
  .note.warn{background:var(--warn-soft);color:#6b3e00}
  .note.bad{background:var(--bad-soft);color:#7d1419}
  .steps{margin:0;padding-left:20px}.steps li{margin:4px 0}

  /* ═══ pestanyes de competició */
  .comp-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
  .comp-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .back{font-size:13px;text-decoration:none;color:var(--muted)}
  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tabs a{padding:9px 16px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .tabs a.on{color:var(--pri);border-bottom-color:var(--pri2)}
  .tabs a .badge{margin-left:4px}
  .tabs .sm{display:none}

  /* ═══ graella de notes */
  input.sc{width:74px;text-align:right;font-variant-numeric:tabular-nums;padding:5px 7px;border-radius:6px}
  input.sc.sm{width:58px}
  input.sc.invalid{border-color:var(--bad);background:var(--bad-soft);outline-color:#f0a3a6}
  input.sc.high{border-color:#e2a33b;background:var(--warn-soft)}
  input.sc.tutor{border-color:#d29a1e;background:#fff6dd;box-shadow:inset 3px 0 0 #d29a1e}
  input.sc:disabled{background:#f6f7f9;color:#555}
  input.bib{width:62px;text-align:right}
  select.teamsel{max-width:170px;padding:4px 6px;font-size:12px}
  /* (a la llista de gimnastes hi ha lloc: el desplegable de l'equip, tan ample com el que hi diu, perquè s'hi llegeixi
     sencer l'equip i quantes en té, «— 3/6») */
  #gymtable .tbl select.teamsel{max-width:300px;field-sizing:content}
  .lc{text-transform:none}
  .tutor-mode header.top nav,.tutor-mode #savestate,.tutor-mode nav.bottom{display:none}
  .tutor-mode input.sc{width:92px;font-size:18px;padding:8px 9px}
  input.sc.locked{background:#eef1f5;color:#555}
  .st{display:inline-block;width:16px;margin-left:4px;font-weight:800}
  .st.ok{color:var(--ok)} .st.err{color:var(--bad)} .st.wait{color:var(--warn)}
  td.out{color:#26324a;font-weight:700}
  /* «→ 3,00» (nota mínima): a sobre del cantó de la casella, sense ocupar lloc. Si n'ocupés, quan arriba una nota així
     d'una tutora les columnes s'eixamplarien i un clic just llavors aniria a parar a una altra casella (o enlloc) */
  #scoregrid td.num{position:relative}
  .minhint{position:absolute;top:0;right:4px;color:var(--warn);font-weight:700;font-size:10px;line-height:12px;background:#fff;border-radius:4px;padding:0 3px;white-space:nowrap;pointer-events:none}
  .minhint:empty{display:none}
  .progress{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 10px}
  /* (amb un aparell de dos intents que compten tots dos, l'avís «… amb 1 intent» hi pot sortir quan arriba una nota
     d'una tutora: la línia hi és sempre, d'una ratlla, perquè la graella no baixi just quan s'hi clica) */
  .progress.resv{flex-wrap:nowrap;overflow:hidden;height:18px;align-items:center}
  .progress.resv .badge{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ico{width:18px;height:18px;vertical-align:-4px;display:inline-block}
  html{scroll-padding-top:70px}
  .grid-wrap{max-height:calc(100vh - 150px)}
  #scoregrid td.who,#scoregrid th.who{position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line)}
  #scoregrid thead th.who{background:#f7f9fc;z-index:3}
  .ico svg{width:100%;height:100%}
  .sub-ph{display:none}
  .ph-lbl{display:none}
  .show-ph{display:none !important}
  .who .sub-ph,.c-name .sub-ph{font-size:12px;color:var(--muted);font-weight:400}

  /* ═══ menús «⋯», selectors de grup i barres de botons */
  .menu{position:relative;display:inline-block}
  .menu-list{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 30px rgba(10,20,40,.18);padding:6px;min-width:220px;max-width:calc(100vw - 16px);flex-direction:column;gap:2px}
  .menu.open .menu-list{display:flex}
  .menu-list .btn{justify-content:flex-start;border-color:transparent;width:100%}
  .menu-list .btn:hover{background:var(--line2)}
  .gsel{display:flex;gap:6px;align-items:center;margin-bottom:10px}
  .gsel .btn{padding:7px 12px}
  /* (el desplegable de debò és a sobre, transparent: el que es veu és el grup en curt i, a sota, quantes notes hi falten) */
  .gsel-pick{position:relative;flex:1;min-width:0;display:flex;align-items:center;min-height:44px;padding:3px 30px 3px 10px;
    border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  .gsel-pick::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-6px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
  .gsel-pick:focus-within{outline:2px solid #dba3b6;border-color:#dba3b6}
  .gsel-pick select{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer}
  .gsel-txt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
  .gsel-txt b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gsel-txt small{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
  .pill .ok{color:var(--ok);font-weight:800}
  .pill.on .ok{color:#c9f5d6}
  .pill.warnp{border-color:#e9c36b}
  nav.bottom{display:none}
  .search{display:flex;gap:6px;align-items:center}
  .search input{min-width:0}
  .avui{border:2px solid var(--pri2)}
  .avui .actions .btn{flex:1;justify-content:center}

  /* ═══ entrada ràpida (una gimnasta cada vegada, amb teclat gran) */
  .qe{max-width:520px;margin:0 auto}
  .qe-app{position:sticky;top:var(--top,0px);z-index:5;display:flex;align-items:center;gap:10px;background:var(--appc,#6d1a33);color:#fff;
    border-radius:12px;padding:10px 14px;font-weight:800;font-size:18px;margin-bottom:10px;cursor:pointer;border:0;width:100%;text-align:left}
  .qe-app .ico{width:26px;height:26px}
  .qe-app small{margin-left:auto;font-size:14px;opacity:.9}
  .qe-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
  .qe-bib{grid-row:span 2;font-size:40px;font-weight:900;color:var(--pri);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
  /* (el que hi ha a sobre del teclat, sempre de la mateixa alçada: d'una gimnasta a la següent —un nom o una entitat
     llargs— i quan apareix un avís, el teclat no es mou de lloc i el dit no prem una altra tecla) */
  .qe-who{min-width:0}
  .qe-who b{display:block;font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qe-who span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qe-saved{font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:21px;line-height:21px}
  .qe-saved .badge{line-height:15px;vertical-align:middle}
  .qe-saved b{color:var(--ink);font-size:16px}
  .qe-card .seg{grid-column:1/-1;margin:6px 0 0}
  .qe-card .seg .pill{flex:1;justify-content:center;min-height:40px;min-width:0;white-space:nowrap;overflow:hidden}
  .qe-display{margin:10px 0 4px;background:#fff;border:2px solid var(--line);border-radius:14px;font-size:46px;font-weight:800;text-align:center;
    padding:6px 10px;font-variant-numeric:tabular-nums;min-height:72px;letter-spacing:.02em}
  .qe-display.empty{color:#b5bccb}
  .qe-display.invalid{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .qe-hint{height:28px;font-size:14px;text-align:center;color:var(--warn);font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center;
    white-space:nowrap;overflow:hidden}
  .qe-hint .btn{flex:none}
  @media (pointer:coarse){ .qe-hint{height:40px} }
  .qe-hint.bad{color:var(--bad)}
  .qe-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
  .qe-keys button{min-height:64px;font-size:28px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;
    touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .qe-keys button:active{background:var(--pri-soft)}
  .qe-bar{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
  .qe-bar .btn{min-height:58px;justify-content:center;font-size:17px}
  .qe-bar .btn.primary{font-size:19px}
  .qe-next{font-size:13px;color:var(--muted);text-align:center;margin:8px 0}
  .qe-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
  .qe-strip button{flex:0 0 auto;min-width:46px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
  .qe-strip button.done{background:var(--ok-soft);border-color:#9fd8b0;color:var(--ok)}

  /* ═══ mòbil, també girat (només a la pantalla: als fulls impresos no s'amaga res) */
  @media screen and (max-width:700px), screen and (max-height:500px) and (orientation:landscape) and (max-width:950px){
    header.top{gap:8px;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));min-height:48px;flex-wrap:nowrap;

      border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(10,20,40,.06)}

    .tutor-mode main{padding-bottom:24px}
    .hide-ph{display:none !important}
    .show-ph{display:flex !important}
    .sub-ph{display:block}
    h1{font-size:19px}
    .page-head{gap:8px}
    .btn{white-space:normal;text-align:center}
    .page-head .actions{margin-left:0;width:100%}
    .page-head .actions .btn{flex:1;justify-content:center}
    .comp-head{gap:6px;margin-bottom:8px}
    .comp-head > div:first-child{min-width:0;flex:1}
    .comp-head h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .comp-head .actions{margin-left:0}
    .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:12px}
    .tabs a{padding:10px 2px;text-align:center;font-size:13px}
    .tabs .lg{display:none}
    .tabs .sm{display:inline}
    .tabs a .badge{display:none}
    .pills.hide-ph{display:none}
    .seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px}
    .seg .pill{justify-content:center;padding:8px 4px;font-size:13px;border-radius:10px}
    /* (les pastilles dels aparells, amb el compte «22/31»: cadascuna tan ampla com el que hi diu i, totes, dins la pantalla,
       també a 320 px; si el compte no hi cap al costat del nom, baixa a sota —amb 5 o 6 aparells, sempre—: la pàgina no
       s'eixampla mai) */
    .seg:has(.pill .n){grid-template-columns:repeat(var(--n,4),auto)}
    .seg:has(> .pill:nth-child(5)) .pill .n{flex-basis:100%}
    .seg .pill:has(.n){min-width:0;flex-wrap:wrap;row-gap:0;column-gap:4px}
    .toolbar .grow{min-width:0;flex:1 1 100%}
    .toolbar .search.grow{flex:1 1 160px}
    .toolbar .right{margin-left:0}
    .card{padding:12px}
    .grid-wrap{max-height:none}
    .tbl th,.tbl td{padding:6px 6px}
    .tbl .num{font-size:13px}
    /* classificacions i rànquing (les taules amb la columna th.total): el total sempre es veu, a la dreta (les columnes dels
       aparells o de les jornades que no hi caben es miren fent lliscar la taula per sota); i les columnes, més justes */
    .tbl-wrap .tbl:has(th.total) th.total,.tbl-wrap .tbl:has(th.total) td.total{position:sticky;right:0;box-shadow:inset 1px 0 0 var(--line),-5px 0 6px -4px rgba(10,20,40,.22)}
    .tbl-wrap .tbl:has(th.total) td.total{background:#fff;z-index:1}
    .tbl-wrap .tbl:has(th.total) thead th.total{z-index:2}
    .tbl-wrap .tbl:has(th.total) tr.member td:last-child{position:sticky;right:0;background:#fff;z-index:1;box-shadow:inset 1px 0 0 var(--line)}
    .tbl-wrap .tbl:has(th.total) th.num,.tbl-wrap .tbl:has(th.total) td.num{padding-left:4px;padding-right:4px}
    .tbl-wrap .tbl:has(th.total) thead th{font-size:11px;letter-spacing:0}
    .tbl-wrap .tbl:has(th.total) thead th:nth-child(2){min-width:88px}
    .tbl-wrap .tbl:has(th.total) button.tg{margin-left:4px;padding:1px 5px}
    /* (el lloc també es queda a l'esquerra; i la columna que, en fer lliscar la taula, queda a mitges sota el total o sota el
       lloc es tapa sencera, del color de la ratlla: mai es llegeix «24» on hi diu 24,45. L'amplada de la tapa la posa tblCuts) */
    .tbl-wrap .tbl:has(th.total) :is(th,td):first-child{position:sticky;left:0;z-index:1;background:#fff}
    .tbl-wrap .tbl:has(th.total) thead th:first-child{background:#f7f9fc;z-index:2}
    .tbl-wrap .tbl:has(th.total) tr.gold td:is(.total,:first-child){background:var(--gold)}
    .tbl-wrap .tbl:has(th.total) tr.silver td:is(.total,:first-child){background:var(--silver)}
    .tbl-wrap .tbl:has(th.total) tr.bronze td:is(.total,:first-child){background:var(--bronze)}
    .tbl-wrap .tbl:has(th.total) :is(th.total,td.total,tr.member td:last-child)::before,.tbl-wrap .tbl:has(th.total) :is(th,td):first-child::after{content:'';position:absolute;top:0;bottom:0;background:inherit;pointer-events:none}
    .tbl-wrap .tbl:has(th.total) :is(th.total,td.total,tr.member td:last-child)::before{right:100%;width:var(--cutr,0px);box-shadow:-5px 0 6px -4px rgba(10,20,40,.22)}
    .tbl-wrap .tbl:has(th.total) :is(th,td):first-child::after{left:100%;width:var(--cutl,0px)}
    .tbl-wrap .tbl.sx:has(th.total) :is(th,td):first-child{box-shadow:5px 0 6px -4px rgba(10,20,40,.22)}
    /* (la ratlla de color de les gimnastes de l'equip, sense vora: per sota d'una vora no tapada es veuria un tros de xifra) */
    .tbl-wrap .tbl:has(th.total) tr.member td:first-child{border-left:0;box-shadow:inset 3px 0 0 var(--pri-soft)}
    .tbl-wrap .tbl.sx:has(th.total) tr.member td:first-child{box-shadow:inset 3px 0 0 var(--pri-soft),5px 0 6px -4px rgba(10,20,40,.22)}
    #scoregrid{font-size:15px}
    #scoregrid td.who{max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #scoregrid .sub-ph{overflow:hidden;text-overflow:ellipsis}
    .toast{font-size:14px}
    /* llistes en forma de fitxa: inscripcions, configuració dels aparells */

    table.cardify,table.cardify tbody{display:block}
    table.cardify tr{display:grid;gap:6px 10px;padding:10px 4px;border-bottom:1px solid var(--line2);align-items:center}
    table.cardify td{display:block;padding:0;border:0}
    table.cardify select,table.cardify input[type=text]{width:100%;max-width:none}
    .selbar label.chk{order:1;flex:1 1 auto}.selbar [data-act=selNone]{order:2}.selbar .btn.danger{order:3;flex:1 1 100%;justify-content:center}
    /* (sempre d'una ratlla: quan s'hi afegeix el nombre de marcades, la barra no creix i la llista no baixa) */
    .selbar .btn.danger{white-space:nowrap;min-width:0}.selbar .btn.danger .ell{overflow:hidden;text-overflow:ellipsis;min-width:0}
    table.ins tr{grid-template-columns:28px 60px minmax(0,1fr) 44px;grid-template-areas:"sel bib name del" "sel bib team team" "sel bib st st"}
    table.ins .c-sel{grid-area:sel}.ins .c-bib{grid-area:bib}.ins .c-name{grid-area:name}.ins .c-del{grid-area:del}.ins .c-team{grid-area:team}.ins .c-st{grid-area:st}
    table.ins .c-bib input{width:100%}
    table.apps tr{grid-template-columns:1fr 1fr;grid-template-areas:"name name" "f m" "att rule" "act act"}
    table.apps .c-name{grid-area:name}.apps .c-f{grid-area:f}.apps .c-m{grid-area:m}.apps .c-att{grid-area:att}.apps .c-rule{grid-area:rule}.apps .c-act{grid-area:act;text-align:left}
    /* categories: el nom i els botons a dalt, els anys a sota (tot a la vista, sense fer lliscar la taula) */
    table.cats tr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"name name act" "from to yrs"}
    table.cats .c-name{grid-area:name}.cats .c-from{grid-area:from}.cats .c-to{grid-area:to}.cats .c-yrs{grid-area:yrs;align-self:end;text-align:right;padding-bottom:12px}.cats .c-act{grid-area:act}
    table.cats input{width:100% !important;min-width:0 !important}
    .ph-lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
    .gym-cards{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
    .gym-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;padding:10px 12px;border-bottom:1px solid var(--line2);align-items:center}
    .gym-card .nm{font-weight:700;font-size:16px;text-decoration:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .gym-card .mt{grid-column:1/-1;font-size:13px;color:var(--muted)}
    .gym-card select{grid-column:1/-1;width:100%;max-width:none}
    .filters{display:none !important}
    .filters.open{display:flex !important}
    dialog#dlg{max-width:100vw;width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
    dialog#dlg .dlg{max-height:100dvh;height:100%;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
    dialog#dlg .dlg-actions{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-bottom:calc(-14px - env(safe-area-inset-bottom));border-top:1px solid var(--line2)}
    dialog#dlg .dlg-actions .btn{flex:1;justify-content:center}
    .pick-list{max-height:none}
    table.clubs tr{grid-template-columns:28px minmax(0,1fr) auto auto auto;grid-template-areas:"sel name name name del" "sel ng nt merge merge"}
    table.cardify.clubs .c-merge select{max-width:46vw}
    table.clubs .c-sel{grid-area:sel}.clubs .c-name{grid-area:name}.clubs .c-ng{grid-area:ng}.clubs .c-nt{grid-area:nt}.clubs .c-merge{grid-area:merge}.clubs .c-del{grid-area:del}
    /* amb el teclat gran, o mentre s'escriu, la barra de baix no hi és (no tapa res) */
    body.has-qe nav.bottom,body.kb nav.bottom{display:none}
    body.has-qe main{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    html{scroll-padding-bottom:calc(70px + env(safe-area-inset-bottom))}
    /* entrada ràpida: que el teclat i «Desa» hi càpiguen sense haver de baixar */
    .qe-on .comp-head{display:none}
    .qe-keys{gap:6px}
    .qe-keys button{min-height:clamp(46px,7.2vh,64px);font-size:26px}
    .qe-display{font-size:40px;min-height:58px;padding:4px 10px;margin:8px 0 2px}
    .qe-card{padding:8px 12px}
    .qe-bib{font-size:34px}
    .qe-who b{font-size:19px}
    .qe-bar .btn{min-height:54px}
    .tutor-mode .page-head{margin-bottom:6px}
  }
  /* (mòbil dret: amb 4 aparells, les pastilles en dues fileres de 2; amb 5 o 6, de 3. I a 320 px, el compte sempre a sota
     del nom: totes les pastilles igual) */
  @media screen and (max-width:440px){
    .seg:has(.pill .n):has(> .pill:nth-child(4)){grid-template-columns:repeat(2,auto)}
    .seg:has(.pill .n):has(> .pill:nth-child(5)){grid-template-columns:repeat(3,auto)}
  }
  @media screen and (max-width:340px){ .seg .pill .n{flex-basis:100%} }
  /* (mòbil: a la configuració dels aparells, el que fa cada aparell per a noies i per a nois, cadascun a la seva ratlla:
     «Compta (general i equips)» hi cap sencer) */
  @media screen and (max-width:520px){ table.cardify.apps tr{grid-template-areas:"name name" "f f" "m m" "att rule" "act act"} }
  /* (mòbil estret, de 360 px: les columnes de les classificacions, més justes, perquè tres aparells o tres jornades hi
     càpiguen sense haver de fer lliscar la taula) */
  @media screen and (max-width:380px){
    .tbl-wrap .tbl:has(th.total) th.num,.tbl-wrap .tbl:has(th.total) td.num{padding-left:3px;padding-right:3px}
  }
  /* els avisos: al mòbil a dalt, i amb el teclat gran sempre a dalt (mai a sobre de «Desa») */
  @media screen and (max-width:700px), screen and (max-height:500px) and (orientation:landscape) and (max-width:950px){ html #toasts{inset:calc(52px + env(safe-area-inset-top)) 8px auto 8px;max-width:none} }
  @media (max-width:1100px), (pointer:coarse){ html body.has-qe #toasts{inset:calc(var(--top,0px) + 8px) 8px auto auto} }
  /* mòbil amb el teclat gran: l'últim avís, d'una línia, a la franja de dalt (mai a sobre de la gimnasta) */
  @media screen and (max-width:700px){
    html body.has-qe #toasts{inset:calc(4px + env(safe-area-inset-top)) 8px auto 8px;max-width:none}
    body.has-qe #toasts .toast:not(:last-child){display:none}
    body.has-qe #toasts .toast{padding:4px 10px;min-height:40px}
    body.has-qe #toasts .toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  }
  /* mòbil dret: un avís llarg amb botons («Desfés», «Reequilibra la resta»…), el text a tota l'amplada i els botons a sota
     (no en una columna estreta al costat) */
  @media screen and (max-width:700px) and (orientation:portrait){
    body:not(.has-qe) #toasts .toast.long{flex-wrap:wrap;justify-content:flex-end}
    body:not(.has-qe) #toasts .toast.long span{flex:1 0 100%}
  }
  /* mòbil girat: els avisos dins la franja de dalt, d'una sola línia (mai a sobre del teclat gran ni de la casella) */
  @media screen and (max-height:500px) and (min-aspect-ratio:3/2) and (max-width:950px){
    html #toasts, html body.has-qe #toasts{inset:calc(4px + env(safe-area-inset-top)) 8px auto 150px;max-width:none}
    #toasts .toast:not(:last-child){display:none}
    #toasts .toast{padding:4px 10px;min-height:40px}
    #toasts .toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    html #tutbanner .banner{padding:4px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    body.kb dialog#dlg .dlg-actions{position:static;margin-bottom:0}
  }
  /* l'avís de connexió de la tutora (que també es veu a dalt, «Sense connexió», i a la barra de l'aparell) surt a la
     franja de dalt, per sobre del nom de l'app, i no ocupa lloc a la pàgina, amb el teclat gran i a la llista: si
     n'ocupés, el teclat o la llista baixarien just quan s'hi toca i el dit premeria una altra tecla o la casella d'una
     altra gimnasta */
  #tutbanner{position:fixed;top:0;left:0;right:0;z-index:21;padding:calc(6px + env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));pointer-events:none}
  #tutbanner .banner{margin:0;padding:7px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(10,20,40,.18)}
  #tutbanner .banner span + span::before{content:" · "}
  /* (al mòbil no hi cap en una ratlla: en dues, més petites, i encara dins la franja de dalt; no tapa res i no mou res) */
  @media screen and (max-width:420px){
    #tutbanner{padding-top:max(5px,env(safe-area-inset-top))}
    #tutbanner .banner{padding:4px 10px;font-size:12px;line-height:15px}
    #tutbanner .banner span{display:block;overflow:hidden;text-overflow:ellipsis}
    #tutbanner .banner span + span::before{content:none}
  }
  /* l'estat de la connexió al costat de «Surt»: sempre el lloc del més llarg, perquè el nom de la competició no canviï
     de ratlles (i la pàgina no baixi) quan canvia */
  #tutstatus{display:inline-grid;justify-items:end}
  #tutstatus>*,#tutstatus::after{grid-area:1/1;white-space:nowrap}
  #tutstatus::after{content:"Connectada · tot enviat";visibility:hidden;font-size:11px;font-weight:700;padding:0 7px;height:0;overflow:hidden}
  /* la barra de l'aparell del teclat gran, sempre d'una ratlla (al mòbil de 360 px «Sense connexió · 2 al mòbil» no hi
     cap): si creixés, el teclat baixaria just quan s'hi toca. Primer s'escurça l'estat de la connexió */
  .qe-app>.ico,.qe-app small{flex:none;white-space:nowrap}
  .qe-name{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qe-net{font-size:12px;font-weight:700;background:rgba(0,0,0,.28);border-radius:6px;padding:2px 6px;margin-left:auto;
    min-width:0;flex:0 1000 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qe-net:empty{display:none}
  .qe-net:not(:empty) + small{margin-left:8px}
  html:has(#qe){scroll-padding-top:0}
  .qe{scroll-margin-top:calc(var(--top,0px) + 6px)}
  /* mòbil girat: el teclat al costat de la gimnasta (i la barra de l'aparell, a sobre de la gimnasta) */
  @media screen and (max-height:500px) and (min-aspect-ratio:3/2) and (max-width:950px){
    .qe{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px;align-items:start;
      grid-template-areas:"app keys" "card keys" "disp keys" "hint keys" "next bar" "strip strip"}
    .qe-app{grid-area:app;position:static}.qe-card{grid-area:card}.qe-display{grid-area:disp}.qe-hint{grid-area:hint}
    .qe-keys{grid-area:keys;margin:0}.qe-bar{grid-area:bar;margin-top:6px}.qe-next{grid-area:next}.qe-strip{grid-area:strip}
    .qe-keys button{min-height:42px;font-size:22px}
    .qe-bar .btn{min-height:46px}
    .qe-display{font-size:32px;min-height:48px}
  }
  /* mòbil de pantalla baixa (360×560, l'iPhone SE amb les barres del Safari, o girat): la barra de l'aparell, més prima i
     enganxada a la fitxa de la gimnasta, perquè en obrir el teclat «Desa» continuï a la vista sense haver de baixar */
  @media screen and (max-width:700px) and (max-height:680px), screen and (max-height:500px) and (min-aspect-ratio:3/2) and (max-width:950px){
    .qe-app{padding:5px 12px;font-size:16px;margin-bottom:0;border-radius:12px 12px 0 0}
    .qe-app .ico{width:20px;height:20px}
    .qe-app small{font-size:13px}
    .qe-app + .qe-card{border-top:0 !important;border-radius:0 0 14px 14px}
  }
  @media screen and (max-width:700px) and (max-height:680px) and (orientation:portrait){
    .qe{scroll-margin-top:calc(var(--top,0px) + 2px)}
    .qe-display{font-size:36px;min-height:50px;margin:6px 0 2px}
    .qe-keys{margin-bottom:8px}
  }
  /* ordinador o tauleta de pantalla baixa (portàtil de 1366×768 o 1280×800, tauleta girada): el teclat al costat de la
     gimnasta, perquè a sobre també hi càpiguen els grups i les pastilles dels aparells (es veu on va la nota). El mòbil girat
     té el seu (a sobre) */
  @media screen and (min-width:900px) and (min-height:501px) and (max-height:900px){
    .qe{max-width:900px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:start;
      grid-template-rows:auto auto auto auto 1fr auto auto;

<script>
"use strict";
/* ═══════════════════════════════════════════ ENGINE-START
   Motor de càlcul: sense DOM, sense dades globals. Tot el que entra i surt són
   objectes simples, i les notes es treballen en MIL·LÈSIMES ENTERES (8,275 → 8275)
   perquè les sumes no arrosseguin errors de coma flotant. Els tests
   (tests/engine.test.mjs) extreuen aquest bloc i el proven sol. */
const Engine = (() => {
  const M = 1000;
  const COLLATOR = new Intl.Collator('ca', { sensitivity: 'base', numeric: true });
  const coll = (a, b) => COLLATOR.compare(String(a ?? ''), String(b ?? ''));
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

  // valor guardat (número en unitats) → mil·lèsimes enteres, o null
  function toM(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    return Number.isFinite(n) ? Math.round(n * M) : null;
  }

  // el que escriu l'usuari → número (accepta coma o punt) · '' → null · brossa → NaN
  function parseScore(input) {
    if (input === null || input === undefined) return null;
    const s = String(input).replace(/\s+/g, '').replace(/[,']/, '.');
    if (s === '') return null;
    if (!/^(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
    return Math.round(Number(s) * M) / M;
  }

  // mil·lèsimes → "8,25" / "8,275" (mínim 2 decimals, màxim 3, sense perdre precisió)
  function fmt(m) {
    if (m === null || m === undefined || !Number.isFinite(m)) return '';
    const a = Math.abs(Math.round(m));
    let frac = String(a % M).padStart(3, '0');
    if (frac.endsWith('0')) frac = frac.slice(0, 2);
    return (m < 0 ? '-' : '') + Math.floor(a / M) + ',' + frac;
  }

  // cfg pot ser la competició sencera o només el mode ('simple' | 'detailed')
  const modeOf = cfg => (cfg && typeof cfg === 'object') ? cfg.scoring : cfg;
  const minOf = cfg => (cfg && typeof cfg === 'object') ? (toM(cfg.minScore) || 0) : 0;

  // nota d'un intent. Mode 'simple': la nota tal qual. Mode 'detailed': D + E − penalització; sense E encara
  // no hi ha nota (així una E oblidada no passa per bona). Si només hi ha la nota final (entrada en mode
  // simple abans de canviar de mode), compta aquesta menys la penalització.
  // Si hi ha nota mínima (p. ex. 3), qui fa l'exercici no en treu menys; un 0 vol dir que no l'ha fet.
  function attemptValue(att, cfg) {
    if (!att) return null;
    let v;
    if (modeOf(cfg) === 'detailed') {
      const d = toM(att.d), e = toM(att.e), p = toM(att.p) || 0;
      if (d === null && e === null) { const f = toM(att.v); v = f === null ? null : Math.max(0, f - (att.src === 'de' ? 0 : p)); }
      else v = e === null ? null : Math.max(0, (d || 0) + e - p);
    } else v = toM(att.v);
    const min = minOf(cfg);
    return (v !== null && v > 0 && v < min) ? min : v;
  }

  // nota d'un aparell (amb 1 o més intents i la regla: millor / mitjana / suma)
  function appResult(entry, app, cfg) {
    const n = Math.max(1, app.attempts || 1);
    const atts = (entry && entry.scores && entry.scores[app.id]) || [];
    const attempts = [];
    for (let i = 0; i < n; i++) attempts.push(attemptValue(atts[i], cfg));
    const got = attempts.filter(v => v !== null);
    let value = null;
    if (got.length) {
      if (n === 1) value = got[0];
      else if (app.rule === 'sum') value = got.reduce((a, b) => a + b, 0);
      else if (app.rule === 'avg') value = Math.round(got.reduce((a, b) => a + b, 0) / got.length);
      else value = Math.max(...got);
    }
    return { value, attempts, complete: got.length === n };
  }
  const appScore = (entry, app, cfg) => appResult(entry, app, cfg).value;
  // l'aparell té la nota completa: amb 2 intents i «la suma» o «la mitjana», calen tots dos (amb «la millor», n'hi ha prou amb un)
  const needsAll = app => (app.attempts || 1) > 1 && (app.rule === 'sum' || app.rule === 'avg');
  const appComplete = (entry, app, cfg) => { const r = appResult(entry, app, cfg); return r.value !== null && (!needsAll(app) || r.complete); };

  // D i E de la nota que compta (per desempatar com la FIG: primer E, després D). Només en mode detallat.
  function appDE(entry, app, cfg) {
    if (modeOf(cfg) !== 'detailed') return { d: null, e: null };
    const n = Math.max(1, app.attempts || 1);
    const atts = ((entry && entry.scores && entry.scores[app.id]) || []).slice(0, n);
    const done = atts.map(a => a || {}).map(a => ({ v: attemptValue(a, cfg), d: toM(a.d), e: toM(a.e) })).filter(x => x.v !== null);
    if (!done.length) return { d: null, e: null };
    if (n === 1 || app.rule === 'best' || !app.rule) { const b = done.reduce((p, x) => (x.v > p.v ? x : p)); return { d: b.d, e: b.e }; }
    const sum = k => done.reduce((t, x) => t + (x[k] || 0), 0);
    if (app.rule === 'sum') return { d: sum('d'), e: sum('e') };
    return { d: Math.round(sum('d') / done.length), e: Math.round(sum('e') / done.length) };
  }

  // gènere: 'F' (femení) o 'M' (masculí). Les dades antigues sense gènere són femení.
  const genderOf = x => (x && x.gender === 'M') ? 'M' : 'F';

  // cada aparell diu què és per a noies i per a nois: 'total' (compta a la general i per equips),
  // 'apart' (només la seva classificació) o 'off' (no es fa). Accepta el format antic (enabled/inTotal).
  function appMode(a, gender) {
    if (a.modes) return a.modes[gender === 'M' ? 'M' : 'F'] || 'off';
    if (!a.enabled) return 'off';
    return a.inTotal ? 'total' : 'apart';
  }
  // sense gènere: els aparells que es fan per a algú
  const enabledApps = (comp, gender) => (comp.apparatus || []).filter(a =>
    gender ? appMode(a, gender) !== 'off' : (appMode(a, 'F') !== 'off' || appMode(a, 'M') !== 'off'));
  const totalApps = (comp, gender) => (comp.apparatus || []).filter(a => appMode(a, gender || 'F') === 'total');
  const teamApps = (comp, gender) => totalApps(comp, gender).filter(a => a.inTeam !== false || a.modes);

  // suma de la general individual d'una inscripció (null si no té cap nota)
  function entryTotal(comp, entry) {
    let t = 0, n = 0;
    for (const a of totalApps(comp, genderOf(entry))) { const v = appScore(entry, a, comp); if (v !== null) { t += v; n++; } }
    return n ? t : null;
  }

  const groupKey = (category, gender, level) => String(category) + '||' + (gender === 'M' ? 'M' : 'F') + '||' + String(level);
  const idx = (list, v) => { const i = (list || []).indexOf(v); return i < 0 ? 1e6 : i; };
  const catName = c => (c && typeof c === 'object') ? c.name : c;

  // grups = categoria + gènere + nivell (cada grup té la seva classificació)
  function groupsOf(comp, settings) {
    const map = new Map();
    const add = (category, gender, level) => {
      const key = groupKey(category, gender, level);
      if (!map.has(key)) map.set(key, { key, category, gender: gender === 'M' ? 'M' : 'F', level, entries: [] });
      return map.get(key);
    };
    for (const e of comp.entries || []) add(e.category, genderOf(e), e.level).entries.push(e);
    for (const t of comp.teams || []) add(t.category, genderOf(t), t.level);
    const cats = ((settings && settings.categories) || []).map(catName), levels = settings && settings.levels;
    return [...map.values()].sort((a, b) =>
      idx(cats, a.category) - idx(cats, b.category) || coll(a.category, b.category) ||
      (a.gender === b.gender ? 0 : a.gender === 'F' ? -1 : 1) ||
      idx(levels, a.level) - idx(levels, b.level) || coll(a.level, b.level));
  }

  // categoria que toca segons l'any de naixement. defs: [{name, from, to}] (from/to buits = sense límit)
  function categoryForYear(defs, year) {
    const y = parseInt(year, 10);
    if (!Number.isFinite(y)) return null;
    const hit = (defs || []).find(c => c && typeof c === 'object' &&
      (c.from === null || c.from === undefined || c.from === '' || y >= +c.from) &&
      (c.to === null || c.to === undefined || c.to === '' || y <= +c.to) &&
      !((c.from === null || c.from === undefined || c.from === '') && (c.to === null || c.to === undefined || c.to === '')));
    return hit ? hit.name : null;
  }

  // compara dues llistes de notes de més gran a més petita: la primera diferència mana
  function cmpDesc(aVals, bVals) {
    const A = aVals.filter(v => v !== null).sort((x, y) => y - x);
    const B = bVals.filter(v => v !== null).sort((x, y) => y - x);
    for (let i = 0; i < Math.max(A.length, B.length); i++) {
      const x = i < A.length ? A[i] : -1, y = i < B.length ? B[i] : -1;
      if (x !== y) return y - x;
    }
    return 0;
  }

  // posa posicions. Empat (mateixa nota i sense desempat) = mateixa posició: 1, 1, 3…
  function assignRanks(items, value, tie) {
    const ranked = items.filter(x => value(x) !== null);
    const rest = items.filter(x => value(x) === null);
    ranked.sort((a, b) => (value(b) - value(a)) || (tie ? tie(a, b) : 0) || (a._order - b._order));
    for (let i = 0; i < ranked.length; i++) {
      const r = ranked[i], p = ranked[i - 1];
      r.rank = (p && value(p) === value(r) && (!tie || tie(p, r) === 0)) ? p.rank : i + 1;
    }
    ranked.forEach((r, i) => {
      r.tied = (i > 0 && ranked[i - 1].rank === r.rank) || (i + 1 < ranked.length && ranked[i + 1].rank === r.rank);
    });
    rest.sort((a, b) => ((a.np ? 1 : 0) - (b.np ? 1 : 0)) || (a._order - b._order));
    rest.forEach(r => { r.rank = null; r.tied = false; });
    return ranked.concat(rest);
  }

  function withOrder(rows) {
    [...rows].sort((a, b) => coll(a.name, b.name)).forEach((r, i) => { r._order = i; });
    return rows;
  }

  // CLASSIFICACIÓ GENERAL INDIVIDUAL: suma dels aparells que compten per al total
  function individualRanking(comp, group, opts = {}) {
    const apps = totalApps(comp, group.gender);
    const nameOf = opts.nameOf || (() => '');
    const rows = withOrder(group.entries.map(e => {
      const np = e.status === 'np';
      const scores = {}; let total = 0, n = 0, eSum = 0, dSum = 0, full = 0;
      for (const a of apps) {
        const r = appResult(e, a, comp), v = r.value;
        scores[a.id] = v;
        if (v !== null && (!needsAll(a) || r.complete)) full++;
        if (v !== null) { total += v; n++; const de = appDE(e, a, comp); eSum += de.e || 0; dSum += de.d || 0; }
      }
      return { entry: e, name: nameOf(e), scores, total: (n && !np) ? total : null,
        count: n, complete: full === apps.length, np, eSum, dSum };
    }));
    let tie = null;
    if (comp.tieInd === 'bestApp') tie = (a, b) => cmpDesc(Object.values(a.scores), Object.values(b.scores));
    if (comp.tieInd === 'fig') tie = (a, b) => (b.eSum - a.eSum) || (b.dSum - a.dSum);
    return { apps, rows: assignRanks(rows, r => r.total, tie) };
  }

  // CLASSIFICACIÓ D'UN APARELL
  function apparatusRanking(comp, group, app, opts = {}) {
    const nameOf = opts.nameOf || (() => '');
    const rows = withOrder(group.entries.map(e => {
      const np = e.status === 'np';
      const r = appResult(e, app, comp);
      const de = appDE(e, app, comp);
      return { entry: e, name: nameOf(e), value: np ? null : r.value, attempts: r.attempts, complete: r.complete, np, e: de.e || 0, d: de.d || 0 };
    }));
    let tie = null;
    if (comp.tieApp === 'bestAttempt' && (app.attempts || 1) > 1) tie = (a, b) => cmpDesc(a.attempts, b.attempts);
    if (comp.tieApp === 'fig') tie = (a, b) => (b.e - a.e) || (b.d - a.d);
    return assignRanks(rows, r => r.value, tie);
  }

  // CLASSIFICACIÓ PER EQUIPS: a cada aparell només compten les N millors notes (per defecte 3)
  function teamRanking(comp, group, opts = {}) {
    const apps = teamApps(comp, group.gender);
    const N = comp.teamCount || 3, min = comp.teamMin || 3, max = comp.teamMax || 6;
    const teams = (comp.teams || []).filter(t => t.category === group.category && genderOf(t) === genderOf(group) && t.level === group.level);
    const rows = withOrder(teams.map(t => {
      const members = (comp.entries || []).filter(e => e.teamId === t.id);
      const perApp = {}, counted = {};
      let total = 0, any = false;
      const allCounted = [];
      for (const a of apps) {
        const vals = members
          .map(e => ({ id: e.id, v: e.status === 'np' ? null : appScore(e, a, comp) }))
          .filter(x => x.v !== null)
          .sort((x, y) => y.v - x.v);
        const top = vals.slice(0, N);
        top.forEach(x => { (counted[x.id] = counted[x.id] || {})[a.id] = true; allCounted.push(x.v); });
        const sum = top.reduce((s, x) => s + x.v, 0);
        perApp[a.id] = { value: top.length ? sum : null, used: top.length, full: top.length >= N };
        if (top.length) { total += sum; any = true; }
      }
      // classifica si hi han competit (no NP) entre el mínim i el màxim de gimnastes
      const size = members.filter(e => e.status !== 'np').length;
      const eligible = size >= min && size <= max;
      return { team: t, name: t.name, members, perApp, counted, allCounted,
        total: (any && eligible) ? total : null, rawTotal: any ? total : null,
        complete: apps.every(a => perApp[a.id].full), size, eligible, undersize: size < min, oversize: size > max };
    }));
    let tie = null;
    if (comp.tieTeam === 'bestApp') tie = (a, b) => cmpDesc(apps.map(x => a.perApp[x.id].value), apps.map(x => b.perApp[x.id].value));
    if (comp.tieTeam === 'bestScore') tie = (a, b) => cmpDesc(a.allCounted, b.allCounted);
    return { apps, rows: assignRanks(rows, r => r.total, tie) };
  }

  // RÀNQUING DE JORNADES: suma de la nota final de cada gimnasta (i de cada equip que classifica) a totes
  // les competicions triades. Cada grup (categoria + gènere + nivell) té el seu. Qui no hi va, no suma.
  function seasonRanking(comps, settings, opts = {}) {
    const nameOf = opts.nameOf || (() => '');
    const groups = new Map();
    const grp = (category, gender, level) => {
      const key = groupKey(category, gender, level);
      if (!groups.has(key)) groups.set(key, { key, category, gender, level, people: new Map(), teams: new Map() });
      return groups.get(key);
    };
    // equips de la llista general que han competit alhora en alguna jornada del curs (al mateix grup): són equips
    // diferents, encara que després se n'hagi esborrat un i l'altre tingui el nom que tenia. opts.allComps: totes les
    // jornades del curs, també les que no es compten (treure'n una del rànquing només en treu la columna)
    // (named: el nom de cada equip a l'última jornada del curs on va competir; és el nom de la seva fila)
    const along = new Map(), named = new Map();
    (opts.allComps || comps).forEach((c, i) => { for (const t of c.teams || []) {
      if (!t.sourceTeamId || !(c.entries || []).some(e => e.teamId === t.id)) continue;
      const k = groupKey(t.category, genderOf(t), t.level) + '|' + t.sourceTeamId;
      if (!along.has(k)) along.set(k, new Set());
      along.get(k).add(c.id);
      named.set(k, { name: t.name, i });
    } });
    const together = (gk, a, b) => { const x = along.get(gk + '|' + a), y = b && along.get(gk + '|' + b); return !!(x && y && [...x].some(id => y.has(id))); };
    const inComp = (gk, a, cid) => { const x = along.get(gk + '|' + a); return !!x && x.has(cid); };
    for (const c of comps) {
      for (const g of groupsOf(c, settings)) {
        const S = grp(g.category, g.gender, g.level);
        for (const r of individualRanking(c, g, { nameOf }).rows) {
          const id = r.entry.gymnastId;
          if (!S.people.has(id)) S.people.set(id, { gymnastId: id, name: r.name, entry: r.entry, per: {}, sum: 0, n: 0 });
          const p = S.people.get(id);
          if (p.per[c.id] !== undefined) continue;   // (dues inscripcions seves a la mateixa jornada: compta la primera)
          p.entry = r.entry; p.name = r.name;
          if (r.total !== null) { p.per[c.id] = r.total; p.sum += r.total; p.n++; } else if (r.np) p.per[c.id] = 'np';
        }
        const used = new Set();   // (les files que ja tenen un equip d'aquesta jornada)
        for (const r of teamRanking(c, g).rows) {
          // el mateix equip a totes les jornades: per l'equip de la llista general del qual és còpia
          // (sourceTeamId) i, per a dades antigues sense, pel nom i l'entitat. Pel nom també si l'equip d'abans ja
          // no existeix (s'ha esborrat i s'ha tornat a fer igual): opts.teamGone(id, jornada). Mai, però, a la fila
          // d'un equip que ja té nota en aquesta jornada ni a la d'un que ha competit alguna vegada alhora amb aquest
          const kS = r.team.sourceTeamId ? 's:' + r.team.sourceTeamId : null;
          const kN = 'n:' + norm(r.team.name) + '|' + (r.team.clubId || '');
          const old = S.teams.get(kN);
          const free = !!old && !used.has(old) && !(old.srcIds || []).some(id => inComp(S.key, id, c.id) || together(S.key, id, r.team.sourceTeamId));
          const oldGone = !!(free && old.src && opts.teamGone && (old.srcIds || []).every(id => opts.teamGone(id, c)));
          let t = (kS && S.teams.get(kS)) || (free && (!kS || !old.src || oldGone) ? old : null);
          // (dues còpies del mateix equip a la mateixa jornada, de dades estranyes: cadascuna a la seva fila)
          const twice = !!t && used.has(t);
          if (twice) t = null;
          if (!t) { t = { id: (kS || kN) + (twice ? '|' + r.team.id : ''), src: !!kS, name: r.team.name, team: r.team, per: {}, sum: 0, n: 0, mem: {} }; }
          used.add(t);
          if (twice) S.teams.set(t.id, t);
          else if (kS) { S.teams.set(kS, t); t.src = true; t.srcIds = t.srcIds || []; if (!t.srcIds.includes(r.team.sourceTeamId)) t.srcIds.push(r.team.sourceTeamId); }
          if (!S.teams.has(kN)) S.teams.set(kN, t);
          t.name = r.team.name; t.team = r.team;   // el nom de l'última jornada
          if (r.total !== null) { t.per[c.id] = r.total; t.sum += r.total; t.n++; }
          // qui hi era inscrit aquell dia (per avisar si l'equip canvia de gimnastes d'una jornada a l'altra)
          const ids = r.members.map(e => e.gymnastId).filter(Boolean);
          if (ids.length) t.mem[c.id] = [...new Set((t.mem[c.id] || []).concat(ids))].sort();
        }
      }
    }
    const order = groupsOf({ entries: [], teams: [...groups.values()] }, settings).map(g => g.key);
    return order.map(k => groups.get(k)).map(g => {
      const rows = withOrder([...g.people.values()].map(p => Object.assign(p, { total: p.n ? p.sum : null })));
      for (const t of g.teams.values()) { const nm = (t.srcIds || []).map(id => named.get(g.key + '|' + id)).filter(Boolean).sort((a, b) => a.i - b.i).pop(); if (nm) t.name = nm.name; }
      const teams = withOrder([...new Set(g.teams.values())].filter(t => t.n).map(t => Object.assign(t, { total: t.sum, changes: teamChanges(t, comps) })));
      return { key: g.key, category: g.category, gender: g.gender, level: g.level,
        rows: assignRanks(rows, r => r.total, null), teams: assignRanks(teams, r => r.total, null) };
    });
  }

  // canvis de gimnastes d'un equip entre jornades (en l'ordre de comps): qui entra i qui en surt. La puntuació no
  // canvia: l'equip continua sumant igual
  function teamChanges(t, comps) {
    const out = []; let prev = null;
    for (const c of comps) {
      const m = t.mem && t.mem[c.id];
      if (!m) continue;
      if (prev) {
        const added = m.filter(id => !prev.m.includes(id)), removed = prev.m.filter(id => !m.includes(id));
        if (added.length || removed.length) out.push({ compId: c.id, prevId: prev.id, added, removed });
      }
      prev = { id: c.id, m };
    }
    return out;
  }

  // un intent amb alguna nota
  const hasMark = a => !!a && ['v', 'd', 'e', 'p'].some(k => a[k] !== undefined && a[k] !== null);
  // la nota l'ha posada la taula (o una de tutora ja revisada): una nota de tutora no la trepitja mai
  const guarded = a => hasMark(a) && (a.by !== 'tutor' || !!a.ok);

  // fusiona a base les notes d'una altra còpia de les dades: de cada intent guanya el més recent (camp at),
  // excepte que una nota de tutora no passa mai per sobre d'una de la taula. Per sobre d'una de tutora ja revisada,
  // només si és més nova: la taula n'ha revisat una de més vella i aquesta (que el programa ja havia acceptat) no
  // l'havia vista; es queda sense revisar (torna a sortir en groc).
  // Torna la llista d'intents que s'han agafat de l'altra còpia. El servidor (servidor/main.go) fa el mateix.
  // Amb since (ms), de l'altra còpia només es miren els intents desats després d'aquell moment.
  const tableOwns = a => guarded(a) && !(a.by === 'tutor' && a.ok);
  function mergeScores(base, other, { since = 0 } = {}) {
    const changed = [];
    const ocomps = new Map(((other && other.competitions) || []).map(c => [c.id, c]));
    for (const c of (base && base.competitions) || []) {
      const oc = ocomps.get(c.id);
      if (!oc) continue;
      const oents = new Map((oc.entries || []).map(e => [e.id, e]));
      for (const e of c.entries || []) {
        const oe = oents.get(e.id);
        if (!oe || !oe.scores || typeof oe.scores !== 'object') continue;
        if (!e.scores || typeof e.scores !== 'object') e.scores = {};
        for (const appId of Object.keys(oe.scores)) {
          const ol = Array.isArray(oe.scores[appId]) ? oe.scores[appId] : [];
          const l = Array.isArray(e.scores[appId]) ? e.scores[appId] : (e.scores[appId] = []);
          ol.forEach((x, i) => {
            if (x && (+x.at || 0) > (+(l[i] && l[i].at) || 0) && (+x.at || 0) > since && !(x.by === 'tutor' && tableOwns(l[i]))) {
              while (l.length <= i) l.push({});
              l[i] = JSON.parse(JSON.stringify(x));
              changed.push({ compId: c.id, entryId: e.id, appId, i });
            }
          });
        }
      }
    }
    return changed;
  }

  // nota massa alta (p. ex. «835» quan el màxim és 20): què devia voler dir (8,35; o 10,50 per «1050»).
  // Prova la coma després de 2 xifres i després d'1; null si no n'hi ha cap que valgui.
  function suggestScore(input, max) {
    const digits = String(input ?? '').replace(/\D/g, '');
    const mx = Number(max) > 0 ? Number(max) : 20;
    if (digits.length < 2 || digits.length > 6) return null;
    for (const k of [2, 1]) {
      if (digits.length <= k) continue;
      const v = Math.round(Number(digits.slice(0, k) + '.' + digits.slice(k)) * M) / M;
      if (v > 0 && v <= mx) return v;
    }
    return null;
  }

  // notes que falten a un grup (de les gimnastes que no són NP), per aparell
  function missingScores(comp, group) {
    const perApp = {}; let total = 0;
    for (const a of enabledApps(comp, group.gender)) {
      const n = group.entries.filter(e => e.status !== 'np' && !appComplete(e, a, comp)).length;
      if (n) { perApp[a.id] = n; total += n; }
    }
    return { total, perApp };
  }

  // curs escolar a partir d'una data: setembre-agost
  function seasonFor(dateStr) {
    const m = /^(\d{4})-(\d{2})/.exec(dateStr || '');
    if (!m) return '';
    const y = +m[1], mo = +m[2];
    return mo >= 9 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
  }


  /* ─── ROTACIONS I HORARI
     Subdivisions (cada una competeix sola, amb el seu escalfament i els seus premis), grups dins de cada
     subdivisió (cada grup comença a un aparell i va passant al següent) i l'horari estimat.
     Tot amb enters i comparant per punt de codi (cps): el resultat és el mateix a tots els aparells. */
  const cps = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  const own = (o, k) => !!o && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k);
  const isInt = v => Number.isInteger(v);
  const I = (v, d) => (isInt(v) ? v : d);
  const clampI = (v, lo, hi, d) => (isInt(v) ? Math.max(lo, Math.min(hi, v)) : d);
  const keyOfE = e => groupKey(e.category, genderOf(e), e.level);
  // pesos: el límit d'entrenadores mana per sobre de tot; després, separar categories (mode 'cat') o igualar els grups ('bal')
  const ROT_MODES = { cat: { MIX: 64, CAT: 16, GAP: 8 }, bal: { MIX: 4, CAT: 2, GAP: 1 } };
  const ROT_WC = { CLUB: 6, CLUB2: 1, COACH: 16777216, CAP: 256, STAB: 2 };
  const ROT_BUDGET = 200000;
  const joinI = l => (l.length <= 1 ? (l[0] || '') : l.slice(0, -1).join(', ') + ' i ' + l[l.length - 1]);
  const UP = s => String(s ?? '').toLocaleUpperCase('ca');
  // una inscripció sense categoria o sense nivell (encara no s'hi ha posat): als noms es diu, no queda un forat
  const catTx = c => (c === '' || c === null || c === undefined ? 'sense categoria' : String(c));

// IndexedDB mínima, només per recordar el fitxer vinculat entre sessions
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('notesgim', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const tx = rq.result.transaction('kv', mode); const st = tx.objectStore('kv');
      const r = fn(st);
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    };
  });
}

      }

      const theirs = inFile && !blankDb(inFile);

      const mine = fileStamp && fm.updated === fileStamp;
      // (amb la història de les dades: el fitxer és una versió d'on venen les d'aquest navegador, o ve d'aquestes; si no, l'ha
      // canviat algú altre, p. ex. un altre ordinador amb el mateix USB, encara que els rellotges diguin el contrari)
      const known = hasHist(db) || hasHist(inFile);
      const other = theirs && ((fm.dbId && fm.dbId !== db.meta.dbId) || (!mine && (known ? !descends(db, inFile) && !descends(inFile, db) : Date.parse(fm.updated || 0) > Date.parse(sessionStamp || 0))));
      if (other) { fileState = 'conflict'; renderSaveState(false); return; }
      // el fitxer ve de les d'aquest navegador i és més nou (p. ex. una altra pestanya hi acaba de desar): es fa servir aquest
      if (theirs && !mine && known && fm.updated !== db.meta.updated && descends(inFile, db) && !descends(db, inFile)) {
        db = migrate(inFile); fileStamp = fm.updated; fileChecked = true; fileDirty = false;
        try { const raw = JSON.stringify(db); localStorage.setItem(LS_KEY, raw); lastRaw = raw; } catch (_) {}
        fileState = 'ok'; renderKeepFocus(); return;

      // no pot escriure la versió que ha llegit a sobre de la que una altra pestanya hi desa en aquell moment)
      if (theirs && fm.updated && fm.updated === db.meta.updated) {
        const f0 = await fileHandle.getFile();

        renderSaveState(false); return;
      }

    const w = await fileHandle.createWritable();
    await w.write(json);
    await w.close();

}

// nom de la jornada següent: el primer número d'ordre o de fase, un més («1a Fase» → «2a Fase», «Fase 1» → «Fase 2»,
// «Jornada 3» → «Jornada 4», «3r Trofeu» → «4t Trofeu»), mai un any («2027») ni un curs o una data («2026-2027»,
// «2026-27», «21/11»). Si no n'hi ha cap, el mateix nom (al formulari surt seleccionat, per escriure'n un altre)
const nextCompName = name => {
  const s = name || '';
  const nums = [...s.matchAll(/\d+/g)].map(m => ({ i: m.index, t: m[0], pre: s.slice(0, m.index), post: s.slice(m.index + m[0].length) }))
    .filter(x => x.t.length < 4 && !/\d[-/.:]$/.test(x.pre) && !/^[-/.:]\d/.test(x.post));
  // (ordinal: 1a, 2ª, 1r, 2n, 3r, 4t, 5è; de fase: «Fase 1», «Jornada 3», «J3»)
  const ord = x => /^(a|ª|º|o|r|n|t|è)(?![\p{L}\d])/iu.exec(x.post);
  const phase = x => /(?:^|[^\p{L}])(fase|jornada|j|prova|etapa|trobada|ronda|tanda|sessió|núm|n)\.?º?\s*$/iu.test(x.pre);
  const x = nums.find(y => ord(y) || phase(y)) || nums.find(y => !/\p{L}$/u.test(y.pre) && !/^\p{L}/u.test(y.post));
  if (!x) return s || S().compName;
  const n = +x.t + 1, o = ord(x);
  let suf = o ? o[0] : '';
  // (els masculins canvien: 1r, 2n, 3r, 4t, 5è…)
  if (o && /^[rntè]$/i.test(suf)) { const m = n === 1 || n === 3 ? 'r' : n === 2 ? 'n' : n === 4 ? 't' : 'è'; suf = suf === suf.toUpperCase() ? m.toUpperCase() : m; }
  return x.pre + n + suf + x.post.slice(o ? o[0].length : 0);
};

// tria de grup: pastilles a l'ordinador i, al mòbil, ◀ desplegable ▶.
// badge(g) → { html, txt }: el que surt al costat del nom (p. ex. quantes notes falten)
// (al mòbil, el desplegable mostra el grup en curt i, a sota, el que diu badge: el nom sencer i «· 8 · falten 6» no hi
// caben —el nivell quedaria tallat—. La llista que s'obre diu els noms sencers)
function groupPicker({ groups, cur, act, all = false, badge = () => ({ html: '', txt: '' }), label = groupLabel, short = label === groupLabel ? groupLabelShort : label }) {
  const keys = groups.map(g => g.key).concat(all && groups.length > 1 ? ['all'] : []);
  const i = keys.indexOf(cur), prev = keys[i - 1], next = keys[i + 1];
  const pills = groups.map(g => { const b = badge(g); return `<button class="pill ${g.key === cur ? 'on' : ''} ${b.cls || ''}" data-act="${act}" data-g="${h(g.key)}">${h(label(g))}${b.html}</button>`; }).join('')
    + (all && groups.length > 1 ? `<button class="pill ${cur === 'all' ? 'on' : ''}" data-act="${act}" data-g="all">Totes</button>` : '');
  const opts = groups.map(g => `<option value="${h(g.key)}" ${g.key === cur ? 'selected' : ''}>${h(label(g))}${badge(g).txt ? ' · ' + h(badge(g).txt) : ''}</option>`).join('')
    + (all && groups.length > 1 ? `<option value="all" ${cur === 'all' ? 'selected' : ''}>Tots els grups</option>` : '');
  const cg = groups.find(g => g.key === cur), ct = cg ? badge(cg).txt : '';
  return `<div class="pills hide-ph">${pills}</div>
    <div class="gsel show-ph"><button type="button" class="btn" data-act="${act}" data-g="${h(prev || '')}" ${prev ? '' : 'disabled'} aria-label="Grup anterior">◀</button>
      <label class="gsel-pick"><span class="gsel-txt"><b>${cg ? h(short(cg)) : cur === 'all' && groups.length > 1 ? 'Tots els grups' : ''}</b>${cg && ct ? `<small data-gtxt="${h(cg.key)}">${h(ct)}</small>` : ''}</span>
        <select data-chg="groupSel" data-target="${act}" aria-label="Grup">${opts}</select></label>
      <button type="button" class="btn" data-act="${act}" data-g="${h(next || '')}" ${next ? '' : 'disabled'} aria-label="Grup següent">▶</button></div>`;
}

function missBadge(c, g) {
  const m = Engine.missingScores(c, g).total, n = g.entries.length;

  const w = `${n} · falten ${'0'.repeat(String(n * Math.max(1, Engine.enabledApps(c, g.gender).length)).length)}`;
  return m ? { html: ` <span class="n" data-w="${w}" title="Hi ${faltenTxt(m, 'nota', 'notes')}">${n} · ${faltenTxt(m)}</span>`, txt: `${n} · ${faltenTxt(m)}` }
    : { html: ` <span class="n ok" data-w="${w}" title="Totes les notes entrades">${n} ✓</span>`, txt: `${n} ✓` };
}

  const tools = `<div class="toolbar">
    <button class="btn primary" data-act="enrollGyms" ${dis}>＋ Inscriu gimnastes</button>
    <button class="btn" data-act="autoCompTeams" ${dis} title="Cada gimnasta va al seu equip; les d’una mateixa entitat sense equip en formen un si n’hi ha ${c.teamMin} o més al mateix grup">Fes equips per entitat</button>
    ${groups.length ? `<input type="search" class="grow" placeholder="Cerca per nom, entitat o dorsal…" value="${h(ui.insQ || '')}" data-inp="insSearch" aria-label="Cerca" autocomplete="off">` : ''}
    <div class="right hide-ph">${more}</div><div class="right show-ph">${menu(more)}</div></div>`;

  if (!groups.length) return tools + `<div class="empty">Encara no hi ha cap gimnasta inscrita.<br>El més ràpid són els fulls d’inscripció dels clubs: els equips queden com diu el full.<br><br>
    <button class="btn primary" data-act="inscOpen" ${dis}>📥 Fulls d’inscripció dels clubs…</button><br><br>
    <span class="small">O clica «Inscriu gimnastes»: els equips es fan sols (els de les fitxes i, si no en tenen, per entitat).</span></div>`;
  const q = norm(ui.insQ || '');

  return tools + insSelBar(c) + groups.map(g => {
    const teams = compTeamsOf(c, g);

      const tip = n < c.teamMin ? `Li falten gimnastes que competeixin: com a mínim ${c.teamMin}` : n > c.teamMax ? `Massa gimnastes: com a màxim ${c.teamMax}` : '';
      return `<span class="chip" title="${tip}"><b>${h(t.name)}</b>${t.clubId && t.name !== clubName(t.clubId) ? `<span class="muted small">${h(clubName(t.clubId))}</span>` : ''}<span class="badge ${cls}">${n}${np ? ` + ${np} NP` : ''}</span>
        <button class="icon-btn" data-act="editCompTeam" data-id="${t.id}" title="Canvia el nom o les gimnastes" aria-label="Edita l’equip ${h(t.name)}" ${dis}>✎</button></span>`;
    }).join('');
    const rows = sortEntries(g.entries).map(e => {
      const gym = gymById(e.gymnastId), club = clubName(e.clubId);
      const hit = !q || norm(`${gymName(gym)} ${club} ${e.bib}`).includes(q) || String(e.bib) === q;
      return `<tr class="${e.status === 'np' ? 'np' : ''} ${hit ? '' : 'hidden'}" data-q="${h(norm(`${gymName(gym)} ${club} ${e.bib}`))}" data-bib="${h(e.bib)}">
        <td class="c-sel">${dis ? '' : selBox(selK, e.id, gymName(gym))}</td>
        <td class="c-bib"><input type="text" inputmode="numeric" pattern="[0-9]*" class="bib" value="${h(e.bib)}" data-chg="bib" data-id="${e.id}" ${dis} aria-label="Dorsal ${deN(h(gymName(gym)))}" autocomplete="off"></td>
        <td class="c-name"><a href="#" data-act="editEntry" data-id="${e.id}">${h(gymName(gym))}</a>${e.status === 'np' ? ' <span class="badge">NP</span>' : ''}${(w => w ? ` <span class="badge warn" title="${h(w)}">pot fer equip</span>` : '')(couldTeam(c, e, g))}<span class="sub-ph">${h(club)}</span></td>
        <td class="c-club hide-ph">${h(club)}</td>
        <td class="c-team"><select data-chg="entryTeam" data-id="${e.id}" ${dis} aria-label="Equip ${deN(h(gymName(gym)))}">${entryTeamOptions(c, e, g)}</select></td>
        <td class="c-st"><select data-chg="entryStatus" data-id="${e.id}" ${dis} aria-label="Es presenta?"><option value="">Participa</option><option value="np" ${e.status === 'np' ? 'selected' : ''}>${isPhone() ? 'NP (no es presenta)' : 'No es presenta (NP)'}</option></select></td>
        <td class="c-del num"><button class="icon-btn" data-act="delEntry" data-id="${e.id}" title="${mf(e, 'Treu-lo', 'Treu-la')} de la competició" aria-label="Treu ${h(gymName(gym))} de la competició" ${dis}>✕</button></td></tr>`;
    }).join('');
    const anyHit = !q || sortEntries(g.entries).some(e => { const gym = gymById(e.gymnastId); return norm(`${gymName(gym)} ${clubName(e.clubId)} ${e.bib}`).includes(q) || String(e.bib) === q; });
    return `<div class="card ins-group ${anyHit ? '' : 'hidden'}">
      <div class="card-head"><h3>${h(groupLabel(g))}</h3><span class="muted">${plural(g.entries.length, 'gimnasta', 'gimnastes')} · ${plural(teams.length, 'equip', 'equips')}</span>

      ${teams.length ? `<div class="chips" style="margin-bottom:10px">${teamChips}</div>` : ''}
      <div class="tbl-wrap"><table class="tbl cardify ins"><thead><tr><th class="c-sel"></th><th>Dorsal</th><th>Gimnasta</th><th class="hide-ph">Entitat</th><th>Equip</th><th>Estat</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="muted">Cap gimnasta en aquest grup.</td></tr>`}</tbody></table></div></div>`;
  }).join('');
}

function newEntry(c, g, grp) {
  return { id: uid(), gymnastId: g.id, category: (grp ? grp.category : g.category) ?? '', gender: genderOf(grp || g),
    level: (grp ? grp.level : g.level) ?? '', clubId: g.clubId || null, teamId: null, bib: nextBib(c), status: '', scores: {} };
}
const hasScores = e => Object.values(e.scores || {}).some(arr => (arr || []).some(a => a && ['v', 'd', 'e', 'p'].some(k => a[k] !== undefined && a[k] !== null)));
/* ─── EQUIPS: cada gimnasta té el seu equip a la fitxa
   L'equip viu a la llista general (db.teams: nom, entitat, grup i gimnastes) i és el que surt a la fitxa de
   cada gimnasta. A cada competició se'n fa una còpia (c.teams, amb sourceTeamId) que és la que compta aquell
   dia: una NP o un canvi d'equip el mateix dia no canvien les altres jornades. Quan es canvia la fitxa (o la
   llista d'equips), les competicions d'avui o de més endavant la segueixen; les passades no es toquen. */
const gymTeam = g => db.teams.find(t => t.memberIds.includes(g.id) && sameGroup(t, g)) || db.teams.find(t => t.memberIds.includes(g.id)) || null;
// valor del desplegable d'equip de la fitxa: l'id de l'equip, '__none' (només individual) o '' (automàtic)
const gymTeamValue = g => { const t = gymTeam(g); return t ? t.id : g.noTeam ? '__none' : ''; };
const clubTeams = (clubId, grp, extra = []) => db.teams.concat(extra).filter(t => (t.clubId || null) === (clubId || null) && sameGroup(t, grp));
// nom d'un equip nou: el de l'entitat (el grup ja surt a tot arreu) i, si ja n'hi ha, amb número: «CG Lleida 2».
// extra: equips que encara no existeixen però es crearan alhora
function newTeamName(clubId, grp, extra = []) {
  const base = clubName(clubId) || 'Equip';
  const used = new Set(db.teams.concat(extra).filter(t => sameGroup(t, grp)).map(t => norm(t.name)));
  if (!clubTeams(clubId, grp, extra).length && !used.has(norm(base))) return base;
  for (let n = 2; ; n++) if (!used.has(norm(base + ' ' + n))) return base + ' ' + n;
}
function makeTeam(clubId, grp, name) {
  const t = { id: uid(), name: String(name || '').trim() || newTeamName(clubId, grp), clubId: clubId || null,
    gender: genderOf(grp), category: grp.category ?? '', level: grp.level ?? '', memberIds: [] };
  db.teams.push(t);
  return t;
}
// una gimnasta només és a un equip: entrar en un la treu de tots els altres
function putInTeam(gymId, team) {
  for (const t of db.teams) if (t !== team && t.memberIds.includes(gymId)) t.memberIds = t.memberIds.filter(id => id !== gymId);
  if (team && !team.memberIds.includes(gymId)) team.memberIds.push(gymId);
}
// la còpia d'un equip en una competició (es crea quan cal; si es queda buida, desapareix sola). Si l'equip ha
// canviat de grup, la còpia del grup d'abans no serveix: se'n fa una de nova
function compTeamFor(c, team) {
  let ct = c.teams.find(x => x.sourceTeamId === team.id && sameGroup(x, team));
  if (!ct) {
    ct = { id: uid(), name: team.name, clubId: team.clubId || null, category: team.category, gender: genderOf(team), level: team.level, sourceTeamId: team.id, auto: true };
    c.teams.push(ct);
  }

let tabAt = 0;

  const k = e.key;
  // Intro sobre un botó o enllaç de fora del teclat (p. ex. «Desfés» d'un avís), o sobre un botó del teclat gran on
  // s'ha arribat amb el tabulador (NP, ◀, la tira de dorsals…): fa el que diu el botó. Sobre una tecla de números, sobre

const teamWhy = (c, r) => r.undersize ? `no classifica: ${plural(r.size, 'gimnasta', 'gimnastes')} (mínim ${c.teamMin})`
  : r.oversize ? `no classifica: ${r.size} gimnastes (màxim ${c.teamMax})` : '';
// equips anul·lats: menys del mínim de gimnastes que hagin competit (per exemple, per una NP)
const cancelledNote = (c, list) => list.length ? `<p class="small ${''}">Equips anul·lats (menys ${deN(c.teamMin)} gimnastes que hagin competit; les seves gimnastes compten com a individuals): ${list.map(r => `${h(r.team.name)} (${r.size})`).join(', ')}.</p>` : '';
// equips esborrats de la llista general: db.goneTeams (id → el dia que es va esborrar; només els que tenen còpies a
// alguna competició). Al rànquing del curs, un equip esborrat i un de nou amb el mateix nom i entitat són el mateix
// equip, però només a les jornades d'aquell dia o de després: si s'ha esborrat més tard (p. ex. en passar al curs
// següent), a les jornades d'abans eren dos equips diferents i ho continuen sent
function markTeamsGone(ids) {
  const used = new Set(db.competitions.flatMap(c => c.teams.map(t => t.sourceTeamId).filter(Boolean)));
  const g = Object.assign({}, db.goneTeams);
  for (const id of ids) if (used.has(id)) g[id] = today();
  for (const id of Object.keys(g)) if (!used.has(id) || teamById(id)) delete g[id];
  if (Object.keys(g).length) db.goneTeams = g; else delete db.goneTeams;
}
// l'equip de la llista general ja no hi era el dia de la competició c (de dades d'abans, sense el dia: ja no hi és)
function teamGoneBy(id, c) { const d = (db.goneTeams || {})[id]; return !teamById(id) && !(d && c && c.date && d > c.date); }
// l'equip a la jornada anterior del mateix curs on va competir (el mateix equip: per l'equip de la fitxa o, si no,
// pel nom i l'entitat): qui hi entra i qui en surt. Només s'avisa: les notes i la puntuació no canvien
function teamPrevChange(c, ct) {
  const season = c.season || Engine.seasonFor(c.date);
  if (!season) return null;
  // (les jornades del curs en el mateix ordre que el rànquing: per data i, el mateix dia, en l'ordre en què es van crear)
  const all = db.competitions.filter(x => (x.season || Engine.seasonFor(x.date)) === season).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const prevs = all.slice(0, all.indexOf(c)).reverse();
  const now = new Set(c.entries.filter(e => e.teamId === ct.id).map(e => e.gymnastId).filter(Boolean));
  // (pel nom, mai un equip de la llista general que és en aquesta jornada o que alguna vegada ha competit alhora amb
  // aquest: és un altre equip, com al rànquing)
  const inComp = (x, src) => x.teams.some(t => t.sourceTeamId === src && sameGroup(t, ct) && x.entries.some(e => e.teamId === t.id));
  const apart = src => !inComp(c, src) && !(ct.sourceTeamId && all.some(x => inComp(x, src) && inComp(x, ct.sourceTeamId)));
  for (const p of prevs) {
    // (pel nom només si un dels dos no és enllaçat a la fitxa o l'equip d'abans ja no hi era, com fa el rànquing)
    const pt = (ct.sourceTeamId && p.teams.find(t => t.sourceTeamId === ct.sourceTeamId && sameGroup(t, ct)))
      || p.teams.find(t => sameGroup(t, ct) && norm(t.name) === norm(ct.name) && (t.clubId || null) === (ct.clubId || null)
        && (!t.sourceTeamId || (apart(t.sourceTeamId) && (!ct.sourceTeamId || teamGoneBy(t.sourceTeamId, c)))));
    if (!pt) continue;
    const before = new Set(p.entries.filter(e => e.teamId === pt.id).map(e => e.gymnastId).filter(Boolean));
    if (!before.size) continue;
    const added = [...now].filter(id => !before.has(id)), removed = [...before].filter(id => !now.has(id));
    return added.length || removed.length ? { comp: p, added, removed } : null;
  }
  return null;
}
function htmlTeams(c, g, print = false) {
  const { apps, rows: all } = Engine.teamRanking(c, g);
  if (!all.length) return `<p class="muted">No hi ha equips en aquest grup.</p>`;

  if (!rows.length) return cancelledNote(c, cancelled);
  const head = `<tr><th class="num">Pos.</th><th>Equip / esportista</th><th class="hide-ph">Entitat</th>${apps.map(a => `<th class="num">${icon(a)} <span class="hide-ph">${h(a.name)}</span></th>`).join('')}<th class="num total">Total</th></tr>`;
  const body = rows.map(r => {
