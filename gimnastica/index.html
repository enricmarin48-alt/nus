<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d3f7a">
<meta name="description" content="Notes i classificacions de gimnàstica artística (individual, per aparells i per equips). Funciona sense internet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d3f7a'/%3E%3Crect x='10' y='24' width='44' height='7' rx='3' fill='white'/%3E%3Cpath d='M20 31l-3 20M44 31l3 20' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='13' r='6' fill='%23ffc94d'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>NotesGim · Gimnàstica artística</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f3f5f9; --panel:#fff; --ink:#1a2233; --muted:#667085; --line:#dde2ea; --line2:#eef1f5;
    --pri:#1d3f7a; --pri2:#2c5cb0; --pri-soft:#e6eefb; --pri-ink:#fff;
    --ok:#1e7b3a; --ok-soft:#e5f5ea; --warn:#a15c00; --warn-soft:#fff3dc; --bad:#c0262d; --bad-soft:#fdeaea;
    --gold:#fff1bf; --silver:#eceff4; --bronze:#f7e0cc;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--pri2)}
  h1{font-size:22px;margin:0}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:15px;margin:0}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .center{text-align:center}
  .nowrap{white-space:nowrap}
  .hidden{display:none !important}

  /* ═══ capçalera de l'app */
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:8px 18px;background:var(--pri);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:800;font-size:17px;letter-spacing:.02em}
  .brand svg{width:28px;height:28px}
  header.top nav{display:flex;gap:4px;flex-wrap:wrap}
  header.top nav a{color:#dbe6fb;text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600}
  header.top nav a:hover{background:rgba(255,255,255,.1)}
  header.top nav a.on{background:#fff;color:var(--pri)}
  .savestate{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:#dbe6fb}
  .savestate button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
  .savestate button.alert{background:#ffc94d;color:#3a2a00;border-color:#ffc94d;font-weight:700}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fd38a;margin-right:5px}
  .dot.busy{background:#ffc94d}.dot.err{background:#ff6b6b}

  main{max-width:1280px;margin:0 auto;padding:20px 18px 80px}
  .page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .grow{flex:1;min-width:180px}
  .toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  /* ═══ botons i controls */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
    padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
  .btn:hover{border-color:#b9c3d3}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--pri2);border-color:var(--pri2);color:#fff}
  .btn.primary:hover{background:var(--pri)}
  .btn.danger{color:var(--bad);border-color:#f1c1c3}
  .btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--line2)}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:6px;color:var(--muted);font-size:15px;line-height:1}
  .icon-btn:hover{background:var(--line2);color:var(--ink)}
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid #9bb8ec;outline-offset:0;border-color:#9bb8ec}
  textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
  label.f > span{color:var(--muted);font-weight:600}
  label.chk{display:flex;gap:7px;align-items:center;cursor:pointer;padding:3px 0}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
  fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:0 0 12px}
  legend{font-weight:700;padding:0 6px}

  /* ═══ targetes, taules, pastilles */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .card-head .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .comp-card h3{font-size:16px;margin-bottom:4px}
  .comp-card .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .comp-card .stats{display:flex;gap:14px;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
  .comp-card .stats b{font-size:16px;display:block}
  .comp-card .actions{display:flex;gap:6px;flex-wrap:wrap}

  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
  table.tbl{border-collapse:collapse;width:100%;background:#fff}
  .tbl th,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
  .tbl thead th{background:#f7f9fc;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
    position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
  .tbl th.grp{text-align:center;border-left:1px solid var(--line)}
  .tbl td.sep,.tbl th.sep{border-left:1px solid var(--line)}
  .tbl tbody tr:hover{background:#fafbfe}
  .tbl tr.gold td{background:var(--gold)} .tbl tr.silver td{background:var(--silver)} .tbl tr.bronze td{background:var(--bronze)}
  .tbl tr.np td{color:var(--muted)}
  .tbl tr.team-row td{border-top:2px solid var(--line);font-weight:700}
  .tbl tr.member td{font-size:13px;color:#3d475c;border-bottom-color:transparent}
  .tbl tr.member td:first-child{border-left:3px solid var(--pri-soft)}
  .tbl td.pos{font-weight:800;width:44px}
  .tbl td.total{font-weight:800}
  .tbl .disc{color:#9aa3b5;text-decoration:line-through}
  .tbl .cnt{font-weight:700}
  .empty{padding:34px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .pill.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
  .pill .n{font-size:11px;opacity:.75}
  .pill svg{width:16px;height:16px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--muted)}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.bad{background:var(--bad-soft);color:var(--bad)}
  .badge.pri{background:var(--pri-soft);color:var(--pri)}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;background:#fff;font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .note{padding:10px 12px;border-radius:8px;background:var(--pri-soft);color:#1c3260;margin-bottom:12px;font-size:13px}
  .note.warn{background:var(--warn-soft);color:#6b3e00}
  .note.bad{background:var(--bad-soft);color:#7d1419}
  .steps{margin:0;padding-left:20px}.steps li{margin:4px 0}

  /* ═══ pestanyes de competició */
  .comp-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
  .comp-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .back{font-size:13px;text-decoration:none;color:var(--muted)}
  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tabs a{padding:9px 16px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .tabs a.on{color:var(--pri);border-bottom-color:var(--pri2)}
  .tabs a .badge{margin-left:4px}

  /* ═══ graella de notes */
  input.sc{width:74px;text-align:right;font-variant-numeric:tabular-nums;padding:5px 7px;border-radius:6px}
  input.sc.sm{width:58px}
  input.sc.invalid{border-color:var(--bad);background:var(--bad-soft);outline-color:#f0a3a6}
  input.sc.high{border-color:#e2a33b;background:var(--warn-soft)}
  input.sc:disabled{background:#f6f7f9;color:#555}
  input.bib{width:62px;text-align:right}
  td.out{color:#26324a;font-weight:700}
  .progress{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .ico{width:18px;height:18px;vertical-align:-4px;display:inline-block}
  .ico svg{width:100%;height:100%}

  /* ═══ diàlegs i avisos */
  dialog{border:none;border-radius:14px;padding:0;max-width:min(680px,calc(100vw - 24px));width:100%;
    box-shadow:0 20px 60px rgba(10,20,40,.35)}
  dialog.wide{max-width:min(1000px,calc(100vw - 24px))}
  dialog::backdrop{background:rgba(15,25,45,.45)}
  dialog .dlg{padding:18px 20px;max-height:calc(100vh - 60px);overflow:auto}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .dlg-actions .left{margin-right:auto}
  #confirm .dlg-actions{flex-direction:row-reverse;justify-content:flex-start}
  .pick-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .pick-list label{display:flex;gap:9px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
  .pick-list label:hover{background:#f7f9fc}
  .pick-list label .muted{margin-left:auto;font-size:12px;text-align:right}
  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(420px,calc(100vw - 32px))}
  .toast{background:#1d2738;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;font-size:13px}
  .toast.bad{background:#8e1c22}.toast.ok{background:#1f4f30}
  .toast button{margin-left:auto;background:#fff;color:#1d2738;border:none;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer}
  .logo-prev{height:64px;max-width:160px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px}
  .list-ed{display:flex;flex-direction:column;gap:6px;max-width:420px}
  .list-ed .row{display:flex;gap:6px;align-items:center}
  .list-ed .row input{flex:1}

  /* ═══ impressió */
  #print{display:none}
  @page{size:A4 portrait;margin:11mm}
  @page land{size:A4 landscape;margin:10mm}
  @media print{
    html,body{background:#fff}
    body > *:not(#print){display:none !important}
    #print{display:block;color:#000;font-size:11pt}
    .sheet{break-after:page;page-break-after:always}
    .sheet:last-child{break-after:auto;page-break-after:auto}
    .sheet.landscape{page:land}
  }
  .sheet .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .sheet .ph-logo{width:90px;min-height:10px;display:flex;justify-content:center}
  .sheet .ph-logo img{max-height:80px;max-width:90px;object-fit:contain}
  .sheet .ph-text{flex:1;text-align:center;line-height:1.3}
  .sheet .ph-org{font-weight:800;font-size:13pt}
  .sheet .ph-name{font-weight:800;text-transform:uppercase}
  .sheet h2{text-align:center;font-size:14pt;margin:10px 0 2px;text-transform:uppercase}
  .sheet .sub{text-align:center;font-weight:700;margin-bottom:10px;text-transform:uppercase}
  .sheet table{width:100%;border-collapse:collapse;font-size:10pt}
  .sheet th,.sheet td{border:1px solid #777;padding:3px 6px}
  .sheet th{background:#e3e8f0;font-size:9pt;text-transform:uppercase}
  .sheet tr.gold td{background:#fff1bf}.sheet tr.silver td{background:#eceff4}.sheet tr.bronze td{background:#f7e0cc}
  .sheet tr.team-row td{font-weight:700;background:#f2f4f8}
  .sheet tr.team-row.gold td{background:#fff1bf}.sheet tr.team-row.silver td{background:#eceff4}.sheet tr.team-row.bronze td{background:#f7e0cc}
  .sheet tr.member td{font-size:9pt}
  .sheet .disc{color:#888;text-decoration:line-through}
  .sheet .judge td{height:26px}
  .sheet .sign{margin-top:26px;display:flex;justify-content:space-between;gap:30px}
  .sheet .foot{margin-top:10px;font-size:8pt;color:#555}
  .sheet .ico{width:14px;height:14px;vertical-align:-2px}
  .sheet h3{margin:14px 0 6px;font-size:11pt;text-transform:uppercase}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/competicions" aria-label="NotesGim, inici">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#fff"/><rect x="10" y="24" width="44" height="7" rx="3" fill="#1d3f7a"/><path d="M20 31l-3 20M44 31l3 20" stroke="#1d3f7a" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="13" r="6" fill="#e9a400"/></svg>
    NotesGim
  </a>
  <nav>
    <a href="#/competicions" data-nav="competicions">Competicions</a>
    <a href="#/gimnastes" data-nav="gimnastes">Gimnastes</a>
    <a href="#/equips" data-nav="equips">Equips</a>
    <a href="#/entitats" data-nav="entitats">Entitats</a>
    <a href="#/configuracio" data-nav="configuracio">Configuració</a>
  </nav>
  <div class="savestate" id="savestate"></div>
</header>
<main id="main"></main>
<div id="print"></div>
<dialog id="dlg"></dialog>
<dialog id="confirm"></dialog>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="filepick" class="hidden">

<script>
"use strict";
/* ═══════════════════════════════════════════ ENGINE-START
   Motor de càlcul: sense DOM, sense dades globals. Tot el que entra i surt són
   objectes simples, i les notes es treballen en MIL·LÈSIMES ENTERES (8,275 → 8275)
   perquè les sumes no arrosseguin errors de coma flotant. Els tests
   (tests/engine.test.mjs) extreuen aquest bloc i el proven sol. */
const Engine = (() => {
  const M = 1000;
  const coll = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'ca', { sensitivity: 'base', numeric: true });
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

  // valor guardat (número en unitats) → mil·lèsimes enteres, o null
  function toM(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    return Number.isFinite(n) ? Math.round(n * M) : null;
  }

  // el que escriu l'usuari → número (accepta coma o punt) · '' → null · brossa → NaN
  function parseScore(input) {
    if (input === null || input === undefined) return null;
    const s = String(input).replace(/\s+/g, '').replace(',', '.');
    if (s === '') return null;
    if (!/^(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
    return Math.round(Number(s) * M) / M;
  }

  // mil·lèsimes → "8,25" / "8,275" (mínim 2 decimals, màxim 3, sense perdre precisió)
  function fmt(m) {
    if (m === null || m === undefined || !Number.isFinite(m)) return '';
    const a = Math.abs(Math.round(m));
    let frac = String(a % M).padStart(3, '0');
    if (frac.endsWith('0')) frac = frac.slice(0, 2);
    return (m < 0 ? '-' : '') + Math.floor(a / M) + ',' + frac;
  }

  // cfg pot ser la competició sencera o només el mode ('simple' | 'detailed')
  const modeOf = cfg => (cfg && typeof cfg === 'object') ? cfg.scoring : cfg;
  const minOf = cfg => (cfg && typeof cfg === 'object') ? (toM(cfg.minScore) || 0) : 0;

  // nota d'un intent. Mode 'simple': la nota tal qual. Mode 'detailed': D + E − penalització.
  // Si hi ha nota mínima (p. ex. 3), qui fa l'exercici no en treu menys; un 0 vol dir que no l'ha fet.
  function attemptValue(att, cfg) {
    if (!att) return null;
    let v;
    if (modeOf(cfg) === 'detailed') {
      const d = toM(att.d), e = toM(att.e), p = toM(att.p);
      v = (d === null && e === null) ? toM(att.v) : Math.max(0, (d || 0) + (e || 0) - (p || 0));
    } else v = toM(att.v);
    const min = minOf(cfg);
    return (v !== null && v > 0 && v < min) ? min : v;
  }

  // nota d'un aparell (amb 1 o més intents i la regla: millor / mitjana / suma)
  function appResult(entry, app, cfg) {
    const n = Math.max(1, app.attempts || 1);
    const atts = (entry && entry.scores && entry.scores[app.id]) || [];
    const attempts = [];
    for (let i = 0; i < n; i++) attempts.push(attemptValue(atts[i], cfg));
    const got = attempts.filter(v => v !== null);
    let value = null;
    if (got.length) {
      if (n === 1) value = got[0];
      else if (app.rule === 'sum') value = got.reduce((a, b) => a + b, 0);
      else if (app.rule === 'avg') value = Math.round(got.reduce((a, b) => a + b, 0) / got.length);
      else value = Math.max(...got);
    }
    return { value, attempts, complete: got.length === n };
  }
  const appScore = (entry, app, cfg) => appResult(entry, app, cfg).value;

  // D i E de la nota que compta (per desempatar com la FIG: primer E, després D). Només en mode detallat.
  function appDE(entry, app, cfg) {
    if (modeOf(cfg) !== 'detailed') return { d: null, e: null };
    const n = Math.max(1, app.attempts || 1);
    const atts = ((entry && entry.scores && entry.scores[app.id]) || []).slice(0, n);
    const done = atts.map(a => a || {}).map(a => ({ v: attemptValue(a, cfg), d: toM(a.d), e: toM(a.e) })).filter(x => x.v !== null);
    if (!done.length) return { d: null, e: null };
    if (n === 1 || app.rule === 'best' || !app.rule) { const b = done.reduce((p, x) => (x.v > p.v ? x : p)); return { d: b.d, e: b.e }; }
    const sum = k => done.reduce((t, x) => t + (x[k] || 0), 0);
    if (app.rule === 'sum') return { d: sum('d'), e: sum('e') };
    return { d: Math.round(sum('d') / done.length), e: Math.round(sum('e') / done.length) };
  }

  const enabledApps = comp => (comp.apparatus || []).filter(a => a.enabled);
  const totalApps = comp => enabledApps(comp).filter(a => a.inTotal);
  const teamApps = comp => enabledApps(comp).filter(a => a.inTeam);

  // suma de la general individual d'una inscripció (null si no té cap nota)
  function entryTotal(comp, entry) {
    let t = 0, n = 0;
    for (const a of totalApps(comp)) { const v = appScore(entry, a, comp); if (v !== null) { t += v; n++; } }
    return n ? t : null;
  }

  const groupKey = (category, level) => String(category) + '||' + String(level);
  const idx = (list, v) => { const i = (list || []).indexOf(v); return i < 0 ? 1e6 : i; };

  // grups = categoria + nivell (cada grup té la seva classificació)
  function groupsOf(comp, settings) {
    const map = new Map();
    const add = (category, level) => {
      const key = groupKey(category, level);
      if (!map.has(key)) map.set(key, { key, category, level, entries: [] });
      return map.get(key);
    };
    for (const e of comp.entries || []) add(e.category, e.level).entries.push(e);
    for (const t of comp.teams || []) add(t.category, t.level);
    const cats = settings && settings.categories, levels = settings && settings.levels;
    return [...map.values()].sort((a, b) =>
      idx(cats, a.category) - idx(cats, b.category) || coll(a.category, b.category) ||
      idx(levels, a.level) - idx(levels, b.level) || coll(a.level, b.level));
  }

  // compara dues llistes de notes de més gran a més petita: la primera diferència mana
  function cmpDesc(aVals, bVals) {
    const A = aVals.filter(v => v !== null).sort((x, y) => y - x);
    const B = bVals.filter(v => v !== null).sort((x, y) => y - x);
    for (let i = 0; i < Math.max(A.length, B.length); i++) {
      const x = i < A.length ? A[i] : -1, y = i < B.length ? B[i] : -1;
      if (x !== y) return y - x;
    }
    return 0;
  }

  // posa posicions. Empat (mateixa nota i sense desempat) = mateixa posició: 1, 1, 3…
  function assignRanks(items, value, tie) {
    const ranked = items.filter(x => value(x) !== null);
    const rest = items.filter(x => value(x) === null);
    ranked.sort((a, b) => (value(b) - value(a)) || (tie ? tie(a, b) : 0) || (a._order - b._order));
    for (let i = 0; i < ranked.length; i++) {
      const r = ranked[i], p = ranked[i - 1];
      r.rank = (p && value(p) === value(r) && (!tie || tie(p, r) === 0)) ? p.rank : i + 1;
    }
    ranked.forEach((r, i) => {
      r.tied = (i > 0 && ranked[i - 1].rank === r.rank) || (i + 1 < ranked.length && ranked[i + 1].rank === r.rank);
    });
    rest.sort((a, b) => ((a.np ? 1 : 0) - (b.np ? 1 : 0)) || (a._order - b._order));
    rest.forEach(r => { r.rank = null; r.tied = false; });
    return ranked.concat(rest);
  }

  function withOrder(rows) {
    [...rows].sort((a, b) => coll(a.name, b.name)).forEach((r, i) => { r._order = i; });
    return rows;
  }

  // CLASSIFICACIÓ GENERAL INDIVIDUAL: suma dels aparells que compten per al total
  function individualRanking(comp, group, opts = {}) {
    const apps = totalApps(comp);
    const nameOf = opts.nameOf || (() => '');
    const rows = withOrder(group.entries.map(e => {
      const np = e.status === 'np';
      const scores = {}; let total = 0, n = 0, eSum = 0, dSum = 0;
      for (const a of apps) {
        const v = appScore(e, a, comp);
        scores[a.id] = v;
        if (v !== null) { total += v; n++; const de = appDE(e, a, comp); eSum += de.e || 0; dSum += de.d || 0; }
      }
      return { entry: e, name: nameOf(e), scores, total: (n && !np) ? total : null,
        count: n, complete: n === apps.length, np, eSum, dSum };
    }));
    let tie = null;
    if (comp.tieInd === 'bestApp') tie = (a, b) => cmpDesc(Object.values(a.scores), Object.values(b.scores));
    if (comp.tieInd === 'fig') tie = (a, b) => (b.eSum - a.eSum) || (b.dSum - a.dSum);
    return { apps, rows: assignRanks(rows, r => r.total, tie) };
  }

  // CLASSIFICACIÓ D'UN APARELL
  function apparatusRanking(comp, group, app, opts = {}) {
    const nameOf = opts.nameOf || (() => '');
    const rows = withOrder(group.entries.map(e => {
      const np = e.status === 'np';
      const r = appResult(e, app, comp);
      const de = appDE(e, app, comp);
      return { entry: e, name: nameOf(e), value: np ? null : r.value, attempts: r.attempts, complete: r.complete, np, e: de.e || 0, d: de.d || 0 };
    }));
    let tie = null;
    if (comp.tieApp === 'bestAttempt' && (app.attempts || 1) > 1) tie = (a, b) => cmpDesc(a.attempts, b.attempts);
    if (comp.tieApp === 'fig') tie = (a, b) => (b.e - a.e) || (b.d - a.d);
    return assignRanks(rows, r => r.value, tie);
  }

  // CLASSIFICACIÓ PER EQUIPS: a cada aparell només compten les N millors notes (per defecte 3)
  function teamRanking(comp, group, opts = {}) {
    const apps = teamApps(comp);
    const N = comp.teamCount || 3, min = comp.teamMin || 3, max = comp.teamMax || 6;
    const teams = (comp.teams || []).filter(t => t.category === group.category && t.level === group.level);
    const rows = withOrder(teams.map(t => {
      const members = (comp.entries || []).filter(e => e.teamId === t.id);
      const perApp = {}, counted = {};
      let total = 0, any = false;
      const allCounted = [];
      for (const a of apps) {
        const vals = members
          .map(e => ({ id: e.id, v: e.status === 'np' ? null : appScore(e, a, comp) }))
          .filter(x => x.v !== null)
          .sort((x, y) => y.v - x.v);
        const top = vals.slice(0, N);
        top.forEach(x => { (counted[x.id] = counted[x.id] || {})[a.id] = true; allCounted.push(x.v); });
        const sum = top.reduce((s, x) => s + x.v, 0);
        perApp[a.id] = { value: top.length ? sum : null, used: top.length, full: top.length >= N };
        if (top.length) { total += sum; any = true; }
      }
      const size = members.length;
      const eligible = size >= min;
      return { team: t, name: t.name, members, perApp, counted, allCounted,
        total: (any && eligible) ? total : null, rawTotal: any ? total : null,
        complete: apps.every(a => perApp[a.id].full), size, eligible, oversize: size > max };
    }));
    let tie = null;
    if (comp.tieTeam === 'bestApp') tie = (a, b) => cmpDesc(apps.map(x => a.perApp[x.id].value), apps.map(x => b.perApp[x.id].value));
    if (comp.tieTeam === 'bestScore') tie = (a, b) => cmpDesc(a.allCounted, b.allCounted);
    return { apps, rows: assignRanks(rows, r => r.total, tie) };
  }

  // curs escolar a partir d'una data: setembre-agost
  function seasonFor(dateStr) {
    const m = /^(\d{4})-(\d{2})/.exec(dateStr || '');
    if (!m) return '';
    const y = +m[1], mo = +m[2];
    return mo >= 9 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
  }

  return { M, coll, norm, toM, parseScore, fmt, attemptValue, appResult, appScore, appDE, enabledApps, totalApps,
    teamApps, entryTotal, groupKey, groupsOf, cmpDesc, assignRanks, individualRanking, apparatusRanking,
    teamRanking, seasonFor };
})();
/* ═══════════════════════════════════════════ ENGINE-END */
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════ utilitats */
const APP_VERSION = '1.0.0';
const LS_KEY = 'notesgim.db';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const { coll, norm, fmt } = Engine;
const range = n => Array.from({ length: n }, (_, i) => i);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ''); };
const ordinal = n => ({ 1: '1r', 2: '2n', 3: '3r', 4: '4t' }[n] || n + 'è');

const ICONS = {
  salt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 11V9.5A2.5 2.5 0 0 1 9.5 7H20"/><path d="M13 7v11M8 18h10"/></svg>',
  barra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9h18" stroke-width="3"/><path d="M7 10.5 6 19M17 10.5l1 8.5"/></svg>',
  terra: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="currentColor"/></svg>',
  mini: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 13 20 8"/><path d="M5 13v6M19 8.5V19M3 19h18"/></svg>',
  paral: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h8M12 10h8"/><path d="M6 6v13M10 6v13M14 10v9M18 10v9"/></svg>',
  altre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="7"/></svg>',
};
const icon = a => `<span class="ico" aria-hidden="true">${ICONS[a.icon] || ICONS.altre}</span>`;

const DEFAULT_APPS = () => [
  { id: 'salt', name: 'Salt', icon: 'salt', enabled: true, inTotal: true, inTeam: true, attempts: 1, rule: 'best' },
  { id: 'barra', name: 'Barra', icon: 'barra', enabled: true, inTotal: true, inTeam: true, attempts: 1, rule: 'best' },
  { id: 'terra', name: 'Terra', icon: 'terra', enabled: true, inTotal: true, inTeam: true, attempts: 1, rule: 'best' },
  { id: 'mini', name: 'Minitramp', icon: 'mini', enabled: false, inTotal: false, inTeam: false, attempts: 1, rule: 'best' },
  { id: 'paral', name: 'Paral·leles', icon: 'paral', enabled: false, inTotal: true, inTeam: true, attempts: 1, rule: 'best' },
];
const COMP_DEFAULTS = () => ({
  scoring: 'simple', maxScore: 20, minScore: 0, apparatus: DEFAULT_APPS(),
  teamCount: 3, teamMin: 3, teamMax: 6, tieInd: 'shared', tieTeam: 'shared', tieApp: 'shared',
});
const COMP_KEYS = Object.keys(COMP_DEFAULTS());

function defaultDb() {
  return {
    app: 'notesgim', version: 1,
    settings: {
      org: 'CONSELL ESPORTIU DEL SEGRIÀ', line2: 'JOCS ESPORTIUS ESCOLARS DE CATALUNYA',
      compName: 'Fase comarcal de gim. artística', place: 'Lleida', suffix: 'FEM',
      logoL: null, logoR: null,
      categories: ['Prebenjamí', 'Benjamí', 'Aleví', 'Infantil', 'Cadet', 'Juvenil'],
      levels: ['A', 'B', 'F'],
      compDefaults: COMP_DEFAULTS(),
    },
    clubs: [], gymnasts: [], teams: [], competitions: [],
    meta: { created: new Date().toISOString(), updated: null, lastBackup: null },
  };
}

// accepta dades velles o importades i hi posa tot el que falti
function migrate(d) {
  const base = defaultDb();
  if (!d || typeof d !== 'object') return base;
  d.app = 'notesgim'; d.version = 1;
  d.settings = Object.assign({}, base.settings, d.settings || {});
  d.settings.compDefaults = Object.assign(COMP_DEFAULTS(), d.settings.compDefaults || {});
  for (const k of ['categories', 'levels']) if (!Array.isArray(d.settings[k])) d.settings[k] = base.settings[k];
  for (const k of ['clubs', 'gymnasts', 'teams', 'competitions']) if (!Array.isArray(d[k])) d[k] = [];
  d.meta = Object.assign({}, base.meta, d.meta || {});
  for (const t of d.teams) if (!Array.isArray(t.memberIds)) t.memberIds = [];
  for (const c of d.competitions) normalizeComp(c, d.settings.compDefaults);
  return d;
}
function normalizeComp(c, defs) {
  const D = Object.assign(COMP_DEFAULTS(), defs || {});
  for (const k of COMP_KEYS) if (c[k] === undefined || c[k] === null) c[k] = JSON.parse(JSON.stringify(D[k]));
  if (!Array.isArray(c.apparatus) || !c.apparatus.length) c.apparatus = DEFAULT_APPS();
  if (!Array.isArray(c.entries)) c.entries = [];
  if (!Array.isArray(c.teams)) c.teams = [];
  for (const e of c.entries) { if (!e.scores || typeof e.scores !== 'object') e.scores = {}; if (!e.status) e.status = ''; }
  return c;
}

/* ═══════════════════════════════════════════ desar
   1) Sempre: localStorage del navegador (a cada canvi).
   2) Si l'usuari vincula un fitxer (Chrome/Edge): també s'hi escriu a cada canvi.
   3) Sempre disponible: descarregar una còpia .json i restaurar-la. */
let db = null;
let saveTimer = null, saveError = false;
let fileHandle = null, fileState = 'none'; // none | ok | perm | err
let fileQueue = Promise.resolve(), fileDirty = false;

function loadDb() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    db = migrate(raw ? JSON.parse(raw) : null);
  } catch (e) {
    console.error(e);
    db = defaultDb();
    saveError = true;
  }
}
function commit() {
  db.meta.updated = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
  renderSaveState(true);
}
function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); saveError = false; }
  catch (e) { console.error(e); saveError = true; toast('No s’ha pogut desar al navegador. Descarrega una còpia de seguretat ara!', 'bad'); }
  if (fileHandle) queueFileWrite();
  renderSaveState(false);
}
addEventListener('pagehide', () => { if (saveTimer) flush(); });
addEventListener('beforeunload', () => { if (saveTimer) flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) flush(); });
// una altra pestanya ha desat: carreguem el que hi ha de nou
addEventListener('storage', e => {
  if (e.key !== LS_KEY || !e.newValue) return;
  try { db = migrate(JSON.parse(e.newValue)); render(); toast('Dades actualitzades des d’una altra finestra.'); } catch (_) {}
});

// IndexedDB mínima, només per recordar el fitxer vinculat entre sessions
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('notesgim', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const tx = rq.result.transaction('kv', mode); const st = tx.objectStore('kv');
      const r = fn(st);
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    };
  });
}
const idbGet = k => idb('readonly', st => st.get(k)).catch(() => null);
const idbSet = (k, v) => idb('readwrite', st => st.put(v, k)).catch(() => null);
const idbDel = k => idb('readwrite', st => st.delete(k)).catch(() => null);
const fsSupported = () => typeof window.showSaveFilePicker === 'function';

function queueFileWrite() {
  fileDirty = true;
  fileQueue = fileQueue.then(writeFileNow).catch(() => {});
}
async function writeFileNow() {
  if (!fileHandle || !fileDirty) return;
  try {
    const p = await fileHandle.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') { fileState = 'perm'; renderSaveState(false); return; }
    fileDirty = false;
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(db, null, 1));
    await w.close();
    fileState = 'ok';
  } catch (e) { console.error(e); fileState = 'err'; fileDirty = true; }
  renderSaveState(false);
}
async function linkFile() {
  if (!fsSupported()) { toast('Aquest navegador no pot desar directament a un fitxer. Fes servir «Descarrega còpia».', 'bad'); return; }
  try {
    const handle = await window.showSaveFilePicker({ suggestedName: 'notesgim-dades.json',
      types: [{ description: 'Dades de NotesGim', accept: { 'application/json': ['.json'] } }] });
    fileHandle = handle; await idbSet('fileHandle', handle);
    fileState = 'ok'; fileDirty = true; queueFileWrite(); await fileQueue;
    toast('A partir d’ara cada canvi també es desa a «' + handle.name + '».', 'ok');
    render();
  } catch (e) { if (e.name !== 'AbortError') toast('No s’ha pogut vincular el fitxer: ' + e.message, 'bad'); }
}
async function regrantFile() {
  if (!fileHandle) return;
  try {
    const p = await fileHandle.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') { fileState = 'ok'; queueFileWrite(); await fileQueue; toast('Fitxer reactivat.', 'ok'); }
  } catch (e) { toast('No s’ha pogut accedir al fitxer.', 'bad'); }
  renderSaveState(false);
}
async function unlinkFile() {
  fileHandle = null; fileState = 'none'; await idbDel('fileHandle'); render();
}
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const stamp = () => { const d = new Date(); return today() + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); };
function backupDownload() {
  db.meta.lastBackup = new Date().toISOString();
  flush();
  downloadBlob(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }), `notesgim-copia-${stamp()}.json`);
  toast('Còpia descarregada. Guarda-la en un lloc segur (USB, núvol…).', 'ok');
  render();
}
function restoreFromText(text, sourceName) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('Aquest fitxer no és una còpia de NotesGim vàlida.', 'bad'); return; }
  if (!data || typeof data !== 'object' || !Array.isArray(data.gymnasts) || !Array.isArray(data.competitions)) {
    toast('Aquest fitxer no és una còpia de NotesGim vàlida.', 'bad'); return;
  }
  const info = `${plural(data.gymnasts.length, 'gimnasta', 'gimnastes')}, ${plural(data.competitions.length, 'competició', 'competicions')}`;
  confirmBox(`Vols substituir totes les dades actuals per les de «${h(sourceName)}» (${info})?<br><br>Les dades que tens ara es perdran (pots desfer-ho just després).`,
    { ok: 'Substitueix', danger: true }).then(ok => {
    if (!ok) return;
    withUndo('Dades restaurades de «' + sourceName + '».', () => { db = migrate(data); });
  });
}
function restorePick() {
  const inp = $('#filepick');
  inp.accept = '.json,application/json'; inp.value = '';
  inp.onchange = async () => { const f = inp.files[0]; if (f) restoreFromText(await f.text(), f.name); };
  inp.click();
}

/* ═══════════════════════════════════════════ consultes */
const clubById = id => db.clubs.find(c => c.id === id);
const clubName = id => (clubById(id) || {}).name || '';
const gymById = id => db.gymnasts.find(g => g.id === id);
const gymName = g => g ? [g.name, g.surname].filter(Boolean).join(' ') : '(gimnasta esborrada)';
const entryName = e => gymName(gymById(e.gymnastId));
const compById = id => db.competitions.find(c => c.id === id);
const teamById = id => db.teams.find(t => t.id === id);
const curComp = () => compById(ui.compId);
const S = () => db.settings;
const catLabel = c => c + (S().suffix ? ' ' + S().suffix : '');
const groupLabel = g => `${g.category} · Nivell ${g.level}`;
const groupLabelPrint = g => `${catLabel(g.category)} · Nivell ${g.level}`;
const groupsOf = c => Engine.groupsOf(c, S());
const sortEntries = list => [...list].sort((a, b) => (a.bib || 1e9) - (b.bib || 1e9) || coll(entryName(a), entryName(b)));
function ensureClub(name) {
  const n = String(name || '').trim();
  if (!n) return null;
  let c = db.clubs.find(x => norm(x.name) === norm(n));
  if (!c) { c = { id: uid(), name: n }; db.clubs.push(c); }
  return c.id;
}
function matchFromList(list, value) {
  const v = norm(value);
  if (!v) return null;
  return list.find(x => norm(x) === v) || null;
}
function nextBib(c) { return c.entries.reduce((m, e) => Math.max(m, +e.bib || 0), 0) + 1; }
function compTeamsOf(c, cat, level) { return c.teams.filter(t => t.category === cat && t.level === level); }

/* ═══════════════════════════════════════════ estat de pantalla i rutes */
const ui = { view: 'competicions', compId: null, tab: null, group: null, app: 'all', clsGroup: null, clsType: 'general',
  gSearch: '', gClub: '', gCat: '', gLevel: '', gArchived: false, tCat: '', import: null };

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  ui.view = parts[0] || 'competicions';
  if (ui.view === 'competicio') {
    if (ui.compId !== parts[1]) { ui.group = null; ui.app = 'all'; ui.clsGroup = null; }
    ui.compId = parts[1]; ui.tab = parts[2] || null;
  }
}
addEventListener('hashchange', () => { route(); render(); window.scrollTo(0, 0); });
const go = hash => { if (location.hash === hash) render(); else location.hash = hash; };

/* ═══════════════════════════════════════════ avisos, diàlegs, desfer */
function toast(msg, type = '', opts = {}) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${h(msg)}</span>${opts.action ? `<button>${h(opts.action)}</button>` : ''}`;
  if (opts.action) el.querySelector('button').onclick = () => { el.remove(); opts.onAction(); };
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > 4) box.firstElementChild.remove();
  setTimeout(() => el.remove(), opts.action ? 9000 : type === 'bad' ? 7000 : 3800);
}
function openDialog(html, { wide = false } = {}) {
  const d = $('#dlg');
  if (d.open) d.close();
  d.className = wide ? 'wide' : '';
  d.innerHTML = `<div class="dlg">${html}</div>`;
  d.showModal();
  const first = d.querySelector('[autofocus]') || d.querySelector('input:not([type=checkbox]):not([type=hidden]),select,textarea');
  if (first) first.focus();
}
const closeDialog = () => { const d = $('#dlg'); if (d.open) d.close(); };
function confirmBox(msg, { ok = 'D’acord', danger = false, typed = null } = {}) {
  return new Promise(res => {
    const d = $('#confirm');
    d.innerHTML = `<form method="dialog" class="dlg"><div>${msg}</div>
      ${typed ? `<p class="small muted">Escriu <b>${h(typed)}</b> per confirmar:</p><input type="text" name="typed" autocomplete="off" style="width:100%">` : ''}
      <div class="dlg-actions"><button value="ok" class="btn ${danger ? 'danger solid' : 'primary'}">${h(ok)}</button><button value="no" class="btn">Cancel·la</button></div></form>`;
    d.returnValue = '';
    d.onclose = () => {
      const typedOk = !typed || norm(d.querySelector('input[name=typed]').value) === norm(typed);
      res(d.returnValue === 'ok' && typedOk);
    };
    d.showModal();
    const inp = d.querySelector('input'); if (inp) inp.focus();
  });
}

function backupDue() {

function compStats(c) {
  const apps = Engine.enabledApps(c);
  const active = c.entries.filter(e => e.status !== 'np');
  let done = 0;
  for (const e of active) for (const a of apps) if (Engine.appScore(e, a, c) !== null) done++;
  return { entries: c.entries.length, teams: c.teams.length, done, total: active.length * apps.length };
}

function newEntry(c, g, cat, level) {
  return { id: uid(), gymnastId: g.id, category: cat ?? g.category ?? '', level: level ?? g.level ?? '', clubId: g.clubId || null,
    teamId: null, bib: nextBib(c), status: '', scores: {} };
}
const hasScores = e => Object.values(e.scores || {}).some(arr => (arr || []).some(a => a && ['v', 'd', 'e', 'p'].some(k => a[k] !== undefined && a[k] !== null)));
// inscriu un equip de la llista general: crea l'equip a la competició i hi apunta les seves gimnastes
function enrollTeam(c, team) {
  let ct = c.teams.find(t => t.sourceTeamId === team.id);
  if (!ct) {
    ct = { id: uid(), name: team.name, clubId: team.clubId || null, category: team.category, level: team.level, sourceTeamId: team.id };
    c.teams.push(ct);
  }
  const problems = [];
  for (const gid of team.memberIds) {
    const g = gymById(gid);
    if (!g) continue;
    let e = c.entries.find(x => x.gymnastId === gid);
    if (!e) { e = newEntry(c, g, ct.category, ct.level); c.entries.push(e); }
    if (e.category !== ct.category || e.level !== ct.level) {
      if (hasScores(e)) { problems.push(gymName(g)); continue; }
      e.category = ct.category; e.level = ct.level;
    }
    e.teamId = ct.id;
  }
  return problems;
}
// després d'inscriure gimnastes soltes: si el seu equip ja hi és, les hi posem
function autoAssignTeams(c, entries) {
  for (const e of entries) {
    if (e.teamId) continue;
    const t = db.teams.find(t => t.memberIds.includes(e.gymnastId) && t.category === e.category && t.level === e.level);
    if (!t) continue;
    const ct = c.teams.find(x => x.sourceTeamId === t.id);
    if (ct) e.teamId = ct.id;
  }
}

function scoreInput(c, e, a, i, f, val, cls = '') {

const att = (e, a, i) => ((e.scores || {})[a.id] || [])[i] || {};
function notesAllTable(c, g, apps) {

      <td class="num sep out total" data-out="tot:${e.id}">${fmt(Engine.entryTotal(c, e))}</td></tr>`;

  const note = (det || apps.some(a => (a.attempts || 1) > 1))

}
function notesAppTable(c, g, a) {
  const det = c.scoring === 'detailed';
  const n = Math.max(1, a.attempts || 1);
  const fields = det ? [['d', 'D'], ['e', 'E'], ['p', 'Pen.']] : [['v', 'Nota']];
  const ruleLbl = { best: 'la millor', avg: 'la mitjana', sum: 'la suma' }[a.rule] || 'la millor';
  const perAtt = fields.length + (det ? 1 : 0);
  const head1 = n > 1 ? `<tr><th colspan="4"></th>${range(n).map(i => `<th colspan="${perAtt}" class="grp">${ordinal(i + 1)} intent</th>`).join('')}<th class="grp">Final (${ruleLbl})</th></tr>` : '';
  const head2 = `<tr><th class="num">Dors.</th><th>Gimnasta</th><th>Entitat</th><th>Equip</th>
    ${range(n).map(() => fields.map((f, k) => `<th class="num ${k === 0 ? 'sep' : ''}">${f[1]}</th>`).join('') + (det ? '<th class="num">Nota</th>' : '')).join('')}
    ${n > 1 || det ? `<th class="num sep">${icon(a)} ${h(a.name)}</th>` : ''}</tr>`;
  const rows = sortEntries(g.entries).map(e => {

function setAttemptField(e, appId, i, f, val) {
  if (!e.scores || typeof e.scores !== 'object') e.scores = {};
  const arr = Array.isArray(e.scores[appId]) ? e.scores[appId] : (e.scores[appId] = []);
  while (arr.length <= i) arr.push({});
  const at = arr[i] || (arr[i] = {});
  if (val === null) delete at[f]; else at[f] = val;
  if (f !== 'v') {
    // mode detallat: guardem també la nota resultant, perquè si es passa a mode simple no es perdi
    const v = Engine.attemptValue({ d: at.d, e: at.e, p: at.p }, 'detailed');
    if (v === null) delete at.v; else at.v = v / 1000;
  }
}
function refreshScoreRow(c, e) {

  for (const a of Engine.enabledApps(c)) {
    const r = Engine.appResult(e, a, c);
    r.attempts.forEach((v, i) => set(`att:${e.id}:${a.id}:${i}`, fmt(v)));

/* ─── Importació des d'Excel (enganxar) */
const IMPORT_FIELDS = [['', '— no l’importis —'], ['name', 'Nom'], ['surname', 'Cognoms'], ['full', 'Nom i cognoms'], ['club', 'Entitat'],
  ['category', 'Categoria'], ['level', 'Nivell'], ['birth', 'Any / data de naixement'], ['team', 'Equip']];
function guessField(header) {
  const x = norm(header);
  if (!x) return '';
  if (/^(nom i cognoms|nom complet|esportista|gimnasta|alumne|alumna|nombre y apellidos|nombre completo)$/.test(x)) return 'full';
  if (/^(cognoms?|apellidos?)/.test(x)) return 'surname';
  if (/^(nom|nombre|name)$/.test(x)) return 'name';
  if (/(entitat|club|escola|centre|colegio|entidad)/.test(x)) return 'club';
  if (/^categori/.test(x)) return 'category';
  if (/^(nivell|nivel|level)/.test(x)) return 'level';
  if (/(naixement|nacimiento|^any$|^ano$|^año$|^data$|birth)/.test(x)) return 'birth';
  if (/^(equip|equipo|team)/.test(x)) return 'team';
  return '';
}
function splitRows(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim() !== '');
  if (!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : lines[0].includes(';') ? ';' : ',';
  return lines.map(l => {
    if (delim === '\t') return l.split('\t').map(s => s.trim());
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === delim) { out.push(cur.trim()); cur = ''; } else cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}
function importAnalyze(text) {
  const rows = splitRows(text);
  if (!rows.length) return null;
  const width = Math.max(...rows.map(r => r.length));
  const guessed = range(width).map(i => guessField(rows[0][i]));
  const hasHeader = guessed.filter(Boolean).length >= 1;
  const map = hasHeader ? guessed : ['name', 'surname', 'club', 'category', 'level', 'birth', 'team'].slice(0, width).concat(range(Math.max(0, width - 7)).map(() => ''));
  return { rows, width, hasHeader, map, defCat: '', defLevel: '' };
}
function importResolve(imp) {
  const data = imp.hasHeader ? imp.rows.slice(1) : imp.rows;
  const col = f => imp.map.indexOf(f);
  const get = (r, f) => { const i = col(f); return i >= 0 ? String(r[i] ?? '').trim() : ''; };
  const seen = new Set();
  return data.map(r => {
    let name = get(r, 'name'), surname = get(r, 'surname');
    const full = get(r, 'full');
    if (!name && full) {
      if (full.includes(',')) { const [s, n] = full.split(','); surname = surname || s.trim(); name = n.trim(); }
      else name = full;
    }
    const club = get(r, 'club');
    const catRaw = get(r, 'category') || imp.defCat, levelRaw = get(r, 'level') || imp.defLevel;
    const category = matchFromList(S().categories, catRaw) || catRaw;
    const level = matchFromList(S().levels, levelRaw) || levelRaw.toUpperCase();
    const by = (/(19|20)\d{2}/.exec(get(r, 'birth')) || [])[0] || '';
    const team = get(r, 'team');
    const key = norm(name + ' ' + surname) + '|' + norm(club);
    let status = 'new';
    if (!name) status = 'noname';
    else if (seen.has(key)) status = 'dupfile';
    else if (db.gymnasts.some(g => norm(gymName(g)) === norm(name + ' ' + surname) && norm(clubName(g.clubId)) === norm(club))) status = 'exists';
    seen.add(key);
    return { name, surname, club, category, level, birthYear: by, team, status,
      newCat: category && !S().categories.includes(category), newLevel: level && !S().levels.includes(level) };
  });
}
function importDialog() {
  const imp = ui.import;
  const preview = imp ? importResolve(imp) : [];

function teamPickList(v, showAll, teamId) {
  if (!v.category || !v.level) return `<p class="muted" style="padding:10px">Tria la categoria i el nivell per veure les gimnastes.</p>`;
  const list = db.gymnasts.filter(g => (!g.archived || v.memberIds.includes(g.id)) &&

    .sort((a, b) => coll(clubName(a.clubId), clubName(b.clubId)) || coll(gymName(a), gymName(b)));
  if (!list.length) return `<p class="muted" style="padding:10px">No hi ha gimnastes de ${h(v.category)} · nivell ${h(v.level)}${v.clubId && !showAll ? ' en aquesta entitat' : ''}. Revisa la categoria i el nivell de les gimnastes.</p>`;

    return `<label><input type="checkbox" name="m" value="${g.id}" ${v.memberIds.includes(g.id) ? 'checked' : ''} data-chg="teamCount"> ${h(gymName(g))}
      <span class="muted">${h(clubName(g.clubId))}${other ? ` · ara a «${h(other.name)}»` : ''}</span></label>`;
  }).join('');

// proposta automàtica: gimnastes de la mateixa entitat + categoria + nivell que no tenen equip
function proposeTeams() {
  const min = S().compDefaults.teamMin, max = S().compDefaults.teamMax;
  const taken = new Set(db.teams.flatMap(t => t.memberIds));
  const buckets = new Map();
  for (const g of db.gymnasts) {
    if (g.archived || taken.has(g.id) || !g.clubId || !g.category || !g.level) continue;
    const k = g.clubId + '||' + g.category + '||' + g.level;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(g);
  }
  const out = [];
  for (const list of buckets.values()) {
    if (list.length < min) continue;
    list.sort((a, b) => coll(gymName(a), gymName(b)));
    const k = Math.ceil(list.length / max);
    const base = Math.floor(list.length / k), extra = list.length % k;
    let p = 0;
    for (let i = 0; i < k; i++) {
      const size = base + (i < extra ? 1 : 0);
      const members = list.slice(p, p + size); p += size;
      const g0 = members[0];
      out.push({ name: `${clubName(g0.clubId)} ${g0.category} ${g0.level}${k > 1 ? ' ' + (i + 1) : ''}`, clubId: g0.clubId,
        category: g0.category, level: g0.level, memberIds: members.map(m => m.id) });
    }
  }
  return out;
}

function doPrint(c, types, keys) {

    if (types.includes('general') && g.entries.length) out.push(sheet(c, 'Classificació individual', g, htmlIndividual(c, g, true)));
    if (types.includes('apps') && g.entries.length) for (const a of Engine.enabledApps(c)) out.push(sheet(c, `Classificació · ${a.name}`, g, htmlOneApp(c, g, a, true)));
    if (types.includes('teams') && compTeamsOf(c, g.category, g.level).length) out.push(sheet(c, 'Classificació per equips', g,
      htmlTeams(c, g, true) + `<p class="small">A cada aparell compten les ${c.teamCount} millors notes de l’equip (les ratllades no compten).</p>`));
    if (types.includes('notes') && g.entries.length) out.push(notesSheet(c, g));
    if (types.includes('list')) out.push(listSheet(c, g));
    if (types.includes('judge') && g.entries.length) for (const a of Engine.enabledApps(c)) out.push(judgeSheet(c, g, a));
  }
  if (!out.length) { toast('No hi ha res per imprimir amb aquesta selecció.', 'bad'); return; }
  $('#print').innerHTML = out.join('');
  setTimeout(() => window.print(), 50);
}
addEventListener('afterprint', () => { $('#print').innerHTML = ''; });

      ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);

<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.00#"/></numFmts>
<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font><font><i/><strike/><sz val="11"/><color rgb="FF888888"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDE5F2"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF999999"/></left><right style="thin"><color rgb="FF999999"/></right><top style="thin"><color rgb="FF999999"/></top><bottom style="thin"><color rgb="FF999999"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="3" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/></cellXfs>

      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n, i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },

const num = m => m === null || m === undefined ? '' : { v: m / 1000, s: 'n' };
const bnum = m => m === null || m === undefined ? '' : { v: m / 1000, s: 'bn' };
function compWorkbook(c) {
  const sheets = [];
  for (const g of groupsOf(c)) {
    const rows = [];
    const H = s => ({ v: s, s: 'h' });
    rows.push([{ v: S().org, s: 'b' }], [c.name + ' · ' + fmtDate(c.date) + (c.place ? ' · ' + c.place : '')], [{ v: groupLabelPrint(g).toUpperCase(), s: 't' }], []);
    const allApps = Engine.enabledApps(c);
    // classificació individual
    const ind = Engine.individualRanking(c, g, { nameOf: entryName });
    rows.push([{ v: 'CLASSIFICACIÓ INDIVIDUAL', s: 't' }]);
    rows.push([H('Pos.'), H('Dorsal'), H('Esportista'), H('Entitat'), H('Equip'), ...ind.apps.map(a => H(a.name)), H('Nota final')]);
    for (const r of ind.rows) {
      const t = c.teams.find(x => x.id === r.entry.teamId);
      rows.push([r.rank ? r.rank : (r.np ? 'NP' : ''), +r.entry.bib || '', r.name, clubName(r.entry.clubId), t ? t.name : '', ...ind.apps.map(a => num(r.scores[a.id])), r.np ? 'NP' : bnum(r.total)]);
    }
    rows.push([]);
    // equips
    const tr = Engine.teamRanking(c, g);
    if (tr.rows.length) {
      rows.push([{ v: 'CLASSIFICACIÓ PER EQUIPS', s: 't' }], [{ v: `Compten les ${c.teamCount} millors notes de cada aparell (les ratllades no compten)`, s: 'm' }]);
      rows.push([H('Pos.'), '', H('Equip / esportista'), H('Entitat'), '', ...tr.apps.map(a => H(a.name)), H('Total')]);
      for (const r of tr.rows) {
        rows.push([r.rank ? r.rank : (r.eligible ? '' : 'NC'), '', { v: r.team.name, s: 'b' }, clubName(r.team.clubId), r.eligible ? '' : `només ${r.size} gimnastes`, ...tr.apps.map(a => bnum(r.perApp[a.id].value)), bnum(r.eligible ? r.total : r.rawTotal)]);
        for (const e of sortEntries(r.members)) rows.push(['', +e.bib || '', '   ' + entryName(e) + (e.status === 'np' ? ' (NP)' : ''), clubName(e.clubId), '',
          ...tr.apps.map(a => { const v = Engine.appScore(e, a, c); const cnt = r.counted[e.id] && r.counted[e.id][a.id]; return v === null ? '' : { v: v / 1000, s: cnt ? 'n' : 'mn' }; }), '']);
      }
      rows.push([]);
    }
    // per aparells
    for (const a of allApps) {
      const ar = Engine.apparatusRanking(c, g, a, { nameOf: entryName });
      const n = Math.max(1, a.attempts || 1);
      rows.push([{ v: 'CLASSIFICACIÓ · ' + a.name.toUpperCase(), s: 't' }]);
      rows.push([H('Pos.'), H('Dorsal'), H('Esportista'), H('Entitat'), '', ...(n > 1 ? range(n).map(i => H(ordinal(i + 1) + ' intent')) : []), H('Nota')]);
      for (const r of ar) rows.push([r.rank ? r.rank : (r.np ? 'NP' : ''), +r.entry.bib || '', r.name, clubName(r.entry.clubId), '', ...(n > 1 ? r.attempts.map(num) : []), r.np ? 'NP' : bnum(r.value)]);
      rows.push([]);
    }
    // notes detallades
    if (c.scoring === 'detailed') {
      rows.push([{ v: 'NOTES DETALLADES (D + E − Pen.)', s: 't' }]);
      const hdr = [H('Dorsal'), H('Esportista'), H('Entitat')];
      for (const a of allApps) for (let i = 0; i < Math.max(1, a.attempts || 1); i++) { const p = (a.attempts || 1) > 1 ? ` ${ordinal(i + 1)}` : ''; hdr.push(H(`${a.name}${p} D`), H(`${a.name}${p} E`), H(`${a.name}${p} Pen.`), H(`${a.name}${p} Nota`)); }
      rows.push(hdr);
      for (const e of sortEntries(g.entries)) {
        const r = [+e.bib || '', entryName(e), clubName(e.clubId)];
        for (const a of allApps) { const res = Engine.appResult(e, a, c); for (let i = 0; i < Math.max(1, a.attempts || 1); i++) { const at = att(e, a, i); r.push(num(Engine.toM(at.d)), num(Engine.toM(at.e)), num(Engine.toM(at.p)), num(res.attempts[i])); } }
        rows.push(r);
      }
    }
    sheets.push({ name: `${g.category} ${g.level}`, rows, cols: [7, 8, 30, 26, 18, ...range(12).map(() => 12)] });
  }
  return sheets;
}

  },
  listMove: el => {
    const arr = S()[el.dataset.key], i = +el.dataset.i, j = i + +el.dataset.d;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]]; commit(); render();

    const key = el.dataset.key, i = +el.dataset.i, v = S()[key][i];
    const field = key === 'categories' ? 'category' : 'level';
    const n = db.gymnasts.filter(g => g[field] === v).length + db.teams.filter(t => t[field] === v).length + db.competitions.reduce((s, c) => s + c.entries.filter(e => e[field] === v).length, 0);
    if (n && !(await confirmBox(`«${h(v)}» es fa servir (${n} vegades). Si l’esborres de la llista, les fitxes el conservaran però no el podràs triar. Continuar?`, { ok: 'Esborra', danger: true }))) return;

  },
  logoPick: el => {
    const k = el.dataset.k, inp = $('#filepick');
    inp.accept = 'image/*'; inp.value = '';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => {
        const scale = Math.min(1, 240 / img.height, 400 / img.width);
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        S()[k] = cv.toDataURL('image/png'); URL.revokeObjectURL(url); commit(); render();
      };
      img.onerror = () => toast('No s’ha pogut llegir aquesta imatge.', 'bad');
      img.src = url;
    };
    inp.click();
  },
  logoDel: el => { S()[el.dataset.k] = null; commit(); render(); },
  appMove: el => {
    const cfg = cfgTarget(el), i = +el.dataset.i, j = i + +el.dataset.d;

};
const safeName = s => String(s || 'competicio').replace(/[\\/:*?"<>|]+/g, '-').trim();

function gymPickList(c) {
  const p = ui.pick || {};
  const q = norm(p.q);
  const inComp = new Set(c.entries.map(e => e.gymnastId));
  const list = db.gymnasts.filter(g => !g.archived && !inComp.has(g.id))
    .sort((a, b) => coll(clubName(a.clubId), clubName(b.clubId)) || coll(gymName(a), gymName(b)));
  if (!list.length) return `<p class="muted" style="padding:10px">${db.gymnasts.length ? 'Totes les gimnastes ja estan inscrites.' : 'Encara no hi ha gimnastes. Afegeix-les a <a href="#/gimnastes">Gimnastes</a>.'}</p>`;
  return list.map(g => {
    const show = (!q || norm(gymName(g) + ' ' + clubName(g.clubId)).includes(q)) && (!p.club || g.clubId === p.club) && (!p.cat || g.category === p.cat) && (!p.level || g.level === p.level);
    return `<label class="${show ? '' : 'hidden'}"><input type="checkbox" name="g" value="${g.id}"> ${h(gymName(g))}
      <span class="muted">${h(clubName(g.clubId))} · ${h(g.category || '¿categoria?')} · ${h(g.level || '¿nivell?')}</span></label>`;
  }).join('');
}
function openCompTeamForm(c, t, cat, level) {
  const entries = sortEntries(c.entries.filter(e => e.category === cat && e.level === level));
  const clubs = [...db.clubs].sort((a, b) => coll(a.name, b.name));
  openDialog(`<form data-form="compTeam" data-id="${t ? t.id : ''}" data-cat="${h(cat)}" data-level="${h(level)}">
    <h2>${t ? 'Equip a la competició' : 'Nou equip a la competició'}</h2><p class="small muted">${h(cat)} · Nivell ${h(level)}. ${t && t.sourceTeamId ? 'Els canvis només afecten aquesta competició.' : ''}</p>
    <div class="grid2"><label class="f"><span>Nom</span><input type="text" name="name" required value="${h(t ? t.name : '')}" autofocus></label>
    <label class="f"><span>Entitat</span><select name="clubId"><option value="">— Diverses / cap —</option>${clubs.map(cl => `<option value="${cl.id}" ${t && t.clubId === cl.id ? 'selected' : ''}>${h(cl.name)}</option>`).join('')}</select></label></div>
    <h3 style="margin:14px 0 6px">Gimnastes</h3>
    <div class="pick-list">${entries.map(e => { const other = e.teamId && (!t || e.teamId !== t.id) ? c.teams.find(x => x.id === e.teamId) : null;
      return `<label><input type="checkbox" name="m" value="${e.id}" ${t && e.teamId === t.id ? 'checked' : ''}> ${h(entryName(e))} <span class="muted">${h(clubName(e.clubId))}${other ? ` · ara a «${h(other.name)}»` : ''}</span></label>`; }).join('') || '<p class="muted" style="padding:10px">Cap gimnasta inscrita en aquest grup.</p>'}</div>
    <div class="dlg-actions"><button type="button" class="btn" data-act="closeDlg">Cancel·la</button><button class="btn primary">Desa</button></div></form>`);
}

/* ═══════════════════════════════════════════ formularis (submit) */
const forms = {
  comp: f => {
    const fd = new FormData(f), id = f.dataset.id;
    const vals = { name: fd.get('name').trim(), date: fd.get('date'), place: fd.get('place').trim(), season: fd.get('season').trim() || Engine.seasonFor(fd.get('date')) };
    if (id) { Object.assign(compById(id), vals); commit(); closeDialog(); render(); return; }
    const c = Object.assign({ id: uid(), entries: [], teams: [], locked: false, created: new Date().toISOString() }, JSON.parse(JSON.stringify(S().compDefaults)), vals);
    const src = fd.get('copyFrom') && compById(fd.get('copyFrom'));
    if (src) {
      for (const k of COMP_KEYS) c[k] = JSON.parse(JSON.stringify(src[k]));
      const map = {};
      c.teams = src.teams.map(t => { const n = Object.assign({}, t, { id: uid() }); map[t.id] = n.id; return n; });
      c.entries = src.entries.filter(e => { const g = gymById(e.gymnastId); return g && !g.archived; })
        .map(e => ({ id: uid(), gymnastId: e.gymnastId, category: e.category, level: e.level, clubId: e.clubId, teamId: map[e.teamId] || null, bib: e.bib, status: '', scores: {} }));
    }
    db.competitions.push(normalizeComp(c, S().compDefaults));
    commit(); closeDialog();
    go(`#/competicio/${c.id}/${c.entries.length ? 'notes' : 'inscripcions'}`);
  },
  gym: (f, submitter) => {
    const fd = new FormData(f), id = f.dataset.id;
    const name = fd.get('name').trim(); if (!name) return;
    const vals = { name, surname: fd.get('surname').trim(), clubId: ensureClub(fd.get('club')), category: fd.get('category'), level: fd.get('level'),
      birthYear: fd.get('birthYear') ? String(fd.get('birthYear')) : '', notes: fd.get('notes').trim() };
    if (id) {
      const g = gymById(id);
      Object.assign(g, vals, { archived: fd.get('archived') === 'on' });
      commit(); closeDialog(); render(); return;
    }
    const dup = db.gymnasts.find(g => norm(gymName(g)) === norm(name + ' ' + vals.surname));
    db.gymnasts.push(Object.assign({ id: uid(), archived: false }, vals));
    ui.lastGym = { clubName: clubName(vals.clubId), category: vals.category, level: vals.level };
    commit();
    toast(`${name} ${vals.surname} afegida.${dup ? ' Compte: ja n’hi havia una amb el mateix nom.' : ''}`, dup ? 'bad' : 'ok');
    if (submitter && submitter.name === 'again') openDialog(gymForm(null, ui.lastGym)); else closeDialog();
    render();
  },
  team: f => {
    const fd = new FormData(f), id = f.dataset.id;
    const vals = { name: fd.get('name').trim(), clubId: fd.get('clubId') || null, category: fd.get('category'), level: fd.get('level'), memberIds: fd.getAll('m') };
    if (!vals.name || !vals.category || !vals.level) { toast('Cal el nom, la categoria i el nivell.', 'bad'); return; }
    const t = id ? teamById(id) : (db.teams.push({ id: uid() }), db.teams[db.teams.length - 1]);
    Object.assign(t, vals);
    // una gimnasta no pot ser a dos equips de la mateixa categoria i nivell
    db.teams.forEach(o => { if (o.id !== t.id && o.category === t.category && o.level === t.level) o.memberIds = o.memberIds.filter(m => !t.memberIds.includes(m)); });
    commit(); closeDialog(); render();
    const n = t.memberIds.length, d = S().compDefaults;
    toast(n < d.teamMin ? `Equip desat, però només té ${n} gimnastes (mínim ${d.teamMin}).` : n > d.teamMax ? `Equip desat, però té ${n} gimnastes (màxim ${d.teamMax}).` : 'Equip desat.', n < d.teamMin || n > d.teamMax ? 'bad' : 'ok');
  },
  autoTeams: f => {
    const picks = new FormData(f).getAll('p').map(Number);
    withUndo(`${plural(picks.length, 'equip creat', 'equips creats')}.`, () => {
      for (const i of picks) db.teams.push(Object.assign({ id: uid() }, ui.proposals[i]));
    });
    closeDialog();
  },
  enrollTeams: f => {
    const c = curComp(), ids = new FormData(f).getAll('t');
    if (!ids.length) { closeDialog(); return; }
    let problems = [];
    withUndo(`${plural(ids.length, 'equip inscrit', 'equips inscrits')}.`, () => { for (const id of ids) problems = problems.concat(enrollTeam(c, teamById(id))); });
    closeDialog();
    if (problems.length) toast(`No s’han pogut moure de categoria (ja tenen notes): ${problems.join(', ')}`, 'bad');
  },
  enrollGyms: f => {
    const c = curComp(), ids = new FormData(f).getAll('g');
    if (!ids.length) { toast('No has marcat cap gimnasta.', 'bad'); return; }
    withUndo(`${plural(ids.length, 'gimnasta inscrita', 'gimnastes inscrites')}.`, () => {
      const added = ids.map(id => { const e = newEntry(c, gymById(id)); c.entries.push(e); return e; });
      autoAssignTeams(c, added);
    });
    closeDialog();
  },
  entry: f => {
    const c = curComp(), e = c.entries.find(x => x.id === f.dataset.id), fd = new FormData(f);
    const cat = fd.get('category'), level = fd.get('level');
    if ((cat !== e.category || level !== e.level) && e.teamId) e.teamId = null;
    Object.assign(e, { category: cat, level, clubId: fd.get('clubId') || null, bib: fd.get('bib') ? +fd.get('bib') : e.bib });
    commit(); closeDialog(); render();
  },
  compTeam: f => {
    const c = curComp(), fd = new FormData(f), id = f.dataset.id;
    const name = fd.get('name').trim(); if (!name) return;
    let t = id && c.teams.find(x => x.id === id);
    if (!t) { t = { id: uid(), category: f.dataset.cat, level: f.dataset.level, sourceTeamId: null }; c.teams.push(t); }
    t.name = name; t.clubId = fd.get('clubId') || null;
    const members = new Set(fd.getAll('m'));
    c.entries.forEach(e => { if (members.has(e.id)) e.teamId = t.id; else if (e.teamId === t.id) e.teamId = null; });
    commit(); closeDialog(); render();
  },
  print: f => {
    const fd = new FormData(f);
    closeDialog();
    doPrint(curComp(), fd.getAll('t'), fd.getAll('g'));
  },
  club: f => {
    const name = new FormData(f).get('name').trim(); if (!name) return;
    if (db.clubs.some(c => norm(c.name) === norm(name))) { toast('Aquesta entitat ja existeix.', 'bad'); return; }
    ensureClub(name); commit(); closeDialog(); render();
  },
};

/* ═══════════════════════════════════════════ canvis en camps (change / input) */
const changes = {
  score: el => {
    const c = curComp(); if (!c || c.locked) return;
    const e = c.entries.find(x => x.id === el.dataset.e); if (!e) return;
    if (el.dataset.last === el.value) return;   // ja processat (Intro i després blur)
    el.dataset.last = el.value;
    const val = Engine.parseScore(el.value);
    if (Number.isNaN(val)) {
      el.classList.add('invalid');
      toast(`«${el.value}» no és una nota vàlida. Escriu un número, per exemple 8,35.`, 'bad');
      return;
    }
    el.classList.remove('invalid');
    setAttemptField(e, el.dataset.a, +el.dataset.i, el.dataset.f, val);
    const m = Engine.toM(val);
    el.value = m === null ? '' : fmt(m);
    el.dataset.last = el.value;
    el.classList.toggle('high', m !== null && el.dataset.f !== 'p' && c.maxScore && m > c.maxScore * 1000);
    if (el.classList.contains('high')) toast(`Compte: ${fmt(m)} passa de ${c.maxScore}. Revisa que sigui correcta.`, 'bad');
    const minM = Engine.toM(c.minScore) || 0;
    if (el.dataset.f !== 'p' && minM && m !== null && m > 0 && m < minM && c.scoring !== 'detailed') toast(`S’aplica la nota mínima: compta com a ${fmt(minM)}.`);
    commit(); refreshScoreRow(c, e);
  },
  bib: el => { const c = curComp(); const e = c.entries.find(x => x.id === el.dataset.id); e.bib = el.value ? +el.value : null; commit(); },
  entryTeam: el => {
    const c = curComp(); const e = c.entries.find(x => x.id === el.dataset.id); e.teamId = el.value || null; commit(); render();
  },
  entryStatus: el => { const c = curComp(); const e = c.entries.find(x => x.id === el.dataset.id); e.status = el.value; commit(); render(); },
  cfg: el => {
    const cfg = cfgTarget(el), k = el.dataset.k;
    let v = el.value;
    if (el.type === 'number') {
      const n = el.dataset.dec ? Math.round((+v || 0) * 1000) / 1000 : Math.round(+v || 0);
      v = Math.max(+el.min || 0, Math.min(+el.max || 100, n));
      if (!v && +el.min > 0) v = COMP_DEFAULTS()[k];
    }
    cfg[k] = v;
    if (cfg.teamMin > cfg.teamMax) { if (k === 'teamMin') cfg.teamMax = cfg.teamMin; else cfg.teamMin = cfg.teamMax; }
    commit(); render();
  },
  app: el => {
    const cfg = cfgTarget(el), a = cfg.apparatus[+el.dataset.i], k = el.dataset.k;
    if (el.type === 'checkbox') a[k] = el.checked;
    else if (k === 'attempts') a[k] = +el.value;
    else if (k === 'name') a[k] = el.value.trim() || a[k];
    else a[k] = el.value;
    commit(); render();
  },
  gFilter: el => { ui[el.dataset.k] = el.value; $('#gymtable').innerHTML = gymTable(); },
  gArchived: el => { ui.gArchived = el.checked; $('#gymtable').innerHTML = gymTable(); },
  pickFilter: el => { ui.pick[el.dataset.k] = el.value; refreshPick(); },
  teamFormRefresh: el => {
    const f = el.closest('form'), fd = new FormData(f);
    const v = { clubId: fd.get('clubId'), category: fd.get('category'), level: fd.get('level'), memberIds: fd.getAll('m') };
    $('#teampick').innerHTML = teamPickList(v, fd.get('showAll') === 'on', f.dataset.id);
    $('#teamcount').textContent = $$('#teampick input:checked').length;
  },
  teamCount: () => { $('#teamcount').textContent = $$('#teampick input:checked').length; },
  impHeader: el => { ui.import.hasHeader = el.checked; if (el.checked) ui.import.map = range(ui.import.width).map(i => guessField(ui.import.rows[0][i]) || ui.import.map[i]); openDialog(importDialog(), { wide: true }); },
  impMap: el => { ui.import.map[+el.dataset.i] = el.value; openDialog(importDialog(), { wide: true }); },
  impDef: el => { ui.import[el.dataset.k] = el.value; openDialog(importDialog(), { wide: true }); },
  clubName: el => {
    const c = clubById(el.dataset.id), v = el.value.trim();
    if (!v) { el.value = c.name; return; }
    if (db.clubs.some(o => o.id !== c.id && norm(o.name) === norm(v))) { toast('Ja hi ha una entitat amb aquest nom. Fes servir «Fusiona».', 'bad'); el.value = c.name; return; }
    c.name = v; commit(); toast('Nom canviat.', 'ok');
  },
  clubMerge: async el => {
    const from = clubById(el.dataset.id), to = clubById(el.value);
    if (!to) return;
    if (!(await confirmBox(`Fusionar <b>${h(from.name)}</b> dins de <b>${h(to.name)}</b>? Totes les gimnastes, equips i inscripcions de «${h(from.name)}» passaran a «${h(to.name)}».`, { ok: 'Fusiona' }))) { el.value = ''; return; }
    withUndo(`«${from.name}» fusionada amb «${to.name}».`, () => {
      const fix = o => { if (o.clubId === from.id) o.clubId = to.id; };
      db.gymnasts.forEach(fix); db.teams.forEach(fix);
      db.competitions.forEach(c => { c.entries.forEach(fix); c.teams.forEach(fix); });
      db.clubs = db.clubs.filter(c => c.id !== from.id);
    });
  },
  setting: el => { S()[el.dataset.k] = el.value; commit(); },
  listRename: el => {
    const key = el.dataset.key, i = +el.dataset.i, old = S()[key][i], v = el.value.trim();
    if (!v || v === old) { el.value = old; return; }
    if (S()[key].some((x, j) => j !== i && norm(x) === norm(v))) { toast('Ja n’hi ha un amb aquest nom.', 'bad'); el.value = old; return; }
    const field = key === 'categories' ? 'category' : 'level';
    S()[key][i] = v;
    const fix = o => { if (o[field] === old) o[field] = v; };
    db.gymnasts.forEach(fix); db.teams.forEach(fix);
    db.competitions.forEach(c => { c.entries.forEach(fix); c.teams.forEach(fix); });
    commit(); toast(`«${old}» ara es diu «${v}».`, 'ok');
  },
};
const inputs = {
  gSearch: el => { ui.gSearch = el.value; $('#gymtable').innerHTML = gymTable(); },
  pickFilter: el => { ui.pick[el.dataset.k] = el.value; refreshPick(); },
};
function refreshPick() {
  const p = ui.pick, q = norm(p.q);
  $$('#gympick label').forEach(l => {
    const g = gymById(l.querySelector('input').value);
    const show = (!q || norm(gymName(g) + ' ' + clubName(g.clubId)).includes(q)) && (!p.club || g.clubId === p.club) && (!p.cat || g.category === p.cat) && (!p.level || g.level === p.level);
    l.classList.toggle('hidden', !show);
  });
}

/* ═══════════════════════════════════════════ esdeveniments */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  if (el.dataset.act === 'editGym' && $('#dlg').open) closeDialog();
  fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (el && changes[el.dataset.chg]) changes[el.dataset.chg](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-inp]');
  if (el && inputs[el.dataset.inp]) inputs[el.dataset.inp](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  forms[f.dataset.form](f, e.submitter);
});
document.addEventListener('keydown', e => {
  const el = e.target;
  // a la graella de notes, Intro / fletxes baixen i pugen per la mateixa columna
  if (el.matches && el.matches('input.sc') && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const up = e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey);
    const col = $$(`#scoregrid input.sc[data-col="${el.dataset.col}"]:not(:disabled)`);
    const i = col.indexOf(el);
    changes.score(el);
    const next = col[i + (up ? -1 : 1)];
    if (next) { next.focus(); next.select(); } else el.blur();
    return;
  }
  if (el.dataset && el.dataset.enter && e.key === 'Enter') { e.preventDefault(); actions[el.dataset.enter](el); }
});
// en entrar en una casella de nota, es selecciona tota perquè es pugui sobreescriure.
// Ha de ser immediat: si s'espera, el que s'escriu de pressa després d'Intro quedaria seleccionat i se sobreescriuria.
const isSc = el => el && el.matches && el.matches('input.sc');
document.addEventListener('focusin', e => { if (isSc(e.target)) { e.target.select(); e.target._fresh = true; } });
document.addEventListener('mouseup', e => { if (isSc(e.target) && e.target._fresh) e.preventDefault(); if (e.target) e.target._fresh = false; });
document.addEventListener('keydown', e => { if (e.target) e.target._fresh = false; }, true);

/* ═══════════════════════════════════════════ arrencada */
async function start() {
  loadDb();
  route();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (fsSupported()) {
    const hd = await idbGet('fileHandle');
    if (hd) {
      fileHandle = hd;
      try { fileState = (await hd.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'perm'; } catch (_) { fileState = 'perm'; }
      renderSaveState(false);
    }
  }
}
start();

// instal·lable i sense internet quan es serveix per web (des d'un fitxer local ja funciona sense res més)
if (location.protocol.startsWith('http')) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
