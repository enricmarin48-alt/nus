<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d1a33">
<meta name="description" content="Notes i classificacions de gimnàstica artística (individual, per aparells i per equips). Funciona sense internet.">

<title>NotesGim · Gimnàstica artística</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f3f5f9; --panel:#fff; --ink:#1a2233; --muted:#667085; --line:#dde2ea; --line2:#eef1f5;
    --pri:#6d1a33; --pri2:#8f2445; --pri-soft:#f7e6ec; --pri-ink:#fff;
    --ok:#1e7b3a; --ok-soft:#e5f5ea; --warn:#a15c00; --warn-soft:#fff3dc; --bad:#c0262d; --bad-soft:#fdeaea;
    --gold:#fff1bf; --silver:#eceff4; --bronze:#f7e0cc;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--pri2)}
  h1{font-size:22px;margin:0}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:15px;margin:0}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .center{text-align:center}
  .nowrap{white-space:nowrap}
  .hidden{display:none !important}

  /* ═══ capçalera de l'app */
  header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:8px 18px;background:var(--pri);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:800;font-size:17px;letter-spacing:.02em}
  .brand svg{width:28px;height:28px}
  header.top nav{display:flex;gap:4px;flex-wrap:wrap}
  header.top nav a{color:#f3dbe3;text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600}
  header.top nav a:hover{background:rgba(255,255,255,.1)}
  header.top nav a.on{background:#fff;color:var(--pri)}
  .savestate{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:#f3dbe3}
  .savestate button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
  .savestate button.alert{background:#ffc94d;color:#3a2a00;border-color:#ffc94d;font-weight:700}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fd38a;margin-right:5px}
  .dot.busy{background:#ffc94d}.dot.err{background:#ff6b6b}

  main{max-width:1280px;margin:0 auto;padding:20px 18px 80px}
  .page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .grow{flex:1;min-width:180px}
  .toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  /* ═══ botons i controls */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
    padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
  .btn:hover{border-color:#b9c3d3}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--pri2);border-color:var(--pri2);color:#fff}
  .btn.primary:hover{background:var(--pri)}
  .btn.danger{color:var(--bad);border-color:#f1c1c3}
  .btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--line2)}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:6px;color:var(--muted);font-size:15px;line-height:1}
  .icon-btn:hover{background:var(--line2);color:var(--ink)}
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid #dba3b6;outline-offset:0;border-color:#dba3b6}
  textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
  label.f > span{color:var(--muted);font-weight:600}
  label.chk{display:flex;gap:7px;align-items:center;cursor:pointer;padding:3px 0}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
  fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:0 0 12px}
  legend{font-weight:700;padding:0 6px}

  /* ═══ targetes, taules, pastilles */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .card-head .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .comp-card h3{font-size:16px;margin-bottom:4px}
  .comp-card .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .comp-card .stats{display:flex;gap:14px;font-size:13px;margin-bottom:12px;flex-wrap:wrap}
  .comp-card .stats b{font-size:16px;display:block}
  .comp-card .actions{display:flex;gap:6px;flex-wrap:wrap}

  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
  table.tbl{border-collapse:collapse;width:100%;background:#fff}
  .tbl th,.tbl td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
  .tbl thead th{background:#f7f9fc;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
    position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
  .tbl th.grp{text-align:center;border-left:1px solid var(--line)}
  .tbl td.sep,.tbl th.sep{border-left:1px solid var(--line)}
  .tbl tbody tr:hover{background:#fafbfe}
  .tbl tr.gold td{background:var(--gold)} .tbl tr.silver td{background:var(--silver)} .tbl tr.bronze td{background:var(--bronze)}
  .tbl tr.np td{color:var(--muted)}
  .tbl tr.team-row td{border-top:2px solid var(--line);font-weight:700}
  .tbl tr.member td{font-size:13px;color:#3d475c;border-bottom-color:transparent}
  .tbl tr.member td:first-child{border-left:3px solid var(--pri-soft)}
  .tbl td.pos{font-weight:800;width:44px}
  .tbl td.total{font-weight:800}
  .tbl .disc{color:#9aa3b5;text-decoration:line-through}
  .tbl .cnt{font-weight:700}
  .empty{padding:34px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .pill.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
  .pill .n{font-size:11px;opacity:.75}
  .pill svg{width:16px;height:16px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--line2);color:var(--muted)}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.bad{background:var(--bad-soft);color:var(--bad)}
  .badge.pri{background:var(--pri-soft);color:var(--pri)}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;background:#fff;font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .note{padding:10px 12px;border-radius:8px;background:var(--pri-soft);color:#561327;margin-bottom:12px;font-size:13px}
  .note.warn{background:var(--warn-soft);color:#6b3e00}
  .note.bad{background:var(--bad-soft);color:#7d1419}
  .steps{margin:0;padding-left:20px}.steps li{margin:4px 0}

  /* ═══ pestanyes de competició */
  .comp-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
  .comp-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .back{font-size:13px;text-decoration:none;color:var(--muted)}
  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tabs a{padding:9px 16px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
  .tabs a.on{color:var(--pri);border-bottom-color:var(--pri2)}
  .tabs a .badge{margin-left:4px}

  /* ═══ graella de notes */
  input.sc{width:74px;text-align:right;font-variant-numeric:tabular-nums;padding:5px 7px;border-radius:6px}
  input.sc.sm{width:58px}
  input.sc.invalid{border-color:var(--bad);background:var(--bad-soft);outline-color:#f0a3a6}
  input.sc.high{border-color:#e2a33b;background:var(--warn-soft)}
  input.sc.tutor{border-color:#d29a1e;background:#fff6dd;box-shadow:inset 3px 0 0 #d29a1e}
  input.sc:disabled{background:#f6f7f9;color:#555}
  input.bib{width:62px;text-align:right}
  select.teamsel{max-width:170px;padding:4px 6px;font-size:12px}
  .lc{text-transform:none}
  .tutor-mode header.top nav,.tutor-mode #savestate{display:none}
  .tutor-mode input.sc{width:92px;font-size:18px;padding:8px 9px}
  .st{display:inline-block;width:16px;margin-left:4px;font-weight:800}
  .st.ok{color:var(--ok)} .st.err{color:var(--bad)} .st.wait{color:var(--warn)}
  td.out{color:#26324a;font-weight:700}
  .minhint{color:var(--warn);font-weight:700;margin-right:4px;font-size:12px}
  .minhint:empty{display:none}
  .progress{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .ico{width:18px;height:18px;vertical-align:-4px;display:inline-block}
  html{scroll-padding-top:70px}
  .grid-wrap{max-height:calc(100vh - 150px)}
  #scoregrid td.who,#scoregrid th.who{position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line)}
  #scoregrid thead th.who{background:#f7f9fc;z-index:3}
  @media (max-width:700px){
    header.top{position:static;gap:8px;padding:6px 10px}
    header.top nav a{padding:5px 8px}
    main{padding:12px 10px 60px}
    .grid-wrap{max-height:calc(100vh - 40px)}
    #scoregrid .club{display:none}
  }
  .ico svg{width:100%;height:100%}

  /* ═══ diàlegs i avisos */
  dialog{border:none;border-radius:14px;padding:0;max-width:min(680px,calc(100vw - 24px));width:100%;
    box-shadow:0 20px 60px rgba(10,20,40,.35)}
  dialog.wide{max-width:min(1000px,calc(100vw - 24px))}
  dialog::backdrop{background:rgba(15,25,45,.45)}
  dialog .dlg{padding:18px 20px;max-height:calc(100vh - 60px);overflow:auto}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .dlg-actions .left{margin-right:auto}
  #confirm .dlg-actions{flex-direction:row-reverse;justify-content:flex-start}
  .pick-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .pick-list label{display:flex;gap:9px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
  .pick-list label:hover{background:#f7f9fc}
  .pick-list label .muted{margin-left:auto;font-size:12px;text-align:right}
  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(420px,calc(100vw - 32px))}
  .toast{background:#1d2738;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;font-size:13px}
  .toast.bad{background:#8e1c22}.toast.ok{background:#1f4f30}
  .toast button{margin-left:auto;background:#fff;color:#1d2738;border:none;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer}
  .logo-prev{height:64px;max-width:160px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px}
  .list-ed{display:flex;flex-direction:column;gap:6px;max-width:420px}
  .list-ed .row{display:flex;gap:6px;align-items:center}
  .list-ed .row input{flex:1}

  /* ═══ impressió */
  #print{display:none}
  @page{size:A4 portrait;margin:11mm}
  @page land{size:A4 landscape;margin:10mm}
  @media print{
    html,body{background:#fff}
    body > *:not(#print){display:none !important}
    #print{display:block;color:#000;font-size:11pt}
    .sheet{break-after:page;page-break-after:always}
    .sheet:last-child{break-after:auto;page-break-after:auto}
    .sheet.landscape{page:land}
    .sheet, .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .sheet .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .sheet .ph-logo{width:90px;min-height:10px;display:flex;justify-content:center}
  .sheet .ph-logo img{max-height:80px;max-width:90px;object-fit:contain}
  .sheet .ph-text{flex:1;text-align:center;line-height:1.3}
  .sheet .ph-org{font-weight:800;font-size:13pt}
  .sheet .ph-name{font-weight:800;text-transform:uppercase}
  .sheet h2{text-align:center;font-size:14pt;margin:10px 0 2px;text-transform:uppercase}
  .sheet .sub{text-align:center;font-weight:700;margin-bottom:10px;text-transform:uppercase}
  .sheet table{width:100%;border-collapse:collapse;font-size:10pt}
  .sheet th,.sheet td{border:1px solid #777;padding:3px 6px}
  .sheet th{background:#f1e3e8;font-size:9pt;text-transform:uppercase}
  .sheet tr.gold td{background:#fff1bf}.sheet tr.silver td{background:#eceff4}.sheet tr.bronze td{background:#f7e0cc}
  .sheet tr.team-row td{font-weight:700;background:#f2f4f8}
  .sheet tr.team-row.gold td{background:#fff1bf}.sheet tr.team-row.silver td{background:#eceff4}.sheet tr.team-row.bronze td{background:#f7e0cc}
  .sheet tr.member td{font-size:9pt}
  .sheet .disc{color:#888;text-decoration:line-through}
  .sheet .judge td{height:26px}
  .sheet .sign{margin-top:26px;display:flex;justify-content:space-between;gap:30px}
  .sheet .foot{margin-top:10px;font-size:8pt;color:#555}
  .sheet tr.rep th{background:none !important;border:none;font-size:11pt;text-align:center;padding:6px 0 8px}
  .sheet td.signrow{border:none;padding-top:22px;font-size:10pt;white-space:pre}
  .sheet .ph-date{font-size:7pt;color:#666}
  .sheet td{white-space:normal}
  .sheet .num{white-space:nowrap}
  .sheet .ico{width:14px;height:14px;vertical-align:-2px}
  .sheet h3{margin:14px 0 6px;font-size:11pt;text-transform:uppercase}
</style>
</head>

<input type="file" id="filepick" class="hidden">

<script>
"use strict";
/* ═══════════════════════════════════════════ ENGINE-START
   Motor de càlcul: sense DOM, sense dades globals. Tot el que entra i surt són
   objectes simples, i les notes es treballen en MIL·LÈSIMES ENTERES (8,275 → 8275)
   perquè les sumes no arrosseguin errors de coma flotant. Els tests
   (tests/engine.test.mjs) extreuen aquest bloc i el proven sol. */
const Engine = (() => {
  const M = 1000;
  const coll = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'ca', { sensitivity: 'base', numeric: true });
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

  // valor guardat (número en unitats) → mil·lèsimes enteres, o null
  function toM(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    return Number.isFinite(n) ? Math.round(n * M) : null;
  }

  // el que escriu l'usuari → número (accepta coma o punt) · '' → null · brossa → NaN
  function parseScore(input) {
    if (input === null || input === undefined) return null;
    const s = String(input).replace(/\s+/g, '').replace(/[,']/, '.');
    if (s === '') return null;
    if (!/^(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
    return Math.round(Number(s) * M) / M;
  }

  // mil·lèsimes → "8,25" / "8,275" (mínim 2 decimals, màxim 3, sense perdre precisió)
  function fmt(m) {
    if (m === null || m === undefined || !Number.isFinite(m)) return '';
    const a = Math.abs(Math.round(m));
    let frac = String(a % M).padStart(3, '0');
    if (frac.endsWith('0')) frac = frac.slice(0, 2);
    return (m < 0 ? '-' : '') + Math.floor(a / M) + ',' + frac;
  }

  // cfg pot ser la competició sencera o només el mode ('simple' | 'detailed')
  const modeOf = cfg => (cfg && typeof cfg === 'object') ? cfg.scoring : cfg;
  const minOf = cfg => (cfg && typeof cfg === 'object') ? (toM(cfg.minScore) || 0) : 0;

  // nota d'un intent. Mode 'simple': la nota tal qual. Mode 'detailed': D + E − penalització; sense E encara
  // no hi ha nota (així una E oblidada no passa per bona). Si només hi ha la nota final (entrada en mode
  // simple abans de canviar de mode), compta aquesta menys la penalització.
  // Si hi ha nota mínima (p. ex. 3), qui fa l'exercici no en treu menys; un 0 vol dir que no l'ha fet.
  function attemptValue(att, cfg) {
    if (!att) return null;
    let v;
    if (modeOf(cfg) === 'detailed') {
      const d = toM(att.d), e = toM(att.e), p = toM(att.p) || 0;
      if (d === null && e === null) { const f = toM(att.v); v = f === null ? null : Math.max(0, f - (att.src === 'de' ? 0 : p)); }
      else v = e === null ? null : Math.max(0, (d || 0) + e - p);
    } else v = toM(att.v);
    const min = minOf(cfg);
    return (v !== null && v > 0 && v < min) ? min : v;
  }

  // nota d'un aparell (amb 1 o més intents i la regla: millor / mitjana / suma)
  function appResult(entry, app, cfg) {
    const n = Math.max(1, app.attempts || 1);
    const atts = (entry && entry.scores && entry.scores[app.id]) || [];
    const attempts = [];
    for (let i = 0; i < n; i++) attempts.push(attemptValue(atts[i], cfg));
    const got = attempts.filter(v => v !== null);
    let value = null;
    if (got.length) {
      if (n === 1) value = got[0];
      else if (app.rule === 'sum') value = got.reduce((a, b) => a + b, 0);
      else if (app.rule === 'avg') value = Math.round(got.reduce((a, b) => a + b, 0) / got.length);
      else value = Math.max(...got);
    }
    return { value, attempts, complete: got.length === n };
  }
  const appScore = (entry, app, cfg) => appResult(entry, app, cfg).value;

  // D i E de la nota que compta (per desempatar com la FIG: primer E, després D). Només en mode detallat.
  function appDE(entry, app, cfg) {
    if (modeOf(cfg) !== 'detailed') return { d: null, e: null };
    const n = Math.max(1, app.attempts || 1);
    const atts = ((entry && entry.scores && entry.scores[app.id]) || []).slice(0, n);
    const done = atts.map(a => a || {}).map(a => ({ v: attemptValue(a, cfg), d: toM(a.d), e: toM(a.e) })).filter(x => x.v !== null);
    if (!done.length) return { d: null, e: null };
    if (n === 1 || app.rule === 'best' || !app.rule) { const b = done.reduce((p, x) => (x.v > p.v ? x : p)); return { d: b.d, e: b.e }; }
    const sum = k => done.reduce((t, x) => t + (x[k] || 0), 0);
    if (app.rule === 'sum') return { d: sum('d'), e: sum('e') };
    return { d: Math.round(sum('d') / done.length), e: Math.round(sum('e') / done.length) };
  }

  // gènere: 'F' (femení) o 'M' (masculí). Les dades antigues sense gènere són femení.
  const genderOf = x => (x && x.gender === 'M') ? 'M' : 'F';

  // cada aparell diu què és per a noies i per a nois: 'total' (compta a la general i per equips),
  // 'apart' (només la seva classificació) o 'off' (no es fa). Accepta el format antic (enabled/inTotal).
  function appMode(a, gender) {
    if (a.modes) return a.modes[gender === 'M' ? 'M' : 'F'] || 'off';
    if (!a.enabled) return 'off';
    return a.inTotal ? 'total' : 'apart';
  }
  // sense gènere: els aparells que es fan per a algú
  const enabledApps = (comp, gender) => (comp.apparatus || []).filter(a =>
    gender ? appMode(a, gender) !== 'off' : (appMode(a, 'F') !== 'off' || appMode(a, 'M') !== 'off'));
  const totalApps = (comp, gender) => (comp.apparatus || []).filter(a => appMode(a, gender || 'F') === 'total');
  const teamApps = (comp, gender) => totalApps(comp, gender).filter(a => a.inTeam !== false || a.modes);

  // suma de la general individual d'una inscripció (null si no té cap nota)
  function entryTotal(comp, entry) {
    let t = 0, n = 0;
    for (const a of totalApps(comp, genderOf(entry))) { const v = appScore(entry, a, comp); if (v !== null) { t += v; n++; } }
    return n ? t : null;
  }

  const groupKey = (category, gender, level) => String(category) + '||' + (gender === 'M' ? 'M' : 'F') + '||' + String(level);
  const idx = (list, v) => { const i = (list || []).indexOf(v); return i < 0 ? 1e6 : i; };
  const catName = c => (c && typeof c === 'object') ? c.name : c;

  // grups = categoria + gènere + nivell (cada grup té la seva classificació)
  function groupsOf(comp, settings) {
    const map = new Map();
    const add = (category, gender, level) => {
      const key = groupKey(category, gender, level);
      if (!map.has(key)) map.set(key, { key, category, gender: gender === 'M' ? 'M' : 'F', level, entries: [] });
      return map.get(key);
    };
    for (const e of comp.entries || []) add(e.category, genderOf(e), e.level).entries.push(e);
    for (const t of comp.teams || []) add(t.category, genderOf(t), t.level);
    const cats = ((settings && settings.categories) || []).map(catName), levels = settings && settings.levels;
    return [...map.values()].sort((a, b) =>
      idx(cats, a.category) - idx(cats, b.category) || coll(a.category, b.category) ||
      (a.gender === b.gender ? 0 : a.gender === 'F' ? -1 : 1) ||
      idx(levels, a.level) - idx(levels, b.level) || coll(a.level, b.level));
  }

  // categoria que toca segons l'any de naixement. defs: [{name, from, to}] (from/to buits = sense límit)
  function categoryForYear(defs, year) {
    const y = parseInt(year, 10);
    if (!Number.isFinite(y)) return null;
    const hit = (defs || []).find(c => c && typeof c === 'object' &&
      (c.from === null || c.from === undefined || c.from === '' || y >= +c.from) &&
      (c.to === null || c.to === undefined || c.to === '' || y <= +c.to) &&
      !((c.from === null || c.from === undefined || c.from === '') && (c.to === null || c.to === undefined || c.to === '')));
    return hit ? hit.name : null;
  }

  // compara dues llistes de notes de més gran a més petita: la primera diferència mana
  function cmpDesc(aVals, bVals) {
    const A = aVals.filter(v => v !== null).sort((x, y) => y - x);
    const B = bVals.filter(v => v !== null).sort((x, y) => y - x);
    for (let i = 0; i < Math.max(A.length, B.length); i++) {
      const x = i < A.length ? A[i] : -1, y = i < B.length ? B[i] : -1;
      if (x !== y) return y - x;
    }
    return 0;
  }

  // posa posicions. Empat (mateixa nota i sense desempat) = mateixa posició: 1, 1, 3…
  function assignRanks(items, value, tie) {
    const ranked = items.filter(x => value(x) !== null);
    const rest = items.filter(x => value(x) === null);
    ranked.sort((a, b) => (value(b) - value(a)) || (tie ? tie(a, b) : 0) || (a._order - b._order));
    for (let i = 0; i < ranked.length; i++) {
      const r = ranked[i], p = ranked[i - 1];
      r.rank = (p && value(p) === value(r) && (!tie || tie(p, r) === 0)) ? p.rank : i + 1;
    }
    ranked.forEach((r, i) => {
      r.tied = (i > 0 && ranked[i - 1].rank === r.rank) || (i + 1 < ranked.length && ranked[i + 1].rank === r.rank);
    });
    rest.sort((a, b) => ((a.np ? 1 : 0) - (b.np ? 1 : 0)) || (a._order - b._order));
    rest.forEach(r => { r.rank = null; r.tied = false; });
    return ranked.concat(rest);
  }

  function withOrder(rows) {
    [...rows].sort((a, b) => coll(a.name, b.name)).forEach((r, i) => { r._order = i; });
    return rows;
  }

  // CLASSIFICACIÓ GENERAL INDIVIDUAL: suma dels aparells que compten per al total
  function individualRanking(comp, group, opts = {}) {
    const apps = totalApps(comp, group.gender);
    const nameOf = opts.nameOf || (() => '');
    const rows = withOrder(group.entries.map(e => {
      const np = e.status === 'np';
      const scores = {}; let total = 0, n = 0, eSum = 0, dSum = 0, full = 0;
      for (const a of apps) {
        const r = appResult(e, a, comp), v = r.value;
        scores[a.id] = v;
        if (v !== null) full++;
        if (v !== null) { total += v; n++; const de = appDE(e, a, comp); eSum += de.e || 0; dSum += de.d || 0; }
      }
      return { entry: e, name: nameOf(e), scores, total: (n && !np) ? total : null,
        count: n, complete: full === apps.length, np, eSum, dSum };
    }));
    let tie = null;
    if (comp.tieInd === 'bestApp') tie = (a, b) => cmpDesc(Object.values(a.scores), Object.values(b.scores));
    if (comp.tieInd === 'fig') tie = (a, b) => (b.eSum - a.eSum) || (b.dSum - a.dSum);
    return { apps, rows: assignRanks(rows, r => r.total, tie) };
  }

  // CLASSIFICACIÓ D'UN APARELL
  function apparatusRanking(comp, group, app, opts = {}) {
    const nameOf = opts.nameOf || (() => '');
    const rows = withOrder(group.entries.map(e => {
      const np = e.status === 'np';
      const r = appResult(e, app, comp);
      const de = appDE(e, app, comp);
      return { entry: e, name: nameOf(e), value: np ? null : r.value, attempts: r.attempts, complete: r.complete, np, e: de.e || 0, d: de.d || 0 };
    }));
    let tie = null;
    if (comp.tieApp === 'bestAttempt' && (app.attempts || 1) > 1) tie = (a, b) => cmpDesc(a.attempts, b.attempts);
    if (comp.tieApp === 'fig') tie = (a, b) => (b.e - a.e) || (b.d - a.d);
    return assignRanks(rows, r => r.value, tie);
  }

  // CLASSIFICACIÓ PER EQUIPS: a cada aparell només compten les N millors notes (per defecte 3)
  function teamRanking(comp, group, opts = {}) {
    const apps = teamApps(comp, group.gender);
    const N = comp.teamCount || 3, min = comp.teamMin || 3, max = comp.teamMax || 6;
    const teams = (comp.teams || []).filter(t => t.category === group.category && genderOf(t) === genderOf(group) && t.level === group.level);
    const rows = withOrder(teams.map(t => {
      const members = (comp.entries || []).filter(e => e.teamId === t.id);
      const perApp = {}, counted = {};
      let total = 0, any = false;
      const allCounted = [];
      for (const a of apps) {
        const vals = members
          .map(e => ({ id: e.id, v: e.status === 'np' ? null : appScore(e, a, comp) }))
          .filter(x => x.v !== null)
          .sort((x, y) => y.v - x.v);
        const top = vals.slice(0, N);
        top.forEach(x => { (counted[x.id] = counted[x.id] || {})[a.id] = true; allCounted.push(x.v); });
        const sum = top.reduce((s, x) => s + x.v, 0);
        perApp[a.id] = { value: top.length ? sum : null, used: top.length, full: top.length >= N };
        if (top.length) { total += sum; any = true; }
      }
      // classifica si hi han competit (no NP) entre el mínim i el màxim de gimnastes
      const size = members.filter(e => e.status !== 'np').length;
      const eligible = size >= min && size <= max;
      return { team: t, name: t.name, members, perApp, counted, allCounted,
        total: (any && eligible) ? total : null, rawTotal: any ? total : null,
        complete: apps.every(a => perApp[a.id].full), size, eligible, undersize: size < min, oversize: size > max };
    }));
    let tie = null;
    if (comp.tieTeam === 'bestApp') tie = (a, b) => cmpDesc(apps.map(x => a.perApp[x.id].value), apps.map(x => b.perApp[x.id].value));
    if (comp.tieTeam === 'bestScore') tie = (a, b) => cmpDesc(a.allCounted, b.allCounted);
    return { apps, rows: assignRanks(rows, r => r.total, tie) };
  }

  // RÀNQUING DE JORNADES: suma de la nota final de cada gimnasta (i de cada equip que classifica) a totes
  // les competicions triades. Cada grup (categoria + gènere + nivell) té el seu. Qui no hi va, no suma.
  function seasonRanking(comps, settings, opts = {}) {
    const nameOf = opts.nameOf || (() => '');
    const groups = new Map();
    const grp = (category, gender, level) => {
      const key = groupKey(category, gender, level);
      if (!groups.has(key)) groups.set(key, { key, category, gender, level, people: new Map(), teams: new Map() });
      return groups.get(key);
    };
    for (const c of comps) {
      for (const g of groupsOf(c, settings)) {
        const S = grp(g.category, g.gender, g.level);
        for (const r of individualRanking(c, g, { nameOf }).rows) {
          const id = r.entry.gymnastId;
          if (!S.people.has(id)) S.people.set(id, { gymnastId: id, name: r.name, entry: r.entry, per: {}, sum: 0, n: 0 });
          const p = S.people.get(id);
          p.entry = r.entry; p.name = r.name;
          if (r.total !== null) { p.per[c.id] = r.total; p.sum += r.total; p.n++; } else if (r.np) p.per[c.id] = 'np';
        }
        for (const r of teamRanking(c, g).rows) {
          const id = norm(r.team.name) + '|' + (r.team.clubId || '');
          if (!S.teams.has(id)) S.teams.set(id, { id, name: r.team.name, team: r.team, per: {}, sum: 0, n: 0 });
          const t = S.teams.get(id);
          if (r.total !== null) { t.per[c.id] = r.total; t.sum += r.total; t.n++; }
        }
      }
    }
    const order = groupsOf({ entries: [], teams: [...groups.values()] }, settings).map(g => g.key);
    return order.map(k => groups.get(k)).map(g => {
      const rows = withOrder([...g.people.values()].map(p => Object.assign(p, { total: p.n ? p.sum : null })));
      const teams = withOrder([...g.teams.values()].filter(t => t.n).map(t => Object.assign(t, { total: t.sum })));
      return { key: g.key, category: g.category, gender: g.gender, level: g.level,
        rows: assignRanks(rows, r => r.total, null), teams: assignRanks(teams, r => r.total, null) };
    });
  }

  // fusiona a base les notes d'una altra còpia de les dades: de cada intent guanya el més recent (camp at).
  // Torna la llista d'intents que s'han agafat de l'altra còpia. El servidor (servidor/main.go) fa el mateix.
  function mergeScores(base, other) {
    const changed = [];
    const ocomps = new Map(((other && other.competitions) || []).map(c => [c.id, c]));
    for (const c of (base && base.competitions) || []) {
      const oc = ocomps.get(c.id);
      if (!oc) continue;
      const oents = new Map((oc.entries || []).map(e => [e.id, e]));
      for (const e of c.entries || []) {
        const oe = oents.get(e.id);
        if (!oe || !oe.scores || typeof oe.scores !== 'object') continue;
        if (!e.scores || typeof e.scores !== 'object') e.scores = {};
        for (const appId of Object.keys(oe.scores)) {
          const ol = Array.isArray(oe.scores[appId]) ? oe.scores[appId] : [];
          const l = Array.isArray(e.scores[appId]) ? e.scores[appId] : (e.scores[appId] = []);
          ol.forEach((x, i) => {
            if (x && (+x.at || 0) > (+(l[i] && l[i].at) || 0)) {
              while (l.length <= i) l.push({});
              l[i] = JSON.parse(JSON.stringify(x));
              changed.push({ compId: c.id, entryId: e.id, appId, i });
            }
          });
        }
      }
    }
    return changed;
  }

  // curs escolar a partir d'una data: setembre-agost
  function seasonFor(dateStr) {
    const m = /^(\d{4})-(\d{2})/.exec(dateStr || '');
    if (!m) return '';
    const y = +m[1], mo = +m[2];
    return mo >= 9 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
  }

  return { M, coll, norm, toM, parseScore, fmt, attemptValue, appResult, appScore, appDE, genderOf, appMode, enabledApps,
    totalApps, teamApps, entryTotal, groupKey, groupsOf, categoryForYear, cmpDesc, assignRanks, individualRanking,
    apparatusRanking, teamRanking, seasonRanking, mergeScores, seasonFor };
})();
/* ═══════════════════════════════════════════ ENGINE-END */
</script>

<script>
"use strict";

const APP_VERSION = '1.0.0';
const LS_KEY = 'notesgim.db';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const { coll, norm, fmt } = Engine;
const range = n => Array.from({ length: n }, (_, i) => i);

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ''); };
const ordinal = n => ({ 1: '1r', 2: '2n', 3: '3r', 4: '4t' }[n] || n + 'è');
// per a capçaleres en majúscules: «1r» i no «1R»
const ordHtml = n => { const o = ordinal(n); return `${o.match(/^\d+/)[0]}<span class="lc">${o.replace(/^\d+/, '')}</span>`; };

const ICONS = {
  salt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 11V9.5A2.5 2.5 0 0 1 9.5 7H20"/><path d="M13 7v11M8 18h10"/></svg>',
  barra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9h18" stroke-width="3"/><path d="M7 10.5 6 19M17 10.5l1 8.5"/></svg>',
  terra: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="currentColor"/></svg>',
  mini: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 13 20 8"/><path d="M5 13v6M19 8.5V19M3 19h18"/></svg>',
  paral: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h8M12 10h8"/><path d="M6 6v13M10 6v13M14 10v9M18 10v9"/></svg>',
  altre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="7"/></svg>',
};
const icon = a => `<span class="ico" aria-hidden="true">${ICONS[a.icon] || ICONS.altre}</span>`;

// valors per defecte segons la normativa UCEC dels JEEC i com treballa el Consell: les tutores donen la
// nota final de cada aparell (1 casella); el minitramp només el fan els nois, amb 2 salts (compta el

// 'apart' = només té la seva classificació, 'off' = no es fa
const DEFAULT_APPS = () => [
  { id: 'salt', name: 'Salt', icon: 'salt', modes: { F: 'total', M: 'total' }, attempts: 1, rule: 'best' },
  { id: 'barra', name: 'Barra', icon: 'barra', modes: { F: 'total', M: 'off' }, attempts: 1, rule: 'best' },
  { id: 'terra', name: 'Terra', icon: 'terra', modes: { F: 'total', M: 'total' }, attempts: 1, rule: 'best' },

  { id: 'paral', name: 'Paral·leles', icon: 'paral', modes: { F: 'off', M: 'off' }, attempts: 1, rule: 'best' },
];
const APP_MODES = [['total', 'Compta (general i equips)'], ['apart', 'Classificació a part'], ['off', 'No es fa']];

const DEFAULT_CATEGORIES = () => [

  { name: 'Aleví', from: 2015, to: 2016 },
  { name: 'Infantil', from: 2013, to: 2014 },
  { name: 'Cadet', from: 2011, to: 2012 },
  { name: 'Juvenil', from: 2009, to: 2010 },
  { name: 'Sènior', from: null, to: 2008 },
];
// aparells en format antic (enabled / inTotal / inTeam, només noies) → modes per gènere
function normalizeApps(list) {
  if (!Array.isArray(list) || !list.length) return DEFAULT_APPS();
  for (const a of list) {
    if (!a.modes || typeof a.modes !== 'object') {
      const m = a.enabled === false ? 'off' : a.inTotal === false ? 'apart' : 'total';
      const def = DEFAULT_APPS().find(d => d.id === a.id);
      a.modes = { F: m, M: def ? def.modes.M : 'off' };
    }
    for (const g of ['F', 'M']) if (!['total', 'apart', 'off'].includes(a.modes[g])) a.modes[g] = 'off';
    delete a.enabled; delete a.inTotal; delete a.inTeam;
    a.attempts = a.attempts === 2 ? 2 : 1;
    if (!['best', 'avg', 'sum'].includes(a.rule)) a.rule = 'best';
    if (!a.name) a.name = 'Aparell';
  }
  return list;
}
function normalizeCategories(list) {
  const defs = DEFAULT_CATEGORIES();
  if (!Array.isArray(list)) return defs;
  const yr = v => (v === '' || v === null || v === undefined || !Number.isFinite(+v)) ? null : Math.round(+v);
  return list.map(c => {
    if (c && typeof c === 'object') return { name: String(c.name || '').trim(), from: yr(c.from), to: yr(c.to) };
    const d = defs.find(x => norm(x.name) === norm(c));
    return { name: String(c ?? '').trim(), from: d ? d.from : null, to: d ? d.to : null };
  }).filter(c => c.name);
}
const COMP_DEFAULTS = () => ({
  scoring: 'simple', maxScore: 20, minScore: 3, apparatus: DEFAULT_APPS(),
  teamCount: 3, teamMin: 3, teamMax: 6, tieInd: 'shared', tieTeam: 'shared', tieApp: 'shared', autoTeams: true,
});
const COMP_KEYS = Object.keys(COMP_DEFAULTS());

function defaultDb() {

      logoL: null, logoR: null,

}

// accepta dades velles o importades i hi posa tot el que falti
function migrate(d) {

  if ((d.settings.rev || 0) < 3) {

    if (JSON.stringify(d.settings.levels) === '["A","B","F"]' && !usesF) d.settings.levels = ['A', 'B'];

    d.settings.rev = 3;
  }
  for (const k of ['clubs', 'gymnasts', 'teams', 'competitions']) if (!Array.isArray(d[k])) d[k] = [];
  d.meta = Object.assign({}, base.meta, d.meta || {});
  for (const g of d.gymnasts) g.gender = Engine.genderOf(g);
  for (const t of d.teams) { if (!Array.isArray(t.memberIds)) t.memberIds = []; t.gender = Engine.genderOf(t); }
  for (const c of d.competitions) normalizeComp(c, d.settings.compDefaults);
  return d;
}
function normalizeComp(c, defs) {
  const D = Object.assign(COMP_DEFAULTS(), defs || {});
  for (const k of COMP_KEYS) if (c[k] === undefined || c[k] === null) c[k] = JSON.parse(JSON.stringify(D[k]));
  c.apparatus = normalizeApps(c.apparatus);
  if (!Array.isArray(c.entries)) c.entries = [];
  if (!Array.isArray(c.teams)) c.teams = [];
  for (const e of c.entries) { if (!e.scores || typeof e.scores !== 'object') e.scores = {}; if (!e.status) e.status = ''; e.gender = Engine.genderOf(e); }
  for (const t of c.teams) t.gender = Engine.genderOf(t);
  if (typeof c.tutorsOn !== 'boolean') c.tutorsOn = false;
  if (typeof c.tutorPin !== 'string') c.tutorPin = '';
  return c;
}

/* ═══════════════════════════════════════════ desar
   1) Sempre: localStorage del navegador (a cada canvi).
   2) Si l'usuari vincula un fitxer (Chrome/Edge): també s'hi escriu a cada canvi.
   3) Sempre disponible: descarregar una còpia .json i restaurar-la. */
let db = null;
let saveTimer = null, saveError = false;
let fileHandle = null, fileState = 'none'; // none | ok | perm | err
let fileQueue = Promise.resolve(), fileDirty = false;

function loadDb() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    db = migrate(raw ? JSON.parse(raw) : null);
  } catch (e) {
    console.error(e);
    db = defaultDb();
    saveError = true;
  }
}
function commit() {
  db.meta.updated = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
  renderSaveState(true);
}
function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); saveError = false; }
  catch (e) { console.error(e); saveError = true; toast('No s’ha pogut desar al navegador. Descarrega una còpia de seguretat ara!', 'bad'); }
  if (fileHandle) queueFileWrite();
  if (server.on && server.role === 'admin') serverPush();
  renderSaveState(false);
}
/* ═══════════════════════════════════════════ MODE SERVIDOR (xarxa local, sense internet)
   Quan l'app s'obre des del programa NotesGim-servidor, les dades viuen al fitxer del servidor:
   l'ordinador de la taula (role admin) hi envia cada canvi i en rep les notes de les tutores al moment;
   des d'un altre aparell (role tutor) s'obre el mode tutora. */
const server = { on: false, role: null, version: null, urls: [], pushing: false, again: false, online: true, deferred: false };
async function api(path, opts = {}, timeout = 0) {
  const ctl = timeout ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), timeout) : null;
  try {
    const r = await fetch(path, Object.assign({ cache: 'no-store', headers: { 'Content-Type': 'application/json' }, signal: ctl && ctl.signal }, opts));
    if (r.status === 204) return null;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(j.error || ('HTTP ' + r.status)); err.status = r.status; throw err; }
    return j;
  } finally { if (t) clearTimeout(t); }
}
async function serverInit() {
  if (!location.protocol.startsWith('http')) return false;
  let info;
  try { info = await api('api/info', {}, 2500); } catch (_) { return false; }
  if (!info || info.app !== 'notesgim') return false;
  server.on = true; server.role = info.role; server.urls = info.urls || [];
  if (info.role === 'tutor') { await tutorStart(); return true; }
  const remote = await api('api/db');
  const has = d => d && ((d.gymnasts || []).length || (d.competitions || []).length);
  if (has(remote.db) && has(db)) {
    try { localStorage.setItem(LS_KEY + '.abans-servidor', JSON.stringify(db)); } catch (_) {}
    // es queda la còpia més nova sencera, i de l'altra només s'hi afegeixen les notes més noves
    if (Date.parse(db.meta.updated || 0) > Date.parse(((remote.db.meta) || {}).updated || 0)) Engine.mergeScores(db, remote.db);
    else { const local = db; db = migrate(remote.db); Engine.mergeScores(db, local); }
  } else if (has(remote.db)) db = migrate(remote.db);
  server.version = remote.version;
  flush();
  render();
  serverWaitLoop();
  return true;
}
function serverPush() {
  if (!server.on || server.role !== 'admin') return;
  if (server.pushing) { server.again = true; return; }
  server.pushing = true;
  api('api/db', { method: 'PUT', body: JSON.stringify({ db }) })
    .then(resp => { server.online = true; server.version = resp.version; if (resp.taken && resp.db) applyRemote(resp.db); })
    .catch(() => { server.online = false; })
    .finally(() => {
      server.pushing = false; renderSaveState(false);
      if (server.again) { server.again = false; serverPush(); } else if (!server.online) setTimeout(serverPush, 4000);
    });
}
async function serverWaitLoop() {
  for (;;) {
    try {
      const resp = await api('api/wait?since=' + server.version);
      if (!server.online) { server.online = true; renderSaveState(false); serverPush(); }
      if (resp) { server.version = resp.version; applyRemote(resp.db); }
    } catch (_) {
      if (server.online) { server.online = false; renderSaveState(false); }
      await new Promise(r => setTimeout(r, 3000));
    }
  }
}
const tutorTitle = a => a && a.by === 'tutor' ? `Nota entrada per ${a.who ? 'la tutora ' + a.who : 'una tutora'}${a.at ? ' a les ' + new Date(a.at).toLocaleTimeString('ca', { hour: '2-digit', minute: '2-digit' }) : ''}. Si la canvies, compta com a revisada.` : '';
// arriben notes noves del servidor (de les tutores): s'afegeixen sense trepitjar el que s'està escrivint
function applyRemote(remoteDb) {
  const changed = Engine.mergeScores(db, remoteDb);
  if (!changed.length) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (_) {}
  const c = curComp();
  if (ui.view === 'competicio' && c && ui.tab === 'notes' && $('#scoregrid')) {
    for (const ch of changed) {
      if (ch.compId !== c.id) continue;
      const e = c.entries.find(x => x.id === ch.entryId);
      if (!e) continue;
      const a = att(e, { id: ch.appId }, ch.i);
      $$(`#scoregrid input.sc[data-e="${e.id}"][data-a="${ch.appId}"][data-i="${ch.i}"]`).forEach(inp => {
        if (inp === document.activeElement) return;
        const m = Engine.toM(a[inp.dataset.f]);
        inp.value = m === null ? '' : fmt(m); inp.dataset.last = inp.value;
        inp.classList.toggle('tutor', a.by === 'tutor' && !a.ok); inp.title = tutorTitle(a);
      });
      refreshScoreRow(c, e);
    }
    const tb = $('#tutorreview'); if (tb) tb.outerHTML = tutorReviewBtn(c, groupsOf(c).find(x => x.key === ui.group));
    toast(`${plural(changed.length, 'nota nova', 'notes noves')} de les tutores.`);
  } else if ($('#dlg').open || $('#confirm').open) server.deferred = true;
  else renderKeepFocus();
}
// notes de tutores encara no revisades en un grup
function tutorPending(c, g) {
  let n = 0;
  for (const e of (g ? g.entries : c.entries)) for (const list of Object.values(e.scores || {})) for (const a of list || []) if (a && a.by === 'tutor' && !a.ok && a.v !== undefined && a.v !== null) n++;

}
function tutorReviewBtn(c, g) {

}

// IndexedDB mínima, només per recordar el fitxer vinculat entre sessions
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open('notesgim', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const tx = rq.result.transaction('kv', mode); const st = tx.objectStore('kv');
      const r = fn(st);
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    };
  });
}
const idbGet = k => idb('readonly', st => st.get(k)).catch(() => null);
const idbSet = (k, v) => idb('readwrite', st => st.put(v, k)).catch(() => null);
const idbDel = k => idb('readwrite', st => st.delete(k)).catch(() => null);
const fsSupported = () => typeof window.showSaveFilePicker === 'function';

function queueFileWrite() {
  fileDirty = true;
  fileQueue = fileQueue.then(writeFileNow).catch(() => {});
}
async function writeFileNow() {
  if (!fileHandle || !fileDirty) return;
  try {
    const p = await fileHandle.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') { fileState = 'perm'; renderSaveState(false); return; }
    fileDirty = false;
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(db, null, 1));
    await w.close();
    fileState = 'ok';
  } catch (e) { console.error(e); fileState = 'err'; fileDirty = true; }
  renderSaveState(false);
}
const FILE_TYPES = [{ description: 'Dades de NotesGim', accept: { 'application/json': ['.json'] } }];
const isNotesGim = d => d && typeof d === 'object' && Array.isArray(d.gymnasts) && Array.isArray(d.competitions);
async function readHandle(handle) {
  try { const f = await handle.getFile(); if (!f.size) return null; const d = JSON.parse(await f.text()); return isNotesGim(d) ? d : null; }
  catch (_) { return null; }
}
async function attachHandle(handle) {
  fileHandle = handle; await idbSet('fileHandle', handle);
  fileState = 'ok'; fileDirty = true; queueFileWrite(); await fileQueue;
  toast('A partir d’ara cada canvi també es desa a «' + handle.name + '».', 'ok');
  render();
}
// vincula un fitxer: si ja té dades de NotesGim, primer es pregunta què se'n fa (mai s'esborra sense avisar)
async function linkFile(mode) {
  if (!fsSupported()) { toast('Aquest navegador no pot desar directament a un fitxer. Fes servir «Descarrega còpia».', 'bad'); return; }
  try {
    const handle = mode === 'open'
      ? (await window.showOpenFilePicker({ types: FILE_TYPES }))[0]
      : await window.showSaveFilePicker({ suggestedName: 'notesgim-dades.json', types: FILE_TYPES });
    if ((await handle.requestPermission({ mode: 'readwrite' })) !== 'granted') { toast('Sense permís per escriure al fitxer.', 'bad'); return; }
    const inFile = await readHandle(handle);
    const info = d => `${plural(d.gymnasts.length, 'gimnasta', 'gimnastes')}, ${plural(d.competitions.length, 'competició', 'competicions')}`;
    if (inFile && (inFile.gymnasts.length || inFile.competitions.length)) {
      const load = !hasData() || await confirmBox(`El fitxer «${h(handle.name)}» ja té dades (${info(inFile)}).<br><br>Vols <b>fer servir les dades del fitxer</b>? Les d’aquest navegador (${info(db)}) se substituiran (pots desfer-ho just després).<br><br>Si cancel·les, no es toca res.`, { ok: 'Fes servir les del fitxer' });
      if (!load) return;
      withUndo('Dades carregades de «' + handle.name + '».', () => { db = migrate(inFile); });
    }
    await attachHandle(handle);
  } catch (e) { if (e.name !== 'AbortError') toast('No s’ha pogut vincular el fitxer: ' + e.message, 'bad'); }
}
async function regrantFile() {
  if (!fileHandle) return;
  try {
    const p = await fileHandle.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') { fileState = 'ok'; queueFileWrite(); await fileQueue; toast('Fitxer reactivat.', 'ok'); }
  } catch (e) { toast('No s’ha pogut accedir al fitxer.', 'bad'); }
  renderSaveState(false);
}
async function unlinkFile() {
  fileHandle = null; fileState = 'none'; await idbDel('fileHandle'); render();
}
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const stamp = () => { const d = new Date(); return today() + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'); };
function backupDownload() {
  db.meta.lastBackup = new Date().toISOString();

  downloadBlob(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }), `notesgim-copia-${stamp()}.json`);
  toast('Còpia descarregada. Guarda-la en un lloc segur (USB, núvol…).', 'ok');

}
function restoreFromText(text, sourceName) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('Aquest fitxer no és una còpia de NotesGim vàlida.', 'bad'); return; }
  if (!data || typeof data !== 'object' || !Array.isArray(data.gymnasts) || !Array.isArray(data.competitions)) {
    toast('Aquest fitxer no és una còpia de NotesGim vàlida.', 'bad'); return;
  }
  const info = `${plural(data.gymnasts.length, 'gimnasta', 'gimnastes')}, ${plural(data.competitions.length, 'competició', 'competicions')}`;
  confirmBox(`Vols substituir totes les dades actuals per les de «${h(sourceName)}» (${info})?<br><br>Les dades que tens ara es perdran (pots desfer-ho just després).`,
    { ok: 'Substitueix', danger: true }).then(ok => {

}

const clubName = id => (clubById(id) || {}).name || '';
const gymById = id => db.gymnasts.find(g => g.id === id);

const catOption = (name, selected) => { const d = catDef(name); return `<option value="${h(name)}" ${selected ? 'selected' : ''}>${h(name)}${d && yearsTxt(d) ? ` (${yearsTxt(d)})` : ''}</option>`; };
const catOptions = (v, extraIfMissing = true) => catNames().map(n => catOption(n, v === n)).join('') + (extraIfMissing && v && !catNames().includes(v) ? `<option selected>${h(v)}</option>` : '');
const genderOptions = v => GENDERS.map(([k, l]) => `<option value="${k}" ${genderOf({ gender: v }) === k ? 'selected' : ''}>${l}</option>`).join('');

// la categoria guardada no és la que toca per l'any de naixement (p. ex. després de passar de curs)

const groupLabel = g => `${g.category} ${genderWord(g.gender)} · Nivell ${g.level}`;

function toast(msg, type = '', opts = {}) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${h(msg)}</span>${opts.action ? `<button>${h(opts.action)}</button>` : ''}`;
  if (opts.action) el.querySelector('button').onclick = () => { el.remove(); opts.onAction(); };
  const box = $('#toasts');

  setTimeout(() => el.remove(), opts.action ? 9000 : type === 'bad' ? 7000 : 3800);
}

function confirmBox(msg, { ok = 'D’acord', danger = false, typed = null } = {}) {

      <div class="dlg-actions"><button value="ok" class="btn ${danger ? 'danger solid' : 'primary'}">${h(ok)}</button><button value="no" class="btn">Cancel·la</button></div></form>`;
    d.returnValue = '';

      res(d.returnValue === 'ok' && typedOk);
    };

  });

function withUndo(label, fn) {
  const snap = JSON.stringify(db);
  fn();
  commit(); render();
  const stamp = db.meta.updated;
  toast(label, 'ok', { action: 'Desfés', onAction: () => {
    if (db.meta.updated !== stamp) { toast('Ja no es pot desfer: s’han fet altres canvis després.', 'bad'); return; }
    db = migrate(JSON.parse(snap)); commit(); render(); toast('Desfet.');
  } });
}

// torna a pintar però deixa el focus on l'usuari l'ha posat (p. ex. Tab després d'editar una casella de configuració)
const FOCUS_KEYS = ['data-chg', 'data-i', 'data-k', 'data-key', 'data-act', 'data-scope', 'data-d', 'data-e', 'data-a', 'data-f', 'id', 'name'];
function renderKeepFocus() {
  setTimeout(() => {
    const a = document.activeElement;
    const key = a && a !== document.body && a.getAttribute ? FOCUS_KEYS.map(k => a.getAttribute(k)) : null;
    render();
    if (!key || key.every(v => v === null)) return;
    const el = $$('#main input, #main select, #main button, #main textarea').find(x => FOCUS_KEYS.every((k, i) => x.getAttribute(k) === key[i]));
    if (el) el.focus();
  }, 0);
}
const views = {};
function render() {
  const v = views[ui.view] || views.competicions;
  $('#main').innerHTML = v();
  if (ui.view === 'tutor') tutStatusBar();

function renderSaveState(busy) {
  const el = $('#savestate'); if (!el || !db) return;
  const parts = [];
  if (server.on && server.role === 'admin') {
    parts.push(server.online
      ? `<span title="Les dades es desen al fitxer del programa servidor i es reben les notes de les tutores"><span class="dot ${busy || server.pushing ? 'busy' : ''}"></span>Servidor · ${busy || server.pushing ? 'desant…' : 'desat'}</span>`
      : `<span title="Es continua desant en aquest navegador i s'enviarà quan torni la connexió"><span class="dot err"></span>Sense connexió amb el servidor</span>`);
    el.innerHTML = parts.join('');
    return;
  }
  if (saveError) parts.push(`<span><span class="dot err"></span>No s’ha pogut desar</span>`);
  else parts.push(`<span title="Les dades es desen automàticament en aquest navegador"><span class="dot ${busy ? 'busy' : ''}"></span>${busy ? 'Desant…' : 'Desat'}</span>`);
  const fileOk = fileHandle && fileState === 'ok';
  if (fileHandle) {
    if (fileState === 'perm') parts.push(`<button class="alert" data-act="regrantFile" title="El navegador demana permís per tornar a escriure al fitxer. Fins llavors només es desa al navegador.">⚠ Clica per tornar a desar a ${h(fileHandle.name)}</button>`);

    else parts.push(`<span title="També es desa en aquest fitxer">+ ${h(fileHandle.name)}</span>`);
  }
  if (!fileOk && hasData() && backupDue()) {
    parts.push(`<button class="alert" data-act="backup" title="No hi ha cap còpia recent de les dades fora del navegador">Fes una còpia</button>`);

const hasData = () => db.gymnasts.length > 0 || db.competitions.length > 0;
function backupDue() {
  if (!db.meta.lastBackup) return true;
  const last = Date.parse(db.meta.lastBackup), upd = Date.parse(db.meta.updated || 0);
  return upd > last && (Date.now() - last) > 3 * 24 * 3600 * 1000;

function compStats(c) {
  const active = c.entries.filter(e => e.status !== 'np');
  let done = 0, total = 0;
  for (const e of active) for (const a of Engine.enabledApps(c, genderOf(e))) { total++; if (Engine.appScore(e, a, c) !== null) done++; }
  return { entries: c.entries.length, teams: c.teams.length, done, total };
}

function newEntry(c, g, grp) {
  return { id: uid(), gymnastId: g.id, category: (grp ? grp.category : g.category) ?? '', gender: genderOf(grp || g),
    level: (grp ? grp.level : g.level) ?? '', clubId: g.clubId || null, teamId: null, bib: nextBib(c), status: '', scores: {} };
}
const hasScores = e => Object.values(e.scores || {}).some(arr => (arr || []).some(a => a && ['v', 'd', 'e', 'p'].some(k => a[k] !== undefined && a[k] !== null)));
// inscriu un equip de la llista general: crea l'equip a la competició i hi apunta les seves gimnastes
function enrollTeam(c, team) {
  let ct = c.teams.find(t => t.sourceTeamId === team.id);
  if (!ct) {
    ct = { id: uid(), name: team.name, clubId: team.clubId || null, category: team.category, gender: genderOf(team), level: team.level, sourceTeamId: team.id };
    c.teams.push(ct);
  }
  const problems = [], moved = [];
  for (const gid of team.memberIds) {
    const g = gymById(gid);
    if (!g) continue;
    let e = c.entries.find(x => x.gymnastId === gid);
    const existed = !!e;
    if (!e) { e = newEntry(c, g, ct); c.entries.push(e); }
    if (!sameGroup(e, ct)) {
      if (hasScores(e)) { problems.push(gymName(g)); continue; }
      moved.push(`${gymName(g)} (${existed ? `estava inscrita a ${e.category} ${e.level}` : `fitxa: ${g.category} ${g.level}`})`);
      e.category = ct.category; e.gender = ct.gender; e.level = ct.level;
    } else if (!existed && !sameGroup(g, ct)) moved.push(`${gymName(g)} (fitxa: ${g.category} ${g.level})`);
    e.teamId = ct.id; delete e.noAuto;
  }
  pruneAutoTeams(c);
  return { problems, moved };
}
// treu els equips automàtics que s'han quedat sense ningú (p. ex. perquè les seves gimnastes han anat al seu equip fix)
function pruneAutoTeams(c) {
  c.teams = c.teams.filter(t => !t.auto || c.entries.some(e => e.teamId === t.id));
}
// EQUIPS AUTOMÀTICS: a cada grup, les gimnastes d'una mateixa entitat que no tenen equip en formen un
// si n'hi ha prou (mínim 3). Primer s'omplen els equips automàtics que ja hi ha i tenen lloc; si en
// sobren més del màxim (6), es reparteixen en diversos equips. Les que ja tenen equip no es toquen.
// Mai es toca qui ja té equip, qui s'ha tret d'un equip a mà (noAuto), ni qui té un equip fix a «Equips».
// only: si es passa, només es col·loquen aquestes inscripcions (les que s'acaben d'inscriure).
function autoCompTeams(c, only) {
  const min = c.teamMin || 3, max = c.teamMax || 6;
  const onlyIds = only ? new Set(only.map(e => e.id)) : null;
  let made = 0, placed = 0;
  for (const g of groupsOf(c)) {
    const byClub = new Map();
    for (const e of sortEntries(g.entries)) {
      if (e.teamId || !e.clubId || e.status === 'np' || e.noAuto || (onlyIds && !onlyIds.has(e.id))) continue;
      if (db.teams.some(t => t.memberIds.includes(e.gymnastId) && sameGroup(t, e))) continue;
      if (!byClub.has(e.clubId)) byClub.set(e.clubId, []);
      byClub.get(e.clubId).push(e);
    }
    for (const [clubId, free] of byClub) {
      const size = t => c.entries.filter(e => e.teamId === t.id).length;
      for (const t of compTeamsOf(c, g).filter(t => t.auto && t.clubId === clubId)) {
        while (free.length && size(t) < max) { free.shift().teamId = t.id; placed++; }
      }
      if (free.length < min) continue;
      const existing = compTeamsOf(c, g).filter(t => t.clubId === clubId).length;
      const sizes = splitSizes(free.length, min, max), k = sizes.length;
      for (let i = 0; i < k; i++) {
        const n = sizes[i];
        const num = existing + k > 1 ? ' ' + (existing + i + 1) : '';
        const t = { id: uid(), name: clubName(clubId) + num, clubId, category: g.category, gender: g.gender, level: g.level, sourceTeamId: null, auto: true };
        c.teams.push(t); made++;
        free.splice(0, n).forEach(e => { e.teamId = t.id; placed++; });
      }
    }
  }
  return { made, placed };
}
// després d'inscriure gimnastes soltes: si tenen un equip fix (a «Equips»), van a aquest equip; si l'equip
// encara no és a la competició, s'hi crea (amb les seves companyes que ja hi siguin inscrites)
function autoAssignTeams(c, entries) {
  for (const e of entries) {
    if (e.teamId) continue;
    const t = db.teams.find(t => t.memberIds.includes(e.gymnastId) && sameGroup(t, e));
    if (!t) continue;
    let ct = c.teams.find(x => x.sourceTeamId === t.id);
    if (!ct) { ct = { id: uid(), name: t.name, clubId: t.clubId || null, category: t.category, gender: genderOf(t), level: t.level, sourceTeamId: t.id }; c.teams.push(ct); }
    e.teamId = ct.id;
  }
}

  const ap = `<button class="pill ${ui.app === 'all' ? 'on' : ''}" data-act="pickApp" data-a="all">Totes les notes</button>` +

  const help = `<p class="small muted">Escriu la nota i prem <b>Intro</b> per baixar a la gimnasta següent. Es pot fer servir coma o punt (8,35 o 8.35). Tot es desa sol.
    ${c.scoring === 'detailed' ? 'Nota = D + E − Penalització.' : ''} ${Engine.toM(c.minScore) ? `Qui fa l’exercici té com a mínim ${fmt(Engine.toM(c.minScore))} punts (un 0 vol dir que no l’ha fet).` : ''}</p>`;
  const table = ui.app === 'all' ? notesAllTable(c, g, apps) : notesAppTable(c, g, apps.find(a => a.id === ui.app));
  const tutLine = server.on && c.tutorsOn ? `<div class="note small">Tutores: codi <b>${h(c.tutorPin)}</b>${server.urls.length ? ` · obren al mòbil ${server.urls.map(u => `<b>${h(u)}</b>`).join(' o ')}` : ''}. Les seves notes surten amb fons groc. ${tutorReviewBtn(c, g)}</div>` : '';
  return `<div class="pills">${gp}</div><div class="pills">${ap}</div>
    <div class="progress" id="progress">${progressHtml(c, g)}</div>${tutLine}${help}${table}`;
}
function progressHtml(c, g) {
  const active = g.entries.filter(e => e.status !== 'np');
  return Engine.enabledApps(c, g.gender).map(a => {
    const n = active.filter(e => Engine.appScore(e, a, c) !== null).length;
    const full = active.filter(e => Engine.appResult(e, a, c).complete).length;
    const tip = (a.attempts || 1) > 1 && a.rule !== 'best' && n > full ? ` <span class="badge warn" title="Amb «${a.rule === 'sum' ? 'la suma' : 'la mitjana'}» calen els dos intents">${n - full} amb 1 intent</span>` : '';
    return `<span>${icon(a)} ${h(a.name)}: <b>${n}/${active.length}</b>${tip}</span>`;
  }).join('');
}
function minHint(c, raw) {
  const m = Engine.toM(raw), min = Engine.toM(c.minScore) || 0;

function setAttemptField(e, appId, i, f, val) {
  if (!e.scores || typeof e.scores !== 'object') e.scores = {};

  while (arr.length <= i) arr.push({});
  const at = arr[i] || (arr[i] = {});
  if (val === null) delete at[f]; else at[f] = val;
  at.at = Date.now();                       // hora del canvi: si hi ha dues versions, guanya la més nova
  delete at.by; delete at.who; delete at.ok; // si la toca l'organització, ja no és «de tutora per revisar»
  if (f === 'v') {

    delete at.d; delete at.e; delete at.p; delete at.src;
    return;
  }
  // mode detallat: guardem també la nota resultant (src 'de'), perquè si es passa a mode simple no es perdi.
  // Si no hi ha ni D ni E, una nota final d'abans (entrada en mode simple) es conserva.
  const hasDE = (at.d !== undefined && at.d !== null) || (at.e !== undefined && at.e !== null);
  const v = Engine.attemptValue({ d: at.d, e: at.e, p: at.p }, 'detailed');
  if (hasDE) { if (v !== null) { at.v = v / 1000; at.src = 'de'; } else if (at.src === 'de') { delete at.v; delete at.src; } }
  else if (at.src === 'de') { delete at.v; delete at.src; }
}

const IMPORT_FIELDS = [['', '— no l’importis —'], ['name', 'Nom'], ['surname', 'Cognoms'], ['full', 'Nom i cognoms'], ['club', 'Entitat'],
  ['gender', 'Gènere'], ['category', 'Categoria'], ['level', 'Nivell'], ['birth', 'Any / data de naixement'], ['team', 'Equip']];
// F / M / Femení / Masculí / noia / noi / dona / home… → 'F' | 'M' | null
function parseGender(v) {
  const x = norm(v).replace(/\.$/, '');
  if (!x) return null;
  if (/^(f|fem|femeni|femenina|femenino|noia|nena|dona|d|mujer|chica|nina|girl|female|w)$/.test(x)) return 'F';
  if (/^(m|masc|masculi|masculino|noi|nen|home|h|hombre|chico|nino|boy|male)$/.test(x)) return 'M';
  return null;
}
function guessField(header) {
  const x = norm(header);
  if (!x) return '';
  if (/^(genere|sexe|sexo|genero|gender|noi\/noia|noia\/noi)$/.test(x)) return 'gender';
  if (/^(nom i cognoms|nom complet|esportista|gimnasta|alumne|alumna|nombre y apellidos|nombre completo)$/.test(x)) return 'full';
  if (/^(cognoms?|apellidos?)/.test(x)) return 'surname';
  if (/^(nom|nombre|name)$/.test(x)) return 'name';
  if (/^(entitat|club|escola|centre|colegio|entidad|club\/escola|escola\/club|nom entitat|nom de l'entitat)$/.test(x)) return 'club';
  if (/^categori/.test(x)) return 'category';
  if (/^(nivell|nivel|level)/.test(x)) return 'level';
  if (/^(any|ano|any naixement|any de naixement|data naixement|data de naixement|naixement|fecha nacimiento|fecha de nacimiento|nacimiento|birth|data)$/.test(x)) return 'birth';
  if (/^(equip|equipo|team)/.test(x)) return 'team';
  return '';
}
function splitRows(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim() !== '');
  if (!lines.length) return [];
  // amb tabuladors (enganxat d'Excel) o punt i coma, es parteix per aquí; amb comes només si totes les files en tenen
  // el mateix nombre (si no, és una sola columna del tipus «COGNOMS, NOM»)
  const anyTab = lines.some(l => l.includes('\t')), anySemi = lines.some(l => l.includes(';'));
  const commas = new Set(lines.map(l => (l.match(/,/g) || []).length));
  const delim = anyTab ? '\t' : anySemi ? ';' : (commas.size === 1 && !commas.has(0) && guessField(lines[0]) !== 'full' && lines.length > 1 && !lines.slice(1).every(l => /^[^,]+,\s*[^,]+$/.test(l))) ? ',' : null;
  if (!delim) return lines.map(l => [l.trim()]);
  return lines.map(l => {
    if (delim === '\t') return l.split('\t').map(s => s.trim());
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === delim) { out.push(cur.trim()); cur = ''; } else cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}
function importAnalyze(text) {
  const rows = splitRows(text);
  if (!rows.length) return null;
  const width = Math.max(...rows.map(r => r.length));
  const guessed = range(width).map(i => guessField(rows[0][i]));
  // la primera fila són títols si hi ha una columna de nom reconeguda, o almenys dues de reconegudes
  const hasHeader = guessed.some(f => ['name', 'surname', 'full'].includes(f)) || guessed.filter(Boolean).length >= 2;
  const map = hasHeader ? guessed : (width === 1 ? ['full'] : ['name', 'surname', 'club', 'gender', 'category', 'level', 'birth', 'team'].slice(0, width).concat(range(Math.max(0, width - 8)).map(() => '')));
  return { rows, width, hasHeader, map, defCat: '', defLevel: '', defGender: 'F' };
}
function importResolve(imp) {
  const data = imp.hasHeader ? imp.rows.slice(1) : imp.rows;
  const col = f => imp.map.indexOf(f);
  const get = (r, f) => { const i = col(f); return i >= 0 ? String(r[i] ?? '').trim() : ''; };
  const seen = new Set();
  return data.map(r => {
    let name = get(r, 'name'), surname = get(r, 'surname');
    const full = get(r, 'full');
    if (!name && full) {
      if (full.includes(',')) { const [s, n] = full.split(','); surname = surname || s.trim(); name = n.trim(); }
      else name = full;
    }
    const club = get(r, 'club');
    const by = (/(19|20)\d{2}/.exec(get(r, 'birth')) || [])[0] || '';
    const gender = parseGender(get(r, 'gender')) || imp.defGender || 'F';
    // categoria: la de la columna; si no n'hi ha, la que toca per l'any; si tampoc, la triada per defecte
    const catRaw = get(r, 'category') || (by && catForYear(by)) || imp.defCat, levelRaw = get(r, 'level') || imp.defLevel;
    const category = matchFromList(catNames(), catRaw) || catRaw;
    const level = matchFromList(S().levels, levelRaw) || levelRaw.toUpperCase();
    const team = get(r, 'team');
    const key = norm(name + ' ' + surname) + '|' + norm(club);
    let status = 'new';
    if (!name) status = 'noname';
    else if (seen.has(key)) status = 'dupfile';
    else if (db.gymnasts.some(g => norm(gymName(g)) === norm(name + ' ' + surname) && norm(clubName(g.clubId)) === norm(club))) status = 'exists';
    seen.add(key);
    return { name, surname, club, gender, category, level, birthYear: by, team, status,
      newCat: category && !catNames().includes(category), newLevel: level && !S().levels.includes(level) };
  });
}

// reparteix n gimnastes en equips de min a max: el mínim d'equips possible i el més igualats possible.
// Si no hi ha manera que tots els equips tinguin el mínim, se'n fan menys i les que sobren queden soles.
function splitSizes(n, min, max) {
  if (n < min) return [];
  let k = Math.ceil(n / max);
  while (k > 1 && Math.floor(n / k) < min) k--;
  const used = Math.min(n, k * max), base = Math.floor(used / k), extra = used % k;
  return range(k).map(i => base + (i < extra ? 1 : 0));
}
// proposta automàtica: gimnastes de la mateixa entitat + gènere + categoria + nivell que no tenen equip
function proposeTeams() {
  const min = S().compDefaults.teamMin, max = S().compDefaults.teamMax;
  const taken = new Set(db.teams.flatMap(t => t.memberIds));
  const buckets = new Map();
  for (const g of db.gymnasts) {
    if (g.archived || taken.has(g.id) || !g.clubId || !g.category || !g.level) continue;
    const k = g.clubId + '||' + genderOf(g) + '||' + g.category + '||' + g.level;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(g);
  }
  const out = [];
  for (const list of buckets.values()) {
    if (list.length < min) continue;
    list.sort((a, b) => coll(gymName(a), gymName(b)));
    const sizes = splitSizes(list.length, min, max), k = sizes.length;
    let p = 0;
    for (let i = 0; i < k; i++) {
      const size = sizes[i];
      const members = list.slice(p, p + size); p += size;
      const g0 = members[0];
      const base = `${clubName(g0.clubId)} ${g0.category} ${g0.level} ${genderWord(g0.gender)}`;
      const already = db.teams.filter(t => t.clubId === g0.clubId && sameGroup(t, g0)).length;
      out.push({ name: base + (k > 1 || already ? ' ' + (already + i + 1) : ''), clubId: g0.clubId,
        gender: genderOf(g0), category: g0.category, level: g0.level, memberIds: members.map(m => m.id) });
    }
  }
  return out;
}

/* ═══════════════════════════════════════════ MODE TUTORA (mòbil a la Wi-Fi del servidor)

const TUT_KEY = 'notesgim.tutor';
const tut = { pin: '', who: '', comps: [], compId: null, group: null, app: null, version: null, queue: [], error: '', online: true, sending: false };
function tutLoad() { try { Object.assign(tut, JSON.parse(localStorage.getItem(TUT_KEY) || '{}')); } catch (_) {} if (!Array.isArray(tut.queue)) tut.queue = []; }
function tutSave() { try { localStorage.setItem(TUT_KEY, JSON.stringify({ pin: tut.pin, who: tut.who, compId: tut.compId, group: tut.group, app: tut.app, queue: tut.queue })); } catch (_) {} }
async function tutorStart() {
  document.body.classList.add('tutor-mode');
  tutLoad();
  ui.view = 'tutor';
  if (tut.pin) { try { await tutFetch(); } catch (_) { tut.online = false; } }
  render();
  tutWaitLoop();
  tutSend();
}
async function tutFetch(since) {
  try {
    const j = await api(`api/tutor?pin=${encodeURIComponent(tut.pin)}${since != null ? '&since=' + since : ''}`);
    if (!j) return false;
    tut.error = ''; tut.comps = j.comps || []; tut.version = j.version; tut.online = true;
    for (const op of tut.queue) tutApplyLocal(op);   // el que encara no s'ha enviat, es continua veient
    return true;
  } catch (e) {
    if (e.status === 403) { tut.error = e.message; tut.comps = []; return true; }
    throw e;
  }
}
async function tutWaitLoop() {
  for (;;) {
    if (!tut.pin || !tut.comps.length) { await new Promise(r => setTimeout(r, 3000)); continue; }
    try {
      const changed = await tutFetch(tut.version);
      if (!tut.online) tut.online = true;
      if (changed) tutRefresh();
    } catch (_) { tut.online = false; tutStatusBar(); await new Promise(r => setTimeout(r, 3000)); }
  }
}
const tutComp = () => tut.comps.find(c => c.id === tut.compId) || tut.comps[0];
function tutApplyLocal(op) {
  const c = tut.comps.find(x => x.id === op.compId); if (!c) return;
  const e = c.entries.find(x => x.id === op.entryId); if (!e) return;
  e.scores = e.scores || {};
  const l = e.scores[op.appId] = e.scores[op.appId] || [];
  while (l.length <= op.i) l.push({});
  l[op.i] = { v: op.value, by: 'tutor', at: op.at, mine: true };
}
// envia la cua de notes, d'una en una i en ordre
async function tutSend() {
  if (tut.sending) return;
  tut.sending = true;
  try {
    while (tut.queue.length) {
      const op = tut.queue[0];
      try {
        await api('api/score', { method: 'POST', body: JSON.stringify({ pin: tut.pin, who: tut.who, compId: op.compId, entryId: op.entryId, appId: op.appId, i: op.i, value: op.value }) });
        tut.online = true;
        tut.queue.shift(); tutSave(); tutMark(op, 'ok');
      } catch (e) {
        if (e.status && e.status !== 500) { tut.queue.shift(); tutSave(); tutMark(op, 'err'); toast(e.message, 'bad'); continue; }
        tut.online = false; tutStatusBar();
        await new Promise(r => setTimeout(r, 4000));
      }
    }
  } finally { tut.sending = false; tutStatusBar(); }
}
function tutMark(op, st) {
  const el = $(`[data-st="${op.entryId}:${op.appId}:${op.i}"]`);
  if (el) { el.textContent = st === 'ok' ? '✓' : st === 'err' ? '✕' : '…'; el.className = 'st ' + st; }
}
function tutStatusBar() {
  const el = $('#tutstatus'); if (!el) return;
  el.innerHTML = !tut.online ? `<span class="badge bad">Sense connexió: ${plural(tut.queue.length, 'nota pendent', 'notes pendents')} d’enviar (s’enviaran soles)</span>`
    : tut.queue.length ? `<span class="badge warn">Enviant ${plural(tut.queue.length, 'nota', 'notes')}…</span>` : '<span class="badge ok">Connectada · tot enviat</span>';
}
// dades noves del servidor: s'actualitzen les caselles que no s'estan editant
function tutRefresh() {
  if (!$('#scoregrid')) { render(); return; }
  const c = tutComp(); if (!c) { render(); return; }
  $$('#scoregrid input.sc').forEach(inp => {
    if (inp === document.activeElement) return;
    const e = c.entries.find(x => x.id === inp.dataset.e); if (!e) return;
    const a = ((e.scores || {})[inp.dataset.a] || [])[+inp.dataset.i] || {};
    const m = Engine.toM(a.v); inp.value = m === null ? '' : fmt(m); inp.dataset.last = inp.value;
  });
  tutStatusBar();
}

  const c = tutComp();
  if (!tut.pin || !c) return `<section style="max-width:420px;margin:0 auto">

      <form data-form="tutLogin"><div class="grid2" style="grid-template-columns:1fr">
        <label class="f"><span>Codi</span><input type="text" name="pin" inputmode="numeric" required value="${h(tut.pin)}" autofocus style="font-size:22px;letter-spacing:.15em"></label>

        <div class="dlg-actions"><button class="btn primary">Entra</button></div></form></div></section>`;
  if (tut.compId !== c.id) tut.compId = c.id;
  const groups = Engine.groupsOf(c, S()).filter(g => g.entries.length);
  if (!groups.find(g => g.key === tut.group)) tut.group = groups[0] && groups[0].key;
  const g = groups.find(x => x.key === tut.group);
  const apps = g ? Engine.enabledApps(c, g.gender) : [];
  if (!apps.find(a => a.id === tut.app)) tut.app = apps[0] && apps[0].id;
  const a = apps.find(x => x.id === tut.app);
  tutSave();
  const n = a ? Math.max(1, a.attempts || 1) : 1;
  const rows = g && a ? [...g.entries].sort((x, y) => (+x.bib || 1e9) - (+y.bib || 1e9)).map(e => {
    const np = e.status === 'np';
    const cells = range(n).map(i => {
      const at = ((e.scores || {})[a.id] || [])[i] || {};
      const m = Engine.toM(at.v);
      return `<td class="num"><input type="text" inputmode="decimal" autocomplete="off" class="sc" value="${m === null ? '' : fmt(m)}" data-last="${m === null ? '' : fmt(m)}"
        data-chg="tscore" data-e="${e.id}" data-a="${a.id}" data-i="${i}" data-f="v" data-col="${a.id}:${i}:v" ${np ? 'disabled' : ''} aria-label="${h(a.name)} ${h(e.name)}">
        <span class="st" data-st="${e.id}:${a.id}:${i}"></span></td>`;
    }).join('');
    return `<tr class="${np ? 'np' : ''}"><td class="num">${h(e.bib)}</td><td>${h(e.name)}${np ? ' <span class="badge">NP</span>' : ''}<br><span class="small muted">${h(e.club)}</span></td>${cells}</tr>`;
  }).join('') : '';
  return `<section>
    <div class="page-head"><h1 style="font-size:19px">${h(c.name)}</h1><div class="actions"><span id="tutstatus"></span><button class="btn sm" data-act="tutLogout">Surt</button></div></div>
    ${tut.comps.length > 1 ? `<div class="pills">${tut.comps.map(x => `<button class="pill ${x.id === c.id ? 'on' : ''}" data-act="tutComp" data-id="${x.id}">${h(x.name)}</button>`).join('')}</div>` : ''}
    <div class="pills">${groups.map(x => `<button class="pill ${x.key === tut.group ? 'on' : ''}" data-act="tutGroup" data-g="${h(x.key)}">${h(groupLabel(x))}</button>`).join('')}</div>
    <div class="pills">${apps.map(x => `<button class="pill ${x.id === tut.app ? 'on' : ''}" data-act="tutApp" data-a="${x.id}">${icon(x)} ${h(x.name)}</button>`).join('')}</div>
    <p class="small muted">Escriu la nota final i prem <b>Intro</b> (o «Següent» al mòbil). S’envia sola a la taula.${n > 1 ? ' Hi ha 2 salts: compta el millor.' : ''}</p>
    ${a ? `<div class="tbl-wrap grid-wrap"><table class="tbl" id="scoregrid"><thead><tr><th class="num">Dors.</th><th>Gimnasta</th>${range(n).map(i => `<th class="num">${n > 1 ? ordHtml(i + 1) + ' salt' : icon(a) + ' ' + h(a.name)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">No hi ha cap aparell per a aquest grup.</div>'}
  </section>`;
};
