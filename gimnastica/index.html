    const open = print || ui.openTeams.has(r.team.id);
    const tg = print ? '' : ` <button class="tg" data-act="toggleTeam" data-id="${r.team.id}" aria-expanded="${open}" title="Mostra o amaga les gimnastes de l’equip">${open ? '▾' : '▸'} ${plural(r.members.length, 'gimnasta', 'gimnastes')}</button>`;
    const chg = teamPrevChange(c, r.team);
    const chgHtml = chg ? `<div class="small chg">⚠ Canvis respecte ${deN(`«${h(chg.comp.name)}»`)} (${fmtDate(chg.comp.date)}): ${h(chgTxt(chg))}. Al rànquing del curs continua sumant com el mateix equip.</div>` : '';
    const top = `<tr class="team-row ${medal(r.rank)}"><td class="num pos">${r.eligible ? posTxt(r) : 'NC'}</td><td>${h(r.team.name)}${tg}${print ? (why ? ` <span class="small">(${h(why)})</span>` : '') : warn}${chgHtml}</td>
      <td class="hide-ph">${h(clubName(r.team.clubId))}</td>${apps.map(a => `<td class="num">${fmt(r.perApp[a.id].value)}</td>`).join('')}
      <td class="num total">${fmt(r.eligible ? r.total : r.rawTotal)}</td></tr>`;
    const mem = sortEntries(r.members).map(e => `<tr class="member ${open ? '' : 'hidden'}" data-mt="${r.team.id}"><td></td><td>${h(entryName(e))}${e.status === 'np' ? ' (NP)' : ''}</td><td class="hide-ph">${h(clubName(e.clubId))}</td>
      ${apps.map(a => { const v = Engine.appScore(e, a, c); const cnt = r.counted[e.id] && r.counted[e.id][a.id];
        return `<td class="num ${v === null ? '' : cnt ? 'cnt' : 'disc'}">${fmt(v)}</td>`; }).join('')}<td></td></tr>`).join('');
    return top + mem;
  }).join('');
  const all2 = print ? '' : `<div class="toolbar" style="margin:0 0 8px"><button class="btn sm" data-act="toggleAllTeams" data-open="1" data-ids="${rows.map(r => r.team.id).join(',')}">▾ Desplega tots els equips</button>
    <button class="btn sm ghost" data-act="toggleAllTeams" data-open="" data-ids="${rows.map(r => r.team.id).join(',')}">▸ Plega’ls</button></div>`;
  return `${all2}<div class="${print ? '' : 'tbl-wrap'}"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>${cancelledNote(c, cancelled)}`;
}

function rankingData() {
  const seasons = [...new Set(db.competitions.map(c => c.season).filter(Boolean))].sort().reverse();
  if (!seasons.includes(ui.rkSeason)) ui.rkSeason = seasons[0] || '';
  ui.rkOff = ui.rkOff || {};
  const all = db.competitions.filter(c => c.season === ui.rkSeason).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const comps = all.filter(c => !ui.rkOff[c.id]);
  return { seasons, all, comps, groups: Engine.seasonRanking(comps, S(), { nameOf: entryName, teamGone: teamGoneBy, allComps: all }) };
}
const jLabel = (comps, c) => 'J' + (comps.indexOf(c) + 1);
const gymNames = ids => { const l = ids.map(id => gymName(gymById(id))); return l.length <= 1 ? (l[0] || '') : `${l.slice(0, -1).join(', ')} i ${l[l.length - 1]}`; };
const chgTxt = x => [x.added.length ? `${x.added.length > 1 ? 'entren' : 'entra'} ${gymNames(x.added)}` : '', x.removed.length ? `${x.removed.length > 1 ? 'en surten' : 'en surt'} ${gymNames(x.removed)}` : ''].filter(Boolean).join('; ');
// canvis d'un equip del rànquing, d'una jornada a l'altra (només s'avisa: la puntuació continua sumant)

/* ─── Equip de cada gimnasta (es tria a la mateixa fitxa) */
function teamOptionsFor(g, current) {
  const cur = current && !String(current).startsWith('__') ? teamById(current) : null;
  const list = db.teams.filter(t => sameGroup(t, g) || t === cur).sort((a, b) => coll(a.name, b.name));
  const own = g.clubId ? list.filter(t => t.clubId === g.clubId) : [], other = list.filter(t => !own.includes(t));
  const max = S().compDefaults.teamMax;
  const opt = t => { const n = t.memberIds.length, mine = t.memberIds.includes(g.id);
    return `<option value="${t.id}" ${t.id === current ? 'selected' : ''}>${h(t.name)}${sameGroup(t, g) ? '' : ' (un altre grup)'}${own.includes(t) || !t.clubId ? '' : ' · ' + h(clubName(t.clubId))} — ${n}/${max}${n >= max && !mine ? ' · ple' : ''}</option>`; };
  return `<option value="" ${!current ? 'selected' : ''}>Automàtic (per entitat)</option>
    ${own.map(opt).join('')}${other.length ? (g.clubId ? `<optgroup label="Altres entitats">${other.map(opt).join('')}</optgroup>` : other.map(opt).join('')) : ''}
    <option value="__none" ${current === '__none' ? 'selected' : ''}>Només individual (sense equip)</option>
    <option value="__new" ${current === '__new' ? 'selected' : ''}>＋ Equip nou…</option>`;
}
// l'equip triat al desplegable de la fitxa, si ja és ple (sense comptar-hi la gimnasta) i no hi era
function fullTeamFor(value, g) {
  const t = value && !String(value).startsWith('__') ? teamById(value) : null;
  if (!t || (g && t.memberIds.includes(g.id))) return null;
  return t.memberIds.length >= (S().compDefaults.teamMax || 6) ? t : null;
}
function teamSetMsg(g, r) {
  const t = r.team, n = t ? t.memberIds.length : 0, max = S().compDefaults.teamMax;
  // (on ha canviat, i a les competicions que vénen on no, amb quin equip hi continua i per què)
  const where = (r.touched.length ? ` També a: ${r.touched.join(', ')}.` : '')
    + (r.skipped || []).map(x => ` A ${x.comp} continua ${x.team ? `a l’equip ${x.team}` : 'com a individual'}: ${x.why}.`).join('');
  const rm = rotMoveNotes(r.rot);
  return { type: n > max ? 'bad' : 'ok', actions: rm.actions, msg: (t ? `${gymName(g)} → ${t.name} (${plural(n, 'gimnasta', 'gimnastes')}).${where}${n > max ? ` Compte: el màxim és ${max}; si se’n presenten més de ${max}, no classificarà.` : ''}`
    : g.noTeam ? `${gymName(g)}: només individual.${where}` : clubDeclared(null, g.clubId, g) ? `${gymName(g)}: sense equip. La seva entitat ja ha dit els seus equips en aquest grup al full d’inscripció: anirà com a individual (si cal, tria-li l’equip).${where}`
    : `${gymName(g)}: sense equip; quan s’inscrigui anirà amb ${mf(g, 'els', 'les')} de la seva entitat.${where}`) + rm.msg };
}

/* ─── Fulls d'inscripció dels clubs (l'Excel .xlsx del Consell, tal com l'envia el club)
   Es llegeix sense internet ni llibreries (un .xlsx és un zip amb XML a dins). Del model del Consell —fulles
   INDIVIDUAL-A/B i EQUIPS-A-<CATEGORIA>— se n'agafen l'entitat, el nivell, l'entrenador/a i el delegat/da, i
   cada esportista (cognoms, nom i any de naixement) amb el seu equip (EQUIP 1, 2, 3). Es reconeix pels títols
   (COGNOMS · NOM · ANY NAIXEMENT, ENTITAT, NIVELL), no per la posició exacta de les cel·les. */
const XLSX_MAX = 25e6;

function teamPickList(v, showAll, teamId) {
  if (!v.category || !v.level) return `<p class="muted" style="padding:10px">Tria la categoria i el nivell per veure les gimnastes.</p>`;
  const list = db.gymnasts.filter(g => (!g.archived || v.memberIds.includes(g.id)) &&
    ((sameGroup(g, v) && (showAll || !v.clubId || g.clubId === v.clubId)) || v.memberIds.includes(g.id)))
    .sort((a, b) => coll(clubName(a.clubId), clubName(b.clubId)) || coll(gymName(a), gymName(b)));
  if (!list.length) return `<p class="muted" style="padding:10px">No hi ha gimnastes ${deN(h(v.category))} ${genderWord(v.gender)} · nivell ${h(v.level)}${v.clubId && !showAll ? ' en aquesta entitat' : ''}. Revisa el gènere, la categoria i el nivell de les fitxes.</p>`;
  return list.map(g => {
    const other = db.teams.find(t => t.id !== teamId && t.memberIds.includes(g.id) && sameGroup(t, v));
    return `<label><input type="checkbox" name="m" value="${g.id}" ${v.memberIds.includes(g.id) ? 'checked' : ''} data-chg="teamCount"> ${h(gymName(g))}
      <span class="muted">${h(clubName(g.clubId))}${!sameGroup(g, v) ? ` · ara és ${h(g.category)} ${genderWord(g.gender)} ${h(g.level)}` : ''}${other ? ` · ara a «${h(other.name)}»` : ''}</span></label>`;
  }).join('');
}
// reparteix n gimnastes en equips de min a max: el mínim d'equips possible i el més igualats possible.
// Si no hi ha manera que tots els equips tinguin el mínim, se'n fan menys i les que sobren queden soles.
function splitSizes(n, min, max) {
  if (n < min) return [];
  let k = Math.ceil(n / max);
  while (k > 1 && Math.floor(n / k) < min) k--;
  const used = Math.min(n, k * max), base = Math.floor(used / k), extra = used % k;
  return range(k).map(i => base + (i < extra ? 1 : 0));
}
// proposta automàtica: gimnastes de la mateixa entitat + gènere + categoria + nivell que no tenen equip
function proposeTeams() {
  const min = S().compDefaults.teamMin, max = S().compDefaults.teamMax;
  const buckets = new Map();
  for (const g of db.gymnasts) {
    if (g.archived || g.noTeam || !g.clubId || !g.category || !g.level || db.teams.some(t => t.memberIds.includes(g.id) && sameGroup(t, g))) continue;
    if (clubDeclared(null, g.clubId, g)) continue;   // (l'entitat ja ha dit els seus equips en aquest grup)
    const k = g.clubId + '||' + genderOf(g) + '||' + g.category + '||' + g.level;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(g);
  }
  const out = [];
  for (const list of buckets.values()) {
    if (list.length < min) continue;
    list.sort((a, b) => coll(gymName(a), gymName(b)));
    const sizes = splitSizes(list.length, min, max), k = sizes.length;
    let p = 0;
    for (let i = 0; i < k; i++) {
      const size = sizes[i];
      const members = list.slice(p, p + size); p += size;
      const g0 = members[0];
      const prop = { clubId: g0.clubId, gender: genderOf(g0), category: g0.category, level: g0.level, memberIds: members.map(m => m.id) };
      prop.name = newTeamName(g0.clubId, prop, out);
      out.push(prop);
    }
  }
  return out;
}

// a Configuració: si l'app ja és a punt per funcionar sense internet i si les dades estan protegides
async function offlineStatus() {
  const el = $('#offstat'); if (!el) return;
  const out = [];
  if (location.protocol === 'file:') out.push('✓ Oberta com a fitxer: funciona sense internet en aquest ordinador.');
  else if ('serviceWorker' in navigator && location.protocol === 'https:') {
    let ready = false;
    try { ready = !!navigator.serviceWorker.controller && !!(await caches.match(new URL('./', location.href).href)); } catch (_) {}
    out.push(ready ? '✓ Llesta per funcionar sense internet en aquest aparell.' : '⏳ Encara no està desada per funcionar sense internet: deixa-la oberta uns segons amb internet i torna a entrar.');
  }
  try {
    if (navigator.storage && navigator.storage.persisted) {
      const p = await navigator.storage.persisted();
      out.push(p ? '✓ Dades protegides: el navegador no les esborrarà per fer lloc.' : 'Les dades encara no estan protegides contra la neteja automàtica del navegador. <button class="btn sm" data-act="persist">Protegeix-les</button>');
    }
  } catch (_) {}
  const bf = await idbGet('abansServidor');
  if (bf && bf.raw) out.push(`Hi ha guardades les dades que tenia aquesta finestra quan les van substituir les del programa o les d’una altra finestra (${h(new Date(bf.at).toLocaleString('ca'))}). <button class="btn sm" data-act="dlBefore">Descarrega-les</button> <button class="btn sm ghost" data-act="dropBefore">Esborra-les</button>`);
  // (i les d'abans d'aquestes, si n'hi ha)
  if (bf && Array.isArray(bf.prev)) bf.prev.forEach((c, k) => { if (c && c.raw) out.push(`També les d’abans (${h(new Date(c.at).toLocaleString('ca'))}). <button class="btn sm" data-act="dlBefore" data-i="${k + 1}">Descarrega-les</button> <button class="btn sm ghost" data-act="dropBefore" data-i="${k + 1}">Esborra-les</button>`); });
  if ($('#offstat') === el) el.innerHTML = out.join('<br>');
}

/* ═══════════════════════════════════════════ MODE TUTORA (mòbil a la Wi-Fi del servidor)
   La tutora posa el codi de la competició, tria el grup i el seu aparell i escriu la nota final.
   Si es perd la connexió, les notes queden a la cua del mòbil i s'envien soles quan torna. */
const TUT_KEY = 'notesgim.tutor', TUT_TAB = 'notesgim.tutor.pestanya', TUT_TURN = 'notesgim.tutor.enviant';
const tut = { pin: '', who: '', comps: [], compId: null, group: null, app: null, version: null, error: '', errCode: '', online: true, sending: false, list: false,
  screen: '', slow: 1, st: {}, noStore: false, mine: new Map(), gone: new Set(), okAt: Date.now(), dead: new Set(), hosts: [], groupIds: [],
  sub: null, byCat: false, subIds: [], mode: null };
// Les notes per enviar són una sola cua del mòbil (localStorage), la de totes les pestanyes: si la tutora té la pàgina
// oberta dues vegades (ha escanejat el QR dos cops), la pestanya que està oberta envia també el que l'altra hi ha deixat
// (encara que ja s'hagi tancat). Cada nota té el seu id des que s'escriu: el programa no en posa mai dues vegades la
// mateixa, encara que l'enviïn totes dues pestanyes. La cua es llegeix i es desa al moment, nota per nota (s'hi afegeix
// una nota —en lloc de la de la mateixa casella— o se'n treu una pel seu id): cap pestanya no hi desa mai a sobre la seva
// còpia. Les que en surten (enviades, refusades, substituïdes o tretes) es recorden (done), i cap pestanya no les hi torna
// a posar. El codi i el nom també són del mòbil, però només es desen en entrar, en sortir i quan el codi QR en porta un de
// nou (una pestanya vella no torna a posar el codi d'abans). El codi, la competició, el grup, l'aparell i la llista són
// també de cada pestanya (sessionStorage): una pestanya no posa el seu aparell ni el seu grup a l'altra (en tornar-la a
// obrir, les notes anirien a un altre aparell i a una altra gimnasta), i el que mira només val amb el codi amb què ho mira
// (si una altra pestanya entra amb el codi d'una altra competició, aquesta, en tornar-la a carregar, es queda amb el seu;
// si mai canvia de codi, l'aparell es torna a triar). Una pestanya nova fa servir el codi i el grup de l'última vegada,
// però l'aparell s'ha de tornar a triar.
// Cada nota porta el codi amb què s'ha escrit (així qualsevol pestanya la pot enviar, també si en fa servir un altre), l'id
// del mòbil i l'hora en què s'ha escrit: el programa no posa mai una nota d'aquest mòbil a sobre d'una de més nova de la
// mateixa casella (una pestanya adormida, o la Wi-Fi que entrega tard una petició que el mòbil ja havia donat per perduda).
const tutCellKey = q => `${q.compId}|${q.entryId}|${q.appId}|${q.i}`;
// (una nota desada per una versió d'abans, que encara no en tenia: totes les pestanyes li calculen el mateix id)
function tutOpId(q) {
  const s = `${tutCellKey(q)}|${q.at}|${q.value}`;
  let a = 2166136261, b = 5381;
  for (let k = 0; k < s.length; k++) { const c = s.charCodeAt(k); a = Math.imul(a ^ c, 16777619) >>> 0; b = (Math.imul(b, 33) + c) >>> 0; }
  return 'v' + a.toString(36) + b.toString(36);
}
function tutClean(s) {
  s = s && typeof s === 'object' && !Array.isArray(s) ? { ...s } : {};
  s.done = (Array.isArray(s.done) ? s.done : []).filter(x => typeof x === 'string');
  const done = new Set(s.done);
  s.queue = (Array.isArray(s.queue) ? s.queue : []).filter(q => q && typeof q === 'object' && q.compId && q.entryId && q.appId)
    .map(q => (q.id ? q : { ...q, id: tutOpId(q) })).filter(q => !done.has(q.id) && !tut.gone.has(q.id));
  // (les notes que la taula no ha acceptat: es diuen a sota fins que la tutora diu que ja ho sap)
  s.refused = (Array.isArray(s.refused) ? s.refused : []).filter(x => x && typeof x === 'object' && typeof x.id === 'string').slice(-50);
  return s;
}
// el que hi ha desat al mòbil, ara (si el navegador no el deixa llegir o desar, el que aquesta pestanya hi hauria desat:
// llavors les notes es guarden només en aquesta pestanya)
function tutRead() {
  let raw;
  if (!tut.noStore) { try { raw = localStorage.getItem(TUT_KEY); } catch (_) { tut.noStore = true; } }
  if (tut.noStore) return tutClean(tut.st);
  let s = {};
  try { s = JSON.parse(raw || '{}'); } catch (_) {}
  return (tut.st = tutClean(s));
}
// canvia el que hi ha desat al mòbil: es llegeix i es desa de seguida
function tutStore(fn) {
  const s = tutRead();
  fn(s);
  s.done = s.done.slice(-500);
  tut.st = s;
  if (!tut.noStore) { try { localStorage.setItem(TUT_KEY, JSON.stringify(s)); } catch (_) { tut.noStore = true; } }
  return s;
}
// la nota id surt de la cua i ja no hi torna
function tutGone(s, id) { if (!s.done.includes(id)) s.done.push(id); tut.gone.add(id); tut.mine.delete(id); }
// posa op a la cua s, en lloc de la de la mateixa casella (lost: una d'aquesta pestanya que s'havia perdut; no en
// substitueix cap de més nova)
function tutPut(s, op, lost = false) {
  const same = s.queue.filter(q => tutCellKey(q) === tutCellKey(op));
  if (lost && same.some(q => (q.at || 0) >= (op.at || 0))) { tut.mine.delete(op.id); return; }
  for (const q of same) tutGone(s, q.id);
  s.queue = s.queue.filter(q => !same.includes(q)).concat(op);
}
const tutDrop = ids => tutStore(s => { s.queue = s.queue.filter(q => !ids.includes(q.id)); for (const id of ids) tutGone(s, id); });
// la cua del mòbil, ara. Una nota escrita fa poc en aquesta pestanya que no hi és però tampoc n'ha sortit (una altra
// pestanya ha desat la cua just quan s'hi afegia) s'hi torna a posar
function tutQ() {
  const s = tutRead(), done = new Set(s.done), now = Date.now();
  const lost = [...tut.mine.values()].filter(op => {
    if (done.has(op.id) || Math.abs(now - op.at) > 600000) { tut.mine.delete(op.id); return false; }
    return !s.queue.some(q => q.id === op.id);
  });
  return lost.length ? tutStore(st => { for (const op of lost) tutPut(st, op, true); }).queue : s.queue;
}
// (si la pàgina és oberta dues vegades, normalment envia una sola pestanya cada vegada, i les notes arriben en l'ordre en
// què s'han escrit. Si mai n'envien dues alhora, o una pestanya adormida envia tard una nota que ja s'ha corregit, el programa
// no la torna a posar —té el mateix id— ni la posa a sobre de la correcció —és més vella i del mateix mòbil—)
const TUT_ME = uid();
// (off: la pestanya que envia diu que no hi ha connexió —fins que una nota arriba—; les altres, que esperen, també ho diuen.
// Sense connexió, la que envia ho torna a provar cada 4 s i es torna a quedar el torn: si en 6 s no ho ha fet, s'ha adormit
// —el mòbil s'ha bloquejat, o és en segon pla— i l'agafa una altra)
function tutTurn(off = !tut.online) {
  try {
    const t = JSON.parse(localStorage.getItem(TUT_TURN) || 'null'), now = Date.now();
    if (t && t.tab !== TUT_ME && Math.abs(now - t.at) < (t.off ? 6000 : 20000)) { tut.otherOff = !!t.off; return false; }
    localStorage.setItem(TUT_TURN, JSON.stringify({ tab: TUT_ME, at: now, off }));
  } catch (_) {}
  return true;
}
function tutTurnEnd() { try { const t = JSON.parse(localStorage.getItem(TUT_TURN) || 'null'); if (t && t.tab === TUT_ME) localStorage.removeItem(TUT_TURN); } catch (_) {} }
addEventListener('pagehide', tutTurnEnd);
function tutLoad() {
  const s = tutRead();
  Object.assign(tut, { pin: s.pin || '', who: s.who || '', compId: s.compId || null, group: s.group || null, app: null, list: !!s.list, sub: s.sub || null, byCat: !!s.byCat });
  // (el que mirava aquesta pestanya, amb el codi amb què ho mirava: el del mòbil pot ser el d'una altra competició, que una
  // altra pestanya hi ha posat. Si no se'n sap el codi —una versió d'abans—, l'aparell es torna a triar)
  try { const t = JSON.parse(sessionStorage.getItem(TUT_TAB) || 'null'); if (t && t.pin && typeof t.pin === 'string') Object.assign(tut, { pin: t.pin, compId: t.compId || null, group: t.group || null, app: t.app || null, list: !!t.list, sub: t.sub || null, byCat: !!t.byCat }); } catch (_) {}
}
// el que mira aquesta pestanya i amb quin codi (es desa a cada pintada: no toca res del que és del mòbil)
function tutSave() {
  try { sessionStorage.setItem(TUT_TAB, JSON.stringify({ pin: tut.pin, compId: tut.compId, group: tut.group, app: tut.app, list: tut.list, sub: tut.sub, byCat: tut.byCat })); } catch (_) {}
}
// aquesta pestanya passa a fer servir un altre codi: el que hi mirava ja no val (es torna a entrar i l'aparell es torna a triar)
function tutSetPin(pin) {
  if (pin === tut.pin) return;
  Object.assign(tut, { pin, app: null, comps: [], error: '', errCode: '' });
  qe.buf = '';
  tutSave();
}
// la tutora tria una competició, un grup (o una subdivisió) o la llista: també és el que farà servir una pestanya nova
function tutPick() {
  tutSave();
  const s = tutRead();
  if ((s.compId || null) !== tut.compId || (s.group || null) !== tut.group || !!s.list !== tut.list || (s.sub || null) !== tut.sub || !!s.byCat !== tut.byCat)
    tutStore(st => Object.assign(st, { compId: tut.compId, group: tut.group, list: tut.list, sub: tut.sub, byCat: tut.byCat }));
}
// ha entrat (amb el codi escrit, el del QR o tornant-ho a provar sola): el codi i el nom queden desats al mòbil, i s'envia
// el que hi havia per enviar
function tutEnter() {
  const s = tutRead();
  if ((s.pin || '') !== tut.pin || (s.who || '') !== tut.who) tutStore(st => { st.pin = tut.pin; st.who = tut.who; });
  setTimeout(tutKick, 0);
}
// hi ha notes per enviar (potser d'una altra pestanya, o d'una que s'ha tancat) i aquesta no les està enviant
function tutKick() { if (ui.view === 'tutor' && !tut.sending && tut.pin && tutReach().length) tutSend(); }
// una altra pestanya ha canviat la cua, o ha entrat amb un altre codi (aquesta, si encara no hi havia pogut entrar, el prova:
// l'aparell es torna a triar). La pestanya que hi ha posat una nota l'envia de seguida: aquesta hi mira una mica després
// (quan ja sap que l'altra l'està enviant), no alhora
addEventListener('storage', e => {
  if (e.key !== TUT_KEY || ui.view !== 'tutor') return;
  const s = tutRead();
  if (!tut.comps.length && s.pin && s.pin !== tut.pin) { tutSetPin(s.pin); tut.who = s.who || ''; }
  tutStatusBar();
  clearTimeout(tut.kickT); tut.kickT = setTimeout(tutKick, 400 + Math.floor(Math.random() * 600));
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ui.view === 'tutor') { tutStatusBar(); tutKick(); } });
// el codi QR de la taula porta el codi a l'adreça (#codi=1234): s'entra sense escriure res (i és el que queda desat al mòbil).
// També si s'escaneja amb la pàgina ja oberta a la mateixa pestanya (només canvia el #: la pàgina no es torna a carregar)
function tutCodeFromHash() {
  const m = /(?:^#|[#&])codi=(\d{3,8})/.exec(location.hash);
  if (!m) return false;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
  tutSetPin(m[1]);
  if ((tutRead().pin || '') !== m[1]) tutStore(s => { s.pin = m[1]; });
  return true;
}
addEventListener('hashchange', () => {
  if (ui.view !== 'tutor' || !tutCodeFromHash()) return;
  render();
  tutFetch().then(() => { render(); tutKick(); }, () => { tut.online = false; render(); });
});
async function tutorStart() {
  document.body.classList.add('tutor-mode');
  tutLoad();
  tutCodeFromHash();
  ui.view = 'tutor';
  if (!tut.pin) render();
  else {
    // (si les dades triguen, «Connectant…» amb les notes guardades: mai una pàgina en blanc)
    const slow = setTimeout(() => { if (!tut.comps.length && !tut.error) render(); }, 400);
    // (si el programa no el vol, el codi es guarda igualment: si la competició només està tancada una estona, quan la
    // taula la torna a obrir s'hi entra sola)
    try { await tutFetch(); } catch (_) { tut.online = false; }
    // (el codi d'aquesta pestanya ja no val i al mòbil n'hi ha un altre —el del QR nou, que s'ha obert en una altra pestanya—:
    // s'hi entra, i l'aparell es torna a triar)
    const s = tutRead();
    if (tut.error && s.pin && s.pin !== tut.pin) { tutSetPin(s.pin); tut.who = s.who || tut.who; try { await tutFetch(); } catch (_) { tut.online = false; } }
    clearTimeout(slow);
    render();
  }

  tutKick();
}
async function tutFetch(since) {
  const pin = tut.pin;
  try {
    // (una petició que es queda penjada —la Wi-Fi del pavelló— es dona per perduda i es torna a provar; si és que la Wi-Fi
    // va molt lenta i la resposta no hi arriba a temps, la vegada següent s'hi espera més)
    const j = await api(`api/tutor?pin=${encodeURIComponent(pin)}${since != null ? '&since=' + since : ''}`, {}, since != null ? 25000 + 10000 * tut.slow : 8000 * tut.slow);
    tut.slow = 1;
    if (pin !== tut.pin) return false;   // (mentrestant ha sortit o ha entrat amb un altre codi)
    if (!j) return false;
    if (!Array.isArray(j.comps)) throw new Error('no és NotesGim');   // (una altra cosa ha respost: com sense connexió)
    const wasOut = !tut.comps.length;
    tut.error = ''; tut.errCode = ''; tut.comps = j.comps || []; tut.version = j.version; tut.online = true; tut.okAt = Date.now();
    tut.hosts = Array.isArray(j.hosts) ? j.hosts.filter(x => typeof x === 'string' && x !== location.host) : [];
    for (const op of tutQ()) tutApplyLocal(op);   // el que encara no s'ha enviat, es continua veient

    if (e.status === 403 && e.body && e.body.error) { tut.error = e.message; tut.errCode = e.body.code || ''; tut.comps = []; tut.okAt = Date.now(); return true; }

}
async function tutWaitLoop() {
  for (;;) {
    if (!tut.pin) { await new Promise(r => setTimeout(r, 3000)); continue; }
    if (!tut.comps.length) {

      // es torna a provar sol, i quan la taula la torna a obrir s'hi entra sense fer res. «Connectant…» es torna a pintar
      // (diu si hi ha connexió); la pantalla del codi no, si no s'hi entra (s'hi podria estar escrivint)
      try { await tutFetch(); tut.online = true; } catch (_) { tut.online = false; }

    }

      const changed = await tutFetch(tut.version);

    } catch (_) { tut.online = false; tutStatusBar(); await new Promise(r => setTimeout(r, 3000)); }
    tutKick();

}
const tutComp = () => tut.comps.find(c => c.id === tut.compId) || tut.comps[0];
function tutApplyLocal(op) {
  const c = tut.comps.find(x => x.id === op.compId); if (!c) return;
  const e = c.entries.find(x => x.id === op.entryId); if (!e) return;
  e.scores = e.scores || {};
  const l = e.scores[op.appId] = e.scores[op.appId] || [];
  while (l.length <= op.i) l.push({});

        for (const pat of ['10111010000', '00001011101']) { let k = s.indexOf(pat); while (k >= 0) { p += 40; k = s.indexOf(pat, k + 1); } }
      }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) { const c = M[y][x]; if (c === M[y][x + 1] && c === M[y + 1][x] && c === M[y + 1][x + 1]) p += 3; }
      const dark = M.reduce((n, r) => n + r.filter(Boolean).length, 0), tot = size * size;
      p += (Math.ceil(Math.abs(dark * 20 - tot * 10) / tot) - 1) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { apply(m); format(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } apply(m); }
    apply(best); format(best);
    return M;
  }
  // SVG amb el marge blanc de 4 mòduls que demana la norma
  function svg(text, px = 220) {
    const M = encode(text), n = M.length, q = 4;
    let d = '';
    M.forEach((row, y) => row.forEach((on, x) => { if (on) d += `M${x + q} ${y + q}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="Codi QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { encode, svg };
})();

/* ═══════════════════════════════════════════ IMPRESSIÓ */
function printHeader(c) {
  const s = S();
  return `<div class="ph"><div class="ph-logo">${s.logoL ? `<img src="${s.logoL}" alt="">` : ''}</div>
    <div class="ph-text"><div class="ph-org">${h(s.org)}</div>${s.line2 ? `<div>${h(s.line2)}</div>` : ''}${c.season ? `<div>CURS ${h(c.season)}</div>` : ''}

      <div class="ph-date">Imprès el ${fmtDate(today())}</div></div>
    <div class="ph-logo">${s.logoR ? `<img src="${s.logoR}" alt="">` : ''}</div></div>`;

// el títol i el grup van dins la capçalera de cada taula: el navegador la repeteix a cada pàgina,
// així un full solt sempre diu què és. prov: si encara falten notes, «PROVISIONAL · falten N notes» (també a cada pàgina)
const sheet = (c, title, g, body, land = false, prov = '') => {
  const pv = prov ? `<div class="prov">${h(prov)}</div>` : '';
  const label = h(title) + (g ? ' · ' + h(groupLabelPrint(g)) : '') + pv;
  return `<section class="sheet ${land ? 'landscape' : ''}">${printHeader(c)}${body.includes('<thead>') ? '' : pv}
    ${body.replace(/<thead>/g, `<thead><tr class="rep"><th colspan="99">${label}</th></tr>`)}</section>`;
};
// l'ordre de «Renumera dorsals». Amb rotacions, el de pas: per subdivisió i grup, i a cada grup com al full (per categoria
// i nivell, entitat i equip) i per cognoms. Sense, per categoria, gènere i nivell, i a cada grup per entitat, equip (les
// individuals al final) i cognoms
function renumberOrder(c) {
  const sur = e => { const g = gymById(e.gymnastId); return g ? [g.surname || '', g.name || ''] : [entryName(e), '']; };
  const bySur = (a, b) => { const x = sur(a), y = sur(b); return coll(x[0], y[0]) || coll(x[1], y[1]) || coll(String(a.id), String(b.id)); };
  const out = [], seen = new Set(), add = e => { if (!seen.has(e)) { seen.add(e); out.push(e); } };
  if (c.rot && c.rot.made) for (const sv of rotViewOf(c).subs) for (const G of sv.groups) for (const x of Engine.rotGroupOrder(G, S(), rotCtx())) x.entries.slice().sort(bySur).forEach(add);
  const team = e => c.teams.find(t => t.id === e.teamId);
  for (const g of groupsOf(c)) [...g.entries].sort((a, b) => coll(clubName(a.clubId), clubName(b.clubId)) || (team(a) ? 0 : 1) - (team(b) ? 0 : 1)
    || coll(team(a) ? team(a).name : '', team(b) ? team(b).name : '') || bySur(a, b)).forEach(add);
  return out;
}
// les gimnastes d'un full de jutge (grup g, aparell a) en l'ordre en què passen. Amb rotacions, un bloc per subdivisió i
// rotació, cadascun amb el grup que hi ha a l'aparell i en l'ordre del full de rotacions; sense, un sol bloc per dorsal
// (rv: les rotacions, calculades un sol cop per a tots els fulls; np: també les NP, al seu lloc —la graella de notes—)
function judgeBlocks(c, g, a, rv = c.rot && c.rot.made ? rotViewOf(c) : null, np = false) {
  const list = sortEntries(g.entries).filter(e => np || e.status !== 'np');
  if (!rv) return [{ title: '', list }];
  const mine = new Set(list), out = [], seen = new Set();
  // (una subdivisió sense cap gimnasta que competeixi no té número: les seves NP van a «Altres»)
  for (const sv of rv.subs) if (sv.idx) for (const b of Engine.rotAppSeq(sv, a.id, S(), rotCtx())) {
    const l = b.entries.filter(e => mine.has(e) && !seen.has(e));
    if (l.length) { l.forEach(e => seen.add(e)); out.push({ title: `${sv.idx}a subdivisió · ${b.r === null ? 'tots junts al final' : `rotació ${b.r + 1}`} · Grup ${b.G.g + 1}`, list: l }); }
  }
  // (les que no passen per aquest aparell a cap rotació: al final, per dorsal)
  const rest = list.filter(e => !seen.has(e));
  return rest.length ? out.concat({ title: out.length ? 'Altres' : '', list: rest }) : out;
}
// notes que falten a aquestes inscripcions (les que no són NP) en aquests aparells; i, si n'hi ha, el que diu el full imprès
const missIn = (c, entries, apps) => entries.reduce((n, e) => n + (e.status === 'np' ? 0 : apps.filter(a => !Engine.appComplete(e, a, c)).length), 0);
const provTxt = n => (n ? `PROVISIONAL · ${n === 1 ? 'falta' : 'falten'} ${plural(n, 'nota', 'notes')}` : '');
function judgeSheet(c, g, a, rv) {
  const det = c.scoring === 'detailed', n = Math.max(1, a.attempts || 1);
  const cols = det ? ['D', 'E', 'Pen.', 'Nota'] : ['Nota'];
  // amb 2 salts (o intents): «1r salt», «2n salt» i «Final»; amb D + E, les caselles de cada salt a sota
  const word = a.icon === 'salt' || a.icon === 'mini' ? 'salt' : 'intent', rs = n > 1 && det ? ' rowspan="2"' : '';
  const head = `<tr><th${rs}>Ordre</th><th${rs}>Dorsal</th><th${rs}>Esportista</th><th${rs}>Entitat</th>${n > 1
    ? range(n).map(i => `<th${det ? ` colspan="${cols.length}"` : ''}>${ordHtml(i + 1)} ${word}</th>`).join('') + `<th${rs}>Final</th></tr>${det ? `<tr>${range(n).map(() => cols.map(cl => `<th>${cl}</th>`).join('')).join('')}</tr>` : ''}`
    : cols.map(cl => `<th>${cl}</th>`).join('') + '</tr>'}`;
  let k = 0;
  const rows = judgeBlocks(c, g, a, rv).map(b => (b.title ? `<tr class="jb"><td colspan="99">${h(b.title)}</td></tr>` : '') + b.list.map(e => `<tr class="judge"><td class="num">${++k}</td><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}</td><td>${h(clubName(e.clubId))}</td>${'<td></td>'.repeat(n * cols.length + (n > 1 ? 1 : 0))}</tr>`).join('')).join('');
  // la línia de signatura va al peu de la taula: surt a cada pàgina i no queda mai sola
  return sheet(c, `Full de jutge · ${a.name}`, g, `<table><thead>${head}</thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="99" class="signrow">Tutor/a de joc: ______________________________     Signatura: ____________________</td></tr></tfoot></table>`, n * cols.length > 4);
}
function notesSheet(c, g) {
  const apps = Engine.enabledApps(c, g.gender), det = c.scoring === 'detailed';
  const head = `<tr><th>Dors.</th><th>Esportista</th><th>Entitat / equip</th>${apps.map(a => `<th>${h(a.name)}${Engine.appMode(a, g.gender) === 'total' ? '' : ' <span class="lc">(a part)</span>'}</th>`).join('')}<th>Total</th></tr>`;
  const rows = sortEntries(g.entries).map(e => {
    const team = c.teams.find(t => t.id === e.teamId);
    const cell = a => {
      const r = Engine.appResult(e, a, c);
      const parts = range(Math.max(1, a.attempts || 1)).map(i => {
        const at = att(e, a, i);
        return det && r.attempts[i] !== null ? `D ${fmt(Engine.toM(at.d))} · E ${fmt(Engine.toM(at.e))}${Engine.toM(at.p) ? ' · P ' + fmt(Engine.toM(at.p)) : ''}` : '';
      }).filter(Boolean);
      return `<td class="num"><b>${fmt(r.value)}</b>${parts.length ? `<br><span class="small">${parts.join('<br>')}</span>` : ''}${(a.attempts || 1) > 1 ? `<br><span class="small">(${r.attempts.map(fmt).join(' / ')})</span>` : ''}</td>`;
    };
    return `<tr><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}${e.status === 'np' ? ' (NP)' : ''}</td><td>${h(clubName(e.clubId))}${team && team.name !== clubName(e.clubId) ? `<br><span class="small">${h(team.name)}</span>` : ''}</td>${apps.map(cell).join('')}<td class="num"><b>${fmt(Engine.entryTotal(c, e))}</b></td></tr>`;
  }).join('');
  return sheet(c, 'Acta de notes', g, `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`, apps.length > 3 || det);
}
function listSheet(c, g) {
  const rows = sortEntries(g.entries).map(e => { const t = c.teams.find(x => x.id === e.teamId);
    return `<tr><td class="num">${h(e.bib)}</td><td>${h(entryName(e))}</td><td>${h(clubName(e.clubId))}</td><td>${t ? h(t.name) : '—'}</td></tr>`; }).join('');
  const teams = compTeamsOf(c, g);
  return sheet(c, 'Llistat d’inscrits', g, `<table><thead><tr><th>Dorsal</th><th>Esportista</th><th>Entitat</th><th>Equip</th></tr></thead><tbody>${rows}</tbody></table>
    ${teams.length ? `<h3>Equips</h3><table><thead><tr><th>Equip</th><th>Entitat</th><th>Gimnastes</th></tr></thead><tbody>${teams.map(t => `<tr><td>${h(t.name)}</td><td>${h(clubName(t.clubId))}</td><td>${c.entries.filter(e => e.teamId === t.id).map(e => h(entryName(e))).join(', ')}</td></tr>`).join('')}</tbody></table>` : ''}`);
}
function doPrint(c, types, keys, extra = '') {
  const groups = groupsOf(c).filter(g => keys.includes(g.key));
  const out = [], rv = types.includes('judge') && c.rot && c.rot.made ? rotViewOf(c) : null;
  // el podi de tots els grups va seguit, per llegir-lo a l'entrega de medalles
  // (amb notes que falten, cada full ho diu: «PROVISIONAL · falten N notes», comptant només les que hi poden canviar alguna cosa)
  const indMiss = g => missIn(c, g.entries, Engine.totalApps(c, g.gender));
  if (types.includes('podium')) out.push(`<section class="sheet">${printHeader(c)}<h2>Podi</h2>${groups.map(g =>
    `<div style="break-inside:avoid"><h3>${h(groupLabelPrint(g))}</h3>${indMiss(g) ? `<div class="prov">${h(provTxt(indMiss(g)))}</div>` : ''}${htmlPodium(c, g, true)}</div>`).join('')}</section>`);
  for (const g of groups) {
    if (types.includes('general') && g.entries.length) out.push(sheet(c, 'Classificació individual', g, htmlIndividual(c, g, true), false, provTxt(indMiss(g))));
    if (types.includes('apps') && g.entries.length) for (const a of Engine.enabledApps(c, g.gender)) out.push(sheet(c, `Classificació · ${a.name}${Engine.appMode(a, g.gender) === 'apart' ? ' (a part)' : ''}`, g, htmlOneApp(c, g, a, true), false, provTxt(missIn(c, g.entries, [a]))));
    if (types.includes('teams') && compTeamsOf(c, g).length) out.push(sheet(c, 'Classificació per equips', g,
      htmlTeams(c, g, true) + `<p class="small">A cada aparell compten les ${c.teamCount} millors notes de l’equip (les ratllades no compten).</p>`, false,
      provTxt(missIn(c, Engine.teamRanking(c, g).rows.filter(r => !r.undersize).flatMap(r => r.members), Engine.teamApps(c, g.gender)))));
    if (types.includes('notes') && g.entries.length) out.push(notesSheet(c, g));
    if (types.includes('list')) out.push(listSheet(c, g));
    if (types.includes('judge') && g.entries.length) for (const a of Engine.enabledApps(c, g.gender)) out.push(judgeSheet(c, g, a, rv));
  }
  if (extra) out.push(extra);
  if (!out.length) { toast('No hi ha res per imprimir amb aquesta selecció.', 'bad'); return; }
  printSheets(out.join(''));
}

/* ═══════════════════════════════════════════ EXCEL (.xlsx sense llibreries)
   Un .xlsx és un zip de fitxers XML. Fem el zip "sense comprimir" (STORE), que
   Excel, LibreOffice i Google Sheets obren sense problema. */
const XLSX = (() => {
  const enc = new TextEncoder();
  const T = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));

  try {
    if (cats) S().categories = JSON.parse(JSON.stringify(cats));
    return applyCatMoves(ids.map(gymById).filter(g => g && catMismatch(g)));
  } finally { db = real; }
}
// l'avís del que ha passat (amb els equips pel seu nom)
function catMsg(r) {
  return `${plural(r.n, 'gimnasta ha', 'gimnastes han')} canviat de categoria.${r.upd ? ` A les competicions que vénen: ${plural(r.upd, 'inscripció posada', 'inscripcions posades')} al dia.` : ''}${r.kept ? ` ${plural(r.kept, 'inscripció ja tenia', 'inscripcions ja tenien')} notes i no s’${r.kept === 1 ? 'ha' : 'han'} tocat.` : ''}`
    + (r.gone.length ? ` ${r.gone.length === 1 ? 'Equip desfet' : 'Equips desfets'}: ${catList(r.gone.map(catTeamName))}.` : '')
    + (r.alone.length ? ` ${r.alone.length === 1 ? 'Es queda' : 'Es queden'} sense equip: ${catList(r.alone.map(id => gymName(gymById(id))), 5)}.` : '')
    + (r.lost.length ? ` ${r.lost.length === 1 ? 'Equip que perd' : 'Equips que perden'} alguna gimnasta: ${catList(r.lost.map(catTeamName))}.` : '')
    + (r.made.length ? ` ${r.made.length === 1 ? 'Equip nou' : 'Equips nous'}: ${catList(r.made.map(catTeamName))}.` : '');
}
// ─── «Passa al curs següent» i «Desfés un curs»
// A les dades, S().lastShift: l'últim canvi de curs (d: 1 o −1; on: el dia; season: el curs per al qual són els anys
// després d'un +1; teams: els equips que havien dit les entitats al full i que el +1 va desfer o canviar).
// A aquest ordinador (IndexedDB, SHIFT_KEY, i en memòria per si no n'hi ha), shiftUndo: com eren les dades just abans de
// l'últim +1 (snap) i just després (stamp: la versió; sig: shiftSig). «Desfés un curs» quan encara són les de just
// després hi torna tal qual, també després de tornar a obrir NotesGim o des d'una altra finestra
const SHIFT_KEY = 'cursAbans';
let shiftUndo = null;
const compSeason = c => c.season || Engine.seasonFor(c.date);
const seasonStep = (s, d) => { const m = /^(\d{4})-(\d{4})$/.exec(s || ''); return m ? `${+m[1] + d}-${+m[2] + d}` : ''; };
const inSummer = () => [6, 7, 8].includes(+today().slice(5, 7));
// el curs per al qual es prepara un +1 fet avui: el que ve si el d'ara ja ha començat (ja s'hi ha fet alguna
// competició) o si som a l'estiu; si no (al setembre, abans de la primera competició), el d'ara
function shiftTarget() {
  const s = Engine.seasonFor(today());
  return inSummer() || db.competitions.some(c => !isUpcoming(c) && compSeason(c) === s) ? seasonStep(s, 1) : s;
}
// les dades tal com es desen, sense meta ni notes (les notes que arriben després es conserven igualment: mergeScores)
function shiftSig(d) {
  const t = JSON.stringify(migrate(JSON.parse(JSON.stringify(d))), (k, v) => k === 'meta' || k === 'scores' ? undefined : v);
  let a = 0x811c9dc5, b = 0;
  for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = (Math.imul(b, 31) + c) | 0; }
  return t.length + ':' + (a >>> 0).toString(36) + ':' + (b >>> 0).toString(36);
}
// la còpia de just abans de l'últim +1 si les dades encara són les de just després (rec); any: n'hi ha alguna d'aquestes
// dades en aquest ordinador (encara que ja no serveixi)
async function shiftBack() {
  const recs = [shiftUndo, await Promise.race([idbGet(SHIFT_KEY), nap(2000).then(() => null)])].filter(r => r && r.dbId === db.meta.dbId && typeof r.snap === 'string');
  if (!recs.length) return { rec: null, any: false };
  const sig = shiftSig(db);
  return { rec: recs.find(r => r.stamp === db.meta.updated || r.sig === sig) || null, any: true };
}
// abans d'un +1: si sembla un clic sense voler, què se li pregunta (HTML; '' si no cal). Els anys ja són els del curs
// que ve (ja s'ha fet el +1), o el curs ja ha començat i encara té competicions per fer (o no som a l'estiu)
function shiftAsk() {
  const last = S().lastShift, s = Engine.seasonFor(today());
  if (last && last.d === 1 && last.season && last.season >= shiftTarget())
    return `<b>Ja s’ha passat al curs següent${last.on ? ' el ' + fmtDate(last.on) : ''}</b>: els anys de les categories ja són els del curs ${h(last.season)}.<br><br>
      Si ho tornes a fer, les gimnastes canviarien de categoria un any abans d’hora (i sortirien dels seus equips, també a les competicions que vénen).<br><br>Segur que vols tornar a passar al curs següent?`;
  const ofS = db.competitions.filter(c => compSeason(c) === s).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const done = ofS.filter(c => !isUpcoming(c)), soon = ofS.filter(isUpcoming);
  if (!done.length || (!soon.length && inSummer())) return '';
  const list = l => h(catList(l.map(c => `«${c.name}»${c.date ? ', ' + fmtDate(c.date) : ''}`)));
  return `${soon.length ? `<b>${soon.length === 1 ? 'Hi ha una competició' : `Hi ha ${soon.length} competicions`} d’aquest curs (${h(s)}) per fer</b>: ${list(soon)}.`
    : `<b>El curs ${h(s)} ja ha començat</b>: ${done.length === 1 ? 'ja s’ha fet' : 'ja s’han fet'} ${list(done.slice(-4))}.`}<br><br>
    «Passa al curs següent» es fa un cop l’any, a l’estiu, abans de la primera competició del curs nou: suma 1 any a totes les categories, i les gimnastes que canvien de categoria surten dels seus equips, també a les competicions que vénen. Si ja es va fer aquest estiu, ara les gimnastes canviarien de categoria abans d’hora.<br><br>Segur que vols passar al curs següent ara?`;
}

  inscOpen: async (el, files) => {

  inscDo: () => {
    const I = ui.insc; if (!I) return;
    const c0 = I.compId ? compById(I.compId) : null, c = c0 && !c0.locked ? c0 : null;
    // una competició que ja ha passat: el full només val per a aquell dia (les fitxes que ja hi eren es queden com són
    // ara); a les fitxes noves (i a les que encara no tenien equip) s'hi desa l'equip del full, per a la jornada següent
    const past = !!c && !isUpcoming(c);
    let made = 0, upd = 0, teamed = 0, nEnrol = 0, scoredMoved = 0, stored = 0, total = 0, pastUpd = 0, othersClub = false;
    const kept = [], others = new Set(), stale = [], renamed = [], moved = [], weak = [], keptClub = [], twins = [], pastKept = [];
    // (rotacions ja fetes: ningú es mou de grup sol; si un equip queda repartit en dos grups, es diu)
    const split0 = c ? rotSplits([c.id]) : new Map();
    let rotNote = '';
    closeDialog();
    withUndo(() => {
      const bad = kept.length || scoredMoved || stale.length || weak.length || keptClub.length;
      const names = l => l.length > 5 ? `${l.slice(0, 5).join(', ')} i ${l.length - 5} més` : l.length <= 1 ? (l[0] || '') : `${l.slice(0, -1).join(', ')} i ${l[l.length - 1]}`;
      return { type: bad ? 'bad' : 'ok', msg: `Fulls d’inscripció importats: ${plural(made, 'fitxa nova', 'fitxes noves')}${upd ? `, ${plural(upd, 'actualitzada', 'actualitzades')}` : ''}${teamed ? ` · ${plural(teamed, 'gimnasta', 'gimnastes')} en equips, tal com diu el full` : ''}${c ? ` · a ${c.name}: ${nEnrol ? plural(nEnrol, 'inscripció nova', 'inscripcions noves') : 'cap inscripció nova'}${teamed ? ', i els equips com diu el full' : ''}` : ''}.`
        + (moved.length ? ` ${moved.length === 1 ? 'Ha canviat d’entitat' : 'Han canviat d’entitat'}: ${names(moved)}.` : '')
        + (twins.length ? ` ${twins.length === 1 ? 'Són dues persones diferents' : 'Són persones diferents'} amb el mateix nom, cadascuna amb la seva fitxa i la seva inscripció: ${names(twins)}.` : '')
        + (past ? (!stored ? ' (És una competició que ja ha passat: les fitxes de les gimnastes no s’han canviat.)'
          : ` (És una competició que ja ha passat: ${stored === total ? (stored === 1 ? 'la fitxa ja té' : 'les fitxes ja tenen') : stored === made ? (stored === 1 ? 'la fitxa nova ja té' : 'les fitxes noves ja tenen') : pastUpd ? plural(stored, 'fitxa ja té', 'fitxes ja tenen') : plural(stored, 'fitxa nova o sense equip ja té', 'fitxes noves o sense equip ja tenen')} l’equip que diu el full, o «només individual», per a la jornada següent${stored < total ? '; les altres no s’han canviat' : ''}.)`) : '')
        + (pastKept.length ? ` ${names(pastKept)}: a la fitxa ${pastKept.length === 1 ? 'continua' : 'continuen'} com ${pastKept.length === 1 ? 'era' : 'eren'} (en una competició posterior hi ${pastKept.length === 1 ? 'és' : 'són'} amb una altra entitat).` : '')
        + (renamed.length ? ` Els equips ${names(renamed)} ja hi eren amb aquest nom i s’hi han posat les gimnastes del full.` : '')
        + (kept.length ? ` Compte: ${names(kept)} ja ${kept.length === 1 ? 'té' : 'tenen'} notes en un altre grup a ${c.name} i no s’hi ha canviat res (fes-ho a Inscripcions si cal).` : '')
        + (keptClub.length ? ` Compte: ${names(keptClub)} ja ${keptClub.length === 1 ? 'té' : 'tenen'} notes a ${c.name} amb una altra entitat i allà no s’hi ha canviat res (fes-ho a Inscripcions si cal).` : '')
        + (scoredMoved ? ` Compte: ${plural(scoredMoved, 'gimnasta que ja tenia notes ha', 'gimnastes que ja tenien notes han')} canviat d’equip (les notes no canvien).` : '')
        + (weak.length ? ` Compte: a ${c.name}, ${weak.map(x => `«${x.name}» es queda amb ${x.n}`).join(', ')}: no arriba${weak.length === 1 ? '' : 'n'} al mínim (${c.teamMin || 3}).` : '')
        + (stale.length ? ` A ${c.name} també hi ${stale.length === 1 ? 'ha' : 'són'} ${names(stale)}, de la mateixa entitat i grup, que no ${stale.length === 1 ? 'surt al full: no s’ha tret' : 'surten al full: no s’han tret'}.` : '')
        + (others.size ? ` A ${names([...others])} hi ha alguna d’aquestes gimnastes amb un altre equip${othersClub ? ' o una altra entitat' : ''}: no s’hi ha tocat res (cada competició té els seus equips; si també hi van així, importa-hi el full).` : '')
        + rotNote };
    }, () => {
      const all = inscResolveAll(I), sheet = new Map();   // fitxa → el que diu el full
      for (const f of I.files) {
        if (f.error) continue;
        // l'entitat: la triada; si és nova, la que ja hi hagi amb el mateix nom (p. ex. creada per un altre fitxer
        // del mateix club en aquesta importació), i si no, una de nova
        let clubId = f.clubPick && !f.clubPick.startsWith('__') ? f.clubPick : null;
        if (!clubId && f.club) { const m = inscClubFor(f.club); clubId = m !== '__new' ? m : ensureClub(f.club); }
        if (!clubId) continue;
        f.clubPick = clubId;
        const list = (all.get(f) || []).filter(p => p.status === 'new' || p.status === 'update');
        if (!list.length) continue;
        const club = clubById(clubId);
        if (club && f.contacts.length) club.contacts = mergeContacts(club.contacts, f.contacts);
        for (const p of list) {
          if (p.level && !S().levels.includes(p.level)) S().levels.push(p.level);
          if (p.category && !catNames().includes(p.category)) S().categories.push({ name: p.category, from: null, to: null });
          let g = p.existing && gymById(p.existing.id);
          const grp = { category: p.category, gender: p.gender, level: p.level };
          const vals = Object.assign({}, grp, p.year ? { birthYear: String(p.year) } : {});
          // (dues persones amb el mateix nom: la fitxa havia passat a l'entitat d'un altre full —p.back és la inscripció que
          // hi va fer aquell full—; torna a la d'aquest, i la de l'altre full en té una de nova)
          const twin = g && p.back && c && c.entries.includes(p.back) ? inscSplitTwin(c, g, p.back) : null;
          if (twin) twins.push(`${gymName(g)} (${clubName(clubId)} i ${clubName(twin.clubId)})`);
          // (blank: una fitxa nova, o una de la mateixa entitat que encara no té equip ni «només individual» en aquest grup)
          let blank = !g;
          if (g) {
            // (en una competició passada la fitxa no canvia: aquell dia potser eren d'un altre grup o d'una altra entitat.
            // Si és la mateixa gimnasta amb una altra entitat o un altre any —p.cands— i en cap competició posterior no hi
            // és amb una altra entitat, sí: és com una fitxa nova d'aquesta entitat, i la jornada següent seguirà el full)
            const now = !past || !!twin || (p.cands.length > 0 && !p.pastKeep);
            blank = (past && now) || (!gymTeam(g) && !g.noTeam && sameGroup(g, grp) && (g.clubId || null) === clubId);
            if (now) {
              Object.assign(g, vals); if (inscN(p.surname).length > inscN(g.surname).length) g.surname = p.surname; if (g.archived) g.archived = false;
              // (la mateixa gimnasta, que ara és d'una altra entitat: la fitxa passa a la del full)
              if ((g.clubId || null) !== clubId) { if (!twin) moved.push(`${gymName(g)} (${clubName(g.clubId) ? `abans a ${clubName(g.clubId)}` : 'abans sense entitat'})`); g.clubId = clubId; }
              if (past) pastUpd++;
            } else if (p.cands.length) pastKept.push(`${gymName(g)} (${clubName(g.clubId) || 'sense entitat'})`);
            upd++;
          } else { g = Object.assign({ id: uid(), name: p.name, surname: p.surname, clubId, category: '', birthYear: '', notes: '', archived: false }, vals); db.gymnasts.push(g); made++; }
          sheet.set(g.id, { p, g, clubId, grp, existed: !!p.existing, blank });
        }
      }
      // equips del full → equips de la fitxa (el mateix nom, o el que té més gimnastes en comú; si no, un de nou)
      const groups = new Map();
      for (const sd of sheet.values()) if (sd.p.teamNo) {
        const k = sd.clubId + '|' + groupKeyOf(sd.grp);
        if (!groups.has(k)) groups.set(k, { clubId: sd.clubId, grp: sd.grp, teams: new Map(), ids: new Map() });
        const G = groups.get(k);
        if (!G.teams.has(sd.p.teamNo)) { G.teams.set(sd.p.teamNo, []); G.ids.set(sd.p.teamNo, []); }
        if (sd.existed) G.teams.get(sd.p.teamNo).push(sd.g.id);
        G.ids.get(sd.p.teamNo).push(sd.g.id);
      }
      for (const G of groups.values()) {
        const nm = clubName(G.clubId), map = inscTeamMap(G.clubId, G.grp, G.teams, nm);
        for (const [no, ids] of G.ids) {
          const name = no === 1 ? nm : `${nm} ${no}`;
          let t = map.get(no) || null;
          // (en una competició passada, l'equip va a les fitxes només si totes les del full encara no en tenen —són
          // noves o no en tenien— i l'equip de la fitxa, si ja hi és, no té ningú més; si no, les fitxes no es toquen)
          const rec = !past || (ids.every(id => sheet.get(id).blank) && (!t || t.memberIds.every(id => ids.includes(id))));
          if (!t && rec) t = makeTeam(G.clubId, G.grp, name);
          G[no] = { t, name: t ? t.name : name };
          for (const id of ids) { const sd = sheet.get(id); sd.team = t; sd.teamName = G[no].name; teamed++; if (past && rec) sd.stored = true; }
          if (!t || !rec) continue;
          // a la fitxa, cada equip del full queda exactament amb les gimnastes que diu el full: és l'equip que ha dit
          // l'entitat (form), i l'app no hi posa ni n'hi treu ningú pel seu compte
          t.form = true;
          const out = t.memberIds.filter(id => !ids.includes(id));
          for (const id of ids) { putInTeam(id, t); const g = gymById(id); if (g) delete g.noTeam; }
          t.memberIds = t.memberIds.filter(id => ids.includes(id));
          for (const id of out) { const g = gymById(id); if (g && !gymTeam(g)) g.noTeam = true; }
        }
      }
      // les que no són en cap equip del full: individuals (o, si ja eren en un equip que va dir l'entitat i aquesta
      // importació no en porta els equips d'aquell grup, es queden a l'equip)
      for (const sd of sheet.values()) {
        if (sd.p.teamNo) continue;
        if (sd.p.keepTeam && teamById(sd.p.keepTeam.id)) { sd.keep = teamById(sd.p.keepTeam.id); continue; }
        if (!past || sd.blank) { putInTeam(sd.g.id, null); sd.g.noTeam = true; if (past) sd.stored = true; }
      }
      // la competició triada (sigui del dia que sigui): hi queden inscrites amb el grup i l'equip del full, encara
      // que ja hi fossin amb un altre equip
      if (c) {
        const declared = new Map(), keptE = new Set(), left = new Set(), tName = e => (c.teams.find(t => t.id === e.teamId) || {}).name || '';
        for (const sd of sheet.values()) {
          const { g, grp } = sd;
          let e = c.entries.find(x => x.gymnastId === g.id);
          if (!e) { e = newEntry(c, g, grp); c.entries.push(e); nEnrol++; }
          else if (!sameGroup(e, grp)) {
            if (hasScores(e)) { kept.push(entryName(e)); keptE.add(e); continue; }
            Object.assign(e, { category: grp.category, gender: genderOf(grp), level: grp.level }); e.teamId = null; delete e.noAuto;
          }
          // (aquell dia és de l'entitat del full, encara que abans fos d'una altra: si era en un equip de l'altra, en surt.
          // Si ja hi té notes amb l'altra entitat, no: ja ha competit així, i es diu)
          if ((e.clubId || null) !== sd.clubId && hasScores(e)) { keptClub.push(entryName(e)); keptE.add(e); continue; }
          if ((e.clubId || null) !== sd.clubId) { if (e.teamId) left.add(e.teamId); e.clubId = sd.clubId; }
          // (la hi ha inscrit el full de la seva entitat: una altra entitat amb una gimnasta que es digui igual no és ella)
          e.sheetClubId = sd.clubId;
          const before = tName(e);
          if (sd.p.teamNo) {
            // la còpia de l'equip en aquesta competició; si ja n'hi havia una amb el mateix nom (d'aquell dia), és aquesta
            let ct = (sd.team && c.teams.find(t => t.sourceTeamId === sd.team.id && sameGroup(t, grp)))
              || c.teams.find(t => (t.clubId || null) === sd.clubId && sameGroup(t, grp) && norm(t.name) === norm(sd.teamName));
            if (ct) { if (sd.team && ct.sourceTeamId !== sd.team.id) { ct.sourceTeamId = sd.team.id; if (!renamed.includes(ct.name)) renamed.push(ct.name); } }
            else { ct = { id: uid(), name: sd.teamName, clubId: sd.clubId, category: grp.category, gender: genderOf(grp), level: grp.level, sourceTeamId: sd.team ? sd.team.id : null, auto: true }; c.teams.push(ct); }
            ct.form = true;
            e.teamId = ct.id; delete e.noAuto;
            if (!declared.has(ct)) declared.set(ct, new Set());
            declared.get(ct).add(e);
          } else if (sd.keep && sameGroup(e, sd.keep)) { e.teamId = compTeamFor(c, sd.keep).id; delete e.noAuto; }
          else { e.teamId = null; e.noAuto = true; }
          if (tName(e) !== before && hasScores(e)) scoredMoved++;
        }
        // (els equips del full, en aquesta competició, només amb les del full)
        for (const [ct, es] of declared) for (const e of c.entries) if (e.teamId === ct.id && !es.has(e) && !keptE.has(e)) { e.teamId = null; e.noAuto = true; if (hasScores(e)) scoredMoved++; }
        pruneAutoTeams(c);
        // (els equips d'una altra entitat que s'han quedat sense prou gimnastes perquè una ara és d'aquesta)
        for (const id of left) { const ct = c.teams.find(t => t.id === id), n = ct ? teamSize(c, ct) : 0; if (ct && n && n < (c.teamMin || 3) && !declared.has(ct)) weak.push({ name: ct.name, n }); }
        // les de la mateixa entitat i grup que són inscrites però ja no surten al full: es diu (no es treuen)
        const pairs = new Set([...sheet.values()].map(sd => sd.clubId + '|' + groupKeyOf(sd.grp)));
        for (const e of c.entries) if (!sheet.has(e.gymnastId) && pairs.has(e.clubId + '|' + groupKeyOf(e))) { stale.push(entryName(e)); delete e.sheetClubId; }
      }
      // les altres competicions no es toquen (cada competició té els seus equips): només es diu on no coincideixen
      for (const cc of db.competitions) {
        if (cc === c || !isUpcoming(cc)) continue;
        for (const [gid, sd] of sheet) {
          if (past && !sd.stored) continue;   // (d'una competició passada, només les fitxes que han canviat)
          const e = cc.entries.find(x => x.gymnastId === gid);
          if (!e) continue;
          const ct = cc.teams.find(t => t.id === e.teamId), want = sd.team || sd.keep;
          const otherClub = !past && (e.clubId || null) !== (sd.clubId || null);
          if (otherClub || (want ? !(ct && ct.sourceTeamId === want.id) : !!ct)) { others.add(cc.name); if (otherClub) othersClub = true; }
        }
      }
      stored = [...sheet.values()].filter(sd => sd.stored).length; total = sheet.size;
      rotNote = rotSplitNote(split0, false);
    });
    ui.insc = null;
  },

  // «Passa al curs següent» (+1) i «Desfés un curs» (−1): els anys de totes les categories i, si es vol, la categoria de
  // cada gimnasta (i les inscripcions i els equips de les competicions que vénen), tot d'un cop (un sol «Desfés»)
  shiftYears: async el => {
    const d = +el.dataset.d, last = S().lastShift;
    let lead = '';
    if (d < 0) {
      // −1 just després d'un +1, sense cap altre canvi (les notes no compten): tot torna a ser com abans del +1, també
      // els equips que havien dit les entitats (com el «Desfés» de l'avís; les notes que han arribat després es queden)
      const back = await shiftBack();
      if (back.rec) {
        const { snap, stamp } = back.rec;
        withUndo('Tot torna a estar com abans de «Passa al curs següent»: els anys de les categories, la categoria de cada gimnasta i els equips.', () => {
          const cur = db;
          db = migrate(JSON.parse(snap));
          db.meta = cur.meta;   // (la història de les dades continua: aquesta versió ve de la d'ara)
          Engine.mergeScores(db, cur, { since: Date.parse(stamp) || 0 });
        });
        return;
      }
      // l'últim canvi de curs va ser un +1 i ja no s'hi pot tornar tal qual: es diu abans, amb els equips del full que
      // no tornaran
      if (last && last.d === 1) lead = `<b>Ja no es pot tornar exactament a com estava abans de «Passa al curs següent»${last.on ? ' (el ' + fmtDate(last.on) + ')' : ''}</b>: ${back.any ? 'després s’hi han fet altres canvis' : 'la còpia de com estava abans no és en aquest ordinador (es va fer en un altre ordinador o navegador)'}.`
        + (last.teams.length ? ` ${last.teams.length === 1 ? 'L’equip que l’entitat havia dit al full d’inscripció i que es va desfer o canviar no tornarà a ser com era' : 'Els equips que les entitats havien dit al full d’inscripció i que es van desfer o canviar no tornaran a ser com eren'}: ${h(catList(last.teams, 6))}. Després ${last.teams.length === 1 ? 'revisa’l' : 'revisa’ls'} a les competicions que vénen.` : '') + '<br><br>';
    }
    // +1 que sembla un clic sense voler (ja s'ha fet, o a mig curs): primer es pregunta si de debò
    const ask = d > 0 ? shiftAsk() : '';
    if (ask && !(await confirmBox(ask, { ok: 'Sí, passa al curs següent', danger: true }))) return;
    // amb els anys nous, qui canvia de categoria (encara no es canvia res)
    const cats = S().categories.map(c => Object.assign({}, c, { from: c.from === null ? null : c.from + d, to: c.to === null ? null : c.to + d }));
    const moves = db.gymnasts.filter(g => !g.archived && g.birthYear).map(g => ({ g, to: Engine.categoryForYear(cats, g.birthYear) })).filter(m => m.to && m.to !== m.g.category);
    const n = moves.length;
    let pick = 'years';
    if (n) {
      pick = await choiceBox(`${lead}Amb els anys nous, ${plural(n, 'gimnasta canvia', 'gimnastes canvien')} de categoria. ${n === 1 ? 'L’actualitzo' : 'Les actualitzo'} ara?<br><span class="small muted">${moves.slice(0, 8).map(m => `${h(gymName(m.g))}: ${h(m.g.category || '—')} → ${h(m.to)}`).join('<br>')}${n > 8 ? '<br>…' : ''}</span><br><br>Les competicions ja fetes no canvien; les que vénen, sí (si encara no hi ${n === 1 ? 'té' : 'tenen'} notes).${catPlanHtml(catPlan(moves, cats))}`,
        [{ value: 'ok', label: n === 1 ? 'Actualitza-la' : 'Actualitza-les', cls: 'primary' }, { value: 'years', label: 'Només els anys de les categories' }]);
      if (!pick) return;
    }
    const pre = JSON.stringify(db), season = d > 0 ? shiftTarget() : '';
    let res = null;
    withUndo(() => ({ msg: `${d > 0 ? 'Anys de les categories avançats un curs.' : 'Anys de les categories endarrerits un curs.'}${res ? ' ' + catMsg(res) : ''}`, type: res && res.alone.length ? 'bad' : 'ok' }), () => {
      // (els equips de les competicions que vénen: dels que havien dit les entitats, es recorden els que es desfan o canvien)
      const used = new Set(db.competitions.filter(c => !c.locked && isUpcoming(c)).flatMap(c => c.teams.filter(t => c.entries.some(e => e.teamId === t.id)).map(t => t.sourceTeamId)));
      for (const c of S().categories) { if (c.from !== null) c.from += d; if (c.to !== null) c.to += d; }
      // (per l'id: mentre es preguntava, les dades poden haver arribat de nou, p. ex. del programa)
      if (pick === 'ok') res = applyCatMoves(moves.map(m => gymById(m.g.id)).filter(g => g && catMismatch(g)));
      const teams = res ? res.gone.concat(res.lost).filter(t => t.form === true && used.has(t.id)).map(catTeamName) : [];
      S().lastShift = { d, on: today(), season, teams };
    });
    // (com eren les dades abans del +1, per a «Desfés un curs»: aquí i a IndexedDB, per a després de tornar a obrir)
    if (d > 0) { shiftUndo = { dbId: db.meta.dbId, stamp: db.meta.updated, sig: shiftSig(db), snap: pre }; idbSet(SHIFT_KEY, shiftUndo); }
    const noYear = d > 0 ? db.gymnasts.filter(g => !g.archived && !g.birthYear).length : 0;
    if (noYear) toast(`${plural(noYear, 'gimnasta no té', 'gimnastes no tenen')} any de naixement: no se’n pot canviar la categoria sola. Revisa-${noYear === 1 ? 'la' : 'les'} a Gimnastes (o ${noYear === 1 ? 'posa-li' : 'posa’ls'} l’any).`, 'bad');
  },
  // (els botons ho criden amb el clic: cap altre paràmetre)
  recalcCats: async () => {
    const list = db.gymnasts.filter(g => !g.archived && catMismatch(g));
    if (!list.length) { toast('Totes les gimnastes ja tenen la categoria que els toca.'); return; }
    const plan = catPlan(list.map(g => ({ g, to: catMismatch(g) })));
    // (d'una sola, el seu nom: «d’Emma Serra», i no «d’una gimnasta» si és un noi)
    const one = list.length === 1;
    if (!(await confirmBox(`Canviar la categoria ${one ? deN(h(gymName(list[0]))) : deQ(list.length, 'gimnasta', 'gimnastes')} segons l’any de naixement?<br><span class="small muted">${list.slice(0, 8).map(g => `${h(gymName(g))}: ${h(g.category || '—')} → ${h(catMismatch(g))}`).join('<br>')}${list.length > 8 ? '<br>…' : ''}</span><br><br>Les competicions ja fetes no canvien; a les que vénen, també es canvien (si encara no hi ${one ? 'té' : 'tenen'} notes). Qui canvia de categoria surt del seu equip.${catPlanHtml(plan)}`, { ok: one ? 'Canvia-la' : 'Canvia-les' }))) return;
    // (mentre la confirmació era oberta pot haver canviat alguna cosa: es torna a mirar qui no té la categoria que li toca)
    const now = db.gymnasts.filter(g => !g.archived && catMismatch(g));
    if (!now.length) return;
    let res = null;
    withUndo(() => ({ msg: catMsg(res), type: res.alone.length ? 'bad' : 'ok' }), () => { res = applyCatMoves(now); });
  },
  toggleWrong: () => { ui.gWrong = !ui.gWrong; render(); },
