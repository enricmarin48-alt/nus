name: Publica NUS a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepara Pages
        uses: actions/configure-pages@v5
      - name: Versió de NotesGim (cada aparell es posa al dia sol)
        # la versió és la de l'últim canvi a gimnastica/ (un canvi només del NUS no fa que els aparells s'actualitzin)
        run: |
          h="$(git log -1 --format=%h -- gimnastica)"
          v="$(git log -1 --format=%cs -- gimnastica) · $h"
          sed -i "s/^const VERSION = 'notesgim-[A-Za-z0-9]*';/const VERSION = 'notesgim-$h';/" gimnastica/sw.js
          sed -i "s/^const APP_BUILD = 'dev';/const APP_BUILD = '$v';/" gimnastica/index.html
          grep -q "notesgim-$h" gimnastica/sw.js
          grep -q "APP_BUILD = '$v'" gimnastica/index.html
      - name: Empaqueta el joc
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Desplega
        id: deployment
        uses: actions/deploy-pages@v4
